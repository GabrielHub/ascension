  <!-- Shoulder epaulette right -->
  <line x1="84" y1="66" x2="78" y2="64" stroke="#2a3555" stroke-width="1" opacity="0.4" />
  <!-- Arm pocket -->
  <rect x="82" y="76" width="4" height="10" rx="1" fill="#2a3555" opacity="0.2" stroke="#1a2440" stroke-width="0.3" />
