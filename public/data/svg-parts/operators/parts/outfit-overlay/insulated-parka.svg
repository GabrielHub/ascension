  <!-- Fur-lined hood edge -->
  <path d="M40 60 Q50 56 60 56 Q70 56 80 60" stroke="#b8b0a0" stroke-width="0.6" fill="none" opacity="0.3" />
  <!-- Center zipper -->
  <line x1="60" y1="62" x2="60" y2="134" stroke="#b8b0a0" stroke-width="0.4" opacity="0.3" />
  <!-- Pocket flaps -->
  <line x1="36" y1="100" x2="50" y2="100" stroke="#5a4030" stroke-width="0.6" opacity="0.4" />
  <line x1="70" y1="100" x2="84" y2="100" stroke="#5a4030" stroke-width="0.6" opacity="0.4" />
  <!-- Drawstring at waist -->
  <path d="M42 92 Q60 90 78 92" stroke="#5a4030" stroke-width="0.4" fill="none" opacity="0.3" stroke-dasharray="2 1" />
