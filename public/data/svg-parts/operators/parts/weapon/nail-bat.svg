<!-- Operator Part: Nail Bat — weapon overlay for raid-context portraits -->
<!-- Category: weapon | Rarity: uncommon | Body: broad, medium | Pose: standing -->
<!-- Composites on 120×160 viewBox, nail-studded bat across back -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- Bat barrel -->
  <line x1="28" y1="20" x2="46" y2="52" stroke="#5a4030" stroke-width="5" stroke-linecap="round" />
  <!-- Bat taper -->
  <line x1="46" y1="52" x2="60" y2="78" stroke="#5a4030" stroke-width="3.5" stroke-linecap="round" />
  <!-- Handle -->
  <line x1="60" y1="78" x2="70" y2="96" stroke="#3d2c20" stroke-width="2.5" stroke-linecap="round" />
  <!-- Nails protruding -->
  <line x1="30" y1="24" x2="24" y2="20" stroke="#b8b0a0" stroke-width="1" stroke-linecap="round" />
  <line x1="34" y1="30" x2="28" y2="28" stroke="#b8b0a0" stroke-width="1" stroke-linecap="round" />
  <line x1="36" y1="36" x2="32" y2="32" stroke="#b8b0a0" stroke-width="1" stroke-linecap="round" />
  <line x1="40" y1="42" x2="34" y2="40" stroke="#b8b0a0" stroke-width="1" stroke-linecap="round" />
  <line x1="42" y1="48" x2="48" y2="44" stroke="#b8b0a0" stroke-width="1" stroke-linecap="round" />
  <!-- Knob -->
  <circle cx="71" cy="97" r="2" fill="#2a1f18" />
</svg>
