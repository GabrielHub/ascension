<!-- Operator Part: Stun Baton — weapon overlay for raid-context portraits -->
<!-- Category: weapon | Rarity: uncommon | Body: medium, lean | Pose: standing -->
<!-- Composites on 120×160 viewBox, stun baton holstered at right hip -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- Baton shaft -->
  <line x1="88" y1="70" x2="88" y2="110" stroke="#1a2440" stroke-width="2.5" stroke-linecap="round" />
  <!-- Shaft highlight -->
  <line x1="89.5" y1="72" x2="89.5" y2="108" stroke="#2a3555" stroke-width="0.5" opacity="0.4" />
  <!-- Contact prongs -->
  <line x1="86" y1="70" x2="85" y2="64" stroke="#b8b0a0" stroke-width="1" stroke-linecap="round" />
  <line x1="90" y1="70" x2="91" y2="64" stroke="#b8b0a0" stroke-width="1" stroke-linecap="round" />
  <!-- Electric arc -->
  <path d="M85 64 Q88 62 91 64" stroke="#c8a84c" stroke-width="0.6" fill="none" opacity="0.5" />
  <!-- Grip section -->
  <line x1="88" y1="94" x2="88" y2="108" stroke="#3d2c20" stroke-width="3" stroke-linecap="round" />
  <!-- Activation button -->
  <circle cx="88" cy="90" r="1.2" fill="#c8a84c" opacity="0.5" />
</svg>
