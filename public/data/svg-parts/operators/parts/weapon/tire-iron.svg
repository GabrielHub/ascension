<!-- Operator Part: Tire Iron — weapon overlay for raid-context portraits -->
<!-- Category: weapon | Rarity: common | Body: broad, medium | Pose: standing -->
<!-- Composites on 120×160 viewBox, tire iron tucked at side -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- Main shaft -->
  <line x1="90" y1="50" x2="90" y2="105" stroke="#b8b0a0" stroke-width="2" stroke-linecap="round" />
  <!-- Metal highlight -->
  <line x1="91" y1="52" x2="91" y2="103" stroke="#e0ddd6" stroke-width="0.4" opacity="0.35" />
  <!-- Cross bar (socket end) -->
  <line x1="82" y1="50" x2="98" y2="50" stroke="#b8b0a0" stroke-width="2" stroke-linecap="round" />
  <!-- Socket tip -->
  <circle cx="82" cy="50" r="2.5" fill="none" stroke="#b8b0a0" stroke-width="1.2" />
  <!-- Chisel tip -->
  <line x1="88" y1="105" x2="92" y2="105" stroke="#b8b0a0" stroke-width="3" stroke-linecap="round" />
</svg>
