<!-- Operator Part: Tactical Knife — weapon overlay for raid-context portraits -->
<!-- Category: weapon | Rarity: uncommon | Body: lean, medium | Pose: standing -->
<!-- Composites on 120×160 viewBox, combat knife sheathed on chest rig -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- Sheath on chest -->
  <rect x="26" y="72" width="4" height="20" rx="1" fill="#1a2440" opacity="0.5" stroke="#2a3555" stroke-width="0.5" />
  <!-- Knife handle protruding -->
  <line x1="28" y1="72" x2="28" y2="62" stroke="#2a1f18" stroke-width="2.5" stroke-linecap="round" />
  <!-- Handle wrap -->
  <line x1="27.5" y1="64" x2="28.5" y2="66" stroke="#5a4030" stroke-width="0.5" opacity="0.6" />
  <line x1="27.5" y1="67" x2="28.5" y2="69" stroke="#5a4030" stroke-width="0.5" opacity="0.6" />
  <!-- Guard -->
  <line x1="25" y1="72" x2="31" y2="72" stroke="#b8b0a0" stroke-width="1.2" stroke-linecap="round" />
  <!-- Pommel -->
  <circle cx="28" cy="61" r="1.5" fill="#1a2440" stroke="#2a3555" stroke-width="0.4" />
  <!-- Sheath strap -->
  <line x1="26" y1="78" x2="22" y2="78" stroke="#5a4030" stroke-width="0.8" opacity="0.4" />
</svg>
