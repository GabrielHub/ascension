<!-- Operator Part: Box Cutter — weapon overlay for raid-context portraits -->
<!-- Category: weapon | Rarity: common | Body: lean, medium | Pose: standing -->
<!-- Composites on 120×160 viewBox, small box cutter holstered at hip -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- Handle body -->
  <rect x="84" y="88" width="5" height="18" rx="1" fill="#c8a84c" opacity="0.6" stroke="#5a4030" stroke-width="0.5" />
  <!-- Blade (extended) -->
  <path d="M86.5 88 L88 80 L85 80 Z" fill="#b8b0a0" opacity="0.8" />
  <!-- Blade edge -->
  <line x1="88" y1="80" x2="86.5" y2="88" stroke="#e0ddd6" stroke-width="0.3" opacity="0.5" />
  <!-- Slider groove -->
  <line x1="86.5" y1="90" x2="86.5" y2="104" stroke="#5a4030" stroke-width="0.4" opacity="0.4" />
  <!-- Slider button -->
  <rect x="85" y="92" width="3" height="2" rx="0.5" fill="#5a4030" opacity="0.5" />
</svg>
