<!-- Operator Part: Pipe Wrench — weapon overlay for raid-context portraits -->
<!-- Category: weapon | Rarity: common | Body: broad, medium | Pose: standing -->
<!-- Composites on 120×160 viewBox, wrench slung diagonally across back -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- Wrench handle -->
  <line x1="78" y1="90" x2="42" y2="30" stroke="#5a4030" stroke-width="3.5" stroke-linecap="round" />
  <!-- Handle grip texture -->
  <line x1="72" y1="80" x2="68" y2="72" stroke="#3d2c20" stroke-width="1" opacity="0.5" />
  <line x1="64" y1="66" x2="60" y2="58" stroke="#3d2c20" stroke-width="1" opacity="0.5" />
  <!-- Wrench jaw (fixed) -->
  <path d="M42 30 L38 24 L44 20 L48 26" stroke="#b8b0a0" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Wrench jaw (adjustable) -->
  <path d="M42 30 L36 28 L34 22 L38 20" stroke="#b8b0a0" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Adjustment wheel -->
  <circle cx="44" cy="32" r="2" fill="#b8b0a0" stroke="#e0ddd6" stroke-width="0.4" opacity="0.6" />
</svg>
