<!-- Operator Part: Wrist Brace — accessory overlay for raid-context portraits -->
<!-- Category: accessory | Rarity: common | Body: broad, medium, lean | Pose: standing -->
<!-- Composites on 120×160 viewBox, fabric wrist braces on both wrists -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- Left wrist brace -->
  <rect x="22" y="108" width="8" height="5" rx="1.5" fill="#5a4030" opacity="0.5" stroke="#3d2c20" stroke-width="0.5" />
  <!-- Left brace wrap lines -->
  <line x1="24" y1="109" x2="24" y2="112" stroke="#3d2c20" stroke-width="0.4" opacity="0.4" />
  <line x1="27" y1="109" x2="27" y2="112" stroke="#3d2c20" stroke-width="0.4" opacity="0.4" />
  <!-- Right wrist brace -->
  <rect x="90" y="108" width="8" height="5" rx="1.5" fill="#5a4030" opacity="0.5" stroke="#3d2c20" stroke-width="0.5" />
  <!-- Right brace wrap lines -->
  <line x1="93" y1="109" x2="93" y2="112" stroke="#3d2c20" stroke-width="0.4" opacity="0.4" />
  <line x1="96" y1="109" x2="96" y2="112" stroke="#3d2c20" stroke-width="0.4" opacity="0.4" />
</svg>
