  <path d="M34 98 Q48 94 60 94 Q72 94 86 98" stroke="#3d2c20" stroke-width="2" fill="none" opacity="0.6" />
  <!-- Belt buckle -->
  <rect x="57" y="93" width="6" height="4" rx="1" fill="#b8b0a0" opacity="0.5" stroke="#e0ddd6" stroke-width="0.3" />
  <!-- Left pouch -->
  <rect x="36" y="98" width="8" height="7" rx="1" fill="#3d2c20" opacity="0.5" stroke="#5a4030" stroke-width="0.5" />
  <!-- Left pouch flap -->
  <line x1="36" y1="98" x2="44" y2="98" stroke="#5a4030" stroke-width="0.6" opacity="0.5" />
  <!-- Center pouch -->
  <rect x="50" y="98" width="6" height="6" rx="1" fill="#3d2c20" opacity="0.5" stroke="#5a4030" stroke-width="0.5" />
  <!-- Right pouch -->
  <rect x="76" y="98" width="8" height="7" rx="1" fill="#3d2c20" opacity="0.5" stroke="#5a4030" stroke-width="0.5" />
  <!-- Right pouch flap -->
  <line x1="76" y1="98" x2="84" y2="98" stroke="#5a4030" stroke-width="0.6" opacity="0.5" />
  <!-- D-ring -->
  <circle cx="68" cy="98" r="1.5" fill="none" stroke="#b8b0a0" stroke-width="0.6" opacity="0.4" />
