<!-- Operator Part: Eye Visor — accessory overlay for raid-context portraits -->
<!-- Category: accessory | Rarity: uncommon | Body: broad, medium, lean | Pose: standing -->
<!-- Composites on 120×160 viewBox, tactical visor across eyes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- Visor band -->
  <rect x="36" y="34" width="48" height="8" rx="3" fill="#1a2440" opacity="0.75" stroke="#2a3555" stroke-width="0.6" />
  <!-- Visor lens (tinted) -->
  <rect x="38" y="35.5" width="44" height="5" rx="2" fill="#2a3555" opacity="0.5" />
  <!-- Lens highlight -->
  <line x1="42" y1="37" x2="56" y2="37" stroke="#4a6888" stroke-width="0.5" opacity="0.4" />
  <!-- Left earpiece -->
  <rect x="33" y="35" width="4" height="6" rx="1.5" fill="#1a2440" stroke="#2a3555" stroke-width="0.4" />
  <!-- Right earpiece -->
  <rect x="83" y="35" width="4" height="6" rx="1.5" fill="#1a2440" stroke="#2a3555" stroke-width="0.4" />
</svg>
