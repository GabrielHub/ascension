<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" fill="none">
  <!-- Broad-build chibi marker — exploration asset for HQ actor tokens -->
  <!-- Colors are placeholder; runtime derives from appearance recipe -->

  <!-- Ground shadow -->
  <ellipse cx="16" cy="37" rx="9" ry="2.5" fill="#000" opacity="0.18"/>

  <!-- Body (broad trapezoid) -->
  <path d="M8 22 Q8 20 10 19 L22 19 Q24 20 24 22 L24 34 Q24 36 22 36 L10 36 Q8 36 8 34 Z"
        fill="#3d2c20" stroke="#0a0a0c" stroke-width="0.8"/>
  <!-- Collar accent stripe -->
  <rect x="10" y="19" width="12" height="2.5" rx="1" fill="#c8a84c" opacity="0.85"/>

  <!-- Neck -->
  <rect x="13.5" y="16" width="5" height="4" rx="1.5" fill="#c4956a"/>

  <!-- Head circle -->
  <circle cx="16" cy="12" r="8" fill="#c4956a" stroke="#0a0a0c" stroke-width="0.8"/>
  <!-- Face shadow -->
  <path d="M10 14 Q16 18 22 14 Q20 8 16 6 Q12 8 10 14" fill="#000" opacity="0.08"/>

  <!-- Hair cap -->
  <path d="M8.5 10 Q8 4 16 3 Q24 4 23.5 10 Q22 7 16 6.5 Q10 7 8.5 10"
        fill="#2a1f18" stroke="#0a0a0c" stroke-width="0.6"/>

  <!-- Eyes (simple dots) -->
  <circle cx="13" cy="12.5" r="1.2" fill="#0a0a0c"/>
  <circle cx="19" cy="12.5" r="1.2" fill="#0a0a0c"/>
  <!-- Eye highlights -->
  <circle cx="13.5" cy="12" r="0.4" fill="#fff" opacity="0.7"/>
  <circle cx="19.5" cy="12" r="0.4" fill="#fff" opacity="0.7"/>
</svg>
