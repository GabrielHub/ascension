<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- REFERENCE FIXTURE: The Register — Bodega Operations
       The checkout area. Register, phone, guild license, pickled-egg jar.
       Aina sits here. Walk-ins land here. Contracts come in here.
       4 cols x 3 rows. Origin (200, 100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24)
       Door on left wall at row 0. Camera views from bottom-left.
       DESIGN TARGET — not used in game rendering. -->

  <!-- ══ RIGHT WALL (warm bodega wood) ══════════════════════════════ -->
  <polygon points="200,16 392,112 392,196 200,100"
    fill="#352616" stroke="#281e14" stroke-width="1"/>
  <!-- Wall panel grooves -->
  <line x1="248" y1="40" x2="248" y2="124" stroke="#281e14" stroke-width="0.5"/>
  <line x1="296" y1="64" x2="296" y2="148" stroke="#281e14" stroke-width="0.5"/>
  <line x1="344" y1="88" x2="344" y2="172" stroke="#281e14" stroke-width="0.5"/>

  <!-- ══ LEFT WALL (col=0, rows 1-3 solid, row 0 door) ═════════════ -->
  <polygon points="152,40 56,88 56,172 152,124"
    fill="#2c2014" stroke="#241c12" stroke-width="1"/>
  <!-- Door frame -->
  <line x1="200" y1="16" x2="200" y2="100" stroke="#3a3020" stroke-width="2"/>
  <line x1="152" y1="40" x2="152" y2="124" stroke="#3a3020" stroke-width="2"/>
  <line x1="200" y1="26" x2="152" y2="50" stroke="#3a3020" stroke-width="1.5"/>

  <!-- ══ FLOOR (warm wood bodega) ════════════════════════════════════ -->
  <polygon points="200,100 392,196 248,268 56,172"
    fill="#3c2a16" stroke="#302010" stroke-width="0.8"/>
  <!-- Tile grid -->
  <line x1="248" y1="124" x2="104" y2="196" stroke="#342414" stroke-width="0.3" opacity="0.5"/>
  <line x1="296" y1="148" x2="152" y2="220" stroke="#342414" stroke-width="0.3" opacity="0.5"/>
  <line x1="344" y1="172" x2="200" y2="244" stroke="#342414" stroke-width="0.3" opacity="0.5"/>
  <line x1="152" y1="124" x2="344" y2="220" stroke="#342414" stroke-width="0.3" opacity="0.5"/>
  <line x1="104" y1="148" x2="296" y2="244" stroke="#342414" stroke-width="0.3" opacity="0.5"/>

  <!-- ══ FLOOR RUG (entrance area) ══════════════════════════════════ -->
  <polygon points="90,160 152,191 138,203 75,172"
    fill="#342820" stroke="rgba(200,168,76,0.1)" stroke-width="0.6" opacity="0.8"/>

  <!-- ══ CEILING FAN (top center, works sometimes) ══════════════════ -->
  <!-- Mount -->
  <ellipse cx="260" cy="44" rx="4" ry="1.5" fill="#3a3838" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="260" y1="44" x2="260" y2="48" stroke="#3a3838" stroke-width="1.2"/>
  <!-- Hub -->
  <ellipse cx="260" cy="49" rx="5" ry="2.5" fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <!-- Blades -->
  <polygon points="265,49 280,52 279,54 264,50" fill="#3a3020" stroke="#302818" stroke-width="0.3" opacity="0.85"/>
  <polygon points="255,49 240,52 241,54 256,50" fill="#342c20" stroke="#2c2418" stroke-width="0.3" opacity="0.85"/>
  <polygon points="260,51 264,56 262,57 258,57 256,56" fill="#3a3020" stroke="#302818" stroke-width="0.3" opacity="0.8"/>
  <polygon points="260,47 264,43 262,42 258,42 256,43" fill="#342c20" opacity="0.7"/>
  <!-- Pull chain -->
  <line x1="263" y1="51" x2="264" y2="56" stroke="#4a4a52" stroke-width="0.5"/>
  <circle cx="264" cy="57" r="0.8" fill="#4a4a52"/>

  <!-- ══ WALL PHONE (left wall area) ════════════════════════════════ -->
  <rect x="114" y="68" width="10" height="18" rx="1" fill="#2a2830" stroke="#222028" stroke-width="0.4"/>
  <rect x="116" y="78" width="6" height="5" rx="0.5" fill="#222028"/>
  <!-- Receiver on hook -->
  <path d="M113,70 Q111,74 113,78" fill="none" stroke="#3a3838" stroke-width="1.2"/>
  <!-- Cord -->
  <path d="M118,84 Q120,90 116,94" fill="none" stroke="#2a2830" stroke-width="0.5" opacity="0.4"/>

  <!-- ══ GUILD LICENSE (taped to wall behind register) ══════════════ -->
  <!-- "The most official-looking thing in the building" -->
  <rect x="136" y="56" width="16" height="20" rx="0.5" fill="#2c2820" stroke="#3a3020" stroke-width="0.6"/>
  <rect x="138" y="58" width="12" height="16" rx="0.3" fill="#3a3828"/>
  <!-- Header -->
  <rect x="139" y="59" width="10" height="2" fill="rgba(200,168,76,0.15)" rx="0.2"/>
  <!-- Text lines -->
  <line x1="139" y1="63" x2="149" y2="63" stroke="rgba(224,221,214,0.12)" stroke-width="0.4"/>
  <line x1="139" y1="65" x2="148" y2="65" stroke="rgba(224,221,214,0.08)" stroke-width="0.4"/>
  <line x1="139" y1="67" x2="147" y2="67" stroke="rgba(224,221,214,0.08)" stroke-width="0.4"/>
  <!-- Official seal -->
  <circle cx="144" cy="71" r="2" fill="rgba(200,168,76,0.2)" stroke="rgba(200,168,76,0.3)" stroke-width="0.4"/>
  <!-- Tape strips (slightly crooked) -->
  <rect x="134" y="55" width="6" height="2" rx="0.2" fill="rgba(200,195,170,0.08)" transform="rotate(-2 137 56)"/>
  <rect x="148" y="54" width="6" height="2" rx="0.2" fill="rgba(200,195,170,0.06)" transform="rotate(2 151 55)"/>

  <!-- ══ CORK BOARD (right wall, health notices & guild permits) ════ -->
  <rect x="276" y="64" width="32" height="24" rx="1" fill="#3a2c20" stroke="#2c2018" stroke-width="0.5"/>
  <!-- Pinned papers -->
  <polygon points="280,68 290,73 290,78 280,73" fill="#3a3828" opacity="0.6"/>
  <polygon points="292,72 302,77 302,82 292,77" fill="#3c3a2a" opacity="0.5"/>
  <polygon points="282,78 290,82 290,86 282,82" fill="#383828" opacity="0.5"/>
  <!-- Pins -->
  <circle cx="284" cy="70" r="1" fill="rgba(200,60,60,0.5)"/>
  <circle cx="296" cy="74" r="1" fill="rgba(60,100,200,0.5)"/>
  <circle cx="286" cy="80" r="1" fill="rgba(200,168,76,0.5)"/>

  <!-- ══ HERO: RECEPTION COUNTER ════════════════════════════════════ -->
  <!-- Top surface -->
  <polygon points="157,146 301,218 272,232 128,160"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.8"/>
  <!-- Front-left face -->
  <polygon points="128,160 272,232 272,258 128,186"
    fill="#2c2418" stroke="#241c12" stroke-width="0.6"/>
  <!-- Front-right face -->
  <polygon points="301,218 272,232 272,258 301,244"
    fill="#302818" stroke="#241c12" stroke-width="0.6"/>
  <!-- Panel grooves -->
  <line x1="164" y1="172" x2="236" y2="244" stroke="#241c12" stroke-width="0.4"/>
  <line x1="200" y1="186" x2="254" y2="250" stroke="#241c12" stroke-width="0.4"/>
  <!-- Top edge highlight -->
  <line x1="157" y1="146" x2="301" y2="218" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- ══ CASH REGISTER (on counter) ═════════════════════════════════ -->
  <polygon points="225,155 249,167 240,171 216,159"
    fill="#2a2830" stroke="#222028" stroke-width="0.5"/>
  <polygon points="216,159 240,171 240,181 216,169"
    fill="#222028" stroke="#1c1a22" stroke-width="0.4"/>
  <polygon points="249,167 240,171 240,181 249,177"
    fill="#26242c" stroke="#1c1a22" stroke-width="0.4"/>
  <!-- Display -->
  <rect x="220" y="152" width="12" height="4" rx="0.5" fill="rgba(100,180,120,0.15)"/>
  <!-- Drawer pull -->
  <line x1="224" y1="176" x2="234" y2="176" stroke="#c8a84c" stroke-width="0.8" opacity="0.3"/>

  <!-- ══ PICKLED-EGG JAR (on counter, holding down paperwork) ═══════ -->
  <!-- Paperwork under the jar -->
  <polygon points="256,168 268,174 264,176 252,170"
    fill="#3a3828" opacity="0.4"/>
  <polygon points="258,167 269,173 265,175 254,169"
    fill="#3c3a28" opacity="0.3"/>
  <!-- Jar body -->
  <rect x="258" y="160" width="8" height="10" fill="#2a3030" opacity="0.9"/>
  <ellipse cx="262" cy="170" rx="4" ry="1.5" fill="#2a3030" stroke="#222828" stroke-width="0.3"/>
  <ellipse cx="262" cy="160" rx="4" ry="1.5" fill="#323a3a" stroke="#2a3030" stroke-width="0.3"/>
  <!-- Brine -->
  <rect x="259" y="162" width="6" height="6" fill="rgba(120,110,50,0.12)"/>
  <!-- Eggs -->
  <ellipse cx="261" cy="164" rx="1.5" ry="1" fill="rgba(200,195,170,0.2)"/>
  <ellipse cx="264" cy="166" rx="1.5" ry="1.2" fill="rgba(200,195,170,0.18)"/>
  <!-- Lid -->
  <ellipse cx="262" cy="159" rx="3.5" ry="1.2" fill="#3a3020" stroke="#302818" stroke-width="0.3"/>

  <!-- ══ STOOL (behind counter) ═════════════════════════════════════ -->
  <line x1="228" y1="170" x2="230" y2="155" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="240" y1="170" x2="238" y2="155" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="224" y1="168" x2="230" y2="155" stroke="#3a3020" stroke-width="1"/>
  <line x1="244" y1="168" x2="238" y2="155" stroke="#3a3020" stroke-width="1"/>
  <line x1="227" y1="164" x2="241" y2="164" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="234" cy="153" rx="8" ry="4" fill="#342c20" stroke="#2c2418" stroke-width="0.5"/>

  <!-- ══ SHELF UNIT (back wall, product stock) ══════════════════════ -->
  <polygon points="330,120 378,144 354,156 306,132"
    fill="#3a3838" stroke="#252525" stroke-width="0.6"/>
  <polygon points="378,144 354,156 354,206 378,194"
    fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <polygon points="306,132 354,156 354,206 306,182"
    fill="#3a3838" stroke="#252525" stroke-width="0.6"/>
  <!-- Shelf dividers -->
  <line x1="306" y1="144" x2="354" y2="168" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="306" y1="156" x2="354" y2="180" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="306" y1="168" x2="354" y2="192" stroke="#2a2a2a" stroke-width="0.5"/>
  <!-- Products -->
  <polygon points="310,134 328,143 328,143 310,134" fill="#2a3828"/>
  <polygon points="314,146 330,153 330,155 314,148" fill="#382a2a" opacity="0.7"/>
  <polygon points="324,150 340,157 340,159 324,152" fill="#2a2a38" opacity="0.7"/>
  <polygon points="312,158 326,165 326,168 312,161" fill="#302c24" opacity="0.6"/>
  <polygon points="330,162 344,169 344,172 330,165" fill="#28302c" opacity="0.6"/>
  <polygon points="310,170 324,177 324,180 310,173" fill="#383028" opacity="0.7"/>

  <!-- ══ BOTTLES RACK (near shelf) ══════════════════════════════════ -->
  <polygon points="264,120 300,138 288,144 252,126"
    fill="#3a3838" stroke="#252525" stroke-width="0.5"/>
  <polygon points="252,126 288,144 288,176 252,158"
    fill="#3a3838" stroke="#252525" stroke-width="0.5"/>
  <polygon points="300,138 288,144 288,176 300,170"
    fill="#333030" stroke="#252525" stroke-width="0.5"/>
  <!-- Bottle shapes -->
  <line x1="256" y1="130" x2="256" y2="148" stroke="#2a3828" stroke-width="2.5" opacity="0.6"/>
  <line x1="262" y1="133" x2="262" y2="151" stroke="#382a2a" stroke-width="2.5" opacity="0.5"/>
  <line x1="268" y1="136" x2="268" y2="154" stroke="#2a2a38" stroke-width="2.5" opacity="0.5"/>
  <line x1="274" y1="139" x2="274" y2="157" stroke="#302c24" stroke-width="2.5" opacity="0.5"/>

  <!-- ══ CARDBOARD BOX (near entrance) ══════════════════════════════ -->
  <polygon points="104,188 116,194 110,197 98,191"
    fill="#3a3020" stroke="#302818" stroke-width="0.4"/>
  <polygon points="98,191 110,197 110,207 98,201"
    fill="#342c20" stroke="#281e14" stroke-width="0.4"/>
  <polygon points="116,194 110,197 110,207 116,204"
    fill="#302818" stroke="#281e14" stroke-width="0.4"/>

  <!-- ══ LABELS ═════════════════════════════════════════════════════ -->
  <text x="220" y="295" font-family="monospace" font-size="11" fill="#c8a84c" text-anchor="middle" opacity="0.8">THE REGISTER</text>
  <text x="220" y="14" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">Bodega reference fixture — not used in game</text>
</svg>
