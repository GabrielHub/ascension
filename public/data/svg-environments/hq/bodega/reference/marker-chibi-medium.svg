  <circle cx="18.5" cy="12.5" r="1.1" fill="#0a0a0c"/>
  <circle cx="14" cy="12" r="0.35" fill="#fff" opacity="0.7"/>
  <circle cx="19" cy="12" r="0.35" fill="#fff" opacity="0.7"/>
