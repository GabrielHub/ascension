  <!-- Body (medium rectangle) -->
  <path d="M9.5 22 Q9.5 20 11 19 L21 19 Q22.5 20 22.5 22 L22.5 34 Q22.5 36 21 36 L11 36 Q9.5 36 9.5 34 Z"
        fill="#3d2c20" stroke="#0a0a0c" stroke-width="0.8"/>
  <!-- Collar accent stripe -->
  <rect x="11" y="19" width="10" height="2.5" rx="1" fill="#c8a84c" opacity="0.85"/>

  <!-- Neck -->
