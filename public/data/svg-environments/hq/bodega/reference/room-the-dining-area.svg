<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- REFERENCE FIXTURE: The Dining Area — Bodega Recovery / Social
       Mixed-use back room. Folding table center, chairs, milk crate, microwave.
       Medical curtain divides the patch-up corner from eating. Cot behind curtain.
       Warm bodega palette, not clinical blue.
       4 cols x 3 rows. Origin (200, 100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24)
       Door on left wall at row 0. Camera views from bottom-left.
       DESIGN TARGET — not used in game rendering. -->

  <!-- ══ RIGHT WALL (warm back-room brown) ══════════════════════════ -->
  <polygon points="200,16 392,112 392,196 200,100"
    fill="#30261c" stroke="#261e14" stroke-width="1"/>
  <!-- Wall panel grooves -->
  <line x1="248" y1="40" x2="248" y2="124" stroke="#261e14" stroke-width="0.5"/>
  <line x1="296" y1="64" x2="296" y2="148" stroke="#261e14" stroke-width="0.5"/>
  <line x1="344" y1="88" x2="344" y2="172" stroke="#261e14" stroke-width="0.5"/>

  <!-- ══ LEFT WALL ══════════════════════════════════════════════════ -->
  <polygon points="152,40 56,88 56,172 152,124"
    fill="#2a2016" stroke="#221a10" stroke-width="1"/>
  <!-- Door frame -->
  <line x1="200" y1="16" x2="200" y2="100" stroke="#3a3020" stroke-width="2"/>
  <line x1="152" y1="40" x2="152" y2="124" stroke="#3a3020" stroke-width="2"/>
  <line x1="200" y1="26" x2="152" y2="50" stroke="#3a3020" stroke-width="1.5"/>

  <!-- ══ FIRST-AID KIT ON WALL (left wall, near medical area) ═══════ -->
  <rect x="78" y="74" width="14" height="10" rx="0.5" fill="#c8c4b8"
    stroke="#b0aca0" stroke-width="0.4" opacity="0.85"/>
  <rect x="83" y="75" width="4" height="1.5" rx="0.2" fill="rgba(200,60,60,0.6)"/>
  <rect x="84" y="74" width="1.5" height="5" rx="0.2" fill="rgba(200,60,60,0.6)"/>
  <rect x="82" y="82" width="3" height="1" rx="0.2" fill="#8a7040" opacity="0.4"/>

  <!-- ══ MOTIVATIONAL POSTER (right wall, put up ironically) ════════ -->
  <rect x="320" y="66" width="20" height="26" rx="0.3" fill="#1e2030"
    stroke="#2a2a34" stroke-width="0.4"/>
  <!-- Faded sunset image area -->
  <rect x="322" y="68" width="16" height="12" rx="0.3" fill="#1a1828"/>
  <rect x="322" y="68" width="16" height="6" fill="rgba(140,80,50,0.12)" rx="0.3"/>
  <rect x="322" y="72" width="16" height="3" fill="rgba(180,100,50,0.08)"/>
  <!-- Mountains -->
  <polygon points="322,79 326,74 330,77 334,72 338,76 338,80 322,80"
    fill="rgba(20,18,30,0.6)"/>
  <!-- Sun glow -->
  <circle cx="334" cy="73" r="2" fill="rgba(200,168,76,0.1)"/>
  <!-- Motivational word block -->
  <rect x="324" y="82" width="12" height="2.5" rx="0.2" fill="rgba(224,221,214,0.18)"/>
  <!-- Subtext -->
  <line x1="326" y1="86" x2="336" y2="86" stroke="rgba(224,221,214,0.08)" stroke-width="0.3"/>
  <!-- Pin -->
  <circle cx="330" cy="66" r="1" fill="rgba(200,60,60,0.4)"/>

  <!-- ══ FLOOR (warm bodega brown, NOT clinical blue) ═══════════════ -->
  <polygon points="200,100 392,196 248,268 56,172"
    fill="#382818" stroke="#2c1e10" stroke-width="0.8"/>
  <!-- Tile grid -->
  <line x1="248" y1="124" x2="104" y2="196" stroke="#322014" stroke-width="0.3" opacity="0.5"/>
  <line x1="296" y1="148" x2="152" y2="220" stroke="#322014" stroke-width="0.3" opacity="0.5"/>
  <line x1="344" y1="172" x2="200" y2="244" stroke="#322014" stroke-width="0.3" opacity="0.5"/>
  <line x1="152" y1="124" x2="344" y2="220" stroke="#322014" stroke-width="0.3" opacity="0.5"/>
  <line x1="104" y1="148" x2="296" y2="244" stroke="#322014" stroke-width="0.3" opacity="0.5"/>

  <!-- ══ CEILING FAN ════════════════════════════════════════════════ -->
  <ellipse cx="260" cy="44" rx="4" ry="1.5" fill="#3a3838" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="260" y1="44" x2="260" y2="48" stroke="#3a3838" stroke-width="1.2"/>
  <ellipse cx="260" cy="49" rx="5" ry="2.5" fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <polygon points="265,49 280,52 279,54 264,50" fill="#3a3020" opacity="0.85"/>
  <polygon points="255,49 240,52 241,54 256,50" fill="#342c20" opacity="0.85"/>
  <polygon points="260,51 264,56 262,57 258,57 256,56" fill="#3a3020" opacity="0.8"/>
  <polygon points="260,47 264,43 262,42 258,42 256,43" fill="#342c20" opacity="0.7"/>

  <!-- ══ MEDICAL COT (behind curtain, left side of room) ════════════ -->
  <!-- Smaller, tucked in the corner — not the hero this time -->
  <polygon points="80,138 128,162 148,152 100,128"
    fill="#c8c4b8" stroke="#3a3838" stroke-width="0.6" opacity="0.85"/>
  <!-- Pillow -->
  <polygon points="100,130 116,138 124,134 108,126"
    fill="#c8c4b8" stroke="#b0aca0" stroke-width="0.4"/>
  <!-- Frame front face -->
  <polygon points="128,162 148,152 148,168 128,178"
    fill="#3a3838" stroke="#252525" stroke-width="0.5"/>
  <polygon points="80,138 128,162 128,178 80,154"
    fill="#333030" stroke="#252525" stroke-width="0.5"/>
  <!-- Legs -->
  <line x1="86" y1="144" x2="86" y2="158" stroke="#3a3838" stroke-width="1.5"/>
  <line x1="144" y1="156" x2="144" y2="170" stroke="#3a3838" stroke-width="1.5"/>

  <!-- ══ BANDAGE BOX (near cot) ═════════════════════════════════════ -->
  <polygon points="74,160 84,165 78,168 68,163"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.3"/>
  <polygon points="68,163 78,168 78,174 68,169"
    fill="#342c20" stroke="#281e14" stroke-width="0.3"/>
  <polygon points="84,165 78,168 78,174 84,171"
    fill="#302818" stroke="#281e14" stroke-width="0.3"/>
  <!-- Red cross -->
  <line x1="73" y1="165" x2="73" y2="168" stroke="rgba(180,60,60,0.4)" stroke-width="0.6"/>
  <line x1="71" y1="166" x2="75" y2="166" stroke="rgba(180,60,60,0.4)" stroke-width="0.6"/>

  <!-- ══ MEDICAL CURTAIN DIVIDER ════════════════════════════════════ -->
  <!-- Separates the patch-up corner from the eating area -->
  <!-- Ceiling rail (angled in iso space) -->
  <line x1="120" y1="28" x2="172" y2="54" stroke="#4a4a52" stroke-width="1.5"/>
  <circle cx="120" cy="28" r="1.5" fill="#3a3a42"/>
  <circle cx="172" cy="54" r="1.5" fill="#3a3a42"/>
  <!-- Curtain rings -->
  <circle cx="130" cy="33" r="1" fill="none" stroke="#4a4a52" stroke-width="0.5"/>
  <circle cx="140" cy="38" r="1" fill="none" stroke="#4a4a52" stroke-width="0.5"/>
  <circle cx="150" cy="43" r="1" fill="none" stroke="#4a4a52" stroke-width="0.5"/>
  <circle cx="160" cy="48" r="1" fill="none" stroke="#4a4a52" stroke-width="0.5"/>
  <!-- Fabric panels (hanging, partially drawn) -->
  <path d="M130,34 Q132,38 130,160" fill="none" stroke="#2c3a38" stroke-width="5" opacity="0.8"/>
  <path d="M138,38 Q140,42 138,164" fill="none" stroke="#304040" stroke-width="5" opacity="0.75"/>
  <path d="M146,42 Q148,46 146,168" fill="none" stroke="#2c3a38" stroke-width="5" opacity="0.8"/>
  <path d="M154,46 Q156,50 154,172" fill="none" stroke="#283636" stroke-width="4" opacity="0.75"/>
  <!-- Bunched section -->
  <path d="M160,48 Q164,54 162,174" fill="none" stroke="#344844" stroke-width="4" opacity="0.7"/>
  <!-- Fold shadow lines -->
  <line x1="134" y1="44" x2="134" y2="162" stroke="rgba(0,0,0,0.1)" stroke-width="0.4"/>
  <line x1="150" y1="48" x2="150" y2="170" stroke="rgba(0,0,0,0.1)" stroke-width="0.4"/>

  <!-- ══ HERO: FOLDING TABLE (center of room) ═══════════════════════ -->
  <!-- This is where everything happens -->
  <!-- Table top -->
  <polygon points="200,164 248,188 288,168 240,144"
    fill="#2c2820" stroke="#231e18" stroke-width="0.8"/>
  <!-- Front face -->
  <polygon points="248,188 288,168 288,176 248,196"
    fill="#231e18" stroke="#1e1a16" stroke-width="0.6"/>
  <!-- Left face -->
  <polygon points="200,164 248,188 248,196 200,172"
    fill="#1e1a16" stroke="#171410" stroke-width="0.6"/>
  <!-- Top edge highlight -->
  <line x1="200" y1="164" x2="240" y2="144" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <!-- Legs -->
  <line x1="204" y1="172" x2="204" y2="192" stroke="#2a2420" stroke-width="1.8"/>
  <line x1="284" y1="172" x2="284" y2="192" stroke="#231e18" stroke-width="1.8"/>
  <line x1="248" y1="196" x2="248" y2="212" stroke="#1e1a16" stroke-width="1.8"/>

  <!-- ══ FOOD DEBRIS ON TABLE ═══════════════════════════════════════ -->
  <!-- Coffee cup -->
  <rect x="218" y="156" width="5" height="7" rx="0.8" fill="#3a3020" stroke="#302818" stroke-width="0.3"/>
  <ellipse cx="221" cy="156" rx="2.5" ry="1" fill="#342c20"/>
  <ellipse cx="221" cy="156" rx="1.5" ry="0.6" fill="#1a1008" opacity="0.5"/>
  <!-- Ramen cup -->
  <rect x="254" y="160" width="6" height="8" rx="0.8" fill="rgba(180,175,165,0.12)"
    stroke="rgba(160,155,145,0.1)" stroke-width="0.3"/>
  <!-- Chopsticks -->
  <line x1="256" y1="159" x2="253" y2="153" stroke="#3a3020" stroke-width="0.6"/>
  <line x1="258" y1="159" x2="256" y2="153" stroke="#342c20" stroke-width="0.6"/>
  <!-- Sauce packet -->
  <rect x="240" y="162" width="4" height="2.5" rx="0.3" fill="rgba(200,60,60,0.12)"/>
  <!-- Crumpled napkin -->
  <ellipse cx="268" cy="164" rx="2.5" ry="1.5" fill="rgba(200,195,180,0.08)"/>

  <!-- ══ CHAIR 1 (at table) ═════════════════════════════════════════ -->
  <!-- iso(2.2, 1.0) area -->
  <polygon points="260,134 270,128 280,134 270,138"
    fill="#263358" stroke="#0d1225" stroke-width="0.4"/>
  <polygon points="260,134 270,138 270,141 260,137"
    fill="#1a2440"/>
  <polygon points="280,134 270,138 270,141 280,137"
    fill="#1a2440"/>
  <polygon points="258,142 270,148 282,142 270,136"
    fill="#1a2440" stroke="#0d1225" stroke-width="0.4"/>
  <line x1="270" y1="148" x2="270" y2="156" stroke="#252525" stroke-width="1.5"/>
  <ellipse cx="270" cy="158" rx="8" ry="3" fill="#252525" opacity="0.7"/>

  <!-- ══ CHAIR 2 (other side of table) ══════════════════════════════ -->
  <polygon points="210,190 220,184 230,190 220,194"
    fill="#263358" stroke="#0d1225" stroke-width="0.4"/>
  <polygon points="210,190 220,194 220,197 210,193"
    fill="#1a2440"/>
  <polygon points="230,190 220,194 220,197 230,193"
    fill="#1a2440"/>
  <polygon points="208,198 220,204 232,198 220,192"
    fill="#1a2440" stroke="#0d1225" stroke-width="0.4"/>
  <line x1="220" y1="204" x2="220" y2="212" stroke="#252525" stroke-width="1.5"/>
  <ellipse cx="220" cy="214" rx="8" ry="3" fill="#252525" opacity="0.7"/>

  <!-- ══ MILK CRATE ("the third chair") ═════════════════════════════ -->
  <!-- iso(2.8, 2.0) area -->
  <polygon points="278,198 290,204 302,198 290,192"
    fill="#263040" stroke="#1e2838" stroke-width="0.5"/>
  <polygon points="278,198 290,204 290,212 278,206"
    fill="#223040" stroke="#1a2030" stroke-width="0.4"/>
  <polygon points="290,204 302,198 302,206 290,212"
    fill="#1e2838" stroke="#1a2030" stroke-width="0.4"/>
  <!-- Grid holes -->
  <rect x="280" y="200" width="2.5" height="1.5" rx="0.2" fill="rgba(0,0,0,0.15)"/>
  <rect x="280" y="203" width="2.5" height="1.5" rx="0.2" fill="rgba(0,0,0,0.15)"/>
  <rect x="284" y="202" width="2.5" height="1.5" rx="0.2" fill="rgba(0,0,0,0.12)"/>
  <rect x="293" y="200" width="2.5" height="1.5" rx="0.2" fill="rgba(0,0,0,0.12)"/>
  <rect x="293" y="203" width="2.5" height="1.5" rx="0.2" fill="rgba(0,0,0,0.1)"/>
  <rect x="297" y="201" width="2.5" height="1.5" rx="0.2" fill="rgba(0,0,0,0.1)"/>

  <!-- ══ MICROWAVE (on a shelf/surface, back-right area) ═══════════ -->
  <polygon points="340,156 356,164 368,158 352,150"
    fill="#2c2c34" stroke="#222228" stroke-width="0.4"/>
  <polygon points="340,156 356,164 356,176 340,168"
    fill="#28282e" stroke="#1e1e24" stroke-width="0.4"/>
  <polygon points="356,164 368,158 368,170 356,176"
    fill="#24242a" stroke="#1e1e24" stroke-width="0.4"/>
  <!-- Door window -->
  <polygon points="342,158 354,164 354,172 342,166"
    fill="#0e1018" stroke="#1a1a20" stroke-width="0.3"/>
  <line x1="343" y1="159" x2="345" y2="160" stroke="rgba(255,255,255,0.06)" stroke-width="0.3"/>
  <!-- Splatter stain -->
  <circle cx="347" cy="164" r="1.2" fill="rgba(60,30,10,0.12)"/>
  <!-- Buttons -->
  <circle cx="360" cy="162" r="0.6" fill="#3a3838"/>
  <circle cx="363" cy="161" r="0.6" fill="#3a3838"/>
  <!-- Timer glow -->
  <rect x="358" y="158" width="4" height="2" rx="0.3" fill="rgba(100,180,120,0.08)"/>

  <!-- ══ RADIO (on floor, near table) ═══════════════════════════════ -->
  <polygon points="330,208 346,216 340,219 324,211"
    fill="#1e1e26" stroke="#2a2a32" stroke-width="0.4"/>
  <polygon points="324,211 340,219 340,225 324,217"
    fill="#16161e"/>
  <circle cx="328" cy="213" r="1.5" fill="#2a2a32" opacity="0.5"/>
  <circle cx="336" cy="217" r="1.5" fill="#2a2a32" opacity="0.5"/>
  <line x1="342" y1="216" x2="346" y2="208" stroke="#3a3a42" stroke-width="0.4"/>

  <!-- ══ LABELS ═════════════════════════════════════════════════════ -->
  <text x="220" y="295" font-family="monospace" font-size="11" fill="#c8a84c" text-anchor="middle" opacity="0.8">THE DINING AREA</text>
  <text x="220" y="14" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">Bodega reference fixture — not used in game</text>
</svg>
