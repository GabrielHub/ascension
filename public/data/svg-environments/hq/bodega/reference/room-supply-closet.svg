<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- REFERENCE FIXTURE: Supply Closet — Bodega Staffing / Storage
       "Behind the register, next to the mops. Literally a closet."
       Shelves packed with gear. Boxes stacked too high. Mop in the corner.
       Dense, cramped, someone tried to organize it.
       4 cols x 3 rows. Origin (200, 100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24)
       Door on left wall at row 0. Camera views from bottom-left.
       DESIGN TARGET — not used in game rendering. -->

  <!-- ══ RIGHT WALL (dark, cramped feel) ════════════════════════════ -->
  <polygon points="200,16 392,112 392,196 200,100"
    fill="#2c2218" stroke="#241a10" stroke-width="1"/>
  <!-- Wall grooves (barely visible behind shelves) -->
  <line x1="248" y1="40" x2="248" y2="124" stroke="#241a10" stroke-width="0.5"/>
  <line x1="296" y1="64" x2="296" y2="148" stroke="#241a10" stroke-width="0.5"/>
  <line x1="344" y1="88" x2="344" y2="172" stroke="#241a10" stroke-width="0.5"/>

  <!-- ══ LEFT WALL ══════════════════════════════════════════════════ -->
  <polygon points="152,40 56,88 56,172 152,124"
    fill="#261e14" stroke="#201810" stroke-width="1"/>
  <!-- Door frame -->
  <line x1="200" y1="16" x2="200" y2="100" stroke="#3a3020" stroke-width="2"/>
  <line x1="152" y1="40" x2="152" y2="124" stroke="#3a3020" stroke-width="2"/>
  <line x1="200" y1="26" x2="152" y2="50" stroke="#3a3020" stroke-width="1.5"/>

  <!-- ══ FLOOR (dark, worn) ═════════════════════════════════════════ -->
  <polygon points="200,100 392,196 248,268 56,172"
    fill="#302418" stroke="#261c10" stroke-width="0.8"/>
  <!-- Tile grid -->
  <line x1="248" y1="124" x2="104" y2="196" stroke="#2a1e12" stroke-width="0.3" opacity="0.5"/>
  <line x1="296" y1="148" x2="152" y2="220" stroke="#2a1e12" stroke-width="0.3" opacity="0.5"/>
  <line x1="344" y1="172" x2="200" y2="244" stroke="#2a1e12" stroke-width="0.3" opacity="0.5"/>
  <line x1="152" y1="124" x2="344" y2="220" stroke="#2a1e12" stroke-width="0.3" opacity="0.5"/>
  <line x1="104" y1="148" x2="296" y2="244" stroke="#2a1e12" stroke-width="0.3" opacity="0.5"/>

  <!-- ══ HERO: SHELF UNIT 1 (right wall, packed with gear) ══════════ -->
  <!-- Tall, dominant, stuffed full -->
  <polygon points="310,100 358,124 334,136 286,112"
    fill="#3a3838" stroke="#252525" stroke-width="0.6"/>
  <polygon points="358,124 334,136 334,196 358,184"
    fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <polygon points="286,112 334,136 334,196 286,172"
    fill="#3a3838" stroke="#252525" stroke-width="0.7"/>
  <!-- Shelf dividers -->
  <line x1="286" y1="126" x2="334" y2="150" stroke="#2a2a2a" stroke-width="0.6"/>
  <line x1="286" y1="140" x2="334" y2="164" stroke="#2a2a2a" stroke-width="0.6"/>
  <line x1="286" y1="154" x2="334" y2="178" stroke="#2a2a2a" stroke-width="0.6"/>
  <!-- Shelf contents (dense — gear, supplies, bodega stock mixed) -->
  <!-- Top shelf: tactical stuff -->
  <polygon points="290,114 306,122 306,126 290,118" fill="#283028" opacity="0.8"/>
  <polygon points="308,120 320,126 320,126 308,120" fill="#2c2820" opacity="0.7"/>
  <polygon points="316,124 330,130 330,134 316,128" fill="#2a2a38" opacity="0.7"/>
  <!-- Second shelf: medical supplies -->
  <polygon points="288,128 302,135 302,140 288,133" fill="#c8c4b8" opacity="0.12"/>
  <polygon points="306,134 320,140 320,144 306,138" fill="#382a2a" opacity="0.6"/>
  <polygon points="318,138 332,144 332,148 318,142" fill="#302c24" opacity="0.6"/>
  <!-- Third shelf: packaged stuff -->
  <polygon points="290,144 308,153 308,156 290,147" fill="#3a3020" opacity="0.7"/>
  <polygon points="312,150 328,157 328,162 312,155" fill="#28302c" opacity="0.6"/>
  <!-- Bottom shelf: heavy boxes -->
  <polygon points="288,158 310,169 310,174 288,163" fill="#302820" opacity="0.7"/>
  <polygon points="314,164 332,172 332,178 314,170" fill="#2a3030" opacity="0.6"/>

  <!-- ══ SHELF UNIT 2 (left wall area) ══════════════════════════════ -->
  <polygon points="200,96 240,116 220,126 180,106"
    fill="#3a3838" stroke="#252525" stroke-width="0.5"/>
  <polygon points="240,116 220,126 220,178 240,168"
    fill="#333030" stroke="#252525" stroke-width="0.5"/>
  <polygon points="180,106 220,126 220,178 180,158"
    fill="#3a3838" stroke="#252525" stroke-width="0.6"/>
  <!-- Shelf dividers -->
  <line x1="180" y1="120" x2="220" y2="140" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="180" y1="134" x2="220" y2="154" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="180" y1="148" x2="220" y2="168" stroke="#2a2a2a" stroke-width="0.5"/>
  <!-- Contents -->
  <polygon points="184,108 200,116 200,120 184,112" fill="#302c24" opacity="0.7"/>
  <polygon points="204,116 216,122 216,120 204,114" fill="#2a3828" opacity="0.6"/>
  <polygon points="182,122 198,130 198,134 182,126" fill="#383028" opacity="0.6"/>
  <polygon points="202,130 214,136 214,140 202,134" fill="#2c2420" opacity="0.6"/>
  <polygon points="184,138 200,146 200,150 184,142" fill="#2a2a38" opacity="0.6"/>
  <polygon points="186,152 204,160 204,166 186,158" fill="#302820" opacity="0.7"/>

  <!-- ══ FILING CABINET (squeezed in, left area) ════════════════════ -->
  <polygon points="110,120 132,131 152,120 130,109"
    fill="#3a3838" stroke="#252525" stroke-width="0.6"/>
  <polygon points="132,131 152,120 152,164 132,175"
    fill="#3a3838" stroke="#252525" stroke-width="0.7"/>
  <polygon points="110,120 132,131 132,175 110,164"
    fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <!-- Drawer lines -->
  <line x1="133" y1="141" x2="151" y2="131" stroke="#252525" stroke-width="0.5"/>
  <line x1="133" y1="151" x2="151" y2="141" stroke="#252525" stroke-width="0.5"/>
  <line x1="133" y1="161" x2="151" y2="151" stroke="#252525" stroke-width="0.5"/>
  <!-- Handles -->
  <rect x="146" y="126" width="2.5" height="2.5" fill="#8a7040" rx="0.3"/>
  <rect x="146" y="136" width="2.5" height="2.5" fill="#8a7040" rx="0.3"/>
  <rect x="146" y="146" width="2.5" height="2.5" fill="#8a7040" rx="0.3"/>

  <!-- ══ GEAR CRATE (center floor, dungeon kit) ═════════════════════ -->
  <polygon points="228,182 244,190 260,182 244,174"
    fill="#283028" stroke="#1e261e" stroke-width="0.5"/>
  <polygon points="228,182 244,190 244,204 228,196"
    fill="#243028" stroke="#1c241c" stroke-width="0.4"/>
  <polygon points="244,190 260,182 260,196 244,204"
    fill="#1e261e" stroke="#1c241c" stroke-width="0.4"/>
  <!-- Metal bands -->
  <line x1="228" y1="188" x2="244" y2="196" stroke="#3a3a38" stroke-width="0.7"/>
  <line x1="244" y1="196" x2="260" y2="188" stroke="#3a3838" stroke-width="0.6"/>
  <!-- Clasp -->
  <rect x="234" y="194" width="3" height="1.5" rx="0.2" fill="#8a7040" opacity="0.3"/>
  <rect x="250" y="186" width="3" height="1.5" rx="0.2" fill="#8a7040" opacity="0.25"/>

  <!-- ══ STACKED BOXES (right-center, piled high) ═══════════════════ -->
  <!-- Bottom box -->
  <polygon points="280,202 296,210 312,202 296,194"
    fill="#3a3020" stroke="#302818" stroke-width="0.5"/>
  <polygon points="296,210 312,202 312,220 296,228"
    fill="#302818" stroke="#281e14" stroke-width="0.4"/>
  <polygon points="280,202 296,210 296,228 280,220"
    fill="#342c20" stroke="#281e14" stroke-width="0.4"/>
  <!-- Top box (stacked on bottom, slightly offset) -->
  <polygon points="284,188 298,195 310,188 296,181"
    fill="#3a3020" stroke="#302818" stroke-width="0.5"/>
  <polygon points="298,195 310,188 310,202 298,209"
    fill="#302818" stroke="#281e14" stroke-width="0.4"/>
  <polygon points="284,188 298,195 298,209 284,202"
    fill="#342c20" stroke="#281e14" stroke-width="0.4"/>
  <!-- Tape strip on top box -->
  <line x1="296" y1="181" x2="296" y2="195" stroke="rgba(200,168,76,0.1)" stroke-width="1.5"/>

  <!-- ══ THIRD BOX (floor, near shelves) ════════════════════════════ -->
  <polygon points="210,210 224,217 236,210 222,203"
    fill="#3a3020" stroke="#302818" stroke-width="0.4"/>
  <polygon points="224,217 236,210 236,224 224,231"
    fill="#302818" stroke="#281e14" stroke-width="0.4"/>
  <polygon points="210,210 224,217 224,231 210,224"
    fill="#342c20" stroke="#281e14" stroke-width="0.4"/>
  <!-- Flap open -->
  <polygon points="210,210 218,206 222,210 224,217"
    fill="#3e3424" opacity="0.4"/>

  <!-- ══ CLIPBOARD ON SHELF (gear tracking) ═════════════════════════ -->
  <polygon points="194,132 206,138 202,140 190,134"
    fill="#2c2818" stroke="#241e12" stroke-width="0.3"/>
  <line x1="194" y1="134" x2="202" y2="138" stroke="rgba(200,168,76,0.1)" stroke-width="0.3"/>
  <line x1="194" y1="136" x2="200" y2="139" stroke="rgba(200,168,76,0.06)" stroke-width="0.3"/>

  <!-- ══ MOP AND BROOM (leaning against left wall, "next to the mops") ═ -->
  <!-- Broom handle -->
  <line x1="88" y1="96" x2="84" y2="164" stroke="#3a3020" stroke-width="1.8"/>
  <!-- Broom head -->
  <polygon points="80,164 84,162 88,164 88,174 84,176 80,174"
    fill="#342c1e" stroke="#281e14" stroke-width="0.4"/>
  <line x1="82" y1="166" x2="81" y2="174" stroke="#281e14" stroke-width="0.3"/>
  <line x1="84" y1="165" x2="84" y2="175" stroke="#281e14" stroke-width="0.3"/>
  <line x1="86" y1="166" x2="87" y2="174" stroke="#281e14" stroke-width="0.3"/>
  <line x1="81" y1="165" x2="87" y2="165" stroke="#2c2418" stroke-width="0.6"/>
  <!-- Mop handle -->
  <line x1="96" y1="94" x2="100" y2="160" stroke="#3a3838" stroke-width="1.8"/>
  <!-- Mop head clamp -->
  <rect x="97" y="160" width="7" height="3" rx="0.5" fill="#4a4a52" stroke="#3a3a42" stroke-width="0.3"/>
  <!-- Mop strands -->
  <path d="M98,163 Q96,170 97,178" fill="none" stroke="#2c3830" stroke-width="1.2" opacity="0.8"/>
  <path d="M100,163 Q99,172 100,178" fill="none" stroke="#283430" stroke-width="1.2" opacity="0.7"/>
  <path d="M103,163 Q105,170 104,178" fill="none" stroke="#2c3830" stroke-width="1" opacity="0.8"/>
  <path d="M99,163 Q97,174 98,178" fill="none" stroke="#263028" stroke-width="1" opacity="0.6"/>
  <!-- Tiny mop puddle -->
  <ellipse cx="100" cy="178" rx="5" ry="1.5" fill="rgba(40,60,60,0.12)"/>

  <!-- ══ BUCKET (cleaning supplies, near mop) ═══════════════════════ -->
  <ellipse cx="120" cy="196" rx="8" ry="3" fill="#2a3038" stroke="#222830" stroke-width="0.4"/>
  <rect x="112" y="182" width="16" height="14" fill="#2a3038"/>
  <ellipse cx="120" cy="182" rx="8" ry="3" fill="#323a42" stroke="#2a3038" stroke-width="0.4"/>
  <ellipse cx="120" cy="182" rx="6" ry="2" fill="#1a2028"/>
  <path d="M114,182 Q114,174 120,172 Q126,174 126,182" fill="none" stroke="#4a4a52" stroke-width="0.8"/>
  <line x1="112" y1="190" x2="128" y2="190" stroke="#3a4048" stroke-width="0.6"/>

  <!-- ══ LABELS ═════════════════════════════════════════════════════ -->
  <text x="220" y="295" font-family="monospace" font-size="11" fill="#c8a84c" text-anchor="middle" opacity="0.8">SUPPLY CLOSET</text>
  <text x="220" y="14" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">Bodega reference fixture — not used in game</text>
</svg>
