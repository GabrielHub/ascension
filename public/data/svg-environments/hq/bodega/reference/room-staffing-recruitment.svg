<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- REFERENCE FIXTURE: Staffing / Recruitment Room
       4 cols × 3 rows. Origin (200, 100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24)
       Door on left wall at row 0. Camera views from bottom-left.
       DESIGN TARGET — not used in game rendering. -->

  <!-- ══ RIGHT WALL ═══════════════════════════════════════════════ -->
  <polygon points="200,16 392,112 392,196 200,100"
    fill="#282e22" stroke="#202618" stroke-width="1"/>

  <!-- ══ LEFT WALL (rows 1-3 solid, row 0 door) ══════════════════ -->
  <polygon points="152,40 56,88 56,172 152,124"
    fill="#222820" stroke="#1c2018" stroke-width="1"/>
  <!-- Door frame -->
  <line x1="200" y1="16" x2="200" y2="100" stroke="#3a3828" stroke-width="2"/>
  <line x1="152" y1="40" x2="152" y2="124" stroke="#3a3828" stroke-width="2"/>
  <line x1="200" y1="26" x2="152" y2="50" stroke="#3a3828" stroke-width="1.5"/>

  <!-- Corkboard on right wall (job postings) -->
  <polygon points="280,72 320,92 320,108 280,88"
    fill="#3a2c20" stroke="#2c2018" stroke-width="0.5"/>
  <!-- Pinned papers on corkboard -->
  <polygon points="286,76 298,82 298,88 286,82" fill="#3a3828" opacity="0.6"/>
  <polygon points="302,84 314,90 314,96 302,90" fill="#3c3a2a" opacity="0.5"/>
  <polygon points="288,86 296,90 296,96 288,92" fill="#383828" opacity="0.5"/>
  <!-- Pins -->
  <circle cx="290" cy="78" r="1" fill="rgba(200,60,60,0.5)"/>
  <circle cx="306" cy="86" r="1" fill="rgba(60,100,200,0.5)"/>
  <circle cx="292" cy="88" r="1" fill="rgba(200,168,76,0.5)"/>

  <!-- Clock on left wall -->
  <circle cx="100" cy="96" r="8" fill="#2a2a32" stroke="#3a3a42" stroke-width="0.5"/>
  <circle cx="100" cy="96" r="6" fill="#1e1e26"/>
  <line x1="100" y1="96" x2="100" y2="91" stroke="#c8a84c" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="96" x2="104" y2="96" stroke="#c8a84c" stroke-width="0.4" opacity="0.3"/>

  <!-- ══ FLOOR (olive/green office) ══════════════════════════════ -->
  <polygon points="200,100 392,196 248,268 56,172"
    fill="#2c3024" stroke="#242818" stroke-width="0.8"/>
  <!-- Tile grid -->
  <line x1="248" y1="124" x2="104" y2="196" stroke="#263020" stroke-width="0.3" opacity="0.5"/>
  <line x1="296" y1="148" x2="152" y2="220" stroke="#263020" stroke-width="0.3" opacity="0.5"/>
  <line x1="344" y1="172" x2="200" y2="244" stroke="#263020" stroke-width="0.3" opacity="0.5"/>
  <line x1="152" y1="124" x2="344" y2="220" stroke="#263020" stroke-width="0.3" opacity="0.5"/>
  <line x1="104" y1="148" x2="296" y2="244" stroke="#263020" stroke-width="0.3" opacity="0.5"/>

  <!-- ══ HERO: INTERVIEW TABLE (cols 1.2-2.8, rows 1.0-1.7) ═════ -->
  <!-- Centered table for the interview setup -->
  <!-- iso(1.2,1.0)=(210,153) iso(2.8,1.0)=(286,191) iso(2.8,1.7)=(253,208) iso(1.2,1.7)=(176,170) -->
  <!-- Top surface -->
  <polygon points="210,153 286,191 253,208 176,170"
    fill="#2c2820" stroke="#231e18" stroke-width="0.6"/>
  <!-- Left face -->
  <polygon points="176,170 253,208 253,216 176,178"
    fill="#1e1a16" stroke="#171410" stroke-width="0.5"/>
  <!-- Right face -->
  <polygon points="286,191 253,208 253,216 286,199"
    fill="#231e18" stroke="#171410" stroke-width="0.5"/>
  <!-- Top edge highlight -->
  <line x1="210" y1="153" x2="286" y2="191" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
  <!-- Table legs -->
  <line x1="182" y1="176" x2="182" y2="192" stroke="#2a2420" stroke-width="1.5"/>
  <line x1="282" y1="196" x2="282" y2="212" stroke="#231e18" stroke-width="1.5"/>
  <line x1="250" y1="212" x2="250" y2="228" stroke="#1e1a16" stroke-width="1.5"/>

  <!-- Clipboard on table -->
  <polygon points="224,166 240,174 236,176 220,168"
    fill="#2c2818" stroke="#241e12" stroke-width="0.3"/>
  <!-- Text lines -->
  <line x1="224" y1="168" x2="234" y2="173" stroke="rgba(200,168,76,0.12)" stroke-width="0.3"/>
  <line x1="224" y1="170" x2="232" y2="174" stroke="rgba(200,168,76,0.08)" stroke-width="0.3"/>

  <!-- ══ CHAIR (interviewer side, col 2.0, row 0.5) ═════════════ -->
  <!-- iso(2.0, 0.5) = (200+1.5*48, 100+2.5*24) = (272, 160) -->
  <!-- Back rest -->
  <polygon points="262,146 272,140 282,146 272,150"
    fill="#263358" stroke="#0d1225" stroke-width="0.4"/>
  <polygon points="262,146 272,150 272,153 262,149"
    fill="#1a2440"/>
  <polygon points="282,146 272,150 272,153 282,149"
    fill="#1a2440"/>
  <!-- Seat -->
  <polygon points="260,154 272,160 284,154 272,148"
    fill="#1a2440" stroke="#0d1225" stroke-width="0.4"/>
  <!-- Post and base -->
  <line x1="272" y1="160" x2="272" y2="168" stroke="#252525" stroke-width="1.5"/>
  <ellipse cx="272" cy="170" rx="8" ry="3" fill="#252525" opacity="0.7"/>

  <!-- ══ CHAIR (candidate side, col 2.0, row 2.2) ═══════════════ -->
  <!-- iso(2.0, 2.2) = (200+(2-2.2)*48, 100+(2+2.2)*24) = (190, 201) -->
  <!-- Back rest -->
  <polygon points="181,188 190,183 199,188 190,192"
    fill="#263358" stroke="#0d1225" stroke-width="0.4"/>
  <polygon points="181,188 190,192 190,195 181,191"
    fill="#1a2440"/>
  <polygon points="199,188 190,192 190,195 199,191"
    fill="#1a2440"/>
  <!-- Seat -->
  <polygon points="179,196 190,202 201,196 190,190"
    fill="#1a2440" stroke="#0d1225" stroke-width="0.4"/>
  <!-- Post and base -->
  <line x1="190" y1="202" x2="190" y2="210" stroke="#252525" stroke-width="1.5"/>
  <ellipse cx="190" cy="212" rx="8" ry="3" fill="#252525" opacity="0.7"/>

  <!-- ══ FILING CABINET (col 0.5, row 0.3) ══════════════════════ -->
  <!-- iso(0.5, 0.3) = (200+0.2*48, 100+0.8*24) = (210, 119) -->
  <!-- Back-left area near the wall -->
  <!-- Top -->
  <polygon points="201,116 218,124 210,128 194,120"
    fill="#3a3838" stroke="#252525" stroke-width="0.5"/>
  <!-- Left face -->
  <polygon points="194,120 210,128 210,160 194,152"
    fill="#333030" stroke="#252525" stroke-width="0.5"/>
  <!-- Right face -->
  <polygon points="218,124 210,128 210,160 218,156"
    fill="#3a3838" stroke="#252525" stroke-width="0.5"/>
  <!-- Drawer lines -->
  <line x1="219" y1="133" x2="211" y2="137" stroke="#252525" stroke-width="0.4"/>
  <line x1="219" y1="142" x2="211" y2="146" stroke="#252525" stroke-width="0.4"/>
  <line x1="219" y1="151" x2="211" y2="155" stroke="#252525" stroke-width="0.4"/>
  <!-- Drawer handles -->
  <rect x="214" y="128" width="2" height="2" fill="#8a7040" rx="0.3" opacity="0.6"/>
  <rect x="214" y="137" width="2" height="2" fill="#8a7040" rx="0.3" opacity="0.6"/>
  <rect x="214" y="146" width="2" height="2" fill="#8a7040" rx="0.3" opacity="0.6"/>

  <!-- ══ WATER COOLER (col 3.5, row 0.5) ═════════════════════════ -->
  <!-- iso(3.5, 0.5) = (200+3*48, 100+4*24) = (344, 196) -->
  <!-- Against right wall -->
  <!-- Cabinet base -->
  <polygon points="336,190 350,197 344,200 330,193"
    fill="#2a2a32" stroke="#222230" stroke-width="0.4"/>
  <polygon points="330,193 344,200 344,212 330,205"
    fill="#303038"/>
  <polygon points="350,197 344,200 344,212 350,209"
    fill="#282830"/>
  <!-- Body -->
  <polygon points="333,180 347,187 344,188 330,181"
    fill="#303038"/>
  <polygon points="330,181 344,188 344,200 330,193"
    fill="#303038" stroke="#282830" stroke-width="0.3"/>
  <polygon points="347,187 344,188 344,200 347,197"
    fill="#282830"/>
  <!-- Water jug -->
  <ellipse cx="338" cy="176" rx="5" ry="2.5" fill="#384858" opacity="0.6"/>
  <rect x="334" y="168" width="8" height="8" rx="1.5" fill="#3a5068" opacity="0.5"/>
  <rect x="335" y="164" width="6" height="5" rx="1" fill="#3a5068" opacity="0.4"/>

  <!-- ══ PLANT (col 1.0, row 2.5) ═══════════════════════════════ -->
  <!-- iso(1.0, 2.5) = (200+(1-2.5)*48, 100+(1+2.5)*24) = (128, 184) -->
  <!-- Near entrance area -->
  <!-- Pot -->
  <polygon points="122,190 128,193 134,190 128,187"
    fill="#2c2218"/>
  <polygon points="128,193 134,190 134,200 128,203"
    fill="#2c2218" stroke="#231e18" stroke-width="0.3"/>
  <polygon points="122,190 128,193 128,203 122,200"
    fill="#3d2c20" stroke="#231e18" stroke-width="0.3"/>
  <!-- Foliage -->
  <ellipse cx="128" cy="182" rx="10" ry="8" fill="#1a3028"/>
  <ellipse cx="124" cy="178" rx="5" ry="6" fill="#1a3028"/>
  <ellipse cx="133" cy="179" rx="4" ry="5" fill="#1c3830"/>

  <!-- ══ BOX OF FILES (col 0.8, row 1.5) ═════════════════════════ -->
  <!-- iso(0.8, 1.5) = (200+(0.8-1.5)*48, 100+(0.8+1.5)*24) = (166, 155) -->
  <polygon points="160,150 172,156 166,159 154,153"
    fill="#3a3020" stroke="#302818" stroke-width="0.4"/>
  <polygon points="154,153 166,159 166,168 154,162"
    fill="#342c20" stroke="#281e14" stroke-width="0.3"/>
  <polygon points="172,156 166,159 166,168 172,165"
    fill="#302818" stroke="#281e14" stroke-width="0.3"/>
  <!-- Papers sticking out -->
  <polygon points="157,150 163,153 163,149 157,146"
    fill="#3a3828" opacity="0.5"/>

  <!-- ══ LABELS ═══════════════════════════════════════════════════ -->
  <text x="220" y="295" font-family="monospace" font-size="11" fill="#c8a84c" text-anchor="middle" opacity="0.8">STAFFING — RECRUITMENT</text>
  <text x="220" y="14" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">Reference fixture — not used in game</text>
</svg>
