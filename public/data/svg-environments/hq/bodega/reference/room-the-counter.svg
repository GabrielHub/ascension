<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- REFERENCE FIXTURE: The Counter — Bodega Recruitment / Deli
       Public-facing deli counter. Boss makes sandwiches, pours coffee,
       recruits whoever lingers. Deli case is the hero.
       4 cols x 3 rows. Origin (200, 100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24)
       Door on left wall at row 0. Camera views from bottom-left.
       DESIGN TARGET — not used in game rendering. -->

  <!-- ══ RIGHT WALL ═════════════════════════════════════════════════ -->
  <polygon points="200,16 392,112 392,196 200,100"
    fill="#342416" stroke="#281c12" stroke-width="1"/>
  <!-- Wall panel grooves -->
  <line x1="248" y1="40" x2="248" y2="124" stroke="#281c12" stroke-width="0.5"/>
  <line x1="296" y1="64" x2="296" y2="148" stroke="#281c12" stroke-width="0.5"/>
  <line x1="344" y1="88" x2="344" y2="172" stroke="#281c12" stroke-width="0.5"/>

  <!-- ══ LEFT WALL ══════════════════════════════════════════════════ -->
  <polygon points="152,40 56,88 56,172 152,124"
    fill="#2c2014" stroke="#241c12" stroke-width="1"/>
  <!-- Door frame -->
  <line x1="200" y1="16" x2="200" y2="100" stroke="#3a3020" stroke-width="2"/>
  <line x1="152" y1="40" x2="152" y2="124" stroke="#3a3020" stroke-width="2"/>
  <line x1="200" y1="26" x2="152" y2="50" stroke="#3a3020" stroke-width="1.5"/>

  <!-- ══ MENU BOARD (right wall, half letters missing) ══════════════ -->
  <polygon points="312,96 348,114 338,119 302,101"
    fill="#18161c" stroke="#121016" stroke-width="0.4"/>
  <polygon points="302,101 338,119 338,131 302,113"
    fill="#141218" stroke="#121016" stroke-width="0.3"/>
  <polygon points="348,114 338,119 338,131 348,126"
    fill="#18161c" stroke="#121016" stroke-width="0.3"/>
  <line x1="307" y1="106" x2="332" y2="118" stroke="rgba(224,221,214,0.08)" stroke-width="0.7"/>
  <line x1="306" y1="110" x2="326" y2="120" stroke="rgba(224,221,214,0.05)" stroke-width="0.6"/>
  <line x1="331" y1="119" x2="336" y2="121" stroke="rgba(200,168,76,0.08)" stroke-width="0.6"/>

  <!-- ══ FLOOR (warm bodega) ════════════════════════════════════════ -->
  <polygon points="200,100 392,196 248,268 56,172"
    fill="#3a2818" stroke="#2e1e10" stroke-width="0.8"/>
  <!-- Tile grid -->
  <line x1="248" y1="124" x2="104" y2="196" stroke="#341e12" stroke-width="0.3" opacity="0.5"/>
  <line x1="296" y1="148" x2="152" y2="220" stroke="#341e12" stroke-width="0.3" opacity="0.5"/>
  <line x1="344" y1="172" x2="200" y2="244" stroke="#341e12" stroke-width="0.3" opacity="0.5"/>
  <line x1="152" y1="124" x2="344" y2="220" stroke="#341e12" stroke-width="0.3" opacity="0.5"/>
  <line x1="104" y1="148" x2="296" y2="244" stroke="#341e12" stroke-width="0.3" opacity="0.5"/>

  <!-- ══ CEILING FAN ════════════════════════════════════════════════ -->
  <ellipse cx="260" cy="44" rx="4" ry="1.5" fill="#3a3838" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="260" y1="44" x2="260" y2="48" stroke="#3a3838" stroke-width="1.2"/>
  <ellipse cx="260" cy="49" rx="5" ry="2.5" fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <polygon points="265,49 280,52 279,54 264,50" fill="#3a3020" opacity="0.85"/>
  <polygon points="255,49 240,52 241,54 256,50" fill="#342c20" opacity="0.85"/>
  <polygon points="260,51 264,56 262,57 258,57 256,56" fill="#3a3020" opacity="0.8"/>
  <polygon points="260,47 264,43 262,42 258,42 256,43" fill="#342c20" opacity="0.7"/>

  <!-- ══ HERO: DELI DISPLAY CASE ════════════════════════════════════ -->
  <!-- Glass-fronted counter with visible food. Scratched but functional. -->
  <!-- Case top surface -->
  <polygon points="150,144 286,212 258,226 122,158"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.7"/>
  <!-- Front face (below glass) -->
  <polygon points="122,158 258,226 258,248 122,180"
    fill="#2c2418" stroke="#241c12" stroke-width="0.5"/>
  <!-- Right end face -->
  <polygon points="286,212 258,226 258,248 286,234"
    fill="#302818" stroke="#241c12" stroke-width="0.5"/>
  <!-- Glass display front (angled, translucent) -->
  <polygon points="122,158 258,226 258,214 122,146"
    fill="rgba(60,80,90,0.12)" stroke="rgba(80,100,110,0.2)" stroke-width="0.5"/>
  <!-- Glass reflections -->
  <line x1="132" y1="152" x2="168" y2="170" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
  <line x1="190" y1="188" x2="228" y2="207" stroke="rgba(255,255,255,0.05)" stroke-width="0.4"/>
  <!-- Glass scratches -->
  <line x1="154" y1="175" x2="160" y2="178" stroke="rgba(255,255,255,0.04)" stroke-width="0.3"/>
  <!-- Food silhouettes inside case -->
  <polygon points="140,174 167,187 163,190 136,176"
    fill="rgba(180,150,100,0.12)" stroke="rgba(160,130,80,0.08)" stroke-width="0.3"/>
  <polygon points="175,191 202,204 198,207 171,193"
    fill="rgba(80,130,80,0.1)" stroke="rgba(60,110,60,0.08)" stroke-width="0.3"/>
  <polygon points="153,183 182,197 179,199 150,185"
    fill="rgba(160,80,70,0.1)" stroke="rgba(140,60,50,0.06)" stroke-width="0.3"/>
  <!-- Steel top rail -->
  <line x1="122" y1="146" x2="258" y2="214" stroke="#4a4a52" stroke-width="1"/>
  <!-- Panel grooves -->
  <line x1="160" y1="177" x2="160" y2="198" stroke="#241c12" stroke-width="0.4"/>
  <line x1="196" y1="195" x2="196" y2="216" stroke="#241c12" stroke-width="0.4"/>
  <line x1="232" y1="213" x2="232" y2="234" stroke="#241c12" stroke-width="0.4"/>
  <!-- Top edge highlight -->
  <line x1="150" y1="144" x2="286" y2="212" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- ══ COFFEE MACHINE (behind counter) ════════════════════════════ -->
  <!-- iso(1.0, 0.8) area — behind the counter, Boss's side -->
  <!-- Body -->
  <polygon points="172,118 190,127 202,121 184,112"
    fill="#2a2830" stroke="#222028" stroke-width="0.5"/>
  <polygon points="172,118 190,127 190,148 172,139"
    fill="#26242c" stroke="#1c1a22" stroke-width="0.4"/>
  <polygon points="190,127 202,121 202,142 190,148"
    fill="#222028" stroke="#1c1a22" stroke-width="0.4"/>
  <!-- Water reservoir -->
  <polygon points="174,114 184,119 190,115 180,110"
    fill="#1e2028" stroke="#1a1a22" stroke-width="0.3"/>
  <!-- Warming plate + carafe -->
  <polygon points="176,139 190,146 198,142 184,135"
    fill="#3a3838" stroke="#252525" stroke-width="0.4"/>
  <polygon points="180,134 188,138 192,136 184,132"
    fill="#1a2028" stroke="#222830" stroke-width="0.3"/>
  <polygon points="180,134 188,138 188,144 180,140"
    fill="#1e242e" opacity="0.8"/>
  <!-- Power light -->
  <circle cx="200" cy="126" r="1" fill="rgba(200,60,60,0.3)"/>
  <!-- Drip stain -->
  <line x1="184" y1="140" x2="188" y2="142" stroke="rgba(30,16,8,0.3)" stroke-width="0.6"/>

  <!-- ══ CUSTOMER STOOLS ════════════════════════════════════════════ -->
  <!-- Stool 1 -->
  <line x1="154" y1="222" x2="156" y2="208" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="164" y1="222" x2="162" y2="208" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="151" y1="218" x2="156" y2="208" stroke="#3a3020" stroke-width="1"/>
  <line x1="167" y1="218" x2="162" y2="208" stroke="#3a3020" stroke-width="1"/>
  <line x1="153" y1="216" x2="165" y2="216" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="159" cy="206" rx="7" ry="3.5" fill="#342c20" stroke="#2c2418" stroke-width="0.5"/>
  <!-- Stool 2 -->
  <line x1="210" y1="246" x2="212" y2="232" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="220" y1="246" x2="218" y2="232" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="207" y1="242" x2="212" y2="232" stroke="#3a3020" stroke-width="1"/>
  <line x1="223" y1="242" x2="218" y2="232" stroke="#3a3020" stroke-width="1"/>
  <line x1="209" y1="240" x2="221" y2="240" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="215" cy="230" rx="7" ry="3.5" fill="#342c20" stroke="#2c2418" stroke-width="0.5"/>

  <!-- ══ PLANT (near entrance, scrappy) ═════════════════════════════ -->
  <polygon points="120,194 126,197 132,194 126,191" fill="#2c2218"/>
  <polygon points="120,194 126,197 126,204 120,201" fill="#3d2c20" stroke="#231e18" stroke-width="0.3"/>
  <polygon points="132,194 126,197 126,204 132,201" fill="#2c2218" stroke="#231e18" stroke-width="0.3"/>
  <ellipse cx="126" cy="185" rx="8" ry="7" fill="#1a3028"/>
  <ellipse cx="122" cy="182" rx="4" ry="5" fill="#1a3028"/>
  <ellipse cx="130" cy="183" rx="3.5" ry="4" fill="#1c3830"/>

  <!-- ══ LABELS ═════════════════════════════════════════════════════ -->
  <text x="220" y="295" font-family="monospace" font-size="11" fill="#c8a84c" text-anchor="middle" opacity="0.8">THE COUNTER</text>
  <text x="220" y="14" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">Bodega reference fixture — not used in game</text>
</svg>
