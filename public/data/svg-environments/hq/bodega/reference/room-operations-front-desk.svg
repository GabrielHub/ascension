<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- REFERENCE FIXTURE: Operations / Front Desk Room
       4 cols × 3 rows. Origin (200, 100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24)
       Door on left wall at row 0. Camera views from bottom-left.
       This is the DESIGN TARGET - not used in game rendering. -->

  <!-- ══ RIGHT WALL (row=0, col 0→4) ═══════════════════════════════ -->
  <polygon points="200,16 392,112 392,196 200,100"
    fill="#352616" stroke="#281e14" stroke-width="1"/>
  <!-- Wall panel grooves -->
  <line x1="248,40" y1="40" x2="248,124" y2="124" stroke="#281e14" stroke-width="0.5"
    x1="248" y1="40" x2="248" y2="124"/>
  <line x1="296" y1="64" x2="296" y2="148" stroke="#281e14" stroke-width="0.5"/>
  <line x1="344" y1="88" x2="344" y2="172" stroke="#281e14" stroke-width="0.5"/>

  <!-- ══ LEFT WALL (col=0, rows 1→3, door at row 0) ══════════════ -->
  <polygon points="152,40 56,88 56,172 152,124"
    fill="#2c2014" stroke="#241c12" stroke-width="1"/>

  <!-- Door frame at row 0 (opening between row 0-1) -->
  <line x1="200" y1="16" x2="200" y2="100" stroke="#3a3020" stroke-width="2"/>
  <line x1="152" y1="40" x2="152" y2="124" stroke="#3a3020" stroke-width="2"/>
  <!-- Door lintel -->
  <line x1="200" y1="26" x2="152" y2="50" stroke="#3a3020" stroke-width="1.5"/>

  <!-- ══ FLOOR (warm wood bodega) ══════════════════════════════════ -->
  <polygon points="200,100 392,196 248,268 56,172"
    fill="#3c2a16" stroke="#302010" stroke-width="0.8"/>
  <!-- Tile grid lines (subtle) -->
  <line x1="248" y1="124" x2="104" y2="196" stroke="#342414" stroke-width="0.3" opacity="0.5"/>
  <line x1="296" y1="148" x2="152" y2="220" stroke="#342414" stroke-width="0.3" opacity="0.5"/>
  <line x1="344" y1="172" x2="200" y2="244" stroke="#342414" stroke-width="0.3" opacity="0.5"/>
  <line x1="152" y1="124" x2="344" y2="220" stroke="#342414" stroke-width="0.3" opacity="0.5"/>
  <line x1="104" y1="148" x2="296" y2="244" stroke="#342414" stroke-width="0.3" opacity="0.5"/>

  <!-- ══ FLOOR RUG (entrance area, rows 2.3-2.8, cols 0.2-1.5) ═══ -->
  <!-- iso(0.2,2.3)=(90,160) iso(1.5,2.3)=(152,191) iso(1.5,2.8)=(138,203) iso(0.2,2.8)=(75,172) -->
  <polygon points="90,160 152,191 138,203 75,172"
    fill="#342820" stroke="rgba(200,168,76,0.1)" stroke-width="0.6" opacity="0.8"/>

  <!-- ══ HERO: RECEPTION COUNTER (cols 0.5-3.5, rows 1.4-2.0) ════ -->
  <!-- Long counter spanning most of room, dividing customer/clerk sides -->
  <!-- Top surface -->
  <polygon points="157,146 301,218 272,232 128,160"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.8"/>
  <!-- Front-left face (main visible face) -->
  <polygon points="128,160 272,232 272,258 128,186"
    fill="#2c2418" stroke="#241c12" stroke-width="0.6"/>
  <!-- Front-right face -->
  <polygon points="301,218 272,232 272,258 301,244"
    fill="#302818" stroke="#241c12" stroke-width="0.6"/>
  <!-- Counter panel grooves on front face -->
  <line x1="164" y1="172" x2="236" y2="244" stroke="#241c12" stroke-width="0.4"/>
  <line x1="200" y1="186" x2="254" y2="250" stroke="#241c12" stroke-width="0.4"/>
  <!-- Top edge highlight -->
  <line x1="157" y1="146" x2="301" y2="218" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- ══ CASH REGISTER (on counter, col ~2.2, row ~1.6) ═══════════ -->
  <!-- Sits ON counter surface (28px above floor) -->
  <!-- Register body -->
  <polygon points="225,155 249,167 240,171 216,159"
    fill="#2a2830" stroke="#222028" stroke-width="0.5"/>
  <!-- Register front face -->
  <polygon points="216,159 240,171 240,181 216,169"
    fill="#222028" stroke="#1c1a22" stroke-width="0.4"/>
  <!-- Register right face -->
  <polygon points="249,167 240,171 240,181 249,177"
    fill="#26242c" stroke="#1c1a22" stroke-width="0.4"/>
  <!-- Display screen -->
  <rect x="220" y="152" width="12" height="4" rx="0.5" fill="rgba(100,180,120,0.15)"/>
  <!-- Drawer pull -->
  <line x1="224" y1="176" x2="234" y2="176" stroke="#c8a84c" stroke-width="0.8" opacity="0.3"/>

  <!-- ══ STOOL (behind counter, col 1.5, row 0.8) ═════════════════ -->
  <!-- iso(1.5, 0.8) = (200+0.7*48, 100+2.3*24) = (234, 155) -->
  <!-- Legs -->
  <line x1="228" y1="170" x2="230" y2="155" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="240" y1="170" x2="238" y2="155" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="224" y1="168" x2="230" y2="155" stroke="#3a3020" stroke-width="1"/>
  <line x1="244" y1="168" x2="238" y2="155" stroke="#3a3020" stroke-width="1"/>
  <!-- Crossbar -->
  <line x1="227" y1="164" x2="241" y2="164" stroke="#2c2418" stroke-width="0.8"/>
  <!-- Seat -->
  <ellipse cx="234" cy="153" rx="8" ry="4" fill="#342c20" stroke="#2c2418" stroke-width="0.5"/>

  <!-- ══ SHELF UNIT (back wall, cols 2.8-3.8, rows 0.1-0.6) ══════ -->
  <!-- Tall shelving unit packed with bodega products -->
  <!-- iso(2.8,0.1)=(330,170) iso(3.8,0.1)=(378,194) iso(3.8,0.6)=(354,206) iso(2.8,0.6)=(306,182) -->
  <!-- Top -->
  <polygon points="330,120 378,144 354,156 306,132"
    fill="#3a3838" stroke="#252525" stroke-width="0.6"/>
  <!-- Right face -->
  <polygon points="378,144 354,156 354,206 378,194"
    fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <!-- Left face (main visible) -->
  <polygon points="306,132 354,156 354,206 306,182"
    fill="#3a3838" stroke="#252525" stroke-width="0.6"/>
  <!-- Shelf dividers on left face -->
  <line x1="306" y1="144" x2="354" y2="168" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="306" y1="156" x2="354" y2="180" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="306" y1="168" x2="354" y2="192" stroke="#2a2a2a" stroke-width="0.5"/>
  <!-- Products on shelves (colored blocks) -->
  <polygon points="310,134 328,143 328,143 310,134" fill="#2a3828" stroke-width="0"/>
  <rect x="310" y="134" width="12" height="8" rx="0.5" fill="#2a3828" opacity="0.7" transform="skewY(12)"/>
  <polygon points="314,146 330,153 330,155 314,148" fill="#382a2a" opacity="0.7"/>
  <polygon points="324,150 340,157 340,159 324,152" fill="#2a2a38" opacity="0.7"/>
  <polygon points="312,158 326,165 326,168 312,161" fill="#302c24" opacity="0.6"/>
  <polygon points="330,162 344,169 344,172 330,165" fill="#28302c" opacity="0.6"/>
  <polygon points="310,170 324,177 324,180 310,173" fill="#383028" opacity="0.7"/>
  <polygon points="328,174 344,181 344,184 328,177" fill="#2a3030" opacity="0.6"/>

  <!-- ══ CARDBOARD BOX (col 0.8, row 0.6) ═════════════════════════ -->
  <!-- iso(0.8, 0.6) = (200+0.2*48, 100+1.4*24) = (210, 134) -->
  <!-- Small box near the shelf area -->
  <polygon points="204,128 216,134 210,137 198,131"
    fill="#3a3020" stroke="#302818" stroke-width="0.4"/>
  <polygon points="198,131 210,137 210,147 198,141"
    fill="#342c20" stroke="#281e14" stroke-width="0.4"/>
  <polygon points="216,134 210,137 210,147 216,144"
    fill="#302818" stroke="#281e14" stroke-width="0.4"/>

  <!-- ══ NEON SIGN (on right wall, decorative) ═══════════════════ -->
  <!-- "OPEN" text on the back wall, glowing -->
  <rect x="290" y="72" width="40" height="16" rx="2" fill="rgba(200,60,60,0.08)" stroke="rgba(200,60,60,0.15)" stroke-width="0.5"/>
  <text x="310" y="83" font-family="monospace" font-size="8" fill="rgba(200,60,60,0.4)" text-anchor="middle">OPEN</text>
  <!-- Glow -->
  <rect x="288" y="70" width="44" height="20" rx="3" fill="none" stroke="rgba(200,60,60,0.06)" stroke-width="2"/>

  <!-- ══ RADIO (on floor, col 3.2, row 2.2) ══════════════════════ -->
  <!-- iso(3.2, 2.2) = (200+1*48, 100+5.4*24) = (248, 230) -->
  <polygon points="242,226 258,234 252,237 236,229"
    fill="#1e1e26" stroke="#2a2a32" stroke-width="0.4"/>
  <polygon points="236,229 252,237 252,243 236,235"
    fill="#16161e"/>
  <!-- Speaker dots -->
  <circle cx="240" cy="231" r="1.5" fill="#2a2a32" opacity="0.5"/>
  <circle cx="248" cy="235" r="1.5" fill="#2a2a32" opacity="0.5"/>
  <!-- Antenna -->
  <line x1="254" y1="234" x2="258" y2="224" stroke="#3a3a42" stroke-width="0.4"/>

  <!-- ══ LABELS ═══════════════════════════════════════════════════ -->
  <text x="220" y="295" font-family="monospace" font-size="11" fill="#c8a84c" text-anchor="middle" opacity="0.8">OPERATIONS — FRONT DESK</text>
  <text x="220" y="14" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">Reference fixture — not used in game</text>
</svg>
