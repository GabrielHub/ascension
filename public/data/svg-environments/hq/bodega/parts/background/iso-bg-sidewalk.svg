<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140">
  <defs>
    <linearGradient id="sw-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1c18"/>
      <stop offset="100%" stop-color="#161410"/>
    </linearGradient>
  </defs>

  <!-- Main sidewalk surface (isometric diamond strip) -->
  <polygon points="100,0 800,0 900,70 0,70"
    fill="url(#sw-grad)" stroke="#141210" stroke-width="1"/>

  <!-- Sidewalk panel joints -->
  <g stroke="#141210" stroke-width="0.6" opacity="0.35">
    <line x1="150" y1="2" x2="100" y2="68"/>
    <line x1="280" y1="2" x2="230" y2="68"/>
    <line x1="410" y1="2" x2="360" y2="68"/>
    <line x1="540" y1="2" x2="490" y2="68"/>
    <line x1="670" y1="2" x2="620" y2="68"/>
    <line x1="750" y1="2" x2="700" y2="68"/>
  </g>

  <!-- Cracks -->
  <g stroke="#0e0d0a" stroke-width="0.5" opacity="0.3">
    <polyline points="200,15 210,25 205,40 215,55" fill="none"/>
    <polyline points="480,10 490,30 485,45" fill="none"/>
    <line x1="620" y1="20" x2="640" y2="50"/>
  </g>

  <!-- Stain patches (gum, oil) -->
  <g opacity="0.12">
    <ellipse cx="250" cy="35" rx="8" ry="4" fill="#0a0908"/>
    <ellipse cx="520" cy="45" rx="12" ry="5" fill="#0a0908"/>
    <ellipse cx="700" cy="30" rx="6" ry="3" fill="#0e0c08"/>
  </g>

  <!-- Curb edge (bottom) -->
  <polygon points="0,70 900,70 900,90 0,90"
    fill="#1a1816" stroke="#141210" stroke-width="0.8"/>
  <!-- Curb face -->
  <polygon points="0,90 900,90 900,100 0,100"
    fill="#141210"/>

  <!-- Drainage grate -->
  <g transform="translate(350, 80)" opacity="0.5">
    <rect width="40" height="16" rx="1" fill="#0a0908" stroke="#3a3838" stroke-width="0.6"/>
    <line x1="8" y1="2" x2="8" y2="14" stroke="#252525" stroke-width="1"/>
    <line x1="16" y1="2" x2="16" y2="14" stroke="#252525" stroke-width="1"/>
    <line x1="24" y1="2" x2="24" y2="14" stroke="#252525" stroke-width="1"/>
    <line x1="32" y1="2" x2="32" y2="14" stroke="#252525" stroke-width="1"/>
  </g>

  <!-- Sidewalk edge detail (inner edge near buildings) -->
  <line x1="100" y1="2" x2="800" y2="2" stroke="#2a2520" stroke-width="0.6" opacity="0.3"/>
</svg>