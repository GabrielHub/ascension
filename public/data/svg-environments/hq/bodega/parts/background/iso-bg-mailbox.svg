<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 52">
  <!-- Isometric USPS-style collection mailbox. Dark blue iso box on a post. -->

  <!-- Post -->
  <rect x="15" y="38" width="6" height="12" fill="#1a2438"/>

  <!-- Box body (iso box) -->
  <!-- Top -->
  <polygon points="18,10 32,17 18,24 4,17"
    fill="#1a2a48" stroke="#142038" stroke-width="0.5"/>
  <!-- Left face -->
  <polygon points="4,17 18,24 18,40 4,33"
    fill="#162640" stroke="#0e1a30" stroke-width="0.5"/>
  <!-- Right face -->
  <polygon points="32,17 18,24 18,40 32,33"
    fill="#122040" stroke="#0e1a30" stroke-width="0.5"/>

  <!-- Mail slot on left face -->
  <polygon points="7,20 15,24 15,26 7,22"
    fill="#0a1020" stroke="#1a2a48" stroke-width="0.3"/>

  <!-- Eagle emblem area (subtle) -->
  <ellipse cx="11" cy="27" rx="3" ry="2" fill="#1a2a48" opacity="0.4"/>

  <!-- Pull handle -->
  <line x1="8" y1="30" x2="14" y2="33" stroke="#3a3a42" stroke-width="0.8"/>

  <!-- Top rounded cap -->
  <ellipse cx="18" cy="10" rx="14" ry="3" fill="#1a2a48" stroke="#142038" stroke-width="0.3"/>

  <!-- Shadow -->
  <ellipse cx="18" cy="50" rx="12" ry="2.5" fill="rgba(0,0,0,0.1)"/>
</svg>
