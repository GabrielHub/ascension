<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -80 480 780">
  <!-- Left-facing modern glass/steel highrise, 8+ stories.
       Facade slope +0.5, side slope -0.5. Blue-gray glass curtain wall.
       Taller and narrower than building-tall.
       Front corner base at (200, 680). -->

  <defs>
    <linearGradient id="hr-facade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#2e3640"/>
      <stop offset="100%" stop-color="#242c34"/>
    </linearGradient>
    <linearGradient id="hr-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2028"/>
      <stop offset="100%" stop-color="#242c34"/>
    </linearGradient>
    <linearGradient id="hr-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2838"/>
      <stop offset="60%" stop-color="#141e2a"/>
      <stop offset="100%" stop-color="#1a2432"/>
    </linearGradient>
  </defs>

  <!-- ═══ STRUCTURAL FACES ═══ -->

  <!-- Side face (iso-right, darker) -->
  <polygon points="200,160 400,60 400,580 200,680"
    fill="url(#hr-side)" stroke="#1a2028" stroke-width="1"/>

  <!-- Facade (iso-left, lighter, main visible) -->
  <polygon points="20,70 200,160 200,680 20,590"
    fill="url(#hr-facade)" stroke="#1a2028" stroke-width="1.5"/>

  <!-- Roof -->
  <polygon points="20,70 200,160 400,60 220,-30"
    fill="#1a1e22" stroke="#222628" stroke-width="1.5"/>

  <!-- Roof edge — facade -->
  <polygon points="20,70 200,160 200,164 20,74"
    fill="#3a4048" stroke="#2a3038" stroke-width="0.5" opacity="0.5"/>

  <!-- Roof edge — side -->
  <polygon points="200,160 400,60 400,64 200,164"
    fill="#2a3038" stroke="#1a2028" stroke-width="0.5" opacity="0.4"/>

  <!-- ═══ FACADE — glass curtain wall ═══ -->
  <!-- matrix(1, 0.5, 0, 1, 20, 70) — local x 0→180, y 0→520 -->

  <!-- Glass panel grid (horizontal bands per floor, 8 floors) -->
  <g transform="matrix(1, 0.5, 0, 1, 20, 70)">
    <!-- Floor bands (alternating glass and mullion) -->
    <g fill="url(#hr-glass)" stroke="#1a2430" stroke-width="0.3">
      <rect x="3" y="8" width="174" height="48"/>
      <rect x="3" y="68" width="174" height="48"/>
      <rect x="3" y="128" width="174" height="48"/>
      <rect x="3" y="188" width="174" height="48"/>
      <rect x="3" y="248" width="174" height="48"/>
      <rect x="3" y="308" width="174" height="48"/>
      <rect x="3" y="368" width="174" height="48"/>
      <rect x="3" y="428" width="174" height="48"/>
    </g>

    <!-- Horizontal mullions (floor dividers, metallic) -->
    <g stroke="#3a4248" stroke-width="1.2" opacity="0.6">
      <line x1="0" y1="60" x2="180" y2="60"/>
      <line x1="0" y1="120" x2="180" y2="120"/>
      <line x1="0" y1="180" x2="180" y2="180"/>
      <line x1="0" y1="240" x2="180" y2="240"/>
      <line x1="0" y1="300" x2="180" y2="300"/>
      <line x1="0" y1="360" x2="180" y2="360"/>
      <line x1="0" y1="420" x2="180" y2="420"/>
      <line x1="0" y1="480" x2="180" y2="480"/>
    </g>

    <!-- Vertical mullions -->
    <g stroke="#2e3840" stroke-width="0.6" opacity="0.5">
      <line x1="36" y1="5" x2="36" y2="515"/>
      <line x1="72" y1="5" x2="72" y2="515"/>
      <line x1="108" y1="5" x2="108" y2="515"/>
      <line x1="144" y1="5" x2="144" y2="515"/>
    </g>

    <!-- Interior lit panels (scattered office lights) -->
    <g opacity="0.2">
      <rect x="5" y="10" width="30" height="44" fill="#3a5a7a"/>
      <rect x="74" y="70" width="30" height="44" fill="#4a6a8a"/>
      <rect x="110" y="130" width="30" height="44" fill="#3a5a7a"/>
      <rect x="38" y="190" width="30" height="44" fill="#4a6a8a"/>
      <rect x="146" y="250" width="30" height="44" fill="#3a5a7a"/>
      <rect x="5" y="310" width="30" height="44" fill="#3a5a7a"/>
      <rect x="74" y="370" width="30" height="44" fill="#4a6a8a"/>
      <rect x="110" y="430" width="30" height="44" fill="#3a5a7a"/>
    </g>

    <!-- Warm office lights (fewer, warmer) -->
    <g opacity="0.15">
      <rect x="146" y="70" width="30" height="44" fill="#c8a84c"/>
      <rect x="38" y="310" width="30" height="44" fill="#b89840"/>
      <rect x="5" y="430" width="30" height="44" fill="#c8a84c"/>
    </g>

    <!-- Ground floor lobby (brighter) -->
    <rect x="3" y="488" width="174" height="30" fill="#161e28" stroke="#1a2430" stroke-width="0.5"/>
    <rect x="70" y="490" width="40" height="28" fill="#0e141c" stroke="#2a3440" stroke-width="0.5"/>
    <rect x="72" y="492" width="36" height="24" fill="#3a5a7a" opacity="0.1"/>
  </g>

  <!-- Sky reflection (diagonal glare on glass) -->
  <g transform="matrix(1, 0.5, 0, 1, 20, 70)" opacity="0.04">
    <polygon points="0,0 30,0 180,300 150,300" fill="#8ab0d0"/>
    <polygon points="60,200 90,200 180,480 150,480" fill="#8ab0d0"/>
  </g>

  <!-- ═══ SIDE — glass curtain wall ═══ -->
  <!-- matrix(1, -0.5, 0, 1, 200, 160) — local x 0→200, y 0→520 -->

  <g transform="matrix(1, -0.5, 0, 1, 200, 160)">
    <g fill="#141c26" stroke="#1a2228" stroke-width="0.3" opacity="0.8">
      <rect x="3" y="8" width="194" height="48"/>
      <rect x="3" y="68" width="194" height="48"/>
      <rect x="3" y="128" width="194" height="48"/>
      <rect x="3" y="188" width="194" height="48"/>
      <rect x="3" y="248" width="194" height="48"/>
      <rect x="3" y="308" width="194" height="48"/>
      <rect x="3" y="368" width="194" height="48"/>
      <rect x="3" y="428" width="194" height="48"/>
    </g>

    <g stroke="#2a3440" stroke-width="0.8" opacity="0.4">
      <line x1="0" y1="60" x2="200" y2="60"/>
      <line x1="0" y1="120" x2="200" y2="120"/>
      <line x1="0" y1="180" x2="200" y2="180"/>
      <line x1="0" y1="240" x2="200" y2="240"/>
      <line x1="0" y1="300" x2="200" y2="300"/>
      <line x1="0" y1="360" x2="200" y2="360"/>
      <line x1="0" y1="420" x2="200" y2="420"/>
      <line x1="0" y1="480" x2="200" y2="480"/>
    </g>

    <g stroke="#1e2830" stroke-width="0.4" opacity="0.35">
      <line x1="40" y1="5" x2="40" y2="515"/>
      <line x1="80" y1="5" x2="80" y2="515"/>
      <line x1="120" y1="5" x2="120" y2="515"/>
      <line x1="160" y1="5" x2="160" y2="515"/>
    </g>

    <g opacity="0.1">
      <rect x="42" y="70" width="36" height="44" fill="#3a5a7a"/>
      <rect x="122" y="190" width="36" height="44" fill="#3a5a7a"/>
      <rect x="5" y="310" width="36" height="44" fill="#4a6a8a"/>
      <rect x="162" y="430" width="36" height="44" fill="#3a5a7a"/>
    </g>
  </g>

  <!-- ═══ ROOFTOP ELEMENTS ═══ -->
  <g opacity="0.35">
    <!-- Mechanical penthouse -->
    <polygon points="80,38 150,73 220,38 150,3"
      fill="#1e2228" stroke="#2a2e32" stroke-width="0.5"/>
    <polygon points="80,38 150,73 150,88 80,53"
      fill="#1a1e24" stroke="#222628" stroke-width="0.4"/>
    <polygon points="150,73 220,38 220,53 150,88"
      fill="#161a20" stroke="#1e2228" stroke-width="0.4"/>

    <!-- Antenna -->
    <line x1="300" y1="55" x2="300" y2="20" stroke="#4a4848" stroke-width="1.2"/>
    <line x1="296" y1="28" x2="304" y2="28" stroke="#4a4848" stroke-width="0.8"/>
    <line x1="296" y1="36" x2="304" y2="36" stroke="#4a4848" stroke-width="0.8"/>
  </g>
</svg>
