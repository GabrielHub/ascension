<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 72">
  <!-- Beer kegs stacked outside the bar.
       Isometric 2:1. Kegs are iso cylinders (ellipse top, rect body, iso right face).
       Three kegs: two in back row, one in front. -->

  <!-- ═══ BACK-LEFT KEG ═══ -->
  <rect x="6" y="30" width="22" height="28"
    fill="#3a3a3e" stroke="#2e2e30" stroke-width="0.6"/>
  <polygon points="28,30 36,26 36,54 28,58"
    fill="#2a2a2e" stroke="#222228" stroke-width="0.5"/>
  <ellipse cx="21" cy="28" rx="15" ry="5"
    fill="#44444a" stroke="#2e2e30" stroke-width="0.5"/>
  <!-- Valve -->
  <ellipse cx="21" cy="28" rx="4" ry="1.5" fill="#2e2e30" stroke="#222228" stroke-width="0.4"/>
  <ellipse cx="21" cy="28" rx="2" ry="0.8" fill="#4a4a50"/>
  <!-- Band -->
  <line x1="6" y1="42" x2="28" y2="42" stroke="#4a4a50" stroke-width="0.8" opacity="0.3"/>

  <!-- ═══ BACK-RIGHT KEG ═══ -->
  <rect x="34" y="30" width="22" height="28"
    fill="#3a3a3e" stroke="#2e2e30" stroke-width="0.6"/>
  <polygon points="56,30 64,26 64,54 56,58"
    fill="#2a2a2e" stroke="#222228" stroke-width="0.5"/>
  <ellipse cx="49" cy="28" rx="15" ry="5"
    fill="#44444a" stroke="#2e2e30" stroke-width="0.5"/>
  <ellipse cx="49" cy="28" rx="4" ry="1.5" fill="#2e2e30" stroke="#222228" stroke-width="0.4"/>
  <ellipse cx="49" cy="28" rx="2" ry="0.8" fill="#4a4a50"/>
  <line x1="34" y1="42" x2="56" y2="42" stroke="#4a4a50" stroke-width="0.8" opacity="0.3"/>

  <!-- ═══ FRONT KEG (centered, overlapping) ═══ -->
  <rect x="20" y="38" width="22" height="28"
    fill="#3a3a3e" stroke="#2e2e30" stroke-width="0.6"/>
  <polygon points="42,38 50,34 50,62 42,66"
    fill="#2a2a2e" stroke="#222228" stroke-width="0.5"/>
  <ellipse cx="35" cy="36" rx="15" ry="5"
    fill="#44444a" stroke="#2e2e30" stroke-width="0.5"/>
  <ellipse cx="35" cy="36" rx="4" ry="1.5" fill="#2e2e30" stroke="#222228" stroke-width="0.4"/>
  <ellipse cx="35" cy="36" rx="2" ry="0.8" fill="#4a4a50"/>
  <line x1="20" y1="50" x2="42" y2="50" stroke="#4a4a50" stroke-width="0.8" opacity="0.3"/>

  <!-- Condensation marks on ground -->
  <g opacity="0.06">
    <ellipse cx="21" cy="62" rx="10" ry="2" fill="#6a8a9a"/>
    <ellipse cx="49" cy="62" rx="10" ry="2" fill="#6a8a9a"/>
  </g>
</svg>