<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 85">
  <!-- Isometric parked sedan, oriented along iso-right axis (slope +0.5).
       Runs from upper-left (rear) to lower-right (front). 2:1 iso.
       Left face visible (lighter, main detail). Right end visible (darker).
       Anchor: center-bottom at (65, 80). -->

  <!-- Ground shadow -->
  <ellipse cx="62" cy="78" rx="48" ry="8" fill="rgba(0,0,0,0.18)"/>

  <!-- ═══ Lower body box ═══ -->
  <!-- Left face (long visible side — the main detail face) -->
  <polygon points="12,32 92,72 92,80 12,40"
    fill="#28263a" stroke="#1e1c2e" stroke-width="0.8"/>

  <!-- Right end face (front of car, darker) -->
  <polygon points="92,72 120,58 120,66 92,80"
    fill="#1e1c2e" stroke="#181628" stroke-width="0.6"/>

  <!-- Top face (hood/roof/trunk surface) -->
  <polygon points="12,32 92,72 120,58 40,18"
    fill="#302e44" stroke="#28263a" stroke-width="0.6"/>

  <!-- ═══ Cabin (raised middle section) ═══ -->
  <!-- Cabin left face (windows visible here) -->
  <polygon points="32,32 72,52 72,60 32,40"
    fill="#282640" stroke="#201e34" stroke-width="0.5"/>

  <!-- Cabin top (roof) -->
  <polygon points="32,32 72,52 98,38 58,18"
    fill="#343250" stroke="#2a2840" stroke-width="0.5"/>

  <!-- Cabin right face -->
  <polygon points="72,52 98,38 98,46 72,60"
    fill="#201e34" stroke="#1a182c" stroke-width="0.4"/>

  <!-- ═══ Windows ═══ -->
  <!-- Left side windows (on cabin left face, split by B-pillar) -->
  <!-- Rear window -->
  <polygon points="34,34 50,42 50,47 34,39"
    fill="#0c0c16" opacity="0.8"/>
  <!-- Front window -->
  <polygon points="53,43.5 70,52 70,57 53,48.5"
    fill="#0c0c16" opacity="0.8"/>

  <!-- Rear windshield (cabin rear end face, visible) -->
  <polygon points="32,32 58,18 58,24 32,38"
    fill="#0c0c16" opacity="0.55"/>

  <!-- Right side window (on cabin right face, partial) -->
  <polygon points="74,51 94,40 94,44 74,55"
    fill="#0c0c16" opacity="0.5"/>

  <!-- ═══ Car details ═══ -->
  <!-- Hood line (on top face, between cabin and front end) -->
  <line x1="72" y1="52" x2="98" y2="38"
    stroke="#28263a" stroke-width="0.5" opacity="0.5"/>

  <!-- Trunk line (on top face, between cabin and rear end) -->
  <line x1="32" y1="32" x2="58" y2="18"
    stroke="#28263a" stroke-width="0.5" opacity="0.5"/>

  <!-- Headlights (front, on right end face) -->
  <polygon points="94,72 98,70 98,72 94,74"
    fill="#4a4440" opacity="0.5"/>
  <polygon points="108,64 112,62 112,64 108,66"
    fill="#4a4440" opacity="0.4"/>

  <!-- Taillights (rear, on left face at the rear end) -->
  <polygon points="13,33 17,35 17,37 13,35"
    fill="#5a1818" opacity="0.4"/>

  <!-- Door handle hint (left face) -->
  <line x1="50" y1="44" x2="54" y2="46"
    stroke="#3a3850" stroke-width="0.6" opacity="0.3"/>

  <!-- Side mirror (left) -->
  <polygon points="30,37 27,36 27,38 30,39"
    fill="#28263a" stroke="#1e1c2e" stroke-width="0.3"/>

  <!-- ═══ Wheels ═══ -->
  <!-- Rear wheel (left face, at bottom) -->
  <ellipse cx="24" cy="40" rx="7" ry="2.5" fill="#0e0e12" stroke="#1a1a1e" stroke-width="0.5"/>
  <!-- Front wheel (left face, at bottom) -->
  <ellipse cx="80" cy="78" rx="7" ry="2.5" fill="#0e0e12" stroke="#1a1a1e" stroke-width="0.5"/>

  <!-- Wheel well shadows -->
  <path d="M17,39 Q24,37 31,39" stroke="#0a0a0e" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M73,77 Q80,75 87,77" stroke="#0a0a0e" stroke-width="0.5" fill="none" opacity="0.4"/>

  <!-- Roof highlight -->
  <polygon points="42,24 62,34 82,24 62,14"
    fill="#3a3858" opacity="0.08"/>
</svg>
