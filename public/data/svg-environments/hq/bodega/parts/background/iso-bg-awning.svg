<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70">
  <defs>
    <linearGradient id="aw-stripe1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a1a10"/>
      <stop offset="100%" stop-color="#3d1208"/>
    </linearGradient>
    <linearGradient id="aw-stripe2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="100%" stop-color="#1e1410"/>
    </linearGradient>
  </defs>

  <!-- Awning canopy (isometric trapezoid) -->
  <!-- Main panel -->
  <polygon points="10,8 190,8 200,50 0,50"
    fill="url(#aw-stripe1)" stroke="#3d1208" stroke-width="1"/>

  <!-- Stripes -->
  <g opacity="0.8">
    <polygon points="40,8 60,8 65,50 35,50" fill="url(#aw-stripe2)"/>
    <polygon points="90,8 110,8 115,50 85,50" fill="url(#aw-stripe2)"/>
    <polygon points="140,8 160,8 165,50 135,50" fill="url(#aw-stripe2)"/>
  </g>

  <!-- Valance (scalloped bottom edge) -->
  <path d="M0,50 Q10,58 20,50 Q30,58 40,50 Q50,58 60,50 Q70,58 80,50 Q90,58 100,50 Q110,58 120,50 Q130,58 140,50 Q150,58 160,50 Q170,58 180,50 Q190,58 200,50"
    fill="#3d1208" stroke="#2a0e06" stroke-width="0.6"/>

  <!-- Support frame hints -->
  <line x1="10" y1="8" x2="10" y2="4" stroke="#3a3838" stroke-width="1.5" opacity="0.5"/>
  <line x1="190" y1="8" x2="190" y2="4" stroke="#3a3838" stroke-width="1.5" opacity="0.5"/>

  <!-- Shadow on underside -->
  <polygon points="10,8 190,8 195,14 5,14"
    fill="#1a0e08" opacity="0.3"/>

  <!-- Worn/faded patch -->
  <ellipse cx="120" cy="30" rx="20" ry="10" fill="#4a1810" opacity="0.15"/>
</svg>