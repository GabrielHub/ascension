<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Distant harbor crane silhouette — background depth element.
       Gantry crane outline, low opacity, atmospheric. -->

  <!-- Crane legs (A-frame gantry) -->
  <g stroke="#1a1a20" stroke-width="3" fill="none" opacity="0.5">
    <!-- Left leg pair -->
    <line x1="50" y1="380" x2="70" y2="120"/>
    <line x1="30" y1="380" x2="65" y2="120"/>
    <!-- Right leg pair -->
    <line x1="140" y1="380" x2="120" y2="120"/>
    <line x1="160" y1="380" x2="125" y2="120"/>
  </g>

  <!-- Cross braces -->
  <g stroke="#1a1a20" stroke-width="1.5" opacity="0.3">
    <line x1="42" y1="300" x2="148" y2="300"/>
    <line x1="48" y1="240" x2="142" y2="240"/>
    <line x1="55" y1="180" x2="135" y2="180"/>
  </g>

  <!-- Top beam (horizontal) -->
  <rect x="40" y="115" width="150" height="10" rx="1"
    fill="#1a1a20" opacity="0.5"/>

  <!-- Boom arm (extending right) -->
  <g stroke="#1a1a20" stroke-width="2.5" fill="none" opacity="0.45">
    <line x1="95" y1="115" x2="195" y2="60"/>
    <line x1="95" y1="120" x2="190" y2="70"/>
    <!-- Boom bracing -->
    <line x1="130" y1="98" x2="135" y2="105"/>
    <line x1="160" y1="82" x2="165" y2="90"/>
  </g>

  <!-- Counter-boom (extending left) -->
  <g stroke="#1a1a20" stroke-width="2" fill="none" opacity="0.35">
    <line x1="95" y1="115" x2="20" y2="80"/>
    <line x1="95" y1="120" x2="25" y2="88"/>
  </g>

  <!-- Operator cab -->
  <rect x="80" y="105" width="18" height="14" rx="1"
    fill="#1a1a20" opacity="0.4"/>
  <!-- Cab window -->
  <rect x="83" y="108" width="12" height="6" rx="0.5"
    fill="#1a2a3a" opacity="0.2"/>

  <!-- Hoist cables -->
  <g stroke="#1a1a20" stroke-width="0.8" opacity="0.3">
    <line x1="170" y1="72" x2="170" y2="180"/>
    <line x1="173" y1="72" x2="173" y2="180"/>
  </g>

  <!-- Hook block -->
  <rect x="166" y="175" width="10" height="8" rx="1"
    fill="#1a1a20" opacity="0.3"/>

  <!-- Warning light (top of boom) -->
  <circle cx="95" cy="110" r="2" fill="#6a2020" opacity="0.3"/>

  <!-- Counterweight -->
  <rect x="18" y="78" width="14" height="12" rx="1"
    fill="#1a1a20" opacity="0.35"/>

  <!-- Base rails -->
  <g stroke="#1a1a20" stroke-width="2" opacity="0.25">
    <line x1="20" y1="382" x2="170" y2="382"/>
    <line x1="20" y1="386" x2="170" y2="386"/>
  </g>
</svg>