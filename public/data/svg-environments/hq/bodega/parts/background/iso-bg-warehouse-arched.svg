<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 20 400 540">
  <!-- Right-facing brick warehouse with arcade of arched windows.
       Inspired by Red Hook's New York Dock Co. building.
       Canonical 2:1 isometric. Facade slope -0.5, side slope +0.5.
       Five-story arched arcade façade, dark brick, corrugated metal roof.

       Tile-aligned footprint: facade 4 tiles (192px), side 2 tiles (96px).
       viewBox bottom-center sits on front corner base for placement anchor.

       Geometry:
         Front corner base: (240, 560)
         Front corner top:  (240, 180)
         FR base:           (432, 464)   FR top: (432,  84)
         FL base:           (144, 512)   FL top: (144, 132)
         BC top:            (336,  36)
         Wall height: 380 (~5 stories of 76 each)
         Facade width: 192 (4 tiles × 48 right iso axis)
         Side depth:   96  (2 tiles × 48 left iso axis) -->

  <defs>
    <linearGradient id="wha-facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a2e1c"/>
      <stop offset="100%" stop-color="#3a1e10"/>
    </linearGradient>
    <linearGradient id="wha-side" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#2e1810"/>
      <stop offset="100%" stop-color="#3e2218"/>
    </linearGradient>
    <radialGradient id="wha-arch-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="rgba(200,140,60,0.55)"/>
      <stop offset="60%" stop-color="rgba(180,120,50,0.20)"/>
      <stop offset="100%" stop-color="rgba(140,80,30,0)"/>
    </radialGradient>
  </defs>

  <!-- ═══ STRUCTURAL FACES ═══ -->

  <!-- Side face (drawn first, behind) -->
  <polygon points="144,132 240,180 240,560 144,512"
    fill="url(#wha-side)" stroke="#1e1208" stroke-width="1"/>

  <!-- Facade -->
  <polygon points="240,180 432,84 432,464 240,560"
    fill="url(#wha-facade)" stroke="#1e1208" stroke-width="1.5"/>

  <!-- Roof -->
  <polygon points="144,132 240,180 432,84 336,36"
    fill="#1c1a18" stroke="#0e0c08" stroke-width="1.5"/>

  <!-- Roof corrugation lines (parallel to facade vec, slope -0.5) -->
  <g stroke="#0a0808" stroke-width="0.6" opacity="0.4">
    <line x1="168" y1="144" x2="360" y2="48"/>
    <line x1="192" y1="156" x2="384" y2="60"/>
    <line x1="216" y1="168" x2="408" y2="72"/>
  </g>

  <!-- Cornice / parapet — facade -->
  <polygon points="240,180 432,84 432,90 240,186"
    fill="#6a3820" stroke="#3a1e10" stroke-width="0.5" opacity="0.7"/>
  <polygon points="240,186 432,90 432,96 240,192"
    fill="#4a2818" stroke="#3a1e10" stroke-width="0.4" opacity="0.5"/>

  <!-- Cornice — side -->
  <polygon points="144,132 240,180 240,186 144,138"
    fill="#3e2418" stroke="#2a1810" stroke-width="0.5" opacity="0.5"/>

  <!-- ═══ FACADE DETAILS — matrix(0.96, -0.48, 0, 1, 240, 180) ═══
       Local x: 0→200 (FC → FR along facade, scales to 192 world units)
       Local y: 0→380 (top → bottom, wall height) -->
  <g transform="matrix(0.96, -0.48, 0, 1, 240, 180)">

    <!-- Brick texture (horizontal courses) -->
    <g stroke="#2a1408" stroke-width="0.4" opacity="0.18">
      <line x1="2" y1="14"  x2="198" y2="14"/>
      <line x1="2" y1="28"  x2="198" y2="28"/>
      <line x1="2" y1="42"  x2="198" y2="42"/>
      <line x1="2" y1="56"  x2="198" y2="56"/>
      <line x1="2" y1="90"  x2="198" y2="90"/>
      <line x1="2" y1="104" x2="198" y2="104"/>
      <line x1="2" y1="118" x2="198" y2="118"/>
      <line x1="2" y1="132" x2="198" y2="132"/>
      <line x1="2" y1="166" x2="198" y2="166"/>
      <line x1="2" y1="180" x2="198" y2="180"/>
      <line x1="2" y1="194" x2="198" y2="194"/>
      <line x1="2" y1="208" x2="198" y2="208"/>
      <line x1="2" y1="242" x2="198" y2="242"/>
      <line x1="2" y1="256" x2="198" y2="256"/>
      <line x1="2" y1="270" x2="198" y2="270"/>
      <line x1="2" y1="284" x2="198" y2="284"/>
      <line x1="2" y1="318" x2="198" y2="318"/>
      <line x1="2" y1="332" x2="198" y2="332"/>
      <line x1="2" y1="346" x2="198" y2="346"/>
      <line x1="2" y1="360" x2="198" y2="360"/>
    </g>

    <!-- Inter-floor stringcourses (slightly thicker brick band) -->
    <g stroke="#5a2818" stroke-width="0.9" opacity="0.30">
      <line x1="0" y1="76"  x2="200" y2="76"/>
      <line x1="0" y1="152" x2="200" y2="152"/>
      <line x1="0" y1="228" x2="200" y2="228"/>
      <line x1="0" y1="304" x2="200" y2="304"/>
    </g>

    <!-- Pilasters between bays (4 vertical brick columns) -->
    <g fill="#1e1008" opacity="0.55">
      <rect x="0"   y="6" width="6"  height="368"/>
      <rect x="50"  y="6" width="4"  height="368"/>
      <rect x="98"  y="6" width="4"  height="368"/>
      <rect x="146" y="6" width="4"  height="368"/>
      <rect x="194" y="6" width="6"  height="368"/>
    </g>

    <!-- ARCHED WINDOW ARCADE — 4 bays × 5 stories.
         Each window: tall recessed rect with rounded top.
         Bay x-centers: 28, 76, 124, 172
         Story y-tops:  10, 86, 162, 238, 314 -->
    <g>
      <!-- Story 5 (top floor) -->
      <path d="M14,46 V20 Q14,10 28,10 Q42,10 42,20 V46 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M62,46 V20 Q62,10 76,10 Q90,10 90,20 V46 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M110,46 V20 Q110,10 124,10 Q138,10 138,20 V46 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M158,46 V20 Q158,10 172,10 Q186,10 186,20 V46 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>

      <!-- Story 4 -->
      <path d="M14,122 V96 Q14,86 28,86 Q42,86 42,96 V122 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M62,122 V96 Q62,86 76,86 Q90,86 90,96 V122 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M110,122 V96 Q110,86 124,86 Q138,86 138,96 V122 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M158,122 V96 Q158,86 172,86 Q186,86 186,96 V122 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>

      <!-- Story 3 -->
      <path d="M14,198 V172 Q14,162 28,162 Q42,162 42,172 V198 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M62,198 V172 Q62,162 76,162 Q90,162 90,172 V198 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M110,198 V172 Q110,162 124,162 Q138,162 138,172 V198 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M158,198 V172 Q158,162 172,162 Q186,162 186,172 V198 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>

      <!-- Story 2 -->
      <path d="M14,274 V248 Q14,238 28,238 Q42,238 42,248 V274 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M62,274 V248 Q62,238 76,238 Q90,238 90,248 V274 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M110,274 V248 Q110,238 124,238 Q138,238 138,248 V274 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>
      <path d="M158,274 V248 Q158,238 172,238 Q186,238 186,248 V274 Z"
        fill="#0c0806" stroke="#1e1008" stroke-width="0.6"/>

      <!-- Story 1 (ground floor — taller arches) -->
      <path d="M14,366 V328 Q14,314 28,314 Q42,314 42,328 V366 Z"
        fill="#080404" stroke="#1e1008" stroke-width="0.7"/>
      <path d="M62,366 V328 Q62,314 76,314 Q90,314 90,328 V366 Z"
        fill="#080404" stroke="#1e1008" stroke-width="0.7"/>
      <path d="M110,366 V328 Q110,314 124,314 Q138,314 138,328 V366 Z"
        fill="#080404" stroke="#1e1008" stroke-width="0.7"/>
      <path d="M158,366 V328 Q158,314 172,314 Q186,314 186,328 V366 Z"
        fill="#080404" stroke="#1e1008" stroke-width="0.7"/>
    </g>

    <!-- Window pane subdivisions (sash bars) — only on the larger reachable stories -->
    <g stroke="#3a2818" stroke-width="0.4" opacity="0.45" fill="none">
      <!-- Story 1 mullions -->
      <line x1="28"  y1="320" x2="28"  y2="366"/>
      <line x1="14"  y1="346" x2="42"  y2="346"/>
      <line x1="76"  y1="320" x2="76"  y2="366"/>
      <line x1="62"  y1="346" x2="90"  y2="346"/>
      <line x1="124" y1="320" x2="124" y2="366"/>
      <line x1="110" y1="346" x2="138" y2="346"/>
      <line x1="172" y1="320" x2="172" y2="366"/>
      <line x1="158" y1="346" x2="186" y2="346"/>
    </g>

    <!-- Sodium glow inside random windows -->
    <g opacity="0.55">
      <ellipse cx="28"  cy="32"  rx="12" ry="14" fill="url(#wha-arch-glow)"/>
      <ellipse cx="124" cy="32"  rx="12" ry="14" fill="url(#wha-arch-glow)"/>
      <ellipse cx="76"  cy="108" rx="12" ry="14" fill="url(#wha-arch-glow)"/>
      <ellipse cx="172" cy="108" rx="12" ry="14" fill="url(#wha-arch-glow)"/>
      <ellipse cx="28"  cy="184" rx="12" ry="14" fill="url(#wha-arch-glow)"/>
      <ellipse cx="124" cy="184" rx="12" ry="14" fill="url(#wha-arch-glow)"/>
      <ellipse cx="76"  cy="260" rx="12" ry="14" fill="url(#wha-arch-glow)"/>
      <ellipse cx="172" cy="260" rx="12" ry="14" fill="url(#wha-arch-glow)"/>
      <ellipse cx="28"  cy="345" rx="12" ry="18" fill="url(#wha-arch-glow)"/>
      <ellipse cx="124" cy="345" rx="12" ry="18" fill="url(#wha-arch-glow)"/>
    </g>

    <!-- Vertical downspout / drainpipe -->
    <line x1="98" y1="6" x2="98" y2="372"
      stroke="#2a2828" stroke-width="1.4" opacity="0.35"/>

    <!-- Water staining streaks under select windows -->
    <g opacity="0.10">
      <line x1="76"  y1="50" x2="76"  y2="155" stroke="#1a1410" stroke-width="3"/>
      <line x1="172" y1="50" x2="172" y2="230" stroke="#1a1410" stroke-width="3"/>
    </g>
  </g>

  <!-- ═══ SIDE FACE — matrix(0.8, 0.4, 0, 1, 144, 132) ═══
       Local x: 0→120 (FL → FC, scales to 96 world units). Local y: 0→380. -->
  <g transform="matrix(0.8, 0.4, 0, 1, 144, 132)">
    <!-- Brick texture -->
    <g stroke="#1a0e08" stroke-width="0.4" opacity="0.14">
      <line x1="2" y1="20"  x2="118" y2="20"/>
      <line x1="2" y1="40"  x2="118" y2="40"/>
      <line x1="2" y1="60"  x2="118" y2="60"/>
      <line x1="2" y1="80"  x2="118" y2="80"/>
      <line x1="2" y1="100" x2="118" y2="100"/>
      <line x1="2" y1="120" x2="118" y2="120"/>
      <line x1="2" y1="140" x2="118" y2="140"/>
      <line x1="2" y1="160" x2="118" y2="160"/>
      <line x1="2" y1="180" x2="118" y2="180"/>
      <line x1="2" y1="200" x2="118" y2="200"/>
      <line x1="2" y1="220" x2="118" y2="220"/>
      <line x1="2" y1="240" x2="118" y2="240"/>
      <line x1="2" y1="260" x2="118" y2="260"/>
      <line x1="2" y1="280" x2="118" y2="280"/>
      <line x1="2" y1="300" x2="118" y2="300"/>
      <line x1="2" y1="320" x2="118" y2="320"/>
      <line x1="2" y1="340" x2="118" y2="340"/>
      <line x1="2" y1="360" x2="118" y2="360"/>
    </g>

    <!-- Stringcourses -->
    <g stroke="#3a1e10" stroke-width="0.7" opacity="0.25">
      <line x1="0" y1="76"  x2="120" y2="76"/>
      <line x1="0" y1="152" x2="120" y2="152"/>
      <line x1="0" y1="228" x2="120" y2="228"/>
      <line x1="0" y1="304" x2="120" y2="304"/>
    </g>

    <!-- Side wall has only small simple windows (not arched) -->
    <g fill="#0c0806" stroke="#1e1008" stroke-width="0.4">
      <rect x="40"  y="20"  width="14" height="22" rx="0.5"/>
      <rect x="80"  y="20"  width="14" height="22" rx="0.5"/>
      <rect x="40"  y="96"  width="14" height="22" rx="0.5"/>
      <rect x="80"  y="96"  width="14" height="22" rx="0.5"/>
      <rect x="40"  y="172" width="14" height="22" rx="0.5"/>
      <rect x="80"  y="172" width="14" height="22" rx="0.5"/>
      <rect x="40"  y="248" width="14" height="22" rx="0.5"/>
      <rect x="80"  y="248" width="14" height="22" rx="0.5"/>
      <rect x="40"  y="324" width="14" height="22" rx="0.5"/>
      <rect x="80"  y="324" width="14" height="22" rx="0.5"/>
    </g>

    <!-- A few side windows lit -->
    <g opacity="0.30">
      <rect x="42" y="22"  width="10" height="18" rx="0.5" fill="#c8a84c"/>
      <rect x="82" y="98"  width="10" height="18" rx="0.5" fill="#9a7a3c"/>
      <rect x="42" y="174" width="10" height="18" rx="0.5" fill="#b89040"/>
      <rect x="82" y="326" width="10" height="18" rx="0.5" fill="#c8a84c"/>
    </g>

    <!-- Side downspouts -->
    <line x1="6"   y1="6" x2="6"   y2="376" stroke="#2a2828" stroke-width="1.2" opacity="0.30"/>
    <line x1="116" y1="6" x2="116" y2="376" stroke="#2a2828" stroke-width="1.2" opacity="0.30"/>
  </g>
</svg>
