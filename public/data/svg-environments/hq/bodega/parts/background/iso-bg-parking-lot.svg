<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 96">
  <!-- Parking lot — 2×2 HQ iso tile footprint (192×96).
       Each parking space spans ~2 tiles long along slope +0.5.
       Diamond fills tile area: (96,0) (192,48) (96,96) (0,48).
       All coordinates verified inside diamond boundary. -->

  <!-- ═══ ASPHALT GROUND (iso diamond, 2×2 tiles) ═══ -->
  <polygon points="96,0 192,48 96,96 0,48"
    fill="#22222a" stroke="#1a1a20" stroke-width="0.5"/>

  <!-- Surface variation (inner diamond) -->
  <polygon points="96,24 144,48 96,72 48,48"
    fill="#1e1e26" opacity="0.12"/>

  <!-- ═══ PARKING SPACE MARKINGS ═══
       Three divider lines along left iso axis (slope +0.5), 80px long each.
       Back and front edges along right iso axis (slope -0.5).
       Creates two car-sized parking spaces. -->
  <g stroke="rgba(200,200,200,0.10)" stroke-width="0.8" fill="none">
    <!-- Divider 1 (leftmost, slope +0.5) -->
    <line x1="20" y1="46" x2="100" y2="86"/>
    <!-- Divider 2 (middle, slope +0.5) -->
    <line x1="56" y1="28" x2="136" y2="68"/>
    <!-- Divider 3 (rightmost, slope +0.5) -->
    <line x1="92" y1="10" x2="172" y2="50"/>
    <!-- Back edge (slope -0.5, connects divider tops) -->
    <line x1="20" y1="46" x2="92" y2="10"/>
    <!-- Front edge (slope -0.5, connects divider bottoms) -->
    <line x1="100" y1="86" x2="172" y2="50"/>
  </g>

  <!-- ═══ GROUND DETAILS ═══ -->
  <ellipse cx="80" cy="58" rx="5" ry="2.5"
    fill="#1a1820" opacity="0.15"/>
  <ellipse cx="130" cy="42" rx="4" ry="2"
    fill="#1a1820" opacity="0.12"/>
  <path d="M50,52 Q60,58 68,66"
    stroke="#181820" stroke-width="0.4" fill="none" opacity="0.2"/>
</svg>
