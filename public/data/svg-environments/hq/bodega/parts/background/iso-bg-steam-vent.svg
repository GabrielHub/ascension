<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80">
  <defs>
    <linearGradient id="steam" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="rgba(200,195,180,0.08)"/>
      <stop offset="40%" stop-color="rgba(200,195,180,0.04)"/>
      <stop offset="100%" stop-color="rgba(200,195,180,0)"/>
    </linearGradient>
  </defs>

  <!-- Steam plumes (multiple wisps) -->
  <g opacity="0.6">
    <path d="M30,75 Q25,60 28,50 Q24,40 30,30 Q26,20 32,10"
      fill="none" stroke="url(#steam)" stroke-width="8"/>
    <path d="M35,72 Q40,58 36,48 Q42,38 38,28 Q44,18 36,8"
      fill="none" stroke="url(#steam)" stroke-width="6"/>
    <path d="M24,70 Q18,56 22,45 Q16,35 22,25 Q18,15 24,5"
      fill="none" stroke="url(#steam)" stroke-width="5"/>
  </g>

  <!-- Grate at base -->
  <rect x="15" y="72" width="30" height="6" rx="1" fill="#1a1816" stroke="#252525" stroke-width="0.5"/>
  <g stroke="#252525" stroke-width="0.5" opacity="0.5">
    <line x1="20" y1="73" x2="20" y2="77"/>
    <line x1="25" y1="73" x2="25" y2="77"/>
    <line x1="30" y1="73" x2="30" y2="77"/>
    <line x1="35" y1="73" x2="35" y2="77"/>
    <line x1="40" y1="73" x2="40" y2="77"/>
  </g>
</svg>