<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 90">
  <!-- Isometric urban street tree. Full canopy on a trunk with sidewalk grate.
       Sized to be rendered at 60-80px wide for proper street scale. -->

  <!-- Tree grate (iso diamond on ground) -->
  <polygon points="28,76 42,83 28,90 14,83"
    fill="#2a2a2a" stroke="#1a1a1a" stroke-width="0.6"/>
  <line x1="21" y1="79.5" x2="35" y2="86.5" stroke="#1a1a1a" stroke-width="0.4"/>
  <line x1="24" y1="78" x2="32" y2="88" stroke="#1a1a1a" stroke-width="0.4"/>

  <!-- Trunk -->
  <line x1="28" y1="76" x2="28" y2="32" stroke="#3a2818" stroke-width="3"/>
  <line x1="28" y1="76" x2="28" y2="32" stroke="#4a3424" stroke-width="1.8"/>
  <!-- Branches -->
  <line x1="28" y1="44" x2="16" y2="30" stroke="#3a2818" stroke-width="1.5"/>
  <line x1="28" y1="40" x2="40" y2="26" stroke="#3a2818" stroke-width="1.2"/>
  <line x1="28" y1="50" x2="20" y2="38" stroke="#3a2818" stroke-width="1"/>

  <!-- Foliage cluster (large, full canopy) -->
  <ellipse cx="28" cy="26" rx="24" ry="18" fill="#0e2818"/>
  <ellipse cx="20" cy="20" rx="14" ry="12" fill="#102a1c"/>
  <ellipse cx="36" cy="18" rx="12" ry="11" fill="#0c2616"/>
  <ellipse cx="28" cy="14" rx="16" ry="10" fill="#102a1c"/>
  <ellipse cx="14" cy="26" rx="10" ry="8" fill="#0e2818"/>
  <ellipse cx="42" cy="24" rx="9" ry="7" fill="#0c2616"/>
  <!-- Leaf highlights -->
  <ellipse cx="22" cy="16" rx="5" ry="4" fill="#143020" opacity="0.5"/>
  <ellipse cx="34" cy="22" rx="4" ry="3" fill="#163222" opacity="0.4"/>
  <ellipse cx="16" cy="28" rx="3" ry="2" fill="#143020" opacity="0.3"/>

  <!-- Shadow -->
  <ellipse cx="28" cy="88" rx="20" ry="3.5" fill="rgba(0,0,0,0.12)"/>
</svg>
