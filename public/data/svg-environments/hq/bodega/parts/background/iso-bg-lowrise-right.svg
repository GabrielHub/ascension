<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280">
  <!-- Right-facing 2-story gray concrete commercial building.
       Facade slope -0.5, side slope +0.5. Ground-floor storefront, flat roof.
       Mirror of lowrise. Front corner base at (140, 260). -->

  <defs>
    <linearGradient id="lrr-facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#484440"/>
      <stop offset="100%" stop-color="#3a3836"/>
    </linearGradient>
    <linearGradient id="lrr-side" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#3e3c3a"/>
      <stop offset="100%" stop-color="#4a4846"/>
    </linearGradient>
  </defs>

  <!-- Side face (iso-left, lighter, drawn first) -->
  <polygon points="20,60 140,120 140,260 20,200"
    fill="url(#lrr-side)" stroke="#2e2c2a" stroke-width="1"/>

  <!-- Facade (iso-right, main visible) -->
  <polygon points="140,120 320,60 320,200 140,260"
    fill="url(#lrr-facade)" stroke="#2e2c2a" stroke-width="1.5"/>

  <!-- Roof -->
  <polygon points="20,60 140,120 320,60 200,0"
    fill="#2a2828" stroke="#222" stroke-width="1.5"/>

  <!-- Parapet — facade -->
  <polygon points="140,120 320,60 320,65 140,125"
    fill="#4a4846" stroke="#3a3838" stroke-width="0.5" opacity="0.55"/>

  <!-- Parapet — side -->
  <polygon points="20,60 140,120 140,125 20,65"
    fill="#3a3836" stroke="#2e2c2a" stroke-width="0.5" opacity="0.4"/>

  <!-- ═══ FACADE — matrix(1, -0.5, 0, 1, 140, 120) ═══ -->

  <g transform="matrix(1, -0.5, 0, 1, 140, 120)"
     opacity="0.18" stroke="#5a5856" stroke-width="0.8">
    <line x1="3" y1="60" x2="177" y2="60"/>
  </g>

  <g transform="matrix(1, -0.5, 0, 1, 140, 120)"
     opacity="0.06" stroke="#50504e" stroke-width="0.4">
    <line x1="60" y1="5" x2="60" y2="140"/>
    <line x1="120" y1="5" x2="120" y2="140"/>
  </g>

  <!-- Upper floor windows -->
  <g transform="matrix(1, -0.5, 0, 1, 140, 120)"
     fill="#0e0e0c" stroke="#3a3838" stroke-width="0.5">
    <rect x="18" y="14" width="28" height="30" rx="1"/>
    <rect x="76" y="14" width="28" height="30" rx="1"/>
    <rect x="134" y="14" width="28" height="30" rx="1"/>
  </g>

  <g transform="matrix(1, -0.5, 0, 1, 140, 120)" opacity="0.2">
    <rect x="78" y="16" width="24" height="26" rx="1" fill="#c8a84c"/>
  </g>

  <!-- Ground floor storefronts -->
  <g transform="matrix(1, -0.5, 0, 1, 140, 120)">
    <rect x="10" y="70" width="70" height="50" rx="1"
      fill="#161412" stroke="#3a3838" stroke-width="0.7" opacity="0.6"/>
    <rect x="95" y="70" width="70" height="50" rx="1"
      fill="#161412" stroke="#3a3838" stroke-width="0.7" opacity="0.6"/>
    <rect x="97" y="72" width="66" height="46" rx="1" fill="#c8a84c" opacity="0.08"/>
  </g>

  <g transform="matrix(1, -0.5, 0, 1, 140, 120)">
    <rect x="82" y="76" width="16" height="44" rx="1"
      fill="#0e0c0a" stroke="#3a3838" stroke-width="0.6"/>
  </g>

  <!-- ═══ SIDE — matrix(1, 0.5, 0, 1, 20, 60) ═══ -->

  <g transform="matrix(1, 0.5, 0, 1, 20, 60)"
     opacity="0.12" stroke="#3a3836" stroke-width="0.5">
    <line x1="3" y1="60" x2="117" y2="60"/>
  </g>

  <g transform="matrix(1, 0.5, 0, 1, 20, 60)"
     fill="#0e0e0c" stroke="#3a3838" stroke-width="0.4" opacity="0.6">
    <rect x="20" y="16" width="22" height="26" rx="1"/>
    <rect x="70" y="16" width="22" height="26" rx="1"/>
    <rect x="20" y="78" width="22" height="26" rx="1"/>
    <rect x="70" y="78" width="22" height="26" rx="1"/>
  </g>

  <g transform="matrix(1, 0.5, 0, 1, 20, 60)" opacity="0.12">
    <rect x="22" y="80" width="18" height="22" rx="1" fill="#c8a84c"/>
  </g>

  <g transform="matrix(1, 0.5, 0, 1, 20, 60)" opacity="0.4">
    <rect x="75" y="48" width="18" height="12" rx="2" fill="#2a2a2a" stroke="#3a3838" stroke-width="0.4"/>
  </g>

  <g transform="matrix(1, 0.5, 0, 1, 20, 60)">
    <line x1="117" y1="5" x2="117" y2="138" stroke="#3a3838" stroke-width="1.2" opacity="0.25"/>
  </g>

  <g opacity="0.3">
    <rect x="220" y="24" width="8" height="12" rx="1" fill="#2a2828" stroke="#222" stroke-width="0.4"/>
  </g>
</svg>
