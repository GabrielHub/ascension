<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -155 760 905">
  <!-- Right-facing NYC apartment block. Facade slope -0.5, side slope +0.5.
       Mirror of building-tall. Extended side face with background building.
       Front corner base at (420, 650). -->

  <defs>
    <linearGradient id="btr-facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#50423a"/>
      <stop offset="100%" stop-color="#3e3028"/>
    </linearGradient>
    <linearGradient id="btr-side" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#3e3428"/>
      <stop offset="100%" stop-color="#4a3e34"/>
    </linearGradient>
  </defs>

  <!-- ═══ BACKGROUND BUILDING (behind main, taller) ═══ -->
  <polygon points="40,20 16,8 16,58 40,70"
    fill="#201c1a" stroke="#1a1818" stroke-width="0.5" opacity="0.8"/>
  <polygon points="40,-140 360,20 40,70 40,-90"
    fill="#242018" opacity="0.85"/>
  <polygon points="40,-140 360,20 336,8 16,-152"
    fill="#181616" stroke="#222" stroke-width="0.5" opacity="0.8"/>
  <g transform="matrix(1, -0.5, 0, 1, 40, -140)" opacity="0.12">
    <rect x="35" y="18" width="10" height="14" rx="0.5" fill="#c8a84c"/>
    <rect x="110" y="20" width="10" height="14" rx="0.5" fill="#9a7a3c"/>
    <rect x="185" y="15" width="10" height="14" rx="0.5" fill="#c8a84c"/>
  </g>

  <!-- ═══ MAIN BUILDING — structural faces ═══ -->

  <!-- Side face (iso-left, lighter, behind facade) -->
  <polygon points="40,70 420,260 420,650 40,460"
    fill="url(#btr-side)" stroke="#2e2418" stroke-width="1"/>

  <!-- Facade (iso-right, main visible face) -->
  <polygon points="420,260 740,100 740,490 420,650"
    fill="url(#btr-facade)" stroke="#2e2418" stroke-width="1.5"/>

  <!-- Roof -->
  <polygon points="40,70 420,260 740,100 360,-90"
    fill="#222020" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Cornice — facade -->
  <polygon points="420,260 740,100 740,108 420,268"
    fill="#4a4440" stroke="#2e2418" stroke-width="0.5" opacity="0.6"/>
  <!-- Cornice — side -->
  <polygon points="40,70 420,260 420,268 40,78"
    fill="#3a3630" stroke="#2e2418" stroke-width="0.5" opacity="0.5"/>

  <!-- ═══ FACADE DETAILS — matrix(1, -0.5, 0, 1, 420, 260) ═══ -->

  <!-- Floor cornice lines -->
  <g transform="matrix(1, -0.5, 0, 1, 420, 260)"
     opacity="0.18" stroke="#5a5040" stroke-width="0.8">
    <line x1="5" y1="66" x2="315" y2="66"/>
    <line x1="5" y1="136" x2="315" y2="136"/>
    <line x1="5" y1="206" x2="315" y2="206"/>
    <line x1="5" y1="276" x2="315" y2="276"/>
  </g>

  <!-- Brick texture -->
  <g transform="matrix(1, -0.5, 0, 1, 420, 260)"
     opacity="0.08" stroke="#4a3e30" stroke-width="0.4">
    <line x1="10" y1="50" x2="315" y2="50"/>
    <line x1="10" y1="100" x2="315" y2="100"/>
    <line x1="10" y1="165" x2="315" y2="165"/>
    <line x1="10" y1="195" x2="315" y2="195"/>
    <line x1="10" y1="240" x2="315" y2="240"/>
    <line x1="10" y1="310" x2="315" y2="310"/>
    <line x1="10" y1="340" x2="315" y2="340"/>
  </g>

  <!-- FACADE WINDOWS (5 cols × 4 floors) -->
  <g transform="matrix(1, -0.5, 0, 1, 420, 260)"
     fill="#161210" stroke="#3a3530" stroke-width="0.5">
    <rect x="30" y="19" width="22" height="28" rx="1"/>
    <rect x="90" y="19" width="22" height="28" rx="1"/>
    <rect x="150" y="19" width="22" height="28" rx="1"/>
    <rect x="210" y="19" width="22" height="28" rx="1"/>
    <rect x="270" y="19" width="22" height="28" rx="1"/>
    <rect x="30" y="87" width="22" height="28" rx="1"/>
    <rect x="90" y="87" width="22" height="28" rx="1"/>
    <rect x="150" y="87" width="22" height="28" rx="1"/>
    <rect x="210" y="87" width="22" height="28" rx="1"/>
    <rect x="270" y="87" width="22" height="28" rx="1"/>
    <rect x="30" y="157" width="22" height="28" rx="1"/>
    <rect x="90" y="157" width="22" height="28" rx="1"/>
    <rect x="150" y="157" width="22" height="28" rx="1"/>
    <rect x="210" y="157" width="22" height="28" rx="1"/>
    <rect x="270" y="157" width="22" height="28" rx="1"/>
    <rect x="30" y="227" width="22" height="28" rx="1"/>
    <rect x="90" y="227" width="22" height="28" rx="1"/>
    <rect x="150" y="227" width="22" height="28" rx="1"/>
    <rect x="210" y="227" width="22" height="28" rx="1"/>
    <rect x="270" y="227" width="22" height="28" rx="1"/>
  </g>

  <!-- Warm lit windows -->
  <g transform="matrix(1, -0.5, 0, 1, 420, 260)" opacity="0.25">
    <rect x="92" y="89" width="18" height="24" rx="1" fill="#c8a84c"/>
    <rect x="32" y="229" width="18" height="24" rx="1" fill="#c8a84c"/>
    <rect x="212" y="159" width="18" height="24" rx="1" fill="#9a7a3c"/>
    <rect x="272" y="89" width="18" height="24" rx="1" fill="#8a7040"/>
    <rect x="152" y="21" width="18" height="24" rx="1" fill="#9a7a3c"/>
    <rect x="32" y="19" width="18" height="24" rx="1" fill="#9a7a3c"/>
  </g>

  <!-- Storefronts (ground floor) -->
  <g transform="matrix(1, -0.5, 0, 1, 420, 260)">
    <rect x="20" y="295" width="60" height="45" rx="1"
      fill="#1a1816" stroke="#3a3530" stroke-width="0.7" opacity="0.6"/>
    <rect x="115" y="295" width="55" height="45" rx="1"
      fill="#1a1816" stroke="#3a3530" stroke-width="0.7" opacity="0.5"/>
    <rect x="205" y="295" width="70" height="45" rx="1"
      fill="#1a1816" stroke="#3a3530" stroke-width="0.7" opacity="0.6"/>
  </g>

  <!-- Fire escape (facade) -->
  <g transform="matrix(1, -0.5, 0, 1, 420, 260)"
     stroke="#4a4840" stroke-width="0.8" fill="none" opacity="0.4">
    <line x1="62" y1="28" x2="62" y2="272"/>
    <line x1="98" y1="28" x2="98" y2="272"/>
    <line x1="62" y1="66" x2="98" y2="66"/>
    <line x1="62" y1="136" x2="98" y2="136"/>
    <line x1="62" y1="206" x2="98" y2="206"/>
    <line x1="62" y1="276" x2="98" y2="276"/>
  </g>

  <!-- ═══ SIDE FACE DETAILS — matrix(1, 0.5, 0, 1, 40, 70) ═══ -->

  <g transform="matrix(1, 0.5, 0, 1, 40, 70)"
     opacity="0.14" stroke="#4a4438" stroke-width="0.6">
    <line x1="5" y1="66" x2="375" y2="66"/>
    <line x1="5" y1="136" x2="375" y2="136"/>
    <line x1="5" y1="206" x2="375" y2="206"/>
    <line x1="5" y1="276" x2="375" y2="276"/>
  </g>

  <!-- SIDE WINDOWS (6 cols × 4 floors) -->
  <g transform="matrix(1, 0.5, 0, 1, 40, 70)"
     fill="#161210" stroke="#3a3530" stroke-width="0.4" opacity="0.7">
    <rect x="25" y="21" width="18" height="24" rx="1"/>
    <rect x="85" y="21" width="18" height="24" rx="1"/>
    <rect x="145" y="21" width="18" height="24" rx="1"/>
    <rect x="205" y="21" width="18" height="24" rx="1"/>
    <rect x="265" y="21" width="18" height="24" rx="1"/>
    <rect x="330" y="21" width="18" height="24" rx="1"/>
    <rect x="25" y="89" width="18" height="24" rx="1"/>
    <rect x="85" y="89" width="18" height="24" rx="1"/>
    <rect x="145" y="89" width="18" height="24" rx="1"/>
    <rect x="205" y="89" width="18" height="24" rx="1"/>
    <rect x="265" y="89" width="18" height="24" rx="1"/>
    <rect x="330" y="89" width="18" height="24" rx="1"/>
    <rect x="25" y="159" width="18" height="24" rx="1"/>
    <rect x="85" y="159" width="18" height="24" rx="1"/>
    <rect x="145" y="159" width="18" height="24" rx="1"/>
    <rect x="205" y="159" width="18" height="24" rx="1"/>
    <rect x="265" y="159" width="18" height="24" rx="1"/>
    <rect x="330" y="159" width="18" height="24" rx="1"/>
    <rect x="25" y="229" width="18" height="24" rx="1"/>
    <rect x="85" y="229" width="18" height="24" rx="1"/>
    <rect x="145" y="229" width="18" height="24" rx="1"/>
    <rect x="205" y="229" width="18" height="24" rx="1"/>
    <rect x="265" y="229" width="18" height="24" rx="1"/>
    <rect x="330" y="229" width="18" height="24" rx="1"/>
  </g>

  <!-- Side lit windows -->
  <g transform="matrix(1, 0.5, 0, 1, 40, 70)" opacity="0.18">
    <rect x="87" y="91" width="14" height="20" rx="1" fill="#c8a84c"/>
    <rect x="207" y="161" width="14" height="20" rx="1" fill="#9a7a3c"/>
    <rect x="332" y="23" width="14" height="20" rx="1" fill="#8a7040"/>
    <rect x="27" y="89" width="14" height="20" rx="1" fill="#c8a84c"/>
  </g>

  <!-- AC units (side) -->
  <g transform="matrix(1, 0.5, 0, 1, 40, 70)" opacity="0.4">
    <rect x="100" y="145" width="22" height="14" rx="2" fill="#2e2e2e" stroke="#444" stroke-width="0.5"/>
    <rect x="250" y="215" width="22" height="14" rx="2" fill="#2e2e2e" stroke="#444" stroke-width="0.5"/>
  </g>

  <!-- Downspout (side) -->
  <g transform="matrix(1, 0.5, 0, 1, 40, 70)">
    <line x1="377" y1="5" x2="377" y2="385" stroke="#3a3838" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- ═══ ROOFTOP ═══ -->
  <g opacity="0.35">
    <rect x="500" y="73" width="24" height="16" rx="2" fill="#2a2828" stroke="#333" stroke-width="0.5"/>
    <rect x="497" y="70" width="30" height="5" rx="1" fill="#2a2828"/>
    <line x1="200" y1="145" x2="200" y2="125" stroke="#4a4848" stroke-width="1.2"/>
    <line x1="196" y1="129" x2="204" y2="129" stroke="#4a4848" stroke-width="0.8"/>
  </g>
</svg>
