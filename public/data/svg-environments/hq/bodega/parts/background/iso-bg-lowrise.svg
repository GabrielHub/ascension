<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280">
  <!-- Left-facing 2-story gray concrete commercial building.
       Facade slope +0.5, side slope -0.5. Ground-floor storefront, flat roof.
       Smaller scale for variety. Front corner base at (200, 260). -->

  <defs>
    <linearGradient id="lr-facade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#484440"/>
      <stop offset="100%" stop-color="#3a3836"/>
    </linearGradient>
    <linearGradient id="lr-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e2c2a"/>
      <stop offset="100%" stop-color="#3a3836"/>
    </linearGradient>
  </defs>

  <!-- Side face (iso-right, darker) -->
  <polygon points="200,120 320,60 320,200 200,260"
    fill="url(#lr-side)" stroke="#2e2c2a" stroke-width="1"/>

  <!-- Facade (iso-left, lighter) -->
  <polygon points="20,60 200,120 200,260 20,200"
    fill="url(#lr-facade)" stroke="#2e2c2a" stroke-width="1.5"/>

  <!-- Roof -->
  <polygon points="20,60 200,120 320,60 140,0"
    fill="#2a2828" stroke="#222" stroke-width="1.5"/>

  <!-- Parapet — facade -->
  <polygon points="20,60 200,120 200,125 20,65"
    fill="#4a4846" stroke="#3a3838" stroke-width="0.5" opacity="0.55"/>

  <!-- Parapet — side -->
  <polygon points="200,120 320,60 320,65 200,125"
    fill="#3a3836" stroke="#2e2c2a" stroke-width="0.5" opacity="0.4"/>

  <!-- ═══ FACADE — matrix(1, 0.5, 0, 1, 20, 60) ═══ -->

  <!-- Floor divider -->
  <g transform="matrix(1, 0.5, 0, 1, 20, 60)"
     opacity="0.18" stroke="#5a5856" stroke-width="0.8">
    <line x1="3" y1="60" x2="177" y2="60"/>
  </g>

  <!-- Concrete panel lines -->
  <g transform="matrix(1, 0.5, 0, 1, 20, 60)"
     opacity="0.06" stroke="#50504e" stroke-width="0.4">
    <line x1="60" y1="5" x2="60" y2="140"/>
    <line x1="120" y1="5" x2="120" y2="140"/>
  </g>

  <!-- Upper floor windows (3 cols) -->
  <g transform="matrix(1, 0.5, 0, 1, 20, 60)"
     fill="#0e0e0c" stroke="#3a3838" stroke-width="0.5">
    <rect x="18" y="14" width="28" height="30" rx="1"/>
    <rect x="76" y="14" width="28" height="30" rx="1"/>
    <rect x="134" y="14" width="28" height="30" rx="1"/>
  </g>

  <!-- Lit windows -->
  <g transform="matrix(1, 0.5, 0, 1, 20, 60)" opacity="0.2">
    <rect x="20" y="16" width="24" height="26" rx="1" fill="#c8a84c"/>
    <rect x="136" y="16" width="24" height="26" rx="1" fill="#9a7a3c"/>
  </g>

  <!-- Ground floor storefronts (larger windows) -->
  <g transform="matrix(1, 0.5, 0, 1, 20, 60)">
    <rect x="10" y="70" width="70" height="50" rx="1"
      fill="#161412" stroke="#3a3838" stroke-width="0.7" opacity="0.6"/>
    <rect x="95" y="70" width="70" height="50" rx="1"
      fill="#161412" stroke="#3a3838" stroke-width="0.7" opacity="0.6"/>
    <!-- Shop glow -->
    <rect x="12" y="72" width="66" height="46" rx="1" fill="#c8a84c" opacity="0.08"/>
  </g>

  <!-- Door -->
  <g transform="matrix(1, 0.5, 0, 1, 20, 60)">
    <rect x="82" y="76" width="16" height="44" rx="1"
      fill="#0e0c0a" stroke="#3a3838" stroke-width="0.6"/>
  </g>

  <!-- ═══ SIDE — matrix(1, -0.5, 0, 1, 200, 120) ═══ -->

  <g transform="matrix(1, -0.5, 0, 1, 200, 120)"
     opacity="0.12" stroke="#3a3836" stroke-width="0.5">
    <line x1="3" y1="60" x2="117" y2="60"/>
  </g>

  <g transform="matrix(1, -0.5, 0, 1, 200, 120)"
     fill="#0e0e0c" stroke="#3a3838" stroke-width="0.4" opacity="0.6">
    <rect x="20" y="16" width="22" height="26" rx="1"/>
    <rect x="70" y="16" width="22" height="26" rx="1"/>
    <rect x="20" y="78" width="22" height="26" rx="1"/>
    <rect x="70" y="78" width="22" height="26" rx="1"/>
  </g>

  <g transform="matrix(1, -0.5, 0, 1, 200, 120)" opacity="0.12">
    <rect x="72" y="18" width="18" height="22" rx="1" fill="#c8a84c"/>
  </g>

  <!-- AC unit -->
  <g transform="matrix(1, -0.5, 0, 1, 200, 120)" opacity="0.4">
    <rect x="25" y="48" width="18" height="12" rx="2" fill="#2a2a2a" stroke="#3a3838" stroke-width="0.4"/>
  </g>

  <!-- Downspout -->
  <g transform="matrix(1, -0.5, 0, 1, 200, 120)">
    <line x1="3" y1="5" x2="3" y2="138" stroke="#3a3838" stroke-width="1.2" opacity="0.25"/>
  </g>

  <!-- Rooftop vent -->
  <g opacity="0.3">
    <rect x="120" y="24" width="8" height="12" rx="1" fill="#2a2828" stroke="#222" stroke-width="0.4"/>
  </g>
</svg>
