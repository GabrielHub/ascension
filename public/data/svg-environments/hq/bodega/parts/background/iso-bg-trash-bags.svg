<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 44">
  <!-- Ground shadow -->
  <ellipse cx="32" cy="40" rx="28" ry="5" fill="#060608" opacity="0.2"/>

  <!-- Back bag (large, lumpy) -->
  <path d="M12,38 Q8,30 10,22 Q12,14 20,12 Q28,10 36,14 Q42,10 48,14 Q54,18 52,28 Q54,36 50,38 Z"
    fill="#0e0e10" stroke="#1a1a1e" stroke-width="0.6"/>
  <!-- Bag highlights (shiny plastic) -->
  <path d="M18,16 Q22,14 26,16" stroke="#1a1a1e" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M38,14 Q42,12 46,16" stroke="#1a1a1e" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Front bag (smaller, leaning) -->
  <path d="M28,40 Q24,34 26,26 Q28,20 34,18 Q40,16 46,20 Q50,24 48,32 Q50,38 46,40 Z"
    fill="#121214" stroke="#1e1e22" stroke-width="0.6"/>
  <!-- Front bag highlight -->
  <path d="M34,22 Q38,20 42,22" stroke="#1e1e22" stroke-width="0.6" fill="none" opacity="0.4"/>

  <!-- Small bag on top -->
  <ellipse cx="30" cy="16" rx="10" ry="6" fill="#0a0a0c" stroke="#161618" stroke-width="0.5"/>

  <!-- Bag ties (twisted plastic) -->
  <g stroke="#1e1e22" stroke-width="0.8" fill="none" opacity="0.6">
    <path d="M24,12 Q22,8 26,6"/>
    <path d="M38,15 Q40,11 37,9"/>
  </g>

  <!-- Leaked liquid stain -->
  <ellipse cx="50" cy="39" rx="5" ry="2" fill="#0a0908" opacity="0.15"/>
</svg>