<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60">
  <!-- Ground shadow -->
  <ellipse cx="40" cy="56" rx="35" ry="5" fill="#060608" opacity="0.2"/>

  <!-- Dumpster body (isometric box) -->
  <!-- Front face -->
  <polygon points="5,24 65,24 65,52 5,52"
    fill="#1a3028" stroke="#142820" stroke-width="1"/>
  <!-- Top face -->
  <polygon points="5,24 65,24 75,18 15,18"
    fill="#1e3830" stroke="#142820" stroke-width="0.8"/>
  <!-- Right face -->
  <polygon points="65,24 75,18 75,46 65,52"
    fill="#142820" stroke="#0e1e18" stroke-width="0.8"/>

  <!-- Lid (slightly open) -->
  <polygon points="15,18 75,18 72,12 18,12"
    fill="#1e3830" stroke="#142820" stroke-width="0.8"/>

  <!-- Lid handle -->
  <rect x="40" y="10" width="12" height="3" rx="1" fill="#3a3838" opacity="0.5"/>

  <!-- Front panel details (ridges) -->
  <g stroke="#142820" stroke-width="0.6" opacity="0.4">
    <line x1="8" y1="30" x2="62" y2="30"/>
    <line x1="8" y1="38" x2="62" y2="38"/>
    <line x1="8" y1="46" x2="62" y2="46"/>
  </g>

  <!-- Rust / wear -->
  <g opacity="0.15">
    <ellipse cx="30" cy="36" rx="8" ry="5" fill="#5a3020"/>
    <ellipse cx="55" cy="42" rx="5" ry="3" fill="#4a2818"/>
  </g>

  <!-- Wheels (small circles at base) -->
  <circle cx="12" cy="53" r="2.5" fill="#252525" stroke="#3a3838" stroke-width="0.4"/>
  <circle cx="58" cy="53" r="2.5" fill="#252525" stroke="#3a3838" stroke-width="0.4"/>

  <!-- Overflow trash hint -->
  <g opacity="0.4">
    <path d="M25,14 Q22,8 28,6" fill="#0e0e10" stroke="#1a1a1e" stroke-width="0.4"/>
    <ellipse cx="55" cy="12" rx="6" ry="4" fill="#0e0e10" stroke="#1a1a1e" stroke-width="0.3"/>
  </g>
</svg>