<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 72">
  <!-- A-frame sidewalk sign / sandwich board.
       Chalkboard style, isometric front-face. Bar specials. -->

  <!-- Ground shadow -->
  <ellipse cx="25" cy="68" rx="18" ry="3" fill="#060608" opacity="0.2"/>

  <!-- Back panel (slightly visible) -->
  <polygon points="8,14 42,14 38,66 12,66"
    fill="#1e1a14" stroke="#161210" stroke-width="0.5"/>

  <!-- Front panel (A-frame, slight taper) -->
  <polygon points="6,16 44,16 40,66 10,66"
    fill="#1a1816" stroke="#2e2418" stroke-width="0.8"/>

  <!-- Chalkboard area -->
  <rect x="10" y="22" width="30" height="38" rx="1"
    fill="#0e1410" stroke="#1e2418" stroke-width="0.5"/>

  <!-- Chalk text (specials) -->
  <g opacity="0.5">
    <text x="14" y="34" font-family="sans-serif" font-size="5" fill="#c8c0a8">HAPPY HOUR</text>
    <line x1="12" y1="37" x2="38" y2="37" stroke="#c8c0a8" stroke-width="0.3" opacity="0.3"/>
    <text x="14" y="44" font-family="sans-serif" font-size="4" fill="#a8a090">Draft $5</text>
    <text x="14" y="50" font-family="sans-serif" font-size="4" fill="#a8a090">Well $6</text>
    <text x="14" y="56" font-family="sans-serif" font-size="4" fill="#a8a090">Wings $8</text>
  </g>

  <!-- Hinge at top -->
  <rect x="20" y="12" width="10" height="6" rx="1"
    fill="#3a3838" stroke="#252525" stroke-width="0.5"/>
  <circle cx="25" cy="15" r="1.5" fill="#252525"/>

  <!-- Frame edges -->
  <g stroke="#2e2418" stroke-width="0.8" opacity="0.4">
    <line x1="6" y1="16" x2="10" y2="66"/>
    <line x1="44" y1="16" x2="40" y2="66"/>
  </g>

  <!-- Chalk dust smudge -->
  <ellipse cx="28" cy="40" rx="8" ry="4" fill="#c8c0a8" opacity="0.03"/>
</svg>