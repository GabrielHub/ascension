<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60">
  <!-- Red navigation buoy leaning against a post.
       Isometric 2:1. Buoy is an iso cylinder, post is vertical. -->

  <!-- Ground shadow -->
  <ellipse cx="20" cy="56" rx="14" ry="3.5" fill="#060608" opacity="0.15"/>

  <!-- Support post (vertical) -->
  <rect x="28" y="12" width="4" height="44" rx="0.5"
    fill="#3a3020" stroke="#2e2418" stroke-width="0.5"/>
  <!-- Post cap -->
  <ellipse cx="30" cy="12" rx="3" ry="1.2" fill="#4a3e2e" stroke="#2e2418" stroke-width="0.3"/>

  <!-- Buoy body — front face (tapered, wider in middle) -->
  <polygon points="6,28 26,28 24,50 8,50"
    fill="#6a2020" stroke="#4a1818" stroke-width="0.7"/>

  <!-- Buoy body — right face -->
  <polygon points="26,28 32,25 30,47 24,50"
    fill="#4a1818" stroke="#3a1010" stroke-width="0.5"/>

  <!-- Buoy body — top (iso ellipse, narrow) -->
  <ellipse cx="19" cy="27" rx="13" ry="4"
    fill="#5a1818" stroke="#4a1818" stroke-width="0.5"/>

  <!-- Center reflective band — front -->
  <rect x="7" y="36" width="18" height="4"
    fill="#e8e8e0" opacity="0.3"/>

  <!-- Ring at top (on front face) -->
  <circle cx="16" cy="26" r="3.5"
    fill="none" stroke="#3a3838" stroke-width="1.5" opacity="0.45"/>

  <!-- Rope from ring to post -->
  <path d="M19,24 Q24,18 28,20"
    stroke="#5a5040" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Salt / wear -->
  <g opacity="0.12">
    <rect x="10" y="40" width="6" height="6" rx="1" fill="#8a8a80"/>
  </g>
</svg>