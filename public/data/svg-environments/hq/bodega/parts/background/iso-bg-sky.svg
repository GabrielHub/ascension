<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08091a"/>
      <stop offset="40%" stop-color="#0e1228"/>
      <stop offset="75%" stop-color="#1a1620"/>
      <stop offset="100%" stop-color="#201816"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(200,168,76,0)"/>
      <stop offset="100%" stop-color="rgba(200,168,76,0.04)"/>
    </linearGradient>
  </defs>

  <!-- Sky gradient -->
  <rect width="1200" height="320" fill="url(#sky-grad)"/>

  <!-- Urban haze at horizon -->
  <rect y="200" width="1200" height="120" fill="url(#haze)"/>

  <!-- Distant skyline silhouette -->
  <g fill="#0c0e18" opacity="0.7">
    <!-- Far left cluster -->
    <rect x="20" y="180" width="40" height="140" rx="1"/>
    <rect x="55" y="200" width="30" height="120" rx="1"/>
    <rect x="80" y="160" width="22" height="160" rx="1"/>

    <!-- Left mid-rise cluster -->
    <rect x="140" y="190" width="35" height="130" rx="1"/>
    <rect x="170" y="210" width="28" height="110" rx="1"/>
    <rect x="195" y="170" width="18" height="150" rx="1"/>

    <!-- Center-left tower -->
    <rect x="260" y="120" width="24" height="200" rx="1"/>
    <rect x="250" y="118" width="44" height="8" rx="1"/>

    <!-- Center cluster -->
    <rect x="340" y="195" width="45" height="125" rx="1"/>
    <rect x="380" y="175" width="30" height="145" rx="1"/>
    <rect x="405" y="205" width="38" height="115" rx="1"/>

    <!-- Water tower on center building -->
    <rect x="385" y="165" width="18" height="14" rx="1"/>
    <rect x="388" y="160" width="12" height="6" rx="1"/>
    <line x1="394" y1="155" x2="394" y2="160" stroke="#0c0e18" stroke-width="1.5"/>

    <!-- Right center -->
    <rect x="500" y="185" width="32" height="135" rx="1"/>
    <rect x="528" y="200" width="25" height="120" rx="1"/>
    <rect x="548" y="140" width="20" height="180" rx="1"/>

    <!-- Right cluster -->
    <rect x="620" y="195" width="40" height="125" rx="1"/>
    <rect x="655" y="210" width="28" height="110" rx="1"/>
    <rect x="680" y="180" width="22" height="140" rx="1"/>

    <!-- Far right -->
    <rect x="750" y="200" width="35" height="120" rx="1"/>
    <rect x="780" y="165" width="18" height="155" rx="1"/>
    <rect x="800" y="210" width="42" height="110" rx="1"/>

    <!-- Extra far right -->
    <rect x="880" y="190" width="30" height="130" rx="1"/>
    <rect x="905" y="205" width="25" height="115" rx="1"/>
    <rect x="940" y="175" width="20" height="145" rx="1"/>

    <!-- Rightmost -->
    <rect x="1000" y="200" width="38" height="120" rx="1"/>
    <rect x="1035" y="185" width="22" height="135" rx="1"/>
    <rect x="1060" y="210" width="35" height="110" rx="1"/>
    <rect x="1100" y="195" width="28" height="125" rx="1"/>
    <rect x="1130" y="175" width="18" height="145" rx="1"/>
  </g>

  <!-- Distant window lights (tiny dots on skyline) -->
  <g fill="#c8a84c" opacity="0.15">
    <rect x="85" y="180" width="2" height="2"/>
    <rect x="85" y="195" width="2" height="2"/>
    <rect x="265" y="140" width="2" height="2"/>
    <rect x="265" y="160" width="2" height="2"/>
    <rect x="270" y="150" width="2" height="2"/>
    <rect x="390" y="200" width="2" height="2"/>
    <rect x="550" y="160" width="2" height="2"/>
    <rect x="550" y="180" width="2" height="2"/>
    <rect x="625" y="210" width="2" height="2"/>
    <rect x="785" y="185" width="2" height="2"/>
    <rect x="785" y="200" width="2" height="2"/>
    <rect x="945" y="195" width="2" height="2"/>
    <rect x="1040" y="200" width="2" height="2"/>
    <rect x="1135" y="195" width="2" height="2"/>
  </g>

  <!-- Stars / ambient sky dots -->
  <g fill="#e0ddd6" opacity="0.08">
    <circle cx="120" cy="40" r="0.8"/>
    <circle cx="350" cy="25" r="0.6"/>
    <circle cx="580" cy="50" r="0.7"/>
    <circle cx="720" cy="30" r="0.5"/>
    <circle cx="900" cy="45" r="0.8"/>
    <circle cx="1050" cy="35" r="0.6"/>
    <circle cx="200" cy="80" r="0.5"/>
    <circle cx="450" cy="70" r="0.7"/>
    <circle cx="800" cy="65" r="0.6"/>
  </g>
</svg>