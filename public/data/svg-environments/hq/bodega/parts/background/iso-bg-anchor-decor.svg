<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 60">
  <!-- Decorative anchor leaning against a wall.
       Iso 2:1. The anchor is a flat iron object leaning,
       rendered on the facade plane (matrix 1, 0.5 shear)
       so it reads as leaning against the left-facing wall. -->

  <!-- Ground shadow -->
  <ellipse cx="23" cy="56" rx="16" ry="4" fill="#060608" opacity="0.15"/>

  <!-- Anchor silhouette on facade shear plane -->
  <g transform="matrix(1, 0.5, 0, 1, 4, 2)">
    <!-- Shank (vertical bar) -->
    <rect x="16" y="8" width="4" height="36" rx="0.5"
      fill="#3a3838" stroke="#2a2a2e" stroke-width="0.7"/>

    <!-- Ring at top -->
    <circle cx="18" cy="6" r="5"
      fill="none" stroke="#3a3838" stroke-width="2"/>

    <!-- Stock (cross bar) -->
    <rect x="6" y="14" width="24" height="3" rx="0.5"
      fill="#3a3838" stroke="#2a2a2e" stroke-width="0.5"/>

    <!-- Left arm + fluke -->
    <path d="M16,42 Q8,46 4,50 L8,46 Q12,43 16,42"
      fill="#3a3838" stroke="#2a2a2e" stroke-width="0.8"/>
    <polygon points="4,50 1,47 8,44" fill="#3a3838" stroke="#2a2a2e" stroke-width="0.4"/>

    <!-- Right arm + fluke -->
    <path d="M20,42 Q28,46 32,50 L28,46 Q24,43 20,42"
      fill="#3a3838" stroke="#2a2a2e" stroke-width="0.8"/>
    <polygon points="32,50 35,47 28,44" fill="#3a3838" stroke="#2a2a2e" stroke-width="0.4"/>
  </g>

  <!-- Rust / patina -->
  <g opacity="0.12">
    <rect x="18" y="22" width="4" height="10" rx="1" fill="#5a3020"/>
    <rect x="14" y="40" width="6" height="4" rx="1" fill="#3a5040"/>
  </g>
</svg>