<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 80">
  <!-- Stacked wooden barrels — two upright on bottom, one on top.
       Isometric 2:1. Barrels are iso cylinders (ellipse top, rect body). -->

  <!-- ═══ BACK-LEFT BARREL (upright) ═══ -->
  <!-- Body — front face -->
  <rect x="8" y="36" width="28" height="34"
    fill="#3e3020" stroke="#2e2418" stroke-width="0.7"/>
  <!-- Body — right face -->
  <polygon points="36,36 46,31 46,65 36,70"
    fill="#2e2418" stroke="#241c12" stroke-width="0.5"/>
  <!-- Top — iso ellipse -->
  <ellipse cx="27" cy="33" rx="19" ry="6"
    fill="#4a3e2e" stroke="#2e2418" stroke-width="0.6"/>
  <!-- Iron bands -->
  <line x1="8" y1="44" x2="36" y2="44" stroke="#3a3838" stroke-width="1" opacity="0.35"/>
  <line x1="8" y1="60" x2="36" y2="60" stroke="#3a3838" stroke-width="1" opacity="0.35"/>
  <!-- Wood grain -->
  <g stroke="#2e2418" stroke-width="0.3" opacity="0.25">
    <line x1="18" y1="36" x2="18" y2="70"/>
    <line x1="28" y1="36" x2="28" y2="70"/>
  </g>

  <!-- ═══ BACK-RIGHT BARREL (upright) ═══ -->
  <!-- Body — front face -->
  <rect x="40" y="36" width="28" height="34"
    fill="#3a2c1e" stroke="#2e2418" stroke-width="0.7"/>
  <!-- Body — right face -->
  <polygon points="68,36 78,31 78,65 68,70"
    fill="#2a2018" stroke="#241c12" stroke-width="0.5"/>
  <!-- Top — iso ellipse -->
  <ellipse cx="59" cy="33" rx="19" ry="6"
    fill="#4a3a28" stroke="#2e2418" stroke-width="0.6"/>
  <!-- Iron bands -->
  <line x1="40" y1="44" x2="68" y2="44" stroke="#3a3838" stroke-width="1" opacity="0.35"/>
  <line x1="40" y1="60" x2="68" y2="60" stroke="#3a3838" stroke-width="1" opacity="0.35"/>
  <!-- Bung hole -->
  <ellipse cx="54" cy="50" rx="2.5" ry="1.5" fill="#1a1410" stroke="#2e2418" stroke-width="0.3"/>

  <!-- ═══ TOP BARREL (resting across the gap) ═══ -->
  <!-- Body — front face -->
  <rect x="18" y="6" width="28" height="28"
    fill="#44362a" stroke="#2e2418" stroke-width="0.7"/>
  <!-- Body — right face -->
  <polygon points="46,6 56,1 56,29 46,34"
    fill="#302820" stroke="#241c12" stroke-width="0.5"/>
  <!-- Top — iso ellipse -->
  <ellipse cx="37" cy="4" rx="19" ry="6"
    fill="#503e30" stroke="#2e2418" stroke-width="0.6"/>
  <!-- Iron bands -->
  <line x1="18" y1="14" x2="46" y2="14" stroke="#3a3838" stroke-width="1" opacity="0.35"/>
  <line x1="18" y1="26" x2="46" y2="26" stroke="#3a3838" stroke-width="1" opacity="0.35"/>

  <!-- Weathering stains -->
  <g opacity="0.1">
    <rect x="12" y="48" width="5" height="12" rx="1" fill="#5a3020"/>
    <rect x="62" y="42" width="4" height="10" rx="1" fill="#4a2818"/>
  </g>
</svg>