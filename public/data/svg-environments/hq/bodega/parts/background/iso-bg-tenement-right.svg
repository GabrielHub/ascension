<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 480">
  <!-- Right-facing tenement. Facade slope -0.5, side slope +0.5.
       Mirror of tenement-left. 5 floors, brick, fire escape.
       Front corner base at (80, 460). -->
  <defs>
    <linearGradient id="tr-brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d2c20"/>
      <stop offset="100%" stop-color="#2e2018"/>
    </linearGradient>
    <linearGradient id="tr-side" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#2e2018"/>
    </linearGradient>
  </defs>

  <!-- Side face (iso-left, lighter, behind facade) -->
  <polygon points="10,110 80,80 80,400 10,430"
    fill="url(#tr-side)" stroke="#2a1f18" stroke-width="1"/>

  <!-- Facade (iso-right, main visible face) -->
  <polygon points="80,80 240,0 240,320 80,400"
    fill="url(#tr-brick)" stroke="#2a1f18" stroke-width="1.5"/>

  <!-- Roof -->
  <polygon points="10,110 80,80 240,0 170,30"
    fill="#1a1818" stroke="#252525" stroke-width="1.5"/>

  <!-- Cornice — facade -->
  <polygon points="80,80 240,0 240,6 80,86"
    fill="#3a3838" stroke="#252525" stroke-width="0.5" opacity="0.6"/>

  <!-- Brick mortar lines (facade) -->
  <g transform="matrix(1, -0.5, 0, 1, 80, 80)"
     opacity="0.1" stroke="#2a1f18" stroke-width="0.4">
    <line x1="5" y1="40" x2="155" y2="40"/>
    <line x1="5" y1="80" x2="155" y2="80"/>
    <line x1="5" y1="120" x2="155" y2="120"/>
    <line x1="5" y1="160" x2="155" y2="160"/>
    <line x1="5" y1="200" x2="155" y2="200"/>
    <line x1="5" y1="240" x2="155" y2="240"/>
    <line x1="5" y1="280" x2="155" y2="280"/>
  </g>

  <!-- Facade windows (3 cols × 5 floors) -->
  <g transform="matrix(1, -0.5, 0, 1, 80, 80)"
     fill="#0a0908" stroke="#3a3838" stroke-width="0.6">
    <!-- Floor 5 (top, y=12) -->
    <rect x="15" y="12" width="20" height="26" rx="1"/>
    <rect x="65" y="12" width="20" height="26" rx="1"/>
    <rect x="115" y="12" width="20" height="26" rx="1"/>
    <!-- Floor 4 (y=72) -->
    <rect x="15" y="72" width="20" height="26" rx="1"/>
    <rect x="65" y="72" width="20" height="26" rx="1"/>
    <rect x="115" y="72" width="20" height="26" rx="1"/>
    <!-- Floor 3 (y=132) -->
    <rect x="15" y="132" width="20" height="26" rx="1"/>
    <rect x="65" y="132" width="20" height="26" rx="1"/>
    <rect x="115" y="132" width="20" height="26" rx="1"/>
    <!-- Floor 2 (y=192) -->
    <rect x="15" y="192" width="20" height="26" rx="1"/>
    <rect x="65" y="192" width="20" height="26" rx="1"/>
    <rect x="115" y="192" width="20" height="26" rx="1"/>
    <!-- Floor 1 (y=252) -->
    <rect x="15" y="252" width="20" height="26" rx="1"/>
    <rect x="65" y="252" width="20" height="26" rx="1"/>
    <rect x="115" y="252" width="20" height="26" rx="1"/>
  </g>

  <!-- Lit window highlights -->
  <g transform="matrix(1, -0.5, 0, 1, 80, 80)" opacity="0.2">
    <rect x="17" y="74" width="16" height="22" rx="1" fill="#c8a84c"/>
    <rect x="117" y="14" width="16" height="22" rx="1" fill="#8a7a50"/>
    <rect x="67" y="194" width="16" height="22" rx="1" fill="#c8a84c"/>
    <rect x="17" y="254" width="16" height="22" rx="1" fill="#9a8040"/>
  </g>

  <!-- Ground-floor storefront -->
  <g transform="matrix(1, -0.5, 0, 1, 80, 80)">
    <rect x="10" y="288" width="55" height="38" rx="1"
      fill="#1a1816" stroke="#3a3838" stroke-width="0.7" opacity="0.6"/>
    <rect x="80" y="288" width="55" height="38" rx="1"
      fill="#1a1816" stroke="#3a3838" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- Fire escape (facade) -->
  <g transform="matrix(1, -0.5, 0, 1, 80, 80)"
     stroke="#3a3838" stroke-width="0.8" fill="none" opacity="0.45">
    <line x1="40" y1="60" x2="90" y2="60"/>
    <line x1="40" y1="120" x2="90" y2="120"/>
    <line x1="40" y1="180" x2="90" y2="180"/>
    <line x1="40" y1="240" x2="90" y2="240"/>
    <line x1="40" y1="40" x2="40" y2="280"/>
    <line x1="90" y1="40" x2="90" y2="280"/>
    <polyline points="45,65 85,85 45,105 85,115"
      stroke-width="0.5" opacity="0.35"/>
    <polyline points="45,125 85,145 45,165 85,175"
      stroke-width="0.5" opacity="0.35"/>
    <!-- Ladder to ground -->
    <line x1="62" y1="240" x2="62" y2="320"/>
    <line x1="67" y1="240" x2="67" y2="320"/>
    <g stroke-width="0.4">
      <line x1="62" y1="255" x2="67" y2="255"/>
      <line x1="62" y1="270" x2="67" y2="270"/>
      <line x1="62" y1="285" x2="67" y2="285"/>
      <line x1="62" y1="300" x2="67" y2="300"/>
    </g>
  </g>

  <!-- Side face details -->
  <g transform="matrix(1, 0.5, 0, 1, 10, 110)" opacity="0.08" stroke="#2a1f18" stroke-width="0.4">
    <line x1="5" y1="40" x2="65" y2="40"/>
    <line x1="5" y1="100" x2="65" y2="100"/>
    <line x1="5" y1="160" x2="65" y2="160"/>
    <line x1="5" y1="220" x2="65" y2="220"/>
    <line x1="5" y1="280" x2="65" y2="280"/>
  </g>

  <!-- AC units on side -->
  <g transform="matrix(1, 0.5, 0, 1, 10, 110)" opacity="0.45">
    <rect x="15" y="90" width="28" height="18" rx="2"
      fill="#252525" stroke="#3a3838" stroke-width="0.5"/>
    <rect x="15" y="210" width="28" height="18" rx="2"
      fill="#252525" stroke="#3a3838" stroke-width="0.5"/>
  </g>

  <!-- Downspout (facade side) -->
  <g transform="matrix(1, -0.5, 0, 1, 80, 80)">
    <line x1="157" y1="5" x2="157" y2="320"
      stroke="#3a3838" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Water stain -->
  <g transform="matrix(1, -0.5, 0, 1, 80, 80)">
    <line x1="100" y1="0" x2="102" y2="320"
      stroke="#1a1612" stroke-width="3" opacity="0.08"/>
  </g>

  <!-- Rooftop details -->
  <g opacity="0.35">
    <rect x="140" y="8" width="16" height="22" rx="1" fill="#2a2828" stroke="#252525" stroke-width="0.5"/>
    <circle cx="50" cy="75" r="8" fill="none" stroke="#3a3838" stroke-width="0.8"/>
    <line x1="50" y1="75" x2="50" y2="67" stroke="#3a3838" stroke-width="0.6"/>
  </g>
</svg>
