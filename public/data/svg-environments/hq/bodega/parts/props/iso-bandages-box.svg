<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 28">
  <!-- Small open box of medical supplies / bandages. Floor-level detail
       for infirmary rooms. Reads as "medical" at small sizes. -->

  <!-- Box body (iso) -->
  <polygon points="6,14 18,20 30,14 18,8"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.5"/>
  <!-- Front face -->
  <polygon points="18,20 30,14 30,22 18,28"
    fill="#302818" stroke="#281e14" stroke-width="0.4"/>
  <!-- Left face -->
  <polygon points="6,14 18,20 18,28 6,22"
    fill="#342c1e" stroke="#281e14" stroke-width="0.4"/>

  <!-- Red cross on front face -->
  <line x1="22" y1="16" x2="22" y2="20" stroke="rgba(180,60,60,0.4)" stroke-width="1.2"/>
  <line x1="20" y1="18" x2="24" y2="18" stroke="rgba(180,60,60,0.4)" stroke-width="1.2"/>

  <!-- Bandage rolls peeking out of top -->
  <ellipse cx="14" cy="12" rx="3" ry="1.5" fill="#c8c4b8" opacity="0.35"/>
  <ellipse cx="20" cy="11" rx="2.5" ry="1.5" fill="#c8c4b8" opacity="0.3"/>

  <!-- Shadow -->
  <ellipse cx="18" cy="27" rx="10" ry="1.5" fill="rgba(0,0,0,0.08)"/>
</svg>
