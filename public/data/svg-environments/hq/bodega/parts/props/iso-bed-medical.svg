<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 10 88 76">
  <!-- Makeshift isometric recovery cot. Canonical 2:1 planes, tight contact only. -->

  <!-- Caster contact occlusion -->
  <ellipse cx="18" cy="75" rx="4" ry="1.2" fill="rgba(0,0,0,0.16)"/>
  <ellipse cx="78" cy="75" rx="4" ry="1.2" fill="rgba(0,0,0,0.14)"/>
  <ellipse cx="48" cy="84" rx="4.5" ry="1.3" fill="rgba(0,0,0,0.16)"/>

  <!-- Rear legs, partly hidden by the frame -->
  <line x1="22" y1="55" x2="22" y2="69" stroke="#56565e" stroke-width="1.6"/>
  <line x1="74" y1="55" x2="74" y2="69" stroke="#4a4a52" stroke-width="1.6"/>

  <!-- Steel support tray -->
  <polygon points="48,38 80,54 48,70 16,54"
    fill="#484850" stroke="#2d2d34" stroke-width="0.9"/>
  <polygon points="16,54 48,70 48,75 16,59"
    fill="#34343c" stroke="#292930" stroke-width="0.7"/>
  <polygon points="48,70 80,54 80,59 48,75"
    fill="#3d3d45" stroke="#292930" stroke-width="0.7"/>

  <!-- Near legs and casters -->
  <line x1="18" y1="59" x2="18" y2="74" stroke="#5a5a62" stroke-width="1.7"/>
  <ellipse cx="18" cy="75" rx="2.4" ry="2.1" fill="#3b3b43"/>
  <line x1="78" y1="59" x2="78" y2="74" stroke="#4d4d55" stroke-width="1.7"/>
  <ellipse cx="78" cy="75" rx="2.4" ry="2.1" fill="#34343c"/>
  <line x1="48" y1="75" x2="48" y2="83" stroke="#505058" stroke-width="1.8"/>
  <ellipse cx="48" cy="84" rx="2.5" ry="2.2" fill="#36363e"/>

  <!-- Mattress and sheet -->
  <polygon points="48,25 76,39 48,53 20,39"
    fill="#d8d4ca" stroke="#b8b3a8" stroke-width="0.8"/>
  <polygon points="20,39 48,53 48,60 20,46"
    fill="#beb9af" stroke="#a8a399" stroke-width="0.6"/>
  <polygon points="48,53 76,39 76,46 48,60"
    fill="#cbc6bc" stroke="#a8a399" stroke-width="0.6"/>

  <!-- Sheet crease and thin blanket edge, both locked to the isometric axes -->
  <line x1="32" y1="35" x2="48" y2="43" stroke="#c2bdb3" stroke-width="0.7" opacity="0.7"/>
  <line x1="48" y1="43" x2="64" y2="35" stroke="#c2bdb3" stroke-width="0.7" opacity="0.5"/>
  <polygon points="22,42 48,55 48,58 22,45"
    fill="#aaa9a2" opacity="0.45"/>

  <!-- Pillow at the head end -->
  <polygon points="58,36 68,41 78,36 68,31"
    fill="#e6e1d7" stroke="#c7c1b7" stroke-width="0.6"/>
  <polygon points="68,41 78,36 78,38 68,43"
    fill="#d4cec4" stroke="#beb8ae" stroke-width="0.4"/>

  <!-- Low side rails: vertical uprights with iso-axis crossbars -->
  <line x1="28" y1="36" x2="28" y2="51" stroke="#585861" stroke-width="1.8"/>
  <line x1="40" y1="42" x2="40" y2="57" stroke="#52525b" stroke-width="1.8"/>
  <line x1="28" y1="36" x2="40" y2="42" stroke="#686871" stroke-width="1.2"/>
  <line x1="28" y1="44" x2="40" y2="50" stroke="#575760" stroke-width="1"/>

  <line x1="56" y1="28" x2="56" y2="40" stroke="#585861" stroke-width="1.8"/>
  <line x1="68" y1="34" x2="68" y2="46" stroke="#52525b" stroke-width="1.8"/>
  <line x1="56" y1="28" x2="68" y2="34" stroke="#686871" stroke-width="1.2"/>

  <!-- Simple foot bar, short enough not to dominate the silhouette -->
  <line x1="20" y1="39" x2="20" y2="52" stroke="#5d5d66" stroke-width="1.8"/>
  <line x1="32" y1="45" x2="32" y2="58" stroke="#54545d" stroke-width="1.8"/>
  <line x1="20" y1="39" x2="32" y2="45" stroke="#696972" stroke-width="1.2"/>

  <!-- Tape marker on the frame: medical read without turning the bed into a hospital icon. -->
  <polygon points="61,57 66,54.5 66,56.5 61,59"
    fill="#c85b48" opacity="0.75"/>
  <polygon points="62.5,54.8 64.5,53.8 64.5,59.8 62.5,60.8"
    fill="#c85b48" opacity="0.75"/>
</svg>
