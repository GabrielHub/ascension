<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 20">
  <!-- Ceiling fan. Works sometimes. Seen from below in isometric view.
       Four blades in iso perspective, hub in center, pull chain.
       Cel shading on hub and canopy; blades use light/shadow pairs. -->

  <!-- Fan canopy (ceiling mount) — cel-shaded small box -->
  <!-- Canopy top -->
  <ellipse cx="24" cy="3" rx="4" ry="1.5" fill="#3a3838" stroke="#302e2e" stroke-width="0.5"/>
  <!-- Canopy left side -->
  <path d="M20,3 Q20,5 20,5 L24,6.5 L24,4.5 Z" fill="#333030" stroke="#2a2828" stroke-width="0.3"/>
  <!-- Canopy right side -->
  <path d="M28,3 Q28,5 28,5 L24,6.5 L24,4.5 Z" fill="#2a2828" stroke="#222020" stroke-width="0.3"/>
  <!-- Canopy highlight -->
  <ellipse cx="24" cy="3" rx="4" ry="1.5" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.3"/>

  <!-- Down rod -->
  <line x1="24" y1="4.5" x2="24" y2="8" stroke="#3a3838" stroke-width="1.2"/>
  <line x1="24.5" y1="4.5" x2="24.5" y2="8" stroke="rgba(255,255,255,0.04)" stroke-width="0.3"/>

  <!-- Hub (motor housing, iso ellipse) — cel-shaded -->
  <ellipse cx="24" cy="9" rx="5" ry="2.5" fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <!-- Hub left shadow -->
  <path d="M19,9 A5,2.5 0 0,0 24,11.5 L24,9 Z" fill="#2a2828" opacity="0.5"/>
  <!-- Hub highlight -->
  <ellipse cx="24" cy="8.5" rx="4" ry="2" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.3"/>

  <!-- Blades (four, isometric foreshortening) -->
  <!-- Blade right — lit side, lightest -->
  <polygon points="29,9 44,12 43,14 28,10"
    fill="#3a3020" stroke="#302818" stroke-width="0.4" opacity="0.85"/>
  <!-- Blade right underside hint -->
  <polygon points="29,9.5 43,12.5 43,14 28,10.5"
    fill="#2c2418" opacity="0.3"/>

  <!-- Blade left — medium shade -->
  <polygon points="19,9 4,12 5,14 20,10"
    fill="#302818" stroke="#2c2418" stroke-width="0.4" opacity="0.85"/>
  <!-- Blade left underside hint -->
  <polygon points="19,9.5 5,12.5 5,14 20,10.5"
    fill="#241c12" opacity="0.3"/>

  <!-- Blade front (foreshortened, shorter) — medium-dark -->
  <polygon points="24,11 28,16 26,17 22,17 20,16 24,11"
    fill="#2c2418" stroke="#241c12" stroke-width="0.4" opacity="0.8"/>

  <!-- Blade back (foreshortened, partially hidden by hub) — darkest -->
  <polygon points="24,7 28,3 26,2 22,2 20,3 24,7"
    fill="#241c12" stroke="#1c1408" stroke-width="0.4" opacity="0.7"/>

  <!-- Hub center cap -->
  <ellipse cx="24" cy="9" rx="2.5" ry="1.2" fill="#3a3838" stroke="#2a2a2a" stroke-width="0.4"/>
  <!-- Cap highlight -->
  <ellipse cx="24" cy="8.8" rx="1.5" ry="0.7" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.3"/>

  <!-- Pull chain (dangles from hub) -->
  <line x1="27" y1="11" x2="28" y2="16" stroke="#4a4a52" stroke-width="0.5"/>
  <circle cx="28" cy="17" r="0.8" fill="#4a4a52"/>
</svg>
