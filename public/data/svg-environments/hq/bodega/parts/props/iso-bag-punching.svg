<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 6 32 78">
  <!-- Isometric punching bag. For training rooms. -->

  <!-- Ceiling mount bracket -->
  <rect x="44" y="8" width="8" height="6" fill="#2a2828" rx="1"/>
  <!-- Chain -->
  <line x1="48" y1="14" x2="48" y2="28" stroke="#3a3838" stroke-width="1.5"
    stroke-dasharray="2,2"/>

  <!-- Bag top cap -->
  <ellipse cx="48" cy="30" rx="12" ry="4" fill="#3a2820"/>
  <!-- Bag body left -->
  <path d="M36,30 Q34,50 38,68 L48,72 L48,30 Z"
    fill="#4a3428" stroke="#3a2820" stroke-width="0.5"/>
  <!-- Bag body right -->
  <path d="M60,30 Q62,50 58,68 L48,72 L48,30 Z"
    fill="#3a2820" stroke="#2e2018" stroke-width="0.5"/>
  <!-- Bag bottom cap -->
  <ellipse cx="48" cy="70" rx="10" ry="3.5" fill="#2e2018"/>

  <!-- Bag highlight strip -->
  <line x1="42" y1="34" x2="42" y2="66" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Stitching line -->
  <line x1="48" y1="32" x2="48" y2="68" stroke="#2e2018" stroke-width="0.5"
    stroke-dasharray="3,3"/>

  <!-- Shadow -->
  <ellipse cx="48" cy="80" rx="12" ry="4" fill="rgba(0,0,0,0.15)"/>
</svg>
