<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 96">
  <!-- Isometric deli display case. Glass-fronted counter with visible food.
       Hero piece for The Counter. Long, low, with angled glass top
       and food silhouettes inside. Scratched but functional. -->

  <!-- Shadow -->
  <ellipse cx="52" cy="90" rx="40" ry="4" fill="rgba(0,0,0,0.1)"/>

  <!-- Case body base — iso parallelogram -->
  <!-- Top surface (behind glass slope) — lightest face -->
  <polygon points="25,12 105,52 80,64 0,24"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.7"/>

  <!-- Front/left face (main visible) — medium shade -->
  <polygon points="0,24 80,64 80,84 0,44"
    fill="#2c2418" stroke="#201810" stroke-width="0.6"/>

  <!-- Right end face — darkest shade -->
  <polygon points="105,52 80,64 80,84 105,72"
    fill="#221a10" stroke="#1a1408" stroke-width="0.6"/>

  <!-- Glass display front (angled, translucent) -->
  <polygon points="0,24 80,64 80,54 0,14"
    fill="rgba(60,80,90,0.12)" stroke="rgba(80,100,110,0.2)" stroke-width="0.5"/>
  <!-- Glass reflection streaks -->
  <line x1="10" y1="18" x2="40" y2="33" stroke="rgba(255,255,255,0.09)" stroke-width="0.6"/>
  <line x1="50" y1="38" x2="70" y2="48" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>

  <!-- Glass scratch marks (this case has seen better days) -->
  <line x1="25" y1="24" x2="30" y2="27" stroke="rgba(255,255,255,0.04)" stroke-width="0.3"/>
  <line x1="55" y1="40" x2="62" y2="44" stroke="rgba(255,255,255,0.03)" stroke-width="0.3"/>

  <!-- Food inside case (visible through glass, muted food silhouettes) -->
  <!-- Sandwich tray (long, light-colored) -->
  <polygon points="15,30 40,42 36,44 11,32"
    fill="rgba(180,150,100,0.12)" stroke="rgba(160,130,80,0.08)" stroke-width="0.3"/>
  <!-- Individual sandwiches -->
  <rect x="16" y="30" width="6" height="3" rx="0.5" fill="rgba(180,150,100,0.15)" transform="skewY(26.5)"/>
  <rect x="24" y="34" width="6" height="3" rx="0.5" fill="rgba(170,140,90,0.12)" transform="skewY(26.5)"/>

  <!-- Salad/sides tray -->
  <polygon points="45,42 65,52 62,53 42,43"
    fill="rgba(80,130,80,0.1)" stroke="rgba(60,110,60,0.08)" stroke-width="0.3"/>

  <!-- Meat/cold cuts area -->
  <polygon points="28,36 48,46 45,47 25,37"
    fill="rgba(160,80,70,0.1)" stroke="rgba(140,60,50,0.06)" stroke-width="0.3"/>

  <!-- Panel grooves on front face -->
  <line x1="20" y1="34" x2="20" y2="54" stroke="#201810" stroke-width="0.5"/>
  <line x1="40" y1="44" x2="40" y2="64" stroke="#201810" stroke-width="0.5"/>
  <line x1="60" y1="54" x2="60" y2="74" stroke="#201810" stroke-width="0.5"/>

  <!-- Top rail (stainless steel strip along glass edge) -->
  <line x1="0" y1="14" x2="80" y2="54" stroke="#4a4a52" stroke-width="1"/>
  <line x1="0" y1="14" x2="25" y2="12" stroke="#4a4a52" stroke-width="0.8"/>

  <!-- Top edge highlights (both iso axes) -->
  <line x1="25" y1="12" x2="105" y2="52" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="25" y1="12" x2="0" y2="24" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
</svg>
