<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56">
  <!-- Isometric medical tray table. Proper iso parallelogram surface
       with wheeled legs. 2:1 iso perspective. -->

  <!-- Legs (angled for iso) -->
  <line x1="12" y1="48" x2="15" y2="28" stroke="#4a4a52" stroke-width="1.2"/>
  <line x1="36" y1="48" x2="33" y2="28" stroke="#4a4a52" stroke-width="1.2"/>

  <!-- Crossbar (iso-aligned) -->
  <line x1="13" y1="40" x2="35" y2="40" stroke="#3a3a42" stroke-width="0.8"/>

  <!-- Wheels -->
  <circle cx="12" cy="49" r="1.5" fill="#3a3a42"/>
  <circle cx="36" cy="49" r="1.5" fill="#3a3a42"/>

  <!-- Tray surface (iso parallelogram) -->
  <polygon points="24,18 44,28 24,38 4,28"
    fill="#4a4a52" stroke="#3a3a42" stroke-width="0.5"/>
  <!-- Tray rim (thin edge) -->
  <polygon points="4,28 24,38 24,40 4,30"
    fill="#3a3a42"/>
  <polygon points="44,28 24,38 24,40 44,30"
    fill="#42424a"/>

  <!-- Tray highlight -->
  <line x1="4" y1="28" x2="24" y2="18" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>

  <!-- Items on tray (iso-aligned) -->
  <!-- Bottle -->
  <polygon points="12,24 18,27 18,22 12,19"
    fill="#2a3a2a" opacity="0.6"/>
  <!-- Bandage roll -->
  <ellipse cx="28" cy="25" rx="3" ry="2" fill="#c8c4b8" opacity="0.3"
    transform="rotate(10, 28, 25)"/>
  <!-- Scissors -->
  <line x1="34" y1="23" x2="38" y2="27" stroke="#5a5a62" stroke-width="0.8"/>
  <line x1="38" y1="23" x2="34" y2="27" stroke="#5a5a62" stroke-width="0.8"/>

  <!-- Shadow -->
  <ellipse cx="24" cy="52" rx="14" ry="2.5" fill="rgba(0,0,0,0.08)"/>
</svg>
