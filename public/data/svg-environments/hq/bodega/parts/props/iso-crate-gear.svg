<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 38">
  <!-- Isometric gear/equipment crate. Heavier than a cardboard box.
       Dark military-surplus vibe. Metal clasps. Dungeon kit lives here.
       Stronger face contrast for cel shading. -->

  <!-- Shadow -->
  <ellipse cx="20" cy="31" rx="10" ry="2.5" fill="rgba(0,0,0,0.1)"/>

  <!-- Crate top — lightest face -->
  <polygon points="8,10 20,16 32,10 20,4"
    fill="#303828" stroke="#263020" stroke-width="0.7"/>
  <!-- Crate left face — medium shade -->
  <polygon points="8,10 20,16 20,28 8,22"
    fill="#263020" stroke="#1e2818" stroke-width="0.6"/>
  <!-- Crate right face — darkest shade -->
  <polygon points="20,16 32,10 32,22 20,28"
    fill="#1e2818" stroke="#162010" stroke-width="0.6"/>

  <!-- Top edge highlights -->
  <line x1="8" y1="10" x2="20" y2="4" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
  <line x1="20" y1="4" x2="32" y2="10" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>

  <!-- Reinforcement strips (metal bands) -->
  <line x1="8" y1="14" x2="20" y2="20" stroke="#3a3a38" stroke-width="0.8"/>
  <line x1="20" y1="20" x2="32" y2="14" stroke="#3a3838" stroke-width="0.7"/>
  <!-- Vertical reinforcement on left face -->
  <line x1="14" y1="12" x2="14" y2="26" stroke="#2c3428" stroke-width="0.6"/>

  <!-- Metal clasp on left face -->
  <rect x="12" y="18" width="4" height="2" rx="0.3" fill="#8a7040" opacity="0.4"/>
  <!-- Metal clasp on right face -->
  <rect x="24" y="14" width="4" height="2" rx="0.3" fill="#8a7040" opacity="0.35"/>

  <!-- Stencil mark on left face (implied label) -->
  <rect x="9" y="14" width="4" height="3" rx="0.2" fill="rgba(224,221,214,0.07)"/>
</svg>
