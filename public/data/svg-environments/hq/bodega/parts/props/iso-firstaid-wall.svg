<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Wall-mounted first-aid kit. Small white box with red cross.
       Proper iso box with 3 cel-shaded faces. -->

  <!-- Shadow -->
  <ellipse cx="12" cy="20" rx="8" ry="1.5" fill="rgba(0,0,0,0.1)"/>

  <!-- Wall shadow behind box -->
  <rect x="5" y="7" width="14" height="10" rx="0.5" fill="rgba(0,0,0,0.08)"/>

  <!-- Box top face — lightest (off-white, warm) -->
  <polygon points="5,6 12,9.5 19,6 12,2.5"
    fill="#c8c4b8" stroke="#b0aca0" stroke-width="0.6"/>
  <!-- Box left face — medium shade -->
  <polygon points="5,6 12,9.5 12,17.5 5,14"
    fill="#b0aca0" stroke="#989488" stroke-width="0.5"/>
  <!-- Box right face — darkest shade -->
  <polygon points="12,9.5 19,6 19,14 12,17.5"
    fill="#989488" stroke="#888478" stroke-width="0.5"/>

  <!-- Top edge highlights -->
  <line x1="5" y1="6" x2="12" y2="2.5" stroke="rgba(255,255,255,0.08)" stroke-width="0.4"/>
  <line x1="12" y1="2.5" x2="19" y2="6" stroke="rgba(255,255,255,0.08)" stroke-width="0.4"/>

  <!-- Red cross (on left face) -->
  <line x1="6.5" y1="10.5" x2="10.5" y2="12.5" stroke="rgba(200,60,60,0.65)" stroke-width="1.8"/>
  <line x1="8.5" y1="9" x2="8.5" y2="14" stroke="rgba(200,60,60,0.65)" stroke-width="1.8"/>

  <!-- Red cross (on right face, darker) -->
  <line x1="13.5" y1="10" x2="17.5" y2="8" stroke="rgba(180,50,50,0.45)" stroke-width="1.5"/>
  <line x1="15.5" y1="7.5" x2="15.5" y2="12.5" stroke="rgba(180,50,50,0.45)" stroke-width="1.5"/>

  <!-- Latch (on front edge) -->
  <rect x="10.5" y="14" width="3" height="1.2" rx="0.2" fill="#8a7040" opacity="0.45"/>

  <!-- Hinge line on left face -->
  <line x1="5.5" y1="11" x2="11.5" y2="14" stroke="#b0aca0" stroke-width="0.3" opacity="0.5"/>

  <!-- Mounting screws -->
  <circle cx="7" cy="7.5" r="0.6" fill="#8a7040" opacity="0.35"/>
  <circle cx="17" cy="7.5" r="0.6" fill="#8a7040" opacity="0.35"/>
</svg>
