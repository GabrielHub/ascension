<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 10 60 78">
  <!-- Isometric medical supply cabinet. Glass-front, cross symbol. -->

  <!-- Cabinet top -->
  <polygon points="22,26 48,38 74,26 48,14"
    fill="#3a3838" stroke="#252525" stroke-width="0.8"/>
  <!-- Cabinet front face -->
  <polygon points="48,38 74,26 74,72 48,84"
    fill="#3a3838" stroke="#252525" stroke-width="1"/>
  <!-- Cabinet left face -->
  <polygon points="22,26 48,38 48,84 22,72"
    fill="#333030" stroke="#252525" stroke-width="0.8"/>

  <!-- Glass panel on front -->
  <polygon points="50,42 72,30 72,68 50,80"
    fill="rgba(26,36,64,0.25)" stroke="#3a3838" stroke-width="0.5"/>
  <!-- Shelf line -->
  <line x1="50" y1="56" x2="72" y2="44" stroke="#3a3838" stroke-width="0.4"/>
  <!-- Glass divider -->
  <line x1="61" y1="36" x2="61" y2="74" stroke="#3a3838" stroke-width="0.4"/>

  <!-- Medical cross -->
  <polygon points="59,46 63,44 63,54 59,56"
    fill="#d4541e" opacity="0.5"/>
  <polygon points="56,49 66,44 66,47 56,52"
    fill="#d4541e" opacity="0.5"/>

  <!-- Supplies on shelves (small shapes) -->
  <polygon points="52,60 58,57 58,64 52,67"
    fill="#c8c4b8" opacity="0.25"/>
  <polygon points="64,55 70,52 70,60 64,63"
    fill="#1a3028" opacity="0.3"/>
</svg>