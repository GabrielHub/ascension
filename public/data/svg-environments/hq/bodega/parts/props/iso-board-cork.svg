<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Isometric corkboard. Wall-mounted board with pinned notes. For staffing rooms. -->

  <!-- Board backing -->
  <rect x="18" y="18" width="60" height="44" fill="#3a3020" rx="2"
    stroke="#2c2418" stroke-width="1"/>

  <!-- Cork surface (inner) -->
  <rect x="22" y="22" width="52" height="36" fill="#4a3c28" rx="1"/>

  <!-- Pinned notes / cards -->
  <rect x="26" y="26" width="14" height="10" fill="#3a4838" rx="0.5"
    transform="rotate(-3, 33, 31)"/>
  <rect x="44" y="24" width="12" height="14" fill="#483838" rx="0.5"
    transform="rotate(2, 50, 31)"/>
  <rect x="60" y="28" width="10" height="8" fill="#384048" rx="0.5"
    transform="rotate(-5, 65, 32)"/>
  <rect x="28" y="40" width="16" height="10" fill="#484038" rx="0.5"
    transform="rotate(1, 36, 45)"/>
  <rect x="50" y="42" width="12" height="12" fill="#3c4438" rx="0.5"/>

  <!-- Pin dots -->
  <circle cx="33" cy="28" r="1.5" fill="#c8a84c" opacity="0.5"/>
  <circle cx="50" cy="26" r="1.5" fill="#c8a84c" opacity="0.4"/>
  <circle cx="65" cy="30" r="1.5" fill="#c8a84c" opacity="0.45"/>
  <circle cx="36" cy="42" r="1.5" fill="#c8a84c" opacity="0.4"/>
  <circle cx="56" cy="44" r="1.5" fill="#c8a84c" opacity="0.5"/>

  <!-- String connecting some pins -->
  <line x1="33" y1="28" x2="50" y2="26" stroke="rgba(200,168,76,0.15)" stroke-width="0.4"/>
  <line x1="50" y1="26" x2="65" y2="30" stroke="rgba(200,168,76,0.15)" stroke-width="0.4"/>

  <!-- Frame highlight -->
  <line x1="18" y1="18" x2="78" y2="18" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

  <!-- Shadow beneath -->
  <ellipse cx="48" cy="68" rx="24" ry="3" fill="rgba(0,0,0,0.08)"/>
</svg>
