<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 36">
  <!-- Isometric boombox/radio. Proper iso box with speaker details.
       Small floor-level detail prop. 2:1 iso perspective. -->

  <!-- Body (iso box) -->
  <!-- Top surface -->
  <polygon points="26,6 46,16 26,26 6,16"
    fill="#1e1e26" stroke="#2a2a32" stroke-width="0.5"/>
  <!-- Left face -->
  <polygon points="6,16 26,26 26,34 6,24"
    fill="#16161e" stroke="#222230" stroke-width="0.4"/>
  <!-- Right face -->
  <polygon points="46,16 26,26 26,34 46,24"
    fill="#1a1a22" stroke="#222230" stroke-width="0.4"/>

  <!-- Speaker grilles on left face (circles projected as ellipses) -->
  <ellipse cx="12" cy="19" rx="3" ry="2.5" fill="#12121a" stroke="#2a2a32" stroke-width="0.3"/>
  <ellipse cx="20" cy="23" rx="3" ry="2.5" fill="#12121a" stroke="#2a2a32" stroke-width="0.3"/>

  <!-- Display/tuner on top surface -->
  <polygon points="18,10 32,16 28,18 14,12"
    fill="#222830" stroke="#2a2a32" stroke-width="0.3"/>
  <!-- Display glow -->
  <polygon points="20,11 30,16 27,17 17,12"
    fill="rgba(200,168,76,0.1)"/>

  <!-- Knobs on top -->
  <circle cx="36" cy="14" r="1.2" fill="#2a2a32"/>
  <circle cx="40" cy="16" r="1.2" fill="#2a2a32"/>

  <!-- Antenna -->
  <line x1="42" y1="14" x2="48" y2="4" stroke="#3a3a42" stroke-width="0.6"/>
  <circle cx="48" cy="4" r="0.8" fill="#c8a84c" opacity="0.4"/>

  <!-- Top highlight -->
  <line x1="6" y1="16" x2="26" y2="6" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
</svg>
