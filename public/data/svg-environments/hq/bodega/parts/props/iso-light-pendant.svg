<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Isometric pendant light fixture.
       Hangs from ceiling, warm gold glow. -->

  <!-- Hanging wire -->
  <line x1="48" y1="8" x2="48" y2="32" stroke="#3a3838" stroke-width="0.8"/>

  <!-- Shade (cone/trapezoid in iso) -->
  <polygon points="36,32 60,32 66,44 30,44"
    fill="#2c2218" stroke="#231e18" stroke-width="0.6"/>
  <!-- Shade bottom rim -->
  <ellipse cx="48" cy="44" rx="18" ry="5" fill="#231e18" stroke="#2c2218" stroke-width="0.4"/>

  <!-- Bulb glow -->
  <ellipse cx="48" cy="42" rx="8" ry="3" fill="#c8a84c" opacity="0.5"/>

  <!-- Light cone (downward glow) -->
  <polygon points="30,44 66,44 80,80 16,80"
    fill="rgba(200,168,76,0.06)"/>

  <!-- Warm circle on floor below -->
  <ellipse cx="48" cy="82" rx="22" ry="6" fill="rgba(200,168,76,0.04)"/>
</svg>