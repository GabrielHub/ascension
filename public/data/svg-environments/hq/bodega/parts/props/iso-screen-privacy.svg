<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 80">
  <!-- Isometric privacy screen / folding divider. Medical or office use. -->

  <!-- Panel 1 (left, angled back) -->
  <rect x="6" y="16" width="22" height="52" rx="1"
    fill="#2c3028" stroke="#242820" stroke-width="0.5"
    transform="skewY(-2)"/>

  <!-- Panel 2 (center) -->
  <rect x="26" y="14" width="22" height="54" rx="1"
    fill="#303428" stroke="#282c22" stroke-width="0.5"/>

  <!-- Panel 3 (right, angled forward) -->
  <rect x="46" y="16" width="22" height="52" rx="1"
    fill="#343830" stroke="#2c3028" stroke-width="0.5"
    transform="skewY(2)"/>

  <!-- Fabric texture lines on center panel -->
  <line x1="30" y1="20" x2="30" y2="62" stroke="rgba(255,255,255,0.02)" stroke-width="0.4"/>
  <line x1="36" y1="20" x2="36" y2="62" stroke="rgba(255,255,255,0.02)" stroke-width="0.4"/>
  <line x1="42" y1="20" x2="42" y2="62" stroke="rgba(255,255,255,0.02)" stroke-width="0.4"/>

  <!-- Hinge dots -->
  <circle cx="27" cy="24" r="1" fill="#4a4a42"/>
  <circle cx="27" cy="56" r="1" fill="#4a4a42"/>
  <circle cx="47" cy="24" r="1" fill="#4a4a42"/>
  <circle cx="47" cy="56" r="1" fill="#4a4a42"/>

  <!-- Top edge highlight -->
  <line x1="6" y1="14" x2="68" y2="14" stroke="rgba(255,255,255,0.04)" stroke-width="0.4"/>

  <!-- Shadow -->
  <ellipse cx="37" cy="72" rx="28" ry="3" fill="rgba(0,0,0,0.08)"/>
</svg>
