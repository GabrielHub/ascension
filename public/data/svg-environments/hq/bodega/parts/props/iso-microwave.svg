<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 36">
  <!-- Isometric microwave. Grubby, shared by everyone, cleaned by nobody.
       Compact iso box with visible door window and buttons. -->

  <!-- Shadow -->
  <ellipse cx="22" cy="31" rx="11" ry="2.5" fill="rgba(0,0,0,0.1)"/>

  <!-- Body top — lightest face -->
  <polygon points="10,10 22,16 34,10 22,4"
    fill="#333038" stroke="#28262e" stroke-width="0.7"/>
  <!-- Body left face — medium shade -->
  <polygon points="10,10 22,16 22,28 10,22"
    fill="#28262e" stroke="#1e1c24" stroke-width="0.6"/>
  <!-- Body right face — darkest shade -->
  <polygon points="22,16 34,10 34,22 22,28"
    fill="#1e1c24" stroke="#16141c" stroke-width="0.6"/>

  <!-- Top edge highlights -->
  <line x1="10" y1="10" x2="22" y2="4" stroke="rgba(255,255,255,0.07)" stroke-width="0.4"/>
  <line x1="22" y1="4" x2="34" y2="10" stroke="rgba(255,255,255,0.07)" stroke-width="0.4"/>

  <!-- Door window (on left face, slightly inset) -->
  <polygon points="12,12 20,16 20,24 12,20"
    fill="#0c0e16" stroke="#18181e" stroke-width="0.5"/>
  <!-- Window reflection -->
  <line x1="13" y1="13" x2="16" y2="14.5" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <line x1="14" y1="17" x2="15" y2="17.5" stroke="rgba(255,255,255,0.04)" stroke-width="0.3"/>

  <!-- Grid dots in window (microwave plate hint) -->
  <circle cx="16" cy="17" r="0.5" fill="rgba(255,255,255,0.05)"/>
  <circle cx="16" cy="19" r="0.5" fill="rgba(255,255,255,0.04)"/>

  <!-- Control panel (right face, button strip) -->
  <rect x="26" y="12" width="4" height="2" rx="0.3" fill="#141218"/>
  <!-- Timer display (tiny green glow) -->
  <rect x="25" y="12" width="5" height="2" rx="0.3" fill="rgba(100,180,120,0.1)"/>
  <!-- Buttons -->
  <circle cx="27" cy="17" r="0.8" fill="#3a3838" stroke="#2a2a30" stroke-width="0.3"/>
  <circle cx="30" cy="16" r="0.8" fill="#3a3838" stroke="#2a2a30" stroke-width="0.3"/>
  <circle cx="27" cy="20" r="0.8" fill="#3a3838" stroke="#2a2a30" stroke-width="0.3"/>
  <circle cx="30" cy="19" r="0.8" fill="#3a3838" stroke="#2a2a30" stroke-width="0.3"/>

  <!-- Door handle (horizontal bar on left face) -->
  <line x1="12" y1="22" x2="20" y2="26" stroke="#3a3a42" stroke-width="1"/>

  <!-- Splatter stain (nobody cleans it) -->
  <circle cx="15" cy="18" r="1.5" fill="rgba(60,30,10,0.12)"/>
</svg>
