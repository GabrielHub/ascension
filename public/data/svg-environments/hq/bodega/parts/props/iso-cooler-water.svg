<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 72">
  <!-- Isometric water cooler. Proper iso box base + cylindrical jug.
       2:1 iso perspective matching tile grid. -->

  <!-- Base cabinet (iso box) -->
  <!-- Top -->
  <polygon points="22,38 38,46 22,54 6,46"
    fill="#303038" stroke="#282830" stroke-width="0.5"/>
  <!-- Left face -->
  <polygon points="6,46 22,54 22,68 6,60"
    fill="#2a2a32" stroke="#222230" stroke-width="0.5"/>
  <!-- Right face -->
  <polygon points="38,46 22,54 22,68 38,60"
    fill="#282830" stroke="#222230" stroke-width="0.5"/>
  <!-- Cabinet door line -->
  <line x1="14" y1="50" x2="14" y2="60" stroke="#1e1e28" stroke-width="0.4"/>

  <!-- Body column (iso box, narrower) -->
  <!-- Top -->
  <polygon points="22,24 35,31 22,38 9,31"
    fill="#333038" stroke="#2a2830" stroke-width="0.4"/>
  <!-- Left face -->
  <polygon points="9,31 22,38 22,46 9,39"
    fill="#303038" stroke="#282830" stroke-width="0.4"/>
  <!-- Right face -->
  <polygon points="35,31 22,38 22,46 35,39"
    fill="#2a2830" stroke="#262830" stroke-width="0.4"/>

  <!-- Water jug (iso cylinder on top) -->
  <ellipse cx="22" cy="20" rx="8" ry="4" fill="#384858" stroke="#304050" stroke-width="0.4"/>
  <!-- Jug body -->
  <polygon points="14,20 14,10 30,10 30,20"
    fill="#3a5068" opacity="0.5"/>
  <ellipse cx="22" cy="10" rx="8" ry="4" fill="#3a5068" opacity="0.55" stroke="#304050" stroke-width="0.3"/>
  <!-- Neck -->
  <rect x="18" y="4" width="8" height="6" rx="1.5" fill="#3a5068" opacity="0.45"/>
  <!-- Water level highlight -->
  <polygon points="16,14" fill="none"/>
  <rect x="15" y="13" width="14" height="5" rx="1" fill="rgba(100,160,200,0.08)"/>

  <!-- Taps (iso-aligned small blocks) -->
  <polygon points="6,35 10,37 10,39 6,37"
    fill="#c8a84c" opacity="0.3"/>
  <polygon points="34,37 38,35 38,37 34,39"
    fill="#4a6a8a" opacity="0.3"/>

  <!-- Drip tray -->
  <polygon points="8,42 22,49 22,50 8,43"
    fill="#222230" opacity="0.6"/>

  <!-- Shadow -->
  <ellipse cx="22" cy="70" rx="14" ry="2.5" fill="rgba(0,0,0,0.08)"/>
</svg>
