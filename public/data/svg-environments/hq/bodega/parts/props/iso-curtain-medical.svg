<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96">
  <!-- Isometric medical curtain on a ceiling track. Hangs from top,
       partially drawn, with visible fabric folds. More readable than
       a folding screen at small sizes. -->

  <!-- Ceiling rail -->
  <line x1="8" y1="6" x2="56" y2="6" stroke="#4a4a52" stroke-width="1.5"/>
  <!-- Rail end caps -->
  <circle cx="8" cy="6" r="1.5" fill="#3a3a42"/>
  <circle cx="56" cy="6" r="1.5" fill="#3a3a42"/>

  <!-- Curtain rings (small loops on rail) -->
  <circle cx="14" cy="6" r="1.2" fill="none" stroke="#4a4a52" stroke-width="0.6"/>
  <circle cx="22" cy="6" r="1.2" fill="none" stroke="#4a4a52" stroke-width="0.6"/>
  <circle cx="30" cy="6" r="1.2" fill="none" stroke="#4a4a52" stroke-width="0.6"/>
  <circle cx="38" cy="6" r="1.2" fill="none" stroke="#4a4a52" stroke-width="0.6"/>
  <circle cx="46" cy="6" r="1.2" fill="none" stroke="#4a4a52" stroke-width="0.6"/>

  <!-- Curtain fabric — gathered folds from left, flowing right -->
  <!-- Main body -->
  <path d="M14,8 Q16,10 14,82 L22,82 Q20,10 22,8 Z" fill="#2c3a38" opacity="0.9"/>
  <path d="M22,8 Q24,12 22,82 L30,82 Q28,10 30,8 Z" fill="#304040" opacity="0.85"/>
  <path d="M30,8 Q32,10 30,82 L38,82 Q36,12 38,8 Z" fill="#2c3a38" opacity="0.9"/>
  <path d="M38,8 Q40,10 38,82 L46,82 Q44,10 46,8 Z" fill="#283636" opacity="0.85"/>

  <!-- Bunched/gathered section (right side, curtain pulled back) -->
  <path d="M46,8 Q50,14 48,82 L56,80 Q54,12 52,8 Z" fill="#344844" opacity="0.8"/>
  <path d="M52,8 L56,10 L56,80 L52,82 Z" fill="#2c3e3a" opacity="0.75"/>

  <!-- Fold shadow lines -->
  <line x1="22" y1="12" x2="22" y2="80" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>
  <line x1="30" y1="10" x2="30" y2="80" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <line x1="38" y1="12" x2="38" y2="80" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>
  <line x1="46" y1="10" x2="46" y2="80" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>

  <!-- Fold highlight lines -->
  <line x1="18" y1="14" x2="18" y2="78" stroke="rgba(255,255,255,0.03)" stroke-width="0.4"/>
  <line x1="34" y1="14" x2="34" y2="78" stroke="rgba(255,255,255,0.03)" stroke-width="0.4"/>

  <!-- Bottom hem weight -->
  <line x1="14" y1="82" x2="56" y2="80" stroke="#243230" stroke-width="1"/>

  <!-- Shadow on floor -->
  <ellipse cx="35" cy="88" rx="20" ry="3" fill="rgba(0,0,0,0.08)"/>
</svg>
