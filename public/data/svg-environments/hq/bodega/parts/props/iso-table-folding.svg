<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 24 72 66">
  <!-- Isometric folding table. Simple rectangular table for meetings/staffing. -->

  <!-- Table top surface -->
  <polygon points="16,44 48,60 80,44 48,28"
    fill="#2c2820" stroke="#231e18" stroke-width="0.8"/>
  <!-- Table front face -->
  <polygon points="48,60 80,44 80,50 48,66"
    fill="#231e18" stroke="#1e1a16" stroke-width="0.6"/>
  <!-- Table left face -->
  <polygon points="16,44 48,60 48,66 16,50"
    fill="#1e1a16" stroke="#171410" stroke-width="0.6"/>
  <!-- Top edge highlight -->
  <line x1="16" y1="44" x2="48" y2="28" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- Legs -->
  <line x1="20" y1="50" x2="20" y2="72" stroke="#2a2420" stroke-width="2"/>
  <line x1="76" y1="48" x2="76" y2="70" stroke="#231e18" stroke-width="2"/>
  <line x1="48" y1="66" x2="48" y2="82" stroke="#1e1a16" stroke-width="2"/>
  <line x1="18" y1="44" x2="18" y2="66" stroke="#2a2420" stroke-width="1.5"/>

  <!-- Shadow -->
  <ellipse cx="48" cy="82" rx="18" ry="5" fill="rgba(0,0,0,0.12)"/>
</svg>
