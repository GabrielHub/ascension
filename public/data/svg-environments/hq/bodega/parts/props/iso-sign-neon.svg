<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 20 48 44">
  <!-- Isometric neon sign for bodega wall.
       Warm gold/ember glow, wall-mounted. -->

  <!-- Sign backing plate (on wall plane, isometric) -->
  <polygon points="12,60 52,40 52,24 12,40"
    fill="#0e0d0c" stroke="#3a3838" stroke-width="0.6"/>

  <!-- Neon tube shapes (abstract "BODEGA" glow) -->
  <line x1="18" y1="54" x2="46" y2="38" stroke="#c8a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="18" y1="48" x2="46" y2="32" stroke="#d4541e" stroke-width="1" opacity="0.4"/>

  <!-- Glow halo -->
  <polygon points="10,62 54,38 54,22 10,38"
    fill="rgba(200,168,76,0.06)"/>

  <!-- Mounting screws -->
  <circle cx="16" cy="42" r="1" fill="#3a3838"/>
  <circle cx="48" cy="26" r="1" fill="#3a3838"/>
</svg>