<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- Wall-mounted clock. Simple round analog clock. -->

  <!-- Clock body -->
  <circle cx="18" cy="18" r="14" fill="#1e1e26" stroke="#2a2a32" stroke-width="0.8"/>

  <!-- Clock face -->
  <circle cx="18" cy="18" r="12" fill="#282830"/>

  <!-- Hour markers -->
  <line x1="18" y1="8" x2="18" y2="10" stroke="rgba(200,168,76,0.3)" stroke-width="0.6"/>
  <line x1="28" y1="18" x2="26" y2="18" stroke="rgba(200,168,76,0.3)" stroke-width="0.6"/>
  <line x1="18" y1="28" x2="18" y2="26" stroke="rgba(200,168,76,0.3)" stroke-width="0.6"/>
  <line x1="8" y1="18" x2="10" y2="18" stroke="rgba(200,168,76,0.3)" stroke-width="0.6"/>

  <!-- Hour hand -->
  <line x1="18" y1="18" x2="18" y2="12" stroke="rgba(224,221,214,0.5)" stroke-width="1" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="18" y1="18" x2="24" y2="16" stroke="rgba(224,221,214,0.4)" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="18" cy="18" r="1.2" fill="#c8a84c" opacity="0.4"/>

  <!-- Frame highlight -->
  <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.3"/>
</svg>
