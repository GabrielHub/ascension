<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 12 28 84">
  <!-- Isometric IV drip stand. Makeshift medical equipment. -->

  <!-- Base (tripod feet) -->
  <line x1="24" y1="88" x2="14" y2="90" stroke="#4a4a52" stroke-width="1.2"/>
  <line x1="24" y1="88" x2="34" y2="90" stroke="#4a4a52" stroke-width="1.2"/>
  <line x1="24" y1="88" x2="24" y2="92" stroke="#4a4a52" stroke-width="1.2"/>
  <!-- Wheel dots -->
  <circle cx="14" cy="91" r="1.5" fill="#3a3a42"/>
  <circle cx="34" cy="91" r="1.5" fill="#3a3a42"/>
  <circle cx="24" cy="93" r="1.5" fill="#3a3a42"/>

  <!-- Pole -->
  <line x1="24" y1="88" x2="24" y2="16" stroke="#5a5a62" stroke-width="1.5"/>

  <!-- Top hook arms -->
  <line x1="24" y1="16" x2="16" y2="14" stroke="#5a5a62" stroke-width="1.2"/>
  <line x1="24" y1="16" x2="32" y2="14" stroke="#5a5a62" stroke-width="1.2"/>

  <!-- IV bag (hanging from left hook) -->
  <rect x="10" y="16" width="10" height="14" rx="2" fill="#384858" opacity="0.5"
    stroke="#304050" stroke-width="0.4"/>
  <!-- Fluid level -->
  <rect x="11" y="22" width="8" height="6" rx="1" fill="rgba(100,160,200,0.1)"/>
  <!-- Tube -->
  <path d="M15,30 Q15,40 18,50 Q20,60 20,70" fill="none" stroke="#4a5a6a" stroke-width="0.6" opacity="0.4"/>

  <!-- Shadow -->
  <ellipse cx="24" cy="93" rx="8" ry="2" fill="rgba(0,0,0,0.08)"/>
</svg>
