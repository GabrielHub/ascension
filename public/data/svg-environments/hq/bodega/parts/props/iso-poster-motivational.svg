<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 38">
  <!-- Motivational poster. Put up ironically, never taken down.
       Faded sunset/mountain image with implied text. Classic format:
       big image, one word, small subtext. Cel-shaded frame edge. -->

  <!-- Shadow -->
  <ellipse cx="15" cy="36" rx="10" ry="1.5" fill="rgba(0,0,0,0.1)"/>

  <!-- Frame — shallow iso box (wall-mounted) -->
  <!-- Frame top face — lightest -->
  <polygon points="3,4 15,2 27,4 15,6"
    fill="#2a2836" stroke="#222030" stroke-width="0.5"/>
  <!-- Frame left face — medium -->
  <polygon points="3,4 15,6 15,34 3,32"
    fill="#222030" stroke="#1a1828" stroke-width="0.5"/>
  <!-- Frame right face — darkest -->
  <polygon points="15,6 27,4 27,32 15,34"
    fill="#1a1828" stroke="#141220" stroke-width="0.5"/>

  <!-- Top edge highlights -->
  <line x1="3" y1="4" x2="15" y2="2" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
  <line x1="15" y1="2" x2="27" y2="4" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>

  <!-- Paper base (recessed inside frame) -->
  <rect x="5" y="6" width="20" height="26" rx="0.3" fill="#1e2030"/>

  <!-- "Image" area (faded sunset gradient over mountains) -->
  <rect x="6" y="7" width="18" height="14" rx="0.3" fill="#1a1828"/>
  <!-- Sky gradient -->
  <rect x="6" y="7" width="18" height="7" rx="0.3" fill="rgba(140,80,50,0.12)"/>
  <rect x="6" y="11" width="18" height="3" fill="rgba(180,100,50,0.08)"/>
  <!-- Mountain silhouettes -->
  <polygon points="6,19 11,13 17,17 21,11 24,15 24,21 6,21"
    fill="rgba(20,18,30,0.6)"/>
  <!-- Sun/horizon glow -->
  <circle cx="19" cy="12" r="2.5" fill="rgba(200,168,76,0.1)"/>

  <!-- Big motivational word (implied, chunky block) -->
  <rect x="8" y="24" width="14" height="3" rx="0.2" fill="rgba(224,221,214,0.18)"/>

  <!-- Small subtext line -->
  <line x1="10" y1="29" x2="20" y2="29" stroke="rgba(224,221,214,0.08)" stroke-width="0.4"/>
  <line x1="12" y1="31" x2="18" y2="31" stroke="rgba(224,221,214,0.06)" stroke-width="0.4"/>

  <!-- Curled corner (bottom right, tape failed) -->
  <polygon points="25,32 27,30 27,34 25,34"
    fill="#242430" stroke="#1e2030" stroke-width="0.3"/>

  <!-- Pin at top -->
  <circle cx="15" cy="3" r="1.2" fill="rgba(200,60,60,0.4)"/>

  <!-- Tape residue at bottom (where tape used to be) -->
  <rect x="12" y="33" width="6" height="1.5" rx="0.2" fill="rgba(200,195,170,0.06)"/>
</svg>
