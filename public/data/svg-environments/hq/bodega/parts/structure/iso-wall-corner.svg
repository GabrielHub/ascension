<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <linearGradient id="iwc-wallL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e1a16"/>
      <stop offset="100%" stop-color="#171410"/>
    </linearGradient>
    <linearGradient id="iwc-wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1714"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>

  <!-- Reusable isometric wall corner piece.
       Two wall planes meeting at a back corner.
       Can be placed at the back of any room-box composition. -->

  <!-- Left wall plane -->
  <polygon points="10,180 80,140 80,20 10,40"
    fill="url(#iwc-wallL)" stroke="#2a2520" stroke-width="1.5"/>
  <!-- Right wall plane -->
  <polygon points="150,180 80,140 80,20 150,40"
    fill="url(#iwc-wallR)" stroke="#2a2520" stroke-width="1.5"/>

  <!-- Corner seam -->
  <line x1="80" y1="20" x2="80" y2="140" stroke="#2a2520" stroke-width="2"/>

  <!-- Ceiling edges -->
  <line x1="10" y1="40" x2="80" y2="20" stroke="#2a2520" stroke-width="1.5"/>
  <line x1="80" y1="20" x2="150" y2="40" stroke="#2a2520" stroke-width="1.5"/>

  <!-- Baseboard trim -->
  <line x1="10" y1="178" x2="80" y2="138" stroke="#2a2520" stroke-width="0.8" opacity="0.5"/>
  <line x1="150" y1="178" x2="80" y2="138" stroke="#2a2520" stroke-width="0.8" opacity="0.5"/>
</svg>