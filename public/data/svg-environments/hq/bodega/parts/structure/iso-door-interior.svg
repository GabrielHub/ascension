<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 160">
  <defs>
    <linearGradient id="idi-wall" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e1a16"/>
      <stop offset="100%" stop-color="#171410"/>
    </linearGradient>
  </defs>

  <!-- Reusable isometric interior door opening.
       Shows a doorway cut into a wall plane with frame and threshold.
       Oriented for left-wall placement (adjust transform for right wall). -->

  <!-- Wall section with door opening -->
  <!-- Wall above door -->
  <polygon points="10,140 58,114 58,20 10,38"
    fill="url(#idi-wall)" stroke="#2a2520" stroke-width="1"/>

  <!-- Door opening (void) -->
  <polygon points="14,138 54,118 54,60 14,74"
    fill="#080706" stroke="#2a2520" stroke-width="0.8"/>

  <!-- Door frame -->
  <!-- Top frame -->
  <line x1="14" y1="74" x2="54" y2="60" stroke="#2a2520" stroke-width="1.8"/>
  <!-- Left frame post -->
  <line x1="14" y1="74" x2="14" y2="138" stroke="#2a2520" stroke-width="1.5"/>
  <!-- Right frame post -->
  <line x1="54" y1="60" x2="54" y2="118" stroke="#2a2520" stroke-width="1.5"/>

  <!-- Threshold on floor (small strip) -->
  <polygon points="14,138 54,118 62,122 22,142"
    fill="#2a2520" stroke="#1e1a16" stroke-width="0.5"/>

  <!-- Door panel (half-open, angled) -->
  <polygon points="54,118 74,108 74,56 54,60"
    fill="#2c2218" stroke="#231e18" stroke-width="0.6" opacity="0.6"/>
  <!-- Door handle -->
  <circle cx="68" cy="88" r="1.5" fill="#8a7040"/>
</svg>