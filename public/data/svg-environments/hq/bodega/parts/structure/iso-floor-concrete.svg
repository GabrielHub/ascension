<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <defs>
    <linearGradient id="ifc-floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1c18"/>
      <stop offset="100%" stop-color="#16140f"/>
    </linearGradient>
  </defs>

  <!-- Reusable isometric floor plane — scuffed concrete.
       Diamond shape for composing into room-box scenes. -->

  <polygon points="80,10 155,50 80,90 5,50"
    fill="url(#ifc-floor)" stroke="#2a2520" stroke-width="1"/>

  <!-- Tile grid lines -->
  <g opacity="0.1" stroke="#3a3530" stroke-width="0.4">
    <line x1="30" y1="50" x2="105" y2="10"/>
    <line x1="55" y1="50" x2="130" y2="10"/>
    <line x1="130" y1="50" x2="55" y2="10"/>
    <line x1="105" y1="50" x2="30" y2="10"/>
  </g>

  <!-- Subtle floor scuffs -->
  <circle cx="60" cy="45" r="2" fill="#141210" opacity="0.1"/>
  <circle cx="100" cy="40" r="1.5" fill="#141210" opacity="0.08"/>

  <!-- Floor edge highlight -->
  <line x1="80" y1="90" x2="5" y2="50" stroke="#2a2520" stroke-width="0.6" opacity="0.3"/>
  <line x1="80" y1="90" x2="155" y2="50" stroke="#2a2520" stroke-width="0.6" opacity="0.3"/>
</svg>