<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="iwb-wall" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e1a16"/>
      <stop offset="100%" stop-color="#171410"/>
    </linearGradient>
  </defs>

  <!-- Reusable isometric window with security bars.
       Fits bodega aesthetic — grimy urban, barred glass.
       Oriented for left-wall placement. -->

  <!-- Wall section around window -->
  <polygon points="8,80 56,54 56,8 8,28"
    fill="url(#iwb-wall)" stroke="#2a2520" stroke-width="1"/>

  <!-- Window opening -->
  <polygon points="16,68 48,52 48,22 16,36"
    fill="rgba(26,36,64,0.3)" stroke="#3a3838" stroke-width="1"/>

  <!-- Glass reflection -->
  <polygon points="20,62 34,55 34,30 20,38"
    fill="rgba(40,55,90,0.12)"/>

  <!-- Security bars -->
  <line x1="26" y1="64" x2="26" y2="34" stroke="#3a3838" stroke-width="1"/>
  <line x1="36" y1="58" x2="36" y2="28" stroke="#3a3838" stroke-width="1"/>
  <!-- Horizontal bar -->
  <line x1="16" y1="52" x2="48" y2="37" stroke="#3a3838" stroke-width="0.8"/>

  <!-- Window sill -->
  <polygon points="16,68 48,52 54,55 22,71"
    fill="#2a2520" stroke="#1e1a16" stroke-width="0.5"/>
</svg>