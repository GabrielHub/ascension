<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Dining Area — Tier 2 (Functional)
       Three folding tables spaced along building **row** (screen vector
       (+48,+24) per tile — the long axis of the 8×3 dining slot).
       Shared translate(-18,9) nudges all three along **+col** ((-48,+24) per tile)
       so the run sits on the slot centerline.
       Origin (200,100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).
       Table A — drawn first (back). Table B — center.
       Table C — closest.
       Depth order: A-west chair → A table → A-east chair →
                    B-west chair → B table → B-east chair →
                    C-west chair → C table → C-east chair. -->

  <!-- ====================================================================
       TABLE A CLUSTER — low-row end of the slot (back in depth order)
       ==================================================================== -->
  <g transform="translate(-132 -48)">
