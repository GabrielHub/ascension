  <line x1="190" y1="170" x2="242" y2="196" stroke="#433527" stroke-width="0.3" opacity="0.25"/>
  <line x1="172" y1="182" x2="172" y2="197" stroke="#241c12" stroke-width="2"/>
  <line x1="274" y1="195" x2="274" y2="210" stroke="#241c12" stroke-width="2"/>
  <line x1="236" y1="214" x2="236" y2="229" stroke="#241c12" stroke-width="2"/>
  <line x1="172" y1="190" x2="274" y2="190" stroke="#241c12" stroke-width="0.6" opacity="0.55"/>

  <!-- map sheet -->
  <polygon points="198,172 226,186 216,191 188,177"
