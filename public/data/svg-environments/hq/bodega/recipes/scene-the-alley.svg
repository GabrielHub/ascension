<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Alley
       Sparse back-exit staging room for the bodega.
       The room should read as pre-departure prep, not storage overflow:
       one rally board, one loadout table, one supply rack, one hydration point.
       No walls, floors, tile grid, or labels. -->

  <!-- == Rally board ==================================================== -->
  <polygon points="214,116 248,133 256,129 222,112"
    fill="#7a5b38" stroke="#553d24" stroke-width="0.55"/>
  <polygon points="214,116 248,133 248,168 214,151"
    fill="#8c6740" stroke="#604428" stroke-width="0.5"/>
  <polygon points="248,133 256,129 256,164 248,168"
    fill="#735437" stroke="#503920" stroke-width="0.45"/>
  <line x1="222" y1="156" x2="222" y2="183" stroke="#353a42" stroke-width="2.1"/>
  <line x1="244" y1="167" x2="244" y2="189" stroke="#353a42" stroke-width="2.1"/>
  <line x1="214" y1="116" x2="248" y2="133" stroke="rgba(255,255,255,0.05)" stroke-width="0.35"/>
  <line x1="216" y1="151" x2="230" y2="158" stroke="rgba(90,55,24,0.2)" stroke-width="0.35"/>
  <line x1="220" y1="182" x2="232" y2="176" stroke="#353a42" stroke-width="1.5"/>
  <line x1="242" y1="189" x2="254" y2="183" stroke="#353a42" stroke-width="1.5"/>
