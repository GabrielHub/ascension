  <line x1="228" y1="127" x2="228" y2="143" stroke="#b73c3c" stroke-width="1"/>
  <line x1="240" y1="138" x2="240" y2="152" stroke="#376b48" stroke-width="1"/>

  <!-- == Supply rack ==================================================== -->
  <polygon points="290,112 346,140 326,150 270,122"
    fill="#3b3938" stroke="#282625" stroke-width="0.6"/>
  <polygon points="270,122 326,150 326,202 270,174"
    fill="#474443" stroke="#302d2b" stroke-width="0.55"/>
  <polygon points="346,140 326,150 326,202 346,192"
