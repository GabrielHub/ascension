  <polygon points="278,131 296,140 296,146 278,137" fill="#6d7a4c"/>
  <polygon points="300,142 318,151 318,157 300,148" fill="#c7ccd3"/>
  <polygon points="278,152 300,163 300,170 278,159" fill="#3d4856"/>
  <polygon points="304,165 322,174 322,181 304,172" fill="#7c5a3a"/>

  <!-- == Hero loadout table ============================================ -->
  <line x1="210" y1="163" x2="210" y2="178" stroke="#241c12" stroke-width="2"/>
  <polygon points="172,179 236,211 236,214 172,182"
    fill="#2c2418" stroke="#241c12" stroke-width="0.5"/>
  <polygon points="274,192 236,211 236,214 274,195"
