  <circle cx="210" cy="174" r="2" fill="#1c1f24"/>
  <circle cx="216" cy="177" r="2" fill="#1c1f24"/>
  <line x1="223" y1="167" x2="231" y2="159" stroke="#59616a" stroke-width="1"/>
</svg>
