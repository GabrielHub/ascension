<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Dining Area — Tier 1 (Makeshift)
       Battered folding table with two mismatched wooden chairs, one on
       each side (west and east in world), centered on the table edges.
       Origin (200,100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).
       Table: 0.75 tile at world (1.958, 1.75), height 22, top thickness 3.
       Chairs: 0.25 tile, seat z=0.42 world (10 screen units).
       Z-order: Chair A (c+r=3.108) → Table (3.708) → Chair B (4.308). -->

  <!-- ====================================================================
       CHAIR A — west of table, facing east (drawn FIRST, tucks under table)
       Seat top center screen (181,165). Floor (181,175).
       Vertices world NW→screen N(181,159), NE→E(193,165), SE→S(181,171), SW→W(169,165).
       Backrest on world west edge (screen NW edge, from N to W).
       ==================================================================== -->
  <!-- Visible legs (strictly vertical, from seat bottom to floor) -->
  <line x1="193" y1="168" x2="193" y2="175" stroke="#2a2a2a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="181" y1="174" x2="181" y2="181" stroke="#2a2a2a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="169" y1="168" x2="169" y2="175" stroke="#2a2a2a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Seat top diamond (iso axis-aligned) -->
  <polygon points="169,165 181,171 193,165 181,159"
    fill="#7a4e32" stroke="#5c3a1e" stroke-width="0.5"/>
  <line x1="172" y1="166" x2="190" y2="166" stroke="#5c3a1e" stroke-width="0.3" opacity="0.4"/>
  <!-- Seat SW face -->
  <polygon points="169,165 181,171 181,174 169,168"
    fill="#5c3a1e" stroke="#4a2e16" stroke-width="0.3"/>
  <!-- Seat SE face -->
  <polygon points="181,171 193,165 193,168 181,174"
    fill="#4e3018" stroke="#3e2612" stroke-width="0.3"/>
  <!-- Backrest face on screen NW edge (N→W, world west edge) -->
  <polygon points="181,159 169,165 169,148 181,142"
    fill="#6b422a" stroke="#553420" stroke-width="0.5"/>
  <!-- Backrest top cap (depth offset toward NW) -->
  <polygon points="181,142 169,148 168,147 180,141"
    fill="#7a4e32" stroke="#553420" stroke-width="0.3"/>
  <!-- Backrest end face (at W end, farthest from camera) -->
  <polygon points="169,148 168,147 168,164 169,165"
    fill="#4e3018" stroke="#3e2612" stroke-width="0.3"/>
  <!-- Backrest slat lines -->
  <line x1="180" y1="148" x2="170" y2="153" stroke="#553420" stroke-width="0.35" opacity="0.5"/>
  <line x1="180" y1="153" x2="170" y2="158" stroke="#553420" stroke-width="0.35" opacity="0.4"/>

  <!-- ====================================================================
       FOLDING TABLE — drawn SECOND (occludes Chair A's east side / leg)
       Top: back(210,149) right(246,167) front(210,185) left(174,167).
       Floor: back(210,171) right(246,189) front(210,207) left(174,189).
       ==================================================================== -->
  <!-- Ground shadow at floor center -->
  <ellipse cx="210" cy="189" rx="30" ry="7" fill="rgba(0,0,0,0.24)"/>

  <!-- Back leg (hidden behind top) — strictly vertical -->
  <line x1="210" y1="152" x2="210" y2="171" stroke="#241c12" stroke-width="2"/>

  <!-- Top-thickness underside faces (SW and SE) -->
  <polygon points="174,167 210,185 210,188 174,170"
    fill="#2c2418" stroke="#241c12" stroke-width="0.5"/>
  <polygon points="246,167 210,185 210,188 246,170"
    fill="#302818" stroke="#241c12" stroke-width="0.5"/>

  <!-- Table top diamond (iso axis-aligned) -->
  <polygon points="210,149 246,167 210,185 174,167"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.7"/>
  <line x1="210" y1="149" x2="174" y2="167" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="210" y1="149" x2="246" y2="167" stroke="rgba(255,255,255,0.05)" stroke-width="0.4"/>
  <!-- Wood grain along iso axes -->
  <line x1="192" y1="158" x2="228" y2="176" stroke="#2c2418" stroke-width="0.3" opacity="0.3"/>
  <line x1="198" y1="164" x2="222" y2="176" stroke="#2c2418" stroke-width="0.25" opacity="0.25"/>
  <!-- Coffee ring stain -->
  <ellipse cx="198" cy="170" rx="3.2" ry="1.6" fill="none" stroke="rgba(40,20,10,0.4)" stroke-width="0.5"/>

  <!-- Visible legs (strictly vertical posts) -->
  <line x1="174" y1="170" x2="174" y2="189" stroke="#241c12" stroke-width="2"/>
  <line x1="246" y1="170" x2="246" y2="189" stroke="#241c12" stroke-width="2"/>
  <line x1="210" y1="188" x2="210" y2="207" stroke="#241c12" stroke-width="2"/>
  <!-- Horizontal cross brace between left and right legs -->
  <line x1="174" y1="183" x2="246" y2="183" stroke="#241c12" stroke-width="0.6" opacity="0.55"/>

  <!-- Coffee cup (iso cylinder, sits on table top center) -->
  <path d="M 207.5,162 A 2.5,1.25 0 0 0 212.5,162 L 212.5,167 A 2.5,1.25 0 0 1 207.5,167 Z"
    fill="#e8e2d4" stroke="#b8b0a0" stroke-width="0.35"/>
  <ellipse cx="210" cy="162" rx="2.5" ry="1.25" fill="#d8d0c0" stroke="#b8b0a0" stroke-width="0.3"/>
  <ellipse cx="210" cy="162" rx="1.9" ry="0.95" fill="rgba(30,15,6,0.75)"/>

  <!-- ====================================================================
       CHAIR B — east of table, facing west (drawn LAST, in front of table)
       Seat top center screen (239,193). Floor (239,203).
       Vertices world NW→screen N(239,187), NE→E(251,193), SE→S(239,199), SW→W(227,193).
       Backrest on world east edge (screen SE edge, from S to E).
       ==================================================================== -->
  <!-- Visible legs -->
  <line x1="227" y1="196" x2="227" y2="203" stroke="#2a2a2a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="239" y1="190" x2="239" y2="197" stroke="#2a2a2a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="239" y1="202" x2="239" y2="209" stroke="#2a2a2a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Seat top diamond -->
  <polygon points="227,193 239,199 251,193 239,187"
    fill="#7a4e32" stroke="#5c3a1e" stroke-width="0.5"/>
  <line x1="230" y1="194" x2="248" y2="194" stroke="#5c3a1e" stroke-width="0.3" opacity="0.4"/>
  <!-- Seat SW face -->
  <polygon points="227,193 239,199 239,202 227,196"
    fill="#5c3a1e" stroke="#4a2e16" stroke-width="0.3"/>
  <!-- Seat SE face -->
  <polygon points="239,199 251,193 251,196 239,202"
    fill="#4e3018" stroke="#3e2612" stroke-width="0.3"/>
  <!-- Backrest face on screen SE edge (S→E, world east edge) -->
  <polygon points="239,199 251,193 251,176 239,182"
    fill="#6b422a" stroke="#553420" stroke-width="0.5"/>
  <!-- Backrest top cap (depth offset toward SE) -->
  <polygon points="239,182 251,176 252,177 240,183"
    fill="#7a4e32" stroke="#553420" stroke-width="0.3"/>
  <!-- Backrest end face (at E end, farthest from camera in +c) -->
  <polygon points="251,176 252,177 252,194 251,193"
    fill="#4e3018" stroke="#3e2612" stroke-width="0.3"/>
  <!-- Backrest slat lines -->
  <line x1="240" y1="185" x2="250" y2="180" stroke="#553420" stroke-width="0.35" opacity="0.5"/>
  <line x1="240" y1="190" x2="250" y2="185" stroke="#553420" stroke-width="0.35" opacity="0.4"/>
</svg>
