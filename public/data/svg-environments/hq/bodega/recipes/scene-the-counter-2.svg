<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Counter — State 2 (Upgraded Deli)
       Wood base with a proper glass display case sitting directly on the
       counter top (shared iso edges — no floating glass). Illuminated
       interior reveals organized food trays; polished steel rim caps the
       top edges. Shifted toward room center along -x / -y so footprint is
       centered within the 4x3 operations slot.
       Props only: counter, stools, plant. No walls, floor, or labels.
       Origin (200,100). Canonical iso 2:1 throughout. -->

  <!-- == COUNTER: WOOD TOP (horizontal plane, base of glass case) ====== -->
  <polygon points="160,118 296,186 268,200 132,132"
    fill="#4a3a24" stroke="#2c2418" stroke-width="0.7"/>
  <!-- Grain sheen along the 2:1 iso axis -->
  <line x1="160" y1="118" x2="296" y2="186" stroke="rgba(255,228,180,0.12)" stroke-width="0.6"/>
  <line x1="180" y1="128" x2="276" y2="176" stroke="rgba(255,228,180,0.05)" stroke-width="0.4"/>
  <!-- Warm interior glow on the wood top, seen through the glass -->
  <polygon points="160,118 296,186 268,200 132,132"
    fill="rgba(255,220,160,0.10)"/>

  <!-- == FOOD TRAYS (inside case, on wood top, iso-aligned) ============ -->
  <!-- Tray 1 — sandwiches -->
  <polygon points="155,125 195,145 188,149 148,129"
    fill="rgba(210,180,130,0.42)" stroke="rgba(180,150,100,0.35)" stroke-width="0.4"/>
  <line x1="156" y1="127" x2="189" y2="144" stroke="rgba(140,100,60,0.4)" stroke-width="0.4"/>
  <line x1="158" y1="130" x2="191" y2="147" stroke="rgba(90,60,40,0.35)" stroke-width="0.4"/>
  <!-- Tray 2 — meats -->
  <polygon points="201,148 241,168 234,172 194,152"
    fill="rgba(150,60,55,0.4)" stroke="rgba(120,40,40,0.35)" stroke-width="0.4"/>
  <line x1="203" y1="150" x2="235" y2="166" stroke="rgba(180,80,70,0.4)" stroke-width="0.4"/>
  <line x1="205" y1="153" x2="237" y2="169" stroke="rgba(100,40,30,0.35)" stroke-width="0.4"/>
  <!-- Tray 3 — cheese -->
  <polygon points="165,142 195,157 188,160 158,145"
    fill="rgba(230,205,120,0.4)" stroke="rgba(200,170,90,0.3)" stroke-width="0.3"/>
  <line x1="172" y1="146" x2="185" y2="153" stroke="rgba(200,170,90,0.3)" stroke-width="0.3"/>
  <!-- Tray 4 — greens / olives -->
  <polygon points="210,166 250,186 243,190 203,170"
    fill="rgba(80,120,70,0.38)" stroke="rgba(60,100,50,0.3)" stroke-width="0.3"/>
  <line x1="213" y1="168" x2="245" y2="184" stroke="rgba(100,140,80,0.4)" stroke-width="0.4"/>

  <!-- == GLASS DISPLAY CASE ============================================ -->
  <!-- Rises 22 px vertically from the wood top. Each glass panel shares
       its bottom edge with a corresponding edge of the wood top. -->

  <!-- Right side glass (bottom edge = wood top right edge) -->
  <polygon points="296,186 268,200 268,178 296,164"
    fill="rgba(80,110,130,0.18)" stroke="rgba(140,170,190,0.4)" stroke-width="0.5"/>
  <!-- Glass top (horizontal, at case peak) -->
  <polygon points="160,96 296,164 268,178 132,110"
    fill="rgba(80,110,130,0.12)" stroke="rgba(140,170,190,0.35)" stroke-width="0.5"/>
  <!-- Front glass (bottom edge = wood top front edge) -->
  <polygon points="132,132 268,200 268,178 132,110"
    fill="rgba(80,110,130,0.14)" stroke="rgba(140,170,190,0.5)" stroke-width="0.6"/>
  <!-- Polished front-glass highlights -->
  <line x1="140" y1="116" x2="180" y2="136" stroke="rgba(255,255,255,0.24)" stroke-width="0.8"/>
  <line x1="200" y1="146" x2="244" y2="168" stroke="rgba(255,255,255,0.16)" stroke-width="0.6"/>
  <line x1="150" y1="122" x2="172" y2="133" stroke="rgba(255,255,255,0.1)" stroke-width="0.4"/>

  <!-- Polished steel rim along the four top edges of the case -->
  <line x1="160" y1="96" x2="296" y2="164" stroke="#8a8a92" stroke-width="1.4"/>
  <line x1="132" y1="110" x2="268" y2="178" stroke="#7a7a82" stroke-width="1.2"/>
  <line x1="160" y1="96" x2="132" y2="110" stroke="#7a7a82" stroke-width="1.2"/>
  <line x1="296" y1="164" x2="268" y2="178" stroke="#7a7a82" stroke-width="1.2"/>
  <line x1="160" y1="95" x2="296" y2="163" stroke="rgba(255,255,255,0.35)" stroke-width="0.5"/>

  <!-- == WOOD BASE FACES (below the counter top) ======================= -->
  <!-- Front face: top edge shares wood top's front edge -->
  <polygon points="132,132 268,200 268,222 132,154"
    fill="#2a1f12" stroke="#1c140a" stroke-width="0.6"/>
  <!-- Right end face: top edge shares wood top's right edge -->
  <polygon points="268,200 296,186 296,208 268,222"
    fill="#241a0e" stroke="#1c140a" stroke-width="0.5"/>
  <!-- Vertical plank grooves -->
  <line x1="170" y1="151" x2="170" y2="173" stroke="#1c140a" stroke-width="0.4"/>
  <line x1="206" y1="169" x2="206" y2="191" stroke="#1c140a" stroke-width="0.4"/>
  <line x1="242" y1="187" x2="242" y2="209" stroke="#1c140a" stroke-width="0.4"/>

  <!-- == CUSTOMER STOOLS (3 — along counter front) ===================== -->
  <!-- Stool 1 -->
  <line x1="164" y1="196" x2="166" y2="182" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="174" y1="196" x2="172" y2="182" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="161" y1="192" x2="166" y2="182" stroke="#3a3020" stroke-width="1"/>
  <line x1="177" y1="192" x2="172" y2="182" stroke="#3a3020" stroke-width="1"/>
  <line x1="163" y1="190" x2="175" y2="190" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="169" cy="180" rx="7" ry="3.5" fill="#3a2d1e" stroke="#2c2418" stroke-width="0.5"/>
  <!-- Stool 2 -->
  <line x1="220" y1="220" x2="222" y2="206" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="230" y1="220" x2="228" y2="206" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="217" y1="216" x2="222" y2="206" stroke="#3a3020" stroke-width="1"/>
  <line x1="233" y1="216" x2="228" y2="206" stroke="#3a3020" stroke-width="1"/>
  <line x1="219" y1="214" x2="231" y2="214" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="225" cy="204" rx="7" ry="3.5" fill="#3a2d1e" stroke="#2c2418" stroke-width="0.5"/>
  <!-- Stool 3 -->
  <line x1="248" y1="232" x2="250" y2="218" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="258" y1="232" x2="256" y2="218" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="245" y1="228" x2="250" y2="218" stroke="#3a3020" stroke-width="1"/>
  <line x1="261" y1="228" x2="256" y2="218" stroke="#3a3020" stroke-width="1"/>
  <line x1="247" y1="226" x2="259" y2="226" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="253" cy="216" rx="7" ry="3.5" fill="#3a2d1e" stroke="#2c2418" stroke-width="0.5"/>

  <!-- == PLANT (front-left of counter) ================================= -->
  <polygon points="120,166 126,169 132,166 126,163" fill="#2c2218"/>
  <polygon points="120,166 126,169 126,176 120,173" fill="#3d2c20" stroke="#231e18" stroke-width="0.3"/>
  <polygon points="132,166 126,169 126,176 132,173" fill="#2c2218" stroke="#231e18" stroke-width="0.3"/>
  <ellipse cx="126" cy="156" rx="9" ry="8" fill="#1e3828"/>
  <ellipse cx="122" cy="153" rx="5" ry="6" fill="#1e3828"/>
  <ellipse cx="130" cy="154" rx="4" ry="5" fill="#204030"/>
  <ellipse cx="126" cy="151" rx="3" ry="3" fill="#264a38"/>
  <circle cx="128" cy="148" r="1.4" fill="rgba(200,168,76,0.18)"/>
</svg>
