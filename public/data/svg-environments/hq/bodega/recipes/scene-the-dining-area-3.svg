<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Dining Area — Tier 3 (Proper)
       One hardwood dining table with four matching upholstered chairs on
       world N/E/S/W. A tall bookshelf and a shorter medical cabinet sit
       along the back-right wall; a reading-corner beanbag occupies the
       front-left floor. Nicer finish than tier 1/2 across the board.
       Origin (200,100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).
       Depth order (c+r ascending):
         chair W (2.667) → chair N (2.667) →
         medical cabinet (3.0) → beanbag (3.0) →
         hardwood table (3.5) → bookshelf (3.75) →
         chair S (4.333) → chair E (4.333). -->

