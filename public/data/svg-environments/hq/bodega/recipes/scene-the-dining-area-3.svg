  <polygon points="118,156 138,154 138,155 118,157"
    fill="#8a4a32" opacity="0.6"/>
  <line x1="121" y1="158" x2="137" y2="156" stroke="#3a1e16" stroke-width="0.3" opacity="0.6"/>

