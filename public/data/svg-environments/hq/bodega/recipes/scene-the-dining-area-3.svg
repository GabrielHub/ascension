<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Dining Area — Tier 3 (Proper)
       Single larger hardwood dining table with four matching upholstered
       chairs, one on each side, each facing the table from a different
       orientation. Nicer finish across the board.
       Origin (200,100). iso(c,r) = (200+(c-r)*48, 100+(c+r)*24) -->

  <!-- == HARDWOOD DINING TABLE (center, 1.0 tile) ====================== -->
  <!-- Center (200,184). Corners: back(200,160) right(248,184)
       front(200,208) left(152,184). Thicker top (4 units). -->
  <ellipse cx="200" cy="218" rx="50" ry="7.5" fill="rgba(0,0,0,0.26)"/>
  <!-- Back leg (hidden behind top) -->
  <line x1="200" y1="164" x2="200" y2="186" stroke="#241810" stroke-width="2.2"/>
  <!-- Front-left face (SW) -->
  <polygon points="152,184 200,208 200,213 152,189"
    fill="#3a2618" stroke="#241810" stroke-width="0.5"/>
  <!-- Front-right face (SE) -->
  <polygon points="248,184 200,208 200,213 248,189"
    fill="#402a1a" stroke="#241810" stroke-width="0.5"/>
  <!-- Table top -->
  <polygon points="200,160 248,184 200,208 152,184"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.8"/>
  <!-- Top edge highlights -->
  <line x1="200" y1="160" x2="152" y2="184" stroke="rgba(255,235,200,0.12)" stroke-width="0.6"/>
  <line x1="200" y1="160" x2="248" y2="184" stroke="rgba(255,235,200,0.08)" stroke-width="0.5"/>
  <!-- Subtle wood grain (clean, not scratched) -->
  <line x1="170" y1="172" x2="224" y2="200" stroke="#3a2618" stroke-width="0.35" opacity="0.3"/>
  <line x1="180" y1="182" x2="220" y2="202" stroke="#3a2618" stroke-width="0.3" opacity="0.25"/>
  <line x1="188" y1="190" x2="214" y2="203" stroke="#3a2618" stroke-width="0.25" opacity="0.2"/>
  <!-- Sturdier turned legs -->
  <line x1="154" y1="187" x2="152" y2="213" stroke="#2a1810" stroke-width="2.2"/>
  <line x1="246" y1="187" x2="248" y2="213" stroke="#2a1810" stroke-width="2.2"/>
  <line x1="200" y1="211" x2="200" y2="232" stroke="#2a1810" stroke-width="2.2"/>
  <!-- Cross stretcher (lower brace, both directions) -->
  <line x1="160" y1="204" x2="198" y2="225" stroke="#2a1810" stroke-width="0.8" opacity="0.7"/>
  <line x1="240" y1="204" x2="202" y2="225" stroke="#2a1810" stroke-width="0.8" opacity="0.7"/>

  <!-- == PLACE SETTINGS on table ======================================= -->
  <!-- Ceramic mug (NW quadrant of table) -->
  <ellipse cx="174" cy="178" rx="3.2" ry="1.3" fill="#2c2418" stroke="#1a1008" stroke-width="0.35"/>
  <ellipse cx="174" cy="178" rx="2.5" ry="0.9" fill="rgba(40,22,10,0.8)"/>
  <rect x="175" y="177" width="3" height="3" rx="0.5" fill="#2c2418" stroke="#1a1008" stroke-width="0.3"/>
  <path d="M174,176 Q173,172 175,169" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
  <!-- Dinner plate (center of table, iso ellipse) -->
  <ellipse cx="204" cy="188" rx="9" ry="3.6" fill="#e8e2d4" stroke="#a89c88" stroke-width="0.5"/>
  <ellipse cx="204" cy="188" rx="6.5" ry="2.6" fill="#d8ccb8" stroke="#a89c88" stroke-width="0.3"/>
  <ellipse cx="204" cy="188" rx="4.5" ry="1.8" fill="rgba(120,80,40,0.22)"/>
  <!-- Glass (NE quadrant) -->
  <ellipse cx="224" cy="180" rx="2.5" ry="1" fill="rgba(180,220,240,0.25)" stroke="rgba(160,200,220,0.35)" stroke-width="0.3"/>
  <polygon points="221.5,180 226.5,180 226,186 222,186"
    fill="rgba(180,220,240,0.2)" stroke="rgba(160,200,220,0.3)" stroke-width="0.3"/>
  <ellipse cx="224" cy="180" rx="2.0" ry="0.7" fill="rgba(160,200,220,0.3)"/>

  <!-- == CHAIR N — NW of table, facing SE (backrest on NW) ============= -->
  <!-- Seat center (160, 148) -->
  <ellipse cx="160" cy="164" rx="13" ry="2.8" fill="rgba(0,0,0,0.24)"/>
  <line x1="171" y1="151" x2="171" y2="161" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="160" y1="157" x2="160" y2="166" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="149" y1="151" x2="149" y2="159" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Seat top (wood frame) -->
  <polygon points="148,148 160,154 172,148 160,142"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.5"/>
  <!-- Cushion inset -->
  <polygon points="150,148 160,153 170,148 160,143"
    fill="#8a5e3a" stroke="#6a4624" stroke-width="0.4"/>
  <ellipse cx="160" cy="148" rx="5.5" ry="1.6" fill="rgba(255,220,160,0.08)"/>
  <!-- Seat SW face -->
  <polygon points="148,148 160,154 160,157 148,151"
    fill="#3a2618" stroke="#2a1810" stroke-width="0.3"/>
  <!-- Seat SE face -->
  <polygon points="160,154 172,148 172,151 160,157"
    fill="#301e10" stroke="#2a1810" stroke-width="0.3"/>
  <!-- Backrest NW face -->
  <polygon points="160,142 148,148 148,131 160,125"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.5"/>
  <!-- Backrest cushion strip -->
  <polygon points="158,141 150,145 150,133 158,129"
    fill="#8a5e3a" stroke="#6a4624" stroke-width="0.3" opacity="0.85"/>
  <polygon points="160,125 148,131 147,130 159,124"
    fill="#5a3c24" stroke="#3a2618" stroke-width="0.3"/>
  <polygon points="148,131 147,130 147,147 148,148"
    fill="#301e10" stroke="#2a1810" stroke-width="0.3"/>

  <!-- == CHAIR E — NE of table, facing SW (backrest on NE) ============= -->
  <!-- Seat center (240, 148) -->
  <ellipse cx="240" cy="164" rx="13" ry="2.8" fill="rgba(0,0,0,0.24)"/>
  <line x1="229" y1="151" x2="229" y2="161" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="240" y1="157" x2="240" y2="166" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="251" y1="151" x2="251" y2="159" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="228,148 240,154 252,148 240,142"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.5"/>
  <polygon points="230,148 240,153 250,148 240,143"
    fill="#8a5e3a" stroke="#6a4624" stroke-width="0.4"/>
  <ellipse cx="240" cy="148" rx="5.5" ry="1.6" fill="rgba(255,220,160,0.08)"/>
  <polygon points="228,148 240,154 240,157 228,151"
    fill="#3a2618" stroke="#2a1810" stroke-width="0.3"/>
  <polygon points="240,154 252,148 252,151 240,157"
    fill="#301e10" stroke="#2a1810" stroke-width="0.3"/>
  <!-- Backrest NE face -->
  <polygon points="240,142 252,148 252,131 240,125"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.5"/>
  <polygon points="242,141 250,145 250,133 242,129"
    fill="#8a5e3a" stroke="#6a4624" stroke-width="0.3" opacity="0.85"/>
  <polygon points="240,125 252,131 253,130 241,124"
    fill="#5a3c24" stroke="#3a2618" stroke-width="0.3"/>
  <polygon points="252,131 253,130 253,147 252,148"
    fill="#301e10" stroke="#2a1810" stroke-width="0.3"/>

  <!-- == CHAIR S — SE of table, facing NW (backrest on SE) ============= -->
  <!-- Seat center (240, 220) -->
  <ellipse cx="240" cy="236" rx="13" ry="2.8" fill="rgba(0,0,0,0.24)"/>
  <line x1="229" y1="223" x2="229" y2="233" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="240" y1="229" x2="240" y2="238" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="251" y1="223" x2="251" y2="231" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="228,220 240,226 252,220 240,214"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.5"/>
  <polygon points="230,220 240,225 250,220 240,215"
    fill="#8a5e3a" stroke="#6a4624" stroke-width="0.4"/>
  <ellipse cx="240" cy="220" rx="5.5" ry="1.6" fill="rgba(255,220,160,0.08)"/>
  <polygon points="228,220 240,226 240,229 228,223"
    fill="#3a2618" stroke="#2a1810" stroke-width="0.3"/>
  <polygon points="240,226 252,220 252,223 240,229"
    fill="#301e10" stroke="#2a1810" stroke-width="0.3"/>
  <!-- Backrest SE face: S→E→E-up→S-up -->
  <polygon points="240,226 252,220 252,203 240,209"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.5"/>
  <polygon points="242,225 250,221 250,209 242,213"
    fill="#8a5e3a" stroke="#6a4624" stroke-width="0.3" opacity="0.85"/>
  <polygon points="240,209 252,203 253,204 241,210"
    fill="#5a3c24" stroke="#3a2618" stroke-width="0.3"/>
  <polygon points="252,203 253,204 253,221 252,220"
    fill="#301e10" stroke="#2a1810" stroke-width="0.3"/>

  <!-- == CHAIR W — SW of table, facing NE (backrest on SW) ============= -->
  <!-- Seat center (160, 220) -->
  <ellipse cx="160" cy="236" rx="13" ry="2.8" fill="rgba(0,0,0,0.24)"/>
  <line x1="149" y1="223" x2="149" y2="233" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="160" y1="229" x2="160" y2="238" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="171" y1="223" x2="171" y2="231" stroke="#2a1810" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="148,220 160,226 172,220 160,214"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.5"/>
  <polygon points="150,220 160,225 170,220 160,215"
    fill="#8a5e3a" stroke="#6a4624" stroke-width="0.4"/>
  <ellipse cx="160" cy="220" rx="5.5" ry="1.6" fill="rgba(255,220,160,0.08)"/>
  <polygon points="148,220 160,226 160,229 148,223"
    fill="#3a2618" stroke="#2a1810" stroke-width="0.3"/>
  <polygon points="160,226 172,220 172,223 160,229"
    fill="#301e10" stroke="#2a1810" stroke-width="0.3"/>
  <!-- Backrest SW face: S→W→W-up→S-up -->
  <polygon points="160,226 148,220 148,203 160,209"
    fill="#4a3220" stroke="#3a2618" stroke-width="0.5"/>
  <polygon points="158,225 150,221 150,209 158,213"
    fill="#8a5e3a" stroke="#6a4624" stroke-width="0.3" opacity="0.85"/>
  <polygon points="160,209 148,203 147,204 159,210"
    fill="#5a3c24" stroke="#3a2618" stroke-width="0.3"/>
  <polygon points="148,203 147,204 147,221 148,220"
    fill="#301e10" stroke="#2a1810" stroke-width="0.3"/>
</svg>
