  <!-- Sunken top dish -->
  <ellipse cx="128" cy="162" rx="28" ry="9" fill="#4a2c50" stroke="#2c1832" stroke-width="0.6"/>
  <!-- Inner crease (suggests a body had just been here) -->
  <ellipse cx="128" cy="162" rx="20" ry="6" fill="#2e1a34" opacity="0.55"/>
  <ellipse cx="128" cy="161" rx="14" ry="3.5" fill="rgba(14,8,20,0.45)"/>
  <!-- Stitched seam across the top (iso-aligned) -->
  <path d="M 102,164 Q 128,155 154,164" fill="none" stroke="#2c1832" stroke-width="0.5" opacity="0.7" stroke-dasharray="1.8 1.8"/>
  <!-- Worn highlight on top ridge -->
  <path d="M 110,159 Q 128,155 146,159" fill="none" stroke="rgba(255,220,180,0.12)" stroke-width="0.6"/>
