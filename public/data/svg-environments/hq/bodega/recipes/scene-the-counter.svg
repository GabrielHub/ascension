<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Counter
       Furniture, fixtures, and decorative items only.
       No walls, floor, tile grid, or labels.
       Derived from reference/room-the-counter.svg -->

  <!-- == CEILING FAN =================================================== -->
  <ellipse cx="260" cy="44" rx="4" ry="1.5" fill="#3a3838" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="260" y1="44" x2="260" y2="48" stroke="#3a3838" stroke-width="1.2"/>
  <ellipse cx="260" cy="49" rx="5" ry="2.5" fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <polygon points="265,49 280,52 279,54 264,50" fill="#3a3020" opacity="0.85"/>
  <polygon points="255,49 240,52 241,54 256,50" fill="#342c20" opacity="0.85"/>
  <polygon points="260,51 264,56 262,57 258,57 256,56" fill="#3a3020" opacity="0.8"/>
  <polygon points="260,47 264,43 262,42 258,42 256,43" fill="#342c20" opacity="0.7"/>

  <!-- == HERO: DELI DISPLAY CASE ======================================= -->
  <!-- Glass-fronted counter with visible food. Scratched but functional. -->
  <!-- Case top surface -->
  <polygon points="140,148 296,226 264,242 108,164"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.7"/>
  <!-- Front face (below glass) -->
  <polygon points="108,164 264,242 264,264 108,186"
    fill="#2c2418" stroke="#241c12" stroke-width="0.5"/>
  <!-- Right end face -->
  <polygon points="296,226 264,242 264,264 296,248"
    fill="#302818" stroke="#241c12" stroke-width="0.5"/>
  <!-- Glass display front (angled, translucent) -->
  <polygon points="108,164 264,242 264,230 108,152"
    fill="rgba(60,80,90,0.12)" stroke="rgba(80,100,110,0.2)" stroke-width="0.5"/>
  <!-- Glass reflections -->
  <line x1="120" y1="158" x2="160" y2="178" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
  <line x1="190" y1="200" x2="230" y2="220" stroke="rgba(255,255,255,0.05)" stroke-width="0.4"/>
  <!-- Glass scratches -->
  <line x1="145" y1="170" x2="152" y2="174" stroke="rgba(255,255,255,0.04)" stroke-width="0.3"/>
  <!-- Food silhouettes inside case -->
  <polygon points="130,172 160,188 156,190 126,174"
    fill="rgba(180,150,100,0.12)" stroke="rgba(160,130,80,0.08)" stroke-width="0.3"/>
  <polygon points="170,190 200,206 196,208 166,192"
    fill="rgba(80,130,80,0.1)" stroke="rgba(60,110,60,0.08)" stroke-width="0.3"/>
  <polygon points="148,182 180,198 177,200 145,184"
    fill="rgba(160,80,70,0.1)" stroke="rgba(140,60,50,0.06)" stroke-width="0.3"/>
  <!-- Steel top rail -->
  <line x1="108" y1="152" x2="264" y2="230" stroke="#4a4a52" stroke-width="1"/>
  <!-- Panel grooves -->
  <line x1="148" y1="178" x2="148" y2="200" stroke="#241c12" stroke-width="0.4"/>
  <line x1="188" y1="198" x2="188" y2="220" stroke="#241c12" stroke-width="0.4"/>
  <line x1="228" y1="218" x2="228" y2="240" stroke="#241c12" stroke-width="0.4"/>
  <!-- Top edge highlight -->
  <line x1="140" y1="148" x2="296" y2="226" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- == COFFEE MACHINE (behind counter) =============================== -->
  <!-- Body -->
  <polygon points="172,118 190,127 202,121 184,112"
    fill="#2a2830" stroke="#222028" stroke-width="0.5"/>
  <polygon points="172,118 190,127 190,148 172,139"
    fill="#26242c" stroke="#1c1a22" stroke-width="0.4"/>
  <polygon points="190,127 202,121 202,142 190,148"
    fill="#222028" stroke="#1c1a22" stroke-width="0.4"/>
  <!-- Water reservoir -->
  <polygon points="174,114 184,119 190,115 180,110"
