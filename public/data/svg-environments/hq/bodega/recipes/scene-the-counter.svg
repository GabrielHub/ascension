  <polygon points="324,138 336,144 336,152 324,146" fill="#c8c4b8" opacity="0.08"/>
  <polygon points="326,152 338,158 338,164 326,158" fill="#302c24" opacity="0.5"/>
  <polygon points="330,166 342,172 342,176 330,170" fill="#28302c" opacity="0.5"/>

