  <polygon points="320,134 352,150 352,196 320,180"
    fill="#3a3838" stroke="#252525" stroke-width="0.6"/>
  <line x1="320" y1="148" x2="352" y2="162" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="320" y1="162" x2="352" y2="176" stroke="#2a2a2a" stroke-width="0.5"/>
