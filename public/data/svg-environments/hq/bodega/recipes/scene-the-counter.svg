<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Counter
       Furniture, fixtures, and decorative items only.
       No walls, floor, tile grid, or labels.
       Derived from reference/room-the-counter.svg -->

  <!-- == CEILING FAN =================================================== -->
  <ellipse cx="260" cy="44" rx="4" ry="1.5" fill="#3a3838" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="260" y1="44" x2="260" y2="48" stroke="#3a3838" stroke-width="1.2"/>
  <ellipse cx="260" cy="49" rx="5" ry="2.5" fill="#333030" stroke="#252525" stroke-width="0.6"/>
  <polygon points="265,49 280,52 279,54 264,50" fill="#3a3020" opacity="0.85"/>
  <polygon points="255,49 240,52 241,54 256,50" fill="#342c20" opacity="0.85"/>
  <polygon points="260,51 264,56 262,57 258,57 256,56" fill="#3a3020" opacity="0.8"/>
  <polygon points="260,47 264,43 262,42 258,42 256,43" fill="#342c20" opacity="0.7"/>

  <!-- == HERO: DELI DISPLAY CASE ======================================= -->
  <!-- Glass-fronted counter with visible food. Scratched but functional. -->
  <!-- Shifted up 30 px in screen-y so the footprint is centered in slot,
       matching scene-the-counter-2 placement. -->
  <!-- Case top surface -->
  <polygon points="160,118 296,186 268,200 132,132"
    fill="#3a3020" stroke="#2c2418" stroke-width="0.7"/>
  <!-- Front face (below glass) -->
  <polygon points="132,132 268,200 268,222 132,154"
    fill="#2c2418" stroke="#241c12" stroke-width="0.5"/>
  <!-- Right end face -->
  <polygon points="296,186 268,200 268,222 296,208"
    fill="#302818" stroke="#241c12" stroke-width="0.5"/>
  <!-- Glass display front (angled, translucent) -->
  <polygon points="132,132 268,200 268,188 132,120"
    fill="rgba(60,80,90,0.12)" stroke="rgba(80,100,110,0.2)" stroke-width="0.5"/>
  <!-- Glass reflections -->
  <line x1="142" y1="126" x2="178" y2="144" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
  <line x1="200" y1="162" x2="238" y2="181" stroke="rgba(255,255,255,0.05)" stroke-width="0.4"/>
  <!-- Glass scratches -->
  <line x1="164" y1="149" x2="170" y2="152" stroke="rgba(255,255,255,0.04)" stroke-width="0.3"/>
  <!-- Food silhouettes inside case -->
  <polygon points="150,148 177,161 173,164 146,150"
    fill="rgba(180,150,100,0.12)" stroke="rgba(160,130,80,0.08)" stroke-width="0.3"/>
  <polygon points="185,165 212,178 208,181 181,167"
    fill="rgba(80,130,80,0.1)" stroke="rgba(60,110,60,0.08)" stroke-width="0.3"/>
  <polygon points="163,157 192,171 189,173 160,159"
    fill="rgba(160,80,70,0.1)" stroke="rgba(140,60,50,0.06)" stroke-width="0.3"/>
  <!-- Steel top rail -->
  <line x1="132" y1="120" x2="268" y2="188" stroke="#4a4a52" stroke-width="1"/>
  <!-- Panel grooves -->
  <line x1="170" y1="151" x2="170" y2="172" stroke="#241c12" stroke-width="0.4"/>
  <line x1="206" y1="169" x2="206" y2="190" stroke="#241c12" stroke-width="0.4"/>
  <line x1="242" y1="187" x2="242" y2="208" stroke="#241c12" stroke-width="0.4"/>
  <!-- Top edge highlight -->
  <line x1="160" y1="118" x2="296" y2="186" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- == CUSTOMER STOOLS =============================================== -->
  <!-- Stool 1 -->
  <line x1="164" y1="196" x2="166" y2="182" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="174" y1="196" x2="172" y2="182" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="161" y1="192" x2="166" y2="182" stroke="#3a3020" stroke-width="1"/>
  <line x1="177" y1="192" x2="172" y2="182" stroke="#3a3020" stroke-width="1"/>
  <line x1="163" y1="190" x2="175" y2="190" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="169" cy="180" rx="7" ry="3.5" fill="#342c20" stroke="#2c2418" stroke-width="0.5"/>
  <!-- Stool 2 -->
  <line x1="220" y1="220" x2="222" y2="206" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="230" y1="220" x2="228" y2="206" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="217" y1="216" x2="222" y2="206" stroke="#3a3020" stroke-width="1"/>
  <line x1="233" y1="216" x2="228" y2="206" stroke="#3a3020" stroke-width="1"/>
  <line x1="219" y1="214" x2="231" y2="214" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="225" cy="204" rx="7" ry="3.5" fill="#342c20" stroke="#2c2418" stroke-width="0.5"/>

  <!-- == PLANT (front-left of counter, scrappy) ======================== -->
  <polygon points="130,168 136,171 142,168 136,165" fill="#2c2218"/>
  <polygon points="130,168 136,171 136,178 130,175" fill="#3d2c20" stroke="#231e18" stroke-width="0.3"/>
  <polygon points="142,168 136,171 136,178 142,175" fill="#2c2218" stroke="#231e18" stroke-width="0.3"/>
  <ellipse cx="136" cy="159" rx="8" ry="7" fill="#1a3028"/>
  <ellipse cx="132" cy="156" rx="4" ry="5" fill="#1a3028"/>
  <ellipse cx="140" cy="157" rx="3.5" ry="4" fill="#1c3830"/>
</svg>
