  <!-- Stool 1 -->
  <line x1="140" y1="218" x2="142" y2="204" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="150" y1="218" x2="148" y2="204" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="137" y1="214" x2="142" y2="204" stroke="#3a3020" stroke-width="1"/>
  <line x1="153" y1="214" x2="148" y2="204" stroke="#3a3020" stroke-width="1"/>
  <line x1="139" y1="212" x2="151" y2="212" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="145" cy="202" rx="7" ry="3.5" fill="#342c20" stroke="#2c2418" stroke-width="0.5"/>
  <!-- Stool 2 -->
  <line x1="200" y1="248" x2="202" y2="234" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="210" y1="248" x2="208" y2="234" stroke="#3a3020" stroke-width="1.2"/>
  <line x1="197" y1="244" x2="202" y2="234" stroke="#3a3020" stroke-width="1"/>
  <line x1="213" y1="244" x2="208" y2="234" stroke="#3a3020" stroke-width="1"/>
  <line x1="199" y1="242" x2="211" y2="242" stroke="#2c2418" stroke-width="0.8"/>
  <ellipse cx="205" cy="232" rx="7" ry="3.5" fill="#342c20" stroke="#2c2418" stroke-width="0.5"/>

  <!-- == PLANT (near entrance, scrappy) ================================ -->
  <polygon points="82,186 88,189 94,186 88,183" fill="#2c2218"/>
  <polygon points="82,186 88,189 88,196 82,193" fill="#3d2c20" stroke="#231e18" stroke-width="0.3"/>
  <polygon points="94,186 88,189 88,196 94,193" fill="#2c2218" stroke="#231e18" stroke-width="0.3"/>
  <ellipse cx="88" cy="178" rx="8" ry="7" fill="#1a3028"/>
  <ellipse cx="84" cy="175" rx="4" ry="5" fill="#1a3028"/>
  <ellipse cx="92" cy="176" rx="3.5" ry="4" fill="#1c3830"/>
