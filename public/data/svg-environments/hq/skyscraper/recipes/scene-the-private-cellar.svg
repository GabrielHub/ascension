      <ellipse cx="144" cy="156" rx="4" ry="1.8"/>
      <ellipse cx="96" cy="154" rx="4" ry="1.8"/>
      <ellipse cx="120" cy="166" rx="4" ry="1.8"/>
      <ellipse cx="144" cy="178" rx="4" ry="1.8"/>
      <ellipse cx="96" cy="176" rx="4" ry="1.8"/>
      <ellipse cx="120" cy="188" rx="4" ry="1.8"/>
