<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 430 320">
  <!-- Props-only scene layer: The Private Cellar, Skyscraper Penthouse floor.
       Authored footprint: 3 cols x 5 rows. Origin (200,100).
       Quiet signing room attached to the Sky Lounge: bottle racks, round
       negotiation table, leather chairs, tasting sideboard, decanter cart,
       and lockbox credenza. No walls, floors, grids, labels, or structure. -->

  <defs>
    <linearGradient id="cellarWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52331d"/>
      <stop offset="1" stop-color="#201006"/>
    </linearGradient>
    <linearGradient id="cellarLeather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a3825"/>
      <stop offset="1" stop-color="#25100a"/>
    </linearGradient>
    <radialGradient id="cellarAmber" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#f3c36b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3a1a06" stop-opacity="0"/>
    </radialGradient>
  </defs>

