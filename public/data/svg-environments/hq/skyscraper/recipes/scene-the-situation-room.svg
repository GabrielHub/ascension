<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 430 320">
  <!-- Props-only scene layer: The Situation Room, Skyscraper floor 1.
       Authored footprint: 3 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Long narrow briefing room behind the bullpen: a rectangular
       briefing table oriented north-south with six task chairs (three
       each side), two big wall-leaning situation displays at the ends,
       an intel cart, and a pinboard with active threads. No walls,
       floors, grids, or structural pieces. -->

  <defs>
    <linearGradient id="sitTableTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a434f"/>
      <stop offset="1" stop-color="#1a1f28"/>
    </linearGradient>
    <linearGradient id="sitTableFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232935"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <radialGradient id="sitScreenGlow" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#4a9cd8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#09192c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sitMapGlow" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#d6b144" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2a1e08" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Briefing table: runs from roughly c=0.3..2.7 along r=1.0..4.0.
       Long axis aligned to +r (down-left). -->
  <g id="table">
    <!-- Top (iso parallelogram) -->
    <polygon points="214,148 330,206 138,298 22,240"
      fill="url(#sitTableTop)" stroke="#0a0c12" stroke-width="0.7"/>
    <!-- Front (south-facing) apron -->
    <polygon points="22,240 138,298 138,310 22,252"
      fill="url(#sitTableFront)" stroke="#050810" stroke-width="0.5"/>
    <!-- East (right-side) apron -->
    <polygon points="330,206 138,298 138,310 330,218"
      fill="#0f141c" stroke="#050810" stroke-width="0.4"/>
    <!-- Inset map graphic (glowing city grid) -->
    <polygon points="198,164 300,216 150,288 48,236"
      fill="#0a121a" stroke="#03060a" stroke-width="0.45"/>
    <polygon points="204,170 294,216 150,286 60,240"
      fill="url(#sitMapGlow)"/>
    <!-- Thin grid on map -->
    <g stroke="#c9a34a" stroke-width="0.3" opacity="0.75">
      <line x1="222" y1="180" x2="132" y2="270"/>
      <line x1="252" y1="196" x2="156" y2="282"/>
      <line x1="276" y1="208" x2="180" y2="294"/>
      <line x1="204" y1="170" x2="60" y2="240"/>
      <line x1="240" y1="188" x2="90" y2="254"/>
      <line x1="280" y1="208" x2="120" y2="272"/>
    </g>
    <!-- Pin markers on map -->
    <circle cx="208" cy="212" r="1.6" fill="#e63d5a"/>
    <circle cx="172" cy="242" r="1.6" fill="#e63d5a"/>
    <circle cx="240" cy="226" r="1.6" fill="#3ad67a"/>
    <circle cx="128" cy="258" r="1.4" fill="#4a9cd8"/>
  </g>

  <!-- Six task chairs around the table: 3 west side, 3 east side -->
  <g id="chairs" fill="#1a1f28" stroke="#060810" stroke-width="0.3">
    <!-- West-side chairs (sit at c ~ -0.1, three positions at r 1.5, 2.5, 3.5) -->
    <!-- Seat iso parallelograms -->
    <g>
      <polygon points="132,160 160,174 148,184 120,170" fill="#2a303c"/>
      <polygon points="120,170 148,184 148,196 120,182"/>
      <polygon points="130,140 158,154 158,172 130,158" fill="#323844"/>
    </g>
    <g>
      <polygon points="84,184 112,198 100,208 72,194" fill="#2a303c"/>
      <polygon points="72,194 100,208 100,220 72,206"/>
      <polygon points="82,164 110,178 110,196 82,182" fill="#323844"/>
    </g>
    <g>
      <polygon points="36,208 64,222 52,232 24,218" fill="#2a303c"/>
      <polygon points="24,218 52,232 52,244 24,230"/>
      <polygon points="34,188 62,202 62,220 34,206" fill="#323844"/>
    </g>
    <!-- East-side chairs (sit at c ~ 3.1) -->
    <g>
      <polygon points="246,184 274,198 262,208 234,194" fill="#2a303c"/>
      <polygon points="234,194 262,208 262,220 234,206"/>
      <polygon points="244,164 272,178 272,196 244,182" fill="#323844"/>
    </g>
    <g>
      <polygon points="198,208 226,222 214,232 186,218" fill="#2a303c"/>
      <polygon points="186,218 214,232 214,244 186,230"/>
      <polygon points="196,188 224,202 224,220 196,206" fill="#323844"/>
    </g>
    <g>
      <polygon points="150,232 178,246 166,256 138,242" fill="#2a303c"/>
      <polygon points="138,242 166,256 166,268 138,254"/>
      <polygon points="148,212 176,226 176,244 148,230" fill="#323844"/>
    </g>
  </g>

  <!-- Big situation display at the north end of the table -->
  <g id="north-display">
    <polygon points="216,44 304,88 304,140 216,96"
      fill="#0a0e14" stroke="#03060a" stroke-width="0.6"/>
    <polygon points="220,48 300,88 300,136 220,96"
      fill="url(#sitScreenGlow)"/>
    <!-- Overlay grid -->
    <g stroke="#6ac4f4" stroke-width="0.3" opacity="0.65">
      <line x1="240" y1="60" x2="240" y2="116"/>
      <line x1="260" y1="70" x2="260" y2="126"/>
      <line x1="280" y1="80" x2="280" y2="136"/>
      <line x1="220" y1="70" x2="300" y2="110"/>
      <line x1="220" y1="84" x2="300" y2="124"/>
    </g>
    <!-- Stand -->
    <polygon points="252,140 272,150 272,156 252,146" fill="#0a0c12" stroke="#050607" stroke-width="0.3"/>
    <polygon points="256,140 268,146 266,154 254,148" fill="#141820"/>
  </g>

  <!-- Secondary display along north-east wall implication -->
  <g id="east-display">
    <polygon points="330,136 374,158 374,202 330,180"
      fill="#0a0e14" stroke="#03060a" stroke-width="0.55"/>
    <polygon points="332,138 372,158 372,200 332,180"
      fill="url(#sitScreenGlow)"/>
    <g stroke="#6ac4f4" stroke-width="0.3" opacity="0.6">
      <line x1="338" y1="148" x2="368" y2="162"/>
      <line x1="338" y1="160" x2="368" y2="174"/>
      <line x1="338" y1="172" x2="368" y2="186"/>
      <line x1="338" y1="184" x2="368" y2="198"/>
    </g>
  </g>

  <!-- Intel cart in the south-east corner -->
  <g id="intel-cart">
    <polygon points="196,268 230,284 216,296 182,280"
      fill="#2a303c" stroke="#0a0c12" stroke-width="0.4"/>
    <polygon points="182,280 216,296 216,308 182,292"
      fill="#14181f" stroke="#060810" stroke-width="0.35"/>
    <polygon points="216,296 230,284 230,296 216,308"
      fill="#0f131a" stroke="#030406" stroke-width="0.3"/>
    <!-- Radio set on top -->
    <polygon points="198,266 222,278 220,282 196,270" fill="#12161c" stroke="#050709" stroke-width="0.3"/>
    <rect x="208" y="262" width="4" height="6" fill="#e63d5a" transform="rotate(24 208 262)"/>
    <rect x="214" y="266" width="4" height="6" fill="#3ad67a" transform="rotate(24 214 266)"/>
    <!-- Antenna -->
    <line x1="204" y1="262" x2="212" y2="236" stroke="#6a6a6a" stroke-width="0.5"/>
    <!-- Wheels -->
    <ellipse cx="186" cy="302" rx="3.5" ry="1.8" fill="#0a0c12"/>
    <ellipse cx="212" cy="308" rx="3.5" ry="1.8" fill="#0a0c12"/>
  </g>

  <!-- Pinboard on west wall zone (upright tilted panel) -->
  <g id="pinboard">
    <polygon points="-10,132 44,160 44,220 -10,192"
      fill="#3a2a1c" stroke="#12080a" stroke-width="0.5"/>
    <polygon points="-6,136 40,160 40,216 -6,192"
      fill="#5a4028" opacity="0.9"/>
    <!-- Pinned notes -->
    <rect x="-2" y="146" width="8" height="6" fill="#efe5cc" transform="rotate(27 -2 146)"/>
    <rect x="10" y="154" width="8" height="6" fill="#c9b999" transform="rotate(27 10 154)"/>
    <rect x="22" y="162" width="8" height="6" fill="#efe5cc" transform="rotate(27 22 162)"/>
    <rect x="2" y="174" width="8" height="6" fill="#ecd478" transform="rotate(27 2 174)"/>
    <rect x="14" y="182" width="8" height="6" fill="#efe5cc" transform="rotate(27 14 182)"/>
    <!-- Red string between notes -->
    <line x1="4" y1="148" x2="16" y2="156" stroke="#c8223a" stroke-width="0.4"/>
    <line x1="16" y1="156" x2="28" y2="164" stroke="#c8223a" stroke-width="0.4"/>
    <line x1="6" y1="176" x2="18" y2="184" stroke="#c8223a" stroke-width="0.4"/>
  </g>
</svg>
