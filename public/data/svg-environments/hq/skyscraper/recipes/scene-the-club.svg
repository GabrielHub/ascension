<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 620 420">
  <!-- Props-only scene layer: The Club, Skyscraper floor 5 (Nightlife).
       Authored footprint: 7 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Loud, flashy nightlife recruitment floor: a long backlit bar
       with rows of bottles and stools along the north wall zone, a
       central iso dance-floor slab with glowing panels, a DJ booth
       in the south-east with turntables and monitor screens, a trio
       of velvet booth banquettes in the south-west, floor-standing
       speaker stacks, and velvet-rope stanchions guiding circulation.
       No walls, floors, grids, labels, or structural elements. -->

  <defs>
    <linearGradient id="clubBarTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#030409"/>
    </linearGradient>
    <linearGradient id="clubBarFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f2e"/>
      <stop offset="1" stop-color="#040609"/>
    </linearGradient>
    <radialGradient id="clubNeon" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#e84dc8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3a0a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clubCyan" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#4dd0e8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0a3a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clubAmber" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#f6a533" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3a1e08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clubVelvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a1844"/>
      <stop offset="1" stop-color="#3a0818"/>
    </linearGradient>
    <linearGradient id="clubDancePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e84dc8" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#4dd0e8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f6a533" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Dance floor slab, c=1.5..4.5, r=1.5..3.5, raised ~4px -->
  <g id="dance-floor">
    <!-- Slab top -->
    <polygon points="272,172 416,244 320,292 176,220"
      fill="#0a0e14" stroke="#03060a" stroke-width="0.7"/>
    <!-- Panel grid — alternating neon -->
    <g stroke="#000" stroke-width="0.4">
      <polygon points="272,172 320,196 296,208 248,184" fill="#e84dc8" opacity="0.55"/>
      <polygon points="320,196 368,220 344,232 296,208" fill="#4dd0e8" opacity="0.55"/>
      <polygon points="368,220 416,244 392,256 344,232" fill="#f6a533" opacity="0.55"/>
      <polygon points="248,184 296,208 272,220 224,196" fill="#4dd0e8" opacity="0.55"/>
      <polygon points="296,208 344,232 320,244 272,220" fill="#f6a533" opacity="0.55"/>
      <polygon points="344,232 392,256 368,268 320,244" fill="#e84dc8" opacity="0.55"/>
      <polygon points="224,196 272,220 248,232 200,208" fill="#f6a533" opacity="0.55"/>
      <polygon points="272,220 320,244 296,256 248,232" fill="#e84dc8" opacity="0.55"/>
      <polygon points="320,244 368,268 344,280 296,256" fill="#4dd0e8" opacity="0.55"/>
      <polygon points="200,208 248,232 224,244 176,220" fill="#e84dc8" opacity="0.55"/>
      <polygon points="248,232 296,256 272,268 224,244" fill="#4dd0e8" opacity="0.55"/>
      <polygon points="296,256 344,280 320,292 272,268" fill="#f6a533" opacity="0.55"/>
    </g>
    <!-- Slab front (south) apron -->
    <polygon points="176,220 320,292 320,298 176,226" fill="#030405" stroke="#020303" stroke-width="0.4"/>
    <polygon points="320,292 416,244 416,250 320,298" fill="#020304" stroke="#010203" stroke-width="0.35"/>
  </g>

  <!-- Bar along the north wall zone. Long axis from c=0.5 to c=5, at r~0.5.
       Counter runs along +c. Counter height ~24. -->
  <g id="bar">
    <!-- Counter top -->
    <polygon points="214,124 446,240 424,264 190,148"
      fill="url(#clubBarTop)" stroke="#020304" stroke-width="0.6"/>
    <!-- Front apron (south-facing) -->
    <polygon points="190,148 424,264 424,280 190,164"
      fill="url(#clubBarFront)" stroke="#010203" stroke-width="0.45"/>
    <!-- End cap east -->
    <polygon points="424,264 446,240 446,256 424,280" fill="#020304" stroke="#010203" stroke-width="0.3"/>
    <!-- Backlit bottle wall standing up behind the bar (upright, faces south) -->
    <polygon points="206,60 458,186 458,234 206,108"
      fill="#0a0f1a" stroke="#03060a" stroke-width="0.5"/>
    <polygon points="210,64 454,186 454,228 210,106" fill="url(#clubAmber)" opacity="0.4"/>
    <!-- Bottle rows -->
    <g>
      <g stroke="#1a1008" stroke-width="0.3">
        <polygon points="216,76 222,79 222,108 216,105" fill="#3aa0d6" opacity="0.85"/>
        <polygon points="226,81 232,84 232,113 226,110" fill="#f6a533" opacity="0.85"/>
        <polygon points="236,86 242,89 242,118 236,115" fill="#e4ecf2" opacity="0.75"/>
        <polygon points="246,91 252,94 252,123 246,120" fill="#6da050" opacity="0.85"/>
        <polygon points="256,96 262,99 262,128 256,125" fill="#e63d5a" opacity="0.85"/>
        <polygon points="266,101 272,104 272,133 266,130" fill="#f6a533" opacity="0.85"/>
        <polygon points="276,106 282,109 282,138 276,135" fill="#3aa0d6" opacity="0.85"/>
        <polygon points="286,111 292,114 292,143 286,140" fill="#ecd478" opacity="0.85"/>
        <polygon points="296,116 302,119 302,148 296,145" fill="#e84dc8" opacity="0.85"/>
        <polygon points="306,121 312,124 312,153 306,150" fill="#4dd0e8" opacity="0.85"/>
        <polygon points="316,126 322,129 322,158 316,155" fill="#f6a533" opacity="0.85"/>
        <polygon points="326,131 332,134 332,163 326,160" fill="#e4ecf2" opacity="0.75"/>
        <polygon points="336,136 342,139 342,168 336,165" fill="#6da050" opacity="0.85"/>
        <polygon points="346,141 352,144 352,173 346,170" fill="#e63d5a" opacity="0.85"/>
        <polygon points="356,146 362,149 362,178 356,175" fill="#3aa0d6" opacity="0.85"/>
        <polygon points="366,151 372,154 372,183 366,180" fill="#f6a533" opacity="0.85"/>
        <polygon points="376,156 382,159 382,188 376,185" fill="#e84dc8" opacity="0.85"/>
        <polygon points="386,161 392,164 392,193 386,190" fill="#4dd0e8" opacity="0.85"/>
        <polygon points="396,166 402,169 402,198 396,195" fill="#ecd478" opacity="0.85"/>
        <polygon points="406,171 412,174 412,203 406,200" fill="#f6a533" opacity="0.85"/>
        <polygon points="416,176 422,179 422,208 416,205" fill="#6da050" opacity="0.85"/>
        <polygon points="426,181 432,184 432,213 426,210" fill="#e63d5a" opacity="0.85"/>
        <polygon points="436,186 442,189 442,218 436,215" fill="#3aa0d6" opacity="0.85"/>
      </g>
      <!-- Lower row bottles -->
      <g stroke="#1a1008" stroke-width="0.3">
        <polygon points="218,134 224,137 224,164 218,161" fill="#ecd478" opacity="0.85"/>
        <polygon points="232,141 238,144 238,171 232,168" fill="#3aa0d6" opacity="0.85"/>
        <polygon points="246,148 252,151 252,178 246,175" fill="#e84dc8" opacity="0.85"/>
        <polygon points="260,155 266,158 266,185 260,182" fill="#f6a533" opacity="0.85"/>
        <polygon points="274,162 280,165 280,192 274,189" fill="#6da050" opacity="0.85"/>
        <polygon points="288,169 294,172 294,199 288,196" fill="#e63d5a" opacity="0.85"/>
        <polygon points="302,176 308,179 308,206 302,203" fill="#4dd0e8" opacity="0.85"/>
        <polygon points="316,183 322,186 322,213 316,210" fill="#ecd478" opacity="0.85"/>
        <polygon points="330,190 336,193 336,220 330,217" fill="#3aa0d6" opacity="0.85"/>
        <polygon points="344,197 350,200 350,227 344,224" fill="#e84dc8" opacity="0.85"/>
        <polygon points="358,204 364,207 364,234 358,231" fill="#f6a533" opacity="0.85"/>
        <polygon points="372,211 378,214 378,241 372,238" fill="#6da050" opacity="0.85"/>
      </g>
    </g>
    <!-- Brass rail under bottle wall -->
    <polygon points="210,104 454,226 454,230 210,108" fill="#c9a34a" opacity="0.85"/>
    <!-- Cash register on counter -->
    <polygon points="216,128 238,139 238,154 216,144" fill="#0a0e14" stroke="#020304" stroke-width="0.3"/>
    <polygon points="218,131 236,140 236,150 218,142" fill="#3a434e" opacity="0.85"/>
  </g>

  <!-- Three bar stools in front of bar (between bar and dance floor) -->
  <g id="stools" fill="#14181f" stroke="#020304" stroke-width="0.3">
    <g>
      <polygon points="258,160 276,169 268,174 250,165" fill="url(#clubVelvet)"/>
      <polygon points="250,165 268,174 268,182 250,173" fill="#4a081c"/>
      <line x1="259" y1="180" x2="259" y2="196" stroke="#0a0c12" stroke-width="1.2"/>
    </g>
    <g>
      <polygon points="306,184 324,193 316,198 298,189" fill="url(#clubVelvet)"/>
      <polygon points="298,189 316,198 316,206 298,197" fill="#4a081c"/>
      <line x1="307" y1="204" x2="307" y2="220" stroke="#0a0c12" stroke-width="1.2"/>
    </g>
    <g>
      <polygon points="354,208 372,217 364,222 346,213" fill="url(#clubVelvet)"/>
      <polygon points="346,213 364,222 364,230 346,221" fill="#4a081c"/>
      <line x1="355" y1="228" x2="355" y2="244" stroke="#0a0c12" stroke-width="1.2"/>
    </g>
  </g>

  <!-- DJ booth in south-east corner -->
  <g id="dj-booth">
    <!-- Raised platform -->
    <polygon points="386,268 480,316 456,340 362,292"
      fill="#1a1f28" stroke="#060810" stroke-width="0.55"/>
    <polygon points="362,292 456,340 456,352 362,304" fill="#0a0c12" stroke="#030405" stroke-width="0.4"/>
    <polygon points="456,340 480,316 480,328 456,352" fill="#050608" stroke="#020303" stroke-width="0.35"/>
    <!-- DJ console -->
    <polygon points="394,264 466,300 450,312 378,276" fill="#0a0e14" stroke="#020304" stroke-width="0.4"/>
    <polygon points="398,266 462,298 450,308 386,276" fill="#2a303c" opacity="0.8"/>
    <!-- Turntable platters -->
    <ellipse cx="412" cy="280" rx="10" ry="4" fill="#14181f" stroke="#050608" stroke-width="0.4"/>
    <ellipse cx="412" cy="280" rx="6.5" ry="2.6" fill="#3a434e"/>
    <circle cx="412" cy="280" r="1" fill="#c9a34a"/>
    <ellipse cx="444" cy="296" rx="10" ry="4" fill="#14181f" stroke="#050608" stroke-width="0.4"/>
    <ellipse cx="444" cy="296" rx="6.5" ry="2.6" fill="#3a434e"/>
    <circle cx="444" cy="296" r="1" fill="#c9a34a"/>
    <!-- Sliders between -->
    <g fill="#c9a34a" stroke="#4a3214" stroke-width="0.2">
      <rect x="424" y="278" width="2" height="6" transform="rotate(27 424 278)"/>
      <rect x="428" y="280" width="2" height="6" transform="rotate(27 428 280)"/>
      <rect x="432" y="282" width="2" height="6" transform="rotate(27 432 282)"/>
    </g>
    <!-- DJ monitor screens -->
    <polygon points="400,240 436,258 436,274 400,256" fill="#0a0e14" stroke="#020304" stroke-width="0.4"/>
    <polygon points="402,242 434,258 434,272 402,256" fill="url(#clubCyan)"/>
    <polygon points="440,256 472,272 472,288 440,272" fill="#0a0e14" stroke="#020304" stroke-width="0.4"/>
    <polygon points="442,258 470,272 470,286 442,272" fill="url(#clubNeon)"/>
    <!-- DJ's headphones hanging -->
    <path d="M 422 268 Q 428 264 436 268" fill="none" stroke="#14181f" stroke-width="1.2"/>
    <circle cx="422" cy="268" r="2" fill="#14181f"/>
    <circle cx="436" cy="268" r="2" fill="#14181f"/>
  </g>

  <!-- Speaker stacks flanking the dance floor -->
  <g id="speakers">
    <!-- Stack A north-west of dance floor -->
    <polygon points="204,160 230,173 230,232 204,220" fill="#0a0e14" stroke="#020304" stroke-width="0.5"/>
    <polygon points="206,162 228,173 228,230 206,218" fill="#14181f" opacity="0.85"/>
    <!-- Speaker cone circles (iso ellipses) -->
    <ellipse cx="216" cy="180" rx="6" ry="2.8" fill="#3a434e" stroke="#050608" stroke-width="0.3"/>
    <ellipse cx="216" cy="180" rx="3.5" ry="1.6" fill="#14181f"/>
    <ellipse cx="216" cy="198" rx="6" ry="2.8" fill="#3a434e" stroke="#050608" stroke-width="0.3"/>
    <ellipse cx="216" cy="198" rx="3.5" ry="1.6" fill="#14181f"/>
    <ellipse cx="216" cy="216" rx="6" ry="2.8" fill="#3a434e" stroke="#050608" stroke-width="0.3"/>
    <!-- Stack B south-east of dance floor -->
    <polygon points="344,272 370,285 370,344 344,332" fill="#0a0e14" stroke="#020304" stroke-width="0.5"/>
    <polygon points="346,274 368,285 368,342 346,330" fill="#14181f" opacity="0.85"/>
    <ellipse cx="356" cy="292" rx="6" ry="2.8" fill="#3a434e" stroke="#050608" stroke-width="0.3"/>
    <ellipse cx="356" cy="292" rx="3.5" ry="1.6" fill="#14181f"/>
    <ellipse cx="356" cy="310" rx="6" ry="2.8" fill="#3a434e" stroke="#050608" stroke-width="0.3"/>
    <ellipse cx="356" cy="310" rx="3.5" ry="1.6" fill="#14181f"/>
    <ellipse cx="356" cy="328" rx="6" ry="2.8" fill="#3a434e" stroke="#050608" stroke-width="0.3"/>
  </g>

  <!-- Velvet booth banquettes in south-west zone -->
  <g id="booths">
    <!-- Booth A (U-shaped curve around a table) -->
    <polygon points="64,244 140,282 116,306 40,268" fill="url(#clubVelvet)" stroke="#3a0818" stroke-width="0.45"/>
    <polygon points="40,268 116,306 116,318 40,280" fill="#4a081c" stroke="#2a050e" stroke-width="0.35"/>
    <!-- Backrest -->
    <polygon points="64,218 140,256 140,282 64,244" fill="url(#clubVelvet)" stroke="#3a0818" stroke-width="0.4"/>
    <polygon points="68,222 136,256 136,278 68,242" fill="#8a1844" opacity="0.9"/>
    <!-- Booth table -->
    <polygon points="80,268 120,288 104,298 64,278" fill="#14181f" stroke="#020304" stroke-width="0.4"/>
    <polygon points="82,270 118,288 104,294 68,278" fill="#3a434e" opacity="0.8"/>
    <!-- Cocktails on table -->
    <polygon points="86,272 92,275 92,282 86,279" fill="#f6a533" stroke="#5a3a08" stroke-width="0.25"/>
    <polygon points="100,280 106,283 106,290 100,287" fill="#e84dc8" stroke="#4a0a3a" stroke-width="0.25"/>
    <!-- Booth B smaller -->
    <polygon points="158,302 210,328 192,348 140,322" fill="url(#clubVelvet)" stroke="#3a0818" stroke-width="0.4"/>
    <polygon points="140,322 192,348 192,358 140,332" fill="#4a081c" stroke="#2a050e" stroke-width="0.3"/>
    <polygon points="158,276 210,302 210,328 158,302" fill="url(#clubVelvet)" stroke="#3a0818" stroke-width="0.35"/>
    <polygon points="162,280 206,302 206,324 162,302" fill="#8a1844" opacity="0.9"/>
  </g>

  <!-- Velvet rope stanchions guiding entry path (south-east entry zone) -->
  <g id="stanchions">
    <g>
      <polygon points="254,332 268,338 268,342 254,336" fill="#c9a34a" stroke="#5a4018" stroke-width="0.3"/>
      <rect x="259" y="310" width="2.5" height="25" fill="#c9a34a"/>
      <ellipse cx="261" cy="308" rx="3" ry="1.2" fill="#c9a34a"/>
    </g>
    <g>
      <polygon points="288,348 302,354 302,358 288,352" fill="#c9a34a" stroke="#5a4018" stroke-width="0.3"/>
      <rect x="293" y="326" width="2.5" height="25" fill="#c9a34a"/>
      <ellipse cx="295" cy="324" rx="3" ry="1.2" fill="#c9a34a"/>
    </g>
    <!-- Velvet rope curving between -->
    <path d="M 261 308 Q 278 302 295 324" fill="none" stroke="#c8223a" stroke-width="1.4"/>
    <path d="M 261 310 Q 278 304 295 326" fill="none" stroke="#8a1020" stroke-width="0.6" opacity="0.8"/>
  </g>
</svg>
