  <!-- ========== CENTER WHITEBOARD KIOSK ========== -->
  <g id="kiosk">
    <!-- Base platform -->
    <polygon points="348,208 396,232 348,256 300,232"
      fill="#2a303c" stroke="#060810" stroke-width="0.5"/>
    <polygon points="300,232 348,256 348,262 300,238" fill="#14181f" stroke="#030406" stroke-width="0.3"/>
    <polygon points="348,256 396,232 396,238 348,262" fill="#0a0c10" stroke="#020304" stroke-width="0.3"/>
    <!-- Upright whiteboard panel (tilted) -->
    <polygon points="332,140 386,168 386,216 332,188" fill="#e4ecf2" stroke="#4a5260" stroke-width="0.5"/>
    <polygon points="334,144 384,168 384,212 334,188" fill="#fafcff" opacity="0.95"/>
    <!-- Marker scribbles / pinned notes -->
    <rect x="340" y="156" width="10" height="6" fill="#ecd478" transform="rotate(27 340 156)"/>
    <rect x="356" y="164" width="10" height="6" fill="#9ad0a4" transform="rotate(27 356 164)"/>
    <rect x="345" y="174" width="10" height="6" fill="#efe5cc" transform="rotate(27 345 174)"/>
    <rect x="361" y="182" width="10" height="6" fill="#e63d5a" transform="rotate(27 361 182)"/>
    <line x1="340" y1="194" x2="376" y2="210" stroke="#2a5a6a" stroke-width="0.5"/>
    <line x1="340" y1="198" x2="368" y2="210" stroke="#2a5a6a" stroke-width="0.5"/>
  </g>

