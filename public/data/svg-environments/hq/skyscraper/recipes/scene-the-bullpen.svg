    <polygon points="248,312 280,328 280,346 248,330" fill="#0a0e14" stroke="#03060a" stroke-width="0.35"/>
    <polygon points="250,314 278,328 278,344 250,330" fill="url(#bullScreen)"/>
    <polygon points="240,354 268,368 256,376 228,362" fill="#1a1f28" stroke="#060810" stroke-width="0.3"/>
    <polygon points="228,362 256,376 256,386 228,372" fill="#0a0c12" stroke="#03060a" stroke-width="0.3"/>
    <polygon points="238,334 266,348 266,366 238,352" fill="#2a303c" stroke="#0a0c12" stroke-width="0.3"/>
