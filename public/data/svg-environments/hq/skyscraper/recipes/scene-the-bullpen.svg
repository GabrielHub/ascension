      fill="url(#bullWalnut)" stroke="#0a0503" stroke-width="0.6"/>
    <polygon points="76,120 196,180 196,240 76,180" fill="#3a2414" opacity="0.9"/>
    <!-- Drawer seams (iso parallels) -->
    <line x1="76" y1="140" x2="196" y2="200" stroke="#14080a" stroke-width="0.5"/>
    <line x1="76" y1="160" x2="196" y2="220" stroke="#14080a" stroke-width="0.5"/>
    <line x1="76" y1="180" x2="196" y2="240" stroke="#14080a" stroke-width="0.5"/>
    <!-- Vertical dividers -->
    <line x1="120" y1="140" x2="120" y2="202" stroke="#14080a" stroke-width="0.4"/>
    <line x1="160" y1="160" x2="160" y2="222" stroke="#14080a" stroke-width="0.4"/>
    <!-- Brass handles (brass dots) -->
    <circle cx="96" cy="130" r="1.2" fill="#c9a34a"/>
    <circle cx="136" cy="150" r="1.2" fill="#c9a34a"/>
    <circle cx="176" cy="170" r="1.2" fill="#c9a34a"/>
    <circle cx="96" cy="150" r="1.2" fill="#c9a34a"/>
    <circle cx="136" cy="170" r="1.2" fill="#c9a34a"/>
    <circle cx="176" cy="190" r="1.2" fill="#c9a34a"/>
    <circle cx="96" cy="170" r="1.2" fill="#c9a34a"/>
    <circle cx="136" cy="190" r="1.2" fill="#c9a34a"/>
    <circle cx="176" cy="210" r="1.2" fill="#c9a34a"/>
  </g>

  <!-- Small printer + file trays on top of credenza -->
