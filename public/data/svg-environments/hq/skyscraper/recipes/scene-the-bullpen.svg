    <rect x="115" y="112" width="18" height="2.5" fill="#0a0c12" transform="rotate(27 115 112)"/>
    <polygon points="152,128 180,142 176,150 148,136" fill="#efe5cc" stroke="#6a604a" stroke-width="0.3"/>
  </g>

  <!-- ========== COFFEE STATION SW CORNER ========== -->
