<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 620 420">
  <!-- Props-only scene layer: The Bullpen, Skyscraper floor 1.
       Authored footprint: 7 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Open-plan operator floor behind the keycard door: two rows of
       four workstations with monitors and task chairs arranged along
       the long axis, a central shared whiteboard/pinwall kiosk on the
       floor, a filing credenza along the back wall zone, a coffee
       station at the south-west, and a supervisor's podium at the
       south-east. No walls, floors, grids, or structural elements. -->

  <defs>
    <linearGradient id="bullDeskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5360"/>
      <stop offset="1" stop-color="#232935"/>
    </linearGradient>
    <linearGradient id="bullDeskFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a303c"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <linearGradient id="bullWalnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="1" stop-color="#2a1a0e"/>
    </linearGradient>
    <radialGradient id="bullScreen" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4a9cd8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#09192c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bullAmber" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#f4b070" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3a1e08" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ========== NORTH ROW DESKS (4 workstations) ========== -->
  <!-- Row at r ~ 1.5; desks span c=0.3..1.3, 1.7..2.7, 3.1..4.1, 4.5..5.5 -->

  <!-- Desk 1 (c=0.3..1.3) -->
  <g id="desk-n1">
    <!-- Top -->
    <polygon points="214,148 262,172 238,196 190,172"
      fill="url(#bullDeskTop)" stroke="#070a10" stroke-width="0.5"/>
    <!-- Front apron -->
    <polygon points="190,172 238,196 238,208 190,184"
      fill="url(#bullDeskFront)" stroke="#03060a" stroke-width="0.4"/>
    <polygon points="238,196 262,172 262,184 238,208" fill="#121820" stroke="#04060a" stroke-width="0.3"/>
    <!-- Monitor -->
    <polygon points="208,148 240,164 240,182 208,166" fill="#0a0e14" stroke="#03060a" stroke-width="0.35"/>
    <polygon points="210,150 238,164 238,180 210,166" fill="url(#bullScreen)"/>
    <!-- Chair -->
    <polygon points="200,190 228,204 216,212 188,198" fill="#1a1f28" stroke="#060810" stroke-width="0.3"/>
    <polygon points="188,198 216,212 216,222 188,208" fill="#0a0c12" stroke="#03060a" stroke-width="0.3"/>
    <polygon points="198,170 226,184 226,202 198,188" fill="#2a303c" stroke="#0a0c12" stroke-width="0.3"/>
  </g>
  <!-- Desk 2 (c=1.7..2.7) -->
  <g id="desk-n2">
    <polygon points="282,182 330,206 306,230 258,206"
      fill="url(#bullDeskTop)" stroke="#070a10" stroke-width="0.5"/>
    <polygon points="258,206 306,230 306,242 258,218"
      fill="url(#bullDeskFront)" stroke="#03060a" stroke-width="0.4"/>
    <polygon points="306,230 330,206 330,218 306,242" fill="#121820" stroke="#04060a" stroke-width="0.3"/>
    <polygon points="276,182 308,198 308,216 276,200" fill="#0a0e14" stroke="#03060a" stroke-width="0.35"/>
    <polygon points="278,184 306,198 306,214 278,200" fill="url(#bullScreen)"/>
    <polygon points="268,224 296,238 284,246 256,232" fill="#1a1f28" stroke="#060810" stroke-width="0.3"/>
    <polygon points="256,232 284,246 284,256 256,242" fill="#0a0c12" stroke="#03060a" stroke-width="0.3"/>
    <polygon points="266,204 294,218 294,236 266,222" fill="#2a303c" stroke="#0a0c12" stroke-width="0.3"/>
  </g>
  <!-- Desk 3 (c=3.1..4.1) -->
  <g id="desk-n3">
    <polygon points="350,216 398,240 374,264 326,240"
      fill="url(#bullDeskTop)" stroke="#070a10" stroke-width="0.5"/>
    <polygon points="326,240 374,264 374,276 326,252"
      fill="url(#bullDeskFront)" stroke="#03060a" stroke-width="0.4"/>
    <polygon points="374,264 398,240 398,252 374,276" fill="#121820" stroke="#04060a" stroke-width="0.3"/>
    <polygon points="344,216 376,232 376,250 344,234" fill="#0a0e14" stroke="#03060a" stroke-width="0.35"/>
    <polygon points="346,218 374,232 374,248 346,234" fill="url(#bullScreen)"/>
    <polygon points="336,258 364,272 352,280 324,266" fill="#1a1f28" stroke="#060810" stroke-width="0.3"/>
    <polygon points="324,266 352,280 352,290 324,276" fill="#0a0c12" stroke="#03060a" stroke-width="0.3"/>
    <polygon points="334,238 362,252 362,270 334,256" fill="#2a303c" stroke="#0a0c12" stroke-width="0.3"/>
  </g>
  <!-- Desk 4 (c=4.5..5.5) -->
  <g id="desk-n4">
    <polygon points="418,250 466,274 442,298 394,274"
      fill="url(#bullDeskTop)" stroke="#070a10" stroke-width="0.5"/>
    <polygon points="394,274 442,298 442,310 394,286"
      fill="url(#bullDeskFront)" stroke="#03060a" stroke-width="0.4"/>
    <polygon points="442,298 466,274 466,286 442,310" fill="#121820" stroke="#04060a" stroke-width="0.3"/>
    <polygon points="412,250 444,266 444,284 412,268" fill="#0a0e14" stroke="#03060a" stroke-width="0.35"/>
    <polygon points="414,252 442,266 442,282 414,268" fill="url(#bullScreen)"/>
    <polygon points="404,292 432,306 420,314 392,300" fill="#1a1f28" stroke="#060810" stroke-width="0.3"/>
    <polygon points="392,300 420,314 420,324 392,310" fill="#0a0c12" stroke="#03060a" stroke-width="0.3"/>
    <polygon points="402,272 430,286 430,304 402,290" fill="#2a303c" stroke="#0a0c12" stroke-width="0.3"/>
  </g>

