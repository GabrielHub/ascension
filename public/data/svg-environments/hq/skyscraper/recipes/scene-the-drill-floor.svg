<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 480 340">
  <!-- Props-only scene layer: The Drill Floor, Skyscraper Specialist Training floor.
       Authored footprint: 4 cols x 5 rows. Origin (200,100).
       Field-lead training with movable drill gear: scenario board, command
       table, comms bench, modular barricades, cone lanes, equipment crates,
       and timing lights. No walls, floors, grids, labels, or structure. -->

  <defs>
    <linearGradient id="drillRubber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35414c"/>
      <stop offset="1" stop-color="#151b22"/>
    </linearGradient>
    <linearGradient id="drillOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee8f42"/>
      <stop offset="1" stop-color="#8c3f14"/>
    </linearGradient>
    <radialGradient id="drillLight" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#7fd6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a304a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="scenario-board">
    <polygon points="82,88 194,144 194,214 82,158" fill="#1b242c" stroke="#080c10" stroke-width="0.55"/>
    <polygon points="88,96 188,146 188,202 88,152" fill="#243747" stroke="#0e151d" stroke-width="0.35"/>
    <polyline points="98,130 126,144 142,136 166,148 178,140" fill="none" stroke="#74c2e8" stroke-width="1.2" opacity="0.8"/>
    <polyline points="104,148 132,162 150,154 180,169" fill="none" stroke="#e8a84e" stroke-width="1.1" opacity="0.8"/>
    <g fill="#d6e8f2" opacity="0.8">
      <circle cx="110" cy="124" r="2"/>
      <circle cx="142" cy="140" r="2"/>
      <circle cx="170" cy="154" r="2"/>
    </g>
  </g>

  <g id="command-table">
    <polygon points="166,178 270,230 222,254 118,202" fill="#202833" stroke="#080c11" stroke-width="0.55"/>
    <polygon points="122,202 222,252 222,267 122,217" fill="#11161c" stroke="#06080b" stroke-width="0.4"/>
    <polygon points="270,230 222,254 222,267 270,243" fill="#0b0e12" stroke="#040506" stroke-width="0.35"/>
    <polygon points="178,190 246,224 218,238 150,204" fill="#415061" opacity="0.75"/>
    <polygon points="188,196 210,207 202,212 180,201" fill="#e9d67d" stroke="#6b5820" stroke-width="0.25"/>
    <polygon points="218,212 240,223 232,228 210,217" fill="#74c2e8" stroke="#21485a" stroke-width="0.25"/>
    <ellipse cx="198" cy="226" rx="11" ry="4" fill="url(#drillLight)" opacity="0.7"/>
  </g>

  <g id="comms-bench">
    <polygon points="282,154 374,200 350,216 258,170" fill="#222a32" stroke="#0a0d11" stroke-width="0.45"/>
    <polygon points="258,170 350,216 350,230 258,184" fill="#11161b" stroke="#05070a" stroke-width="0.35"/>
    <g>
      <polygon points="286,158 310,170 310,188 286,176" fill="#0e141b" stroke="#020304" stroke-width="0.3"/>
      <polygon points="318,174 342,186 342,204 318,192" fill="#0e141b" stroke="#020304" stroke-width="0.3"/>
      <polygon points="350,190 366,198 366,212 350,204" fill="#0e141b" stroke="#020304" stroke-width="0.3"/>
      <line x1="296" y1="184" x2="302" y2="198" stroke="#4d9fc0" stroke-width="1"/>
      <line x1="328" y1="200" x2="334" y2="214" stroke="#4d9fc0" stroke-width="1"/>
    </g>
  </g>

  <g id="movable-barricades" fill="url(#drillRubber)" stroke="#07090c" stroke-width="0.4">
    <polygon points="64,220 140,258 124,270 48,232"/>
    <polygon points="48,232 124,270 124,286 48,248" fill="#121920"/>
    <polygon points="274,250 350,288 334,300 258,262"/>
    <polygon points="258,262 334,300 334,316 258,278" fill="#121920"/>
    <polygon points="216,132 274,161 258,173 200,144"/>
    <polygon points="200,144 258,173 258,187 200,158" fill="#121920"/>
  </g>

  <g id="cones-and-lights">
    <g fill="url(#drillOrange)" stroke="#4a1705" stroke-width="0.25">
      <polygon points="96,188 108,194 102,202"/>
      <polygon points="144,212 156,218 150,226"/>
      <polygon points="192,236 204,242 198,250"/>
      <polygon points="308,214 320,220 314,228"/>
      <polygon points="356,238 368,244 362,252"/>
    </g>
    <g>
      <line x1="82" y1="162" x2="82" y2="222" stroke="#1b222b" stroke-width="2"/>
      <ellipse cx="82" cy="158" rx="7" ry="3" fill="url(#drillLight)"/>
      <line x1="374" y1="230" x2="374" y2="294" stroke="#1b222b" stroke-width="2"/>
      <ellipse cx="374" cy="226" rx="7" ry="3" fill="url(#drillLight)"/>
    </g>
  </g>

  <g id="equipment-crates">
    <polygon points="34,260 74,280 58,290 18,270" fill="#27313b" stroke="#0b0f13" stroke-width="0.35"/>
    <polygon points="18,270 58,290 58,306 18,286" fill="#151c23" stroke="#07090c" stroke-width="0.3"/>
    <polygon points="74,280 58,290 58,306 74,296" fill="#10161c" stroke="#05070a" stroke-width="0.25"/>
    <polygon points="64,282 104,302 88,312 48,292" fill="#2d382f" stroke="#0c120d" stroke-width="0.35"/>
    <polygon points="48,292 88,312 88,326 48,306" fill="#172016" stroke="#070a06" stroke-width="0.3"/>
  </g>
</svg>
