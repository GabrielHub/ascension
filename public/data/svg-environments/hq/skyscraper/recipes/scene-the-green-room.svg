<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 430 320">
  <!-- Props-only scene layer: The Green Room, Skyscraper Nightlife floor.
       Authored footprint: 3 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Backstage decompression room: private bar, vanity station, lockers,
       garment rack, soft sectional seating, low table, mini-fridge, and a
       quiet kit bench. No walls, floors, grids, room outlines, or structure. -->

  <defs>
    <linearGradient id="greenVelvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#314f43"/>
      <stop offset="1" stop-color="#14251f"/>
    </linearGradient>
    <linearGradient id="greenBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6b35f"/>
      <stop offset="1" stop-color="#806020"/>
    </linearGradient>
    <radialGradient id="greenMirrorGlow" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#4a2a08" stop-opacity="0"/>
