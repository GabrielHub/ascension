<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 480 340">
  <!-- Props-only scene layer: The Dojo, Skyscraper floor 2.
       Authored footprint: 4 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       General operator conditioning: a cluster of floor mats making a
       training square in the center, a heavy bag on a steel stand, a
       wooden weapons rack with bokken and jo, a standing striking
       dummy, a water cooler, and a low bench for kit along the wall.
       No walls, floors, tile grids, labels, or structural elements. -->

  <defs>
    <linearGradient id="dojoMat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4a5c"/>
      <stop offset="1" stop-color="#1e2734"/>
    </linearGradient>
    <linearGradient id="dojoMatAlt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a3c2a"/>
      <stop offset="1" stop-color="#33180e"/>
    </linearGradient>
    <linearGradient id="dojoWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4828"/>
      <stop offset="1" stop-color="#2e1a0c"/>
    </linearGradient>
    <linearGradient id="dojoSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a848e"/>
      <stop offset="1" stop-color="#2a323c"/>
    </linearGradient>
  </defs>

  <!-- Training mat cluster. Four 2x2 mats arranged in a 2x2 grid, alternating. -->
  <!-- Mat A (c=0.5-2.5, r=1.5-3.5): iso corners
       (0.5,1.5)=(152,148), (2.5,1.5)=(248,196),
       (2.5,3.5)=(152,244), (0.5,3.5)=(56,196) -->
  <g id="mat-a">
    <polygon points="152,148 248,196 152,244 56,196"
      fill="url(#dojoMat)" stroke="#0a0e18" stroke-width="0.5"/>
    <!-- Cross seam -->
    <line x1="200" y1="172" x2="104" y2="220" stroke="#1a232c" stroke-width="0.5"/>
    <line x1="104" y1="172" x2="200" y2="220" stroke="#1a232c" stroke-width="0.5"/>
  </g>
  <!-- Mat B (c=0.5-2.5, r=3.5-5): same across -->
  <!-- actually we need one more aligned block; keep 2x2 central -->
  <g id="mat-b">
    <polygon points="248,196 344,244 248,292 152,244"
      fill="url(#dojoMatAlt)" stroke="#10070a" stroke-width="0.5"/>
    <line x1="296" y1="220" x2="200" y2="268" stroke="#2a120a" stroke-width="0.5"/>
    <line x1="200" y1="220" x2="296" y2="268" stroke="#2a120a" stroke-width="0.5"/>
  </g>

  <!-- Heavy bag on a steel stand (north-east corner zone) -->
  <g id="heavy-bag">
    <!-- Steel stand base (iso parallelogram) -->
    <polygon points="296,148 336,168 320,184 280,164"
      fill="url(#dojoSteel)" stroke="#0a0e14" stroke-width="0.45"/>
    <polygon points="280,164 320,184 320,192 280,172"
      fill="#3a434e" stroke="#05080b" stroke-width="0.35"/>
    <!-- Stand upright -->
    <rect x="305" y="90" width="3.2" height="75" fill="#3a434e"/>
    <!-- Stand arm -->
    <line x1="307" y1="92" x2="296" y2="88" stroke="#5a6370" stroke-width="1.5"/>
    <!-- Chain -->
    <line x1="296" y1="88" x2="296" y2="112" stroke="#7a8490" stroke-width="0.6"/>
    <!-- Heavy bag (vertical cylinder) -->
    <polygon points="286,112 306,120 306,188 286,180" fill="#3a2414" stroke="#1a0e06" stroke-width="0.45"/>
    <polygon points="288,114 304,120 304,186 288,180" fill="#5a3a22" opacity="0.9"/>
    <!-- Strap bands -->
    <line x1="287" y1="128" x2="305" y2="135" stroke="#2a1808" stroke-width="0.8"/>
    <line x1="287" y1="150" x2="305" y2="157" stroke="#2a1808" stroke-width="0.8"/>
    <line x1="287" y1="172" x2="305" y2="179" stroke="#2a1808" stroke-width="0.8"/>
  </g>

  <!-- Wooden weapons rack along the back (col 0 side, r 0-2 zone) -->
  <g id="weapons-rack">
    <polygon points="80,116 170,162 170,232 80,186"
      fill="url(#dojoWood)" stroke="#0a0604" stroke-width="0.55"/>
    <polygon points="84,120 166,162 166,224 84,182"
      fill="#3a2414" opacity="0.9"/>
    <!-- Horizontal shelf slats -->
    <line x1="84" y1="140" x2="166" y2="182" stroke="#14080a" stroke-width="0.5"/>
    <line x1="84" y1="174" x2="166" y2="216" stroke="#14080a" stroke-width="0.5"/>
    <!-- Bokken (wooden swords) leaned diagonally -->
    <g stroke="#b08a58" stroke-width="1.2" stroke-linecap="round">
      <line x1="90" y1="166" x2="162" y2="116"/>
      <line x1="94" y1="170" x2="166" y2="120"/>
      <line x1="98" y1="174" x2="170" y2="124"/>
    </g>
    <!-- Jo staves (thinner) -->
    <g stroke="#8a6a3a" stroke-width="0.9" stroke-linecap="round">
      <line x1="90" y1="200" x2="162" y2="150"/>
      <line x1="94" y1="204" x2="166" y2="154"/>
    </g>
    <!-- Hanging pegs highlight -->
    <circle cx="94" cy="168" r="1.2" fill="#c9a34a"/>
    <circle cx="94" cy="202" r="1.2" fill="#c9a34a"/>
  </g>

  <!-- Standing striking dummy (south-west corner of mat) -->
  <g id="dummy">
    <!-- Weighted base -->
    <polygon points="40,260 76,278 62,290 26,272"
      fill="url(#dojoSteel)" stroke="#0a0e14" stroke-width="0.4"/>
    <polygon points="26,272 62,290 62,298 26,280"
      fill="#1a1f28" stroke="#05080b" stroke-width="0.3"/>
    <!-- Body pole -->
    <rect x="48" y="214" width="3.2" height="50" fill="#3a434e"/>
    <!-- Torso (iso vertical cylinder) -->
    <polygon points="40,214 60,222 60,264 40,256" fill="#6a3c2a" stroke="#1a0e06" stroke-width="0.45"/>
    <polygon points="42,216 58,222 58,262 42,256" fill="#8a5a3a" opacity="0.9"/>
    <!-- Head sphere -->
    <ellipse cx="50" cy="208" rx="8" ry="6" fill="#6a3c2a" stroke="#1a0e06" stroke-width="0.35"/>
    <ellipse cx="50" cy="206" rx="6" ry="4" fill="#8a5a3a" opacity="0.85"/>
    <!-- Strap bands -->
    <line x1="41" y1="230" x2="59" y2="236" stroke="#2a1808" stroke-width="0.8"/>
    <line x1="41" y1="245" x2="59" y2="251" stroke="#2a1808" stroke-width="0.8"/>
  </g>

  <!-- Water cooler (north-west of mat zone) -->
  <g id="water-cooler">
    <!-- Body -->
    <polygon points="240,114 268,128 268,188 240,174"
      fill="url(#dojoSteel)" stroke="#0a0e14" stroke-width="0.4"/>
    <polygon points="242,116 266,128 266,182 242,172" fill="#9aa4b0" opacity="0.8"/>
    <!-- Big jug on top -->
    <polygon points="238,96 270,112 268,124 240,110" fill="#c0d8e8" stroke="#3a5a6a" stroke-width="0.35"/>
    <polygon points="242,100 266,112 264,118 244,108" fill="#6ab0d8" opacity="0.7"/>
    <!-- Tap -->
    <rect x="252" y="150" width="3" height="6" fill="#e63d5a" transform="rotate(24 252 150)"/>
    <!-- Small drip tray -->
    <polygon points="240,176 268,190 266,194 240,180" fill="#3a434e"/>
  </g>

  <!-- Low bench (south-east, against wall) -->
  <g id="bench">
    <polygon points="230,250 330,300 316,312 216,262"
      fill="url(#dojoWood)" stroke="#0a0604" stroke-width="0.5"/>
    <polygon points="216,262 316,312 316,322 216,272"
      fill="#2a1808" stroke="#080302" stroke-width="0.4"/>
    <polygon points="316,312 330,300 330,310 316,322"
      fill="#14080a" stroke="#050302" stroke-width="0.3"/>
    <!-- Folded gi on bench -->
    <polygon points="246,260 276,274 268,282 238,268" fill="#fafcff" stroke="#7a8490" stroke-width="0.3"/>
    <polygon points="250,264 272,272 266,278 244,270" fill="#d8dde5" opacity="0.85"/>
    <!-- Black belt -->
    <line x1="260" y1="268" x2="278" y2="276" stroke="#14181e" stroke-width="1.5"/>
    <!-- Gloves -->
    <polygon points="292,276 312,286 306,294 286,284" fill="#c8223a" stroke="#4a0d14" stroke-width="0.35"/>
    <polygon points="294,278 310,286 306,292 290,284" fill="#e63d5a" opacity="0.9"/>
  </g>
</svg>
