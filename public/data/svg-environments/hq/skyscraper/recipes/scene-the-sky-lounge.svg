<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 620 420">
  <!-- Props-only scene layer: The Sky Lounge, Skyscraper Penthouse floor.
       Authored footprint: 7 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Penthouse entertaining lounge: long marble bar with backlit bottle
       wall along the back, a sculptural pendant, deep L-banquette and
       chaise seating around a low smoked-glass cocktail table, a grand
       potted palm pair framing the entry, a standing floor lamp, and a
       polished floor inlay medallion. No walls, floors, tile grids, room
       outlines, or structural elements. -->

  <defs>
    <linearGradient id="skyMarble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee5d0"/>
      <stop offset="0.55" stop-color="#c6b898"/>
      <stop offset="1" stop-color="#8a7d62"/>
    </linearGradient>
    <linearGradient id="skyBarFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1e14"/>
      <stop offset="1" stop-color="#120b06"/>
    </linearGradient>
    <linearGradient id="skyVelvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e2d4a"/>
      <stop offset="1" stop-color="#1e1225"/>
    </linearGradient>
    <radialGradient id="skyAmberGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#f4d080" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#b27432" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#583616" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skyFloorSheen" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d8c69a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d8c69a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Polished floor inlay sheen -->
  <polygon points="240,220 408,304 264,376 96,292"
    fill="url(#skyFloorSheen)" opacity="0.9"/>

  <!-- Subtle circular medallion on the floor (iso ellipse, not a cast shadow) -->
  <ellipse cx="252" cy="304" rx="42" ry="15" fill="none" stroke="#8a7d5a" stroke-width="0.6" opacity="0.6"/>
  <ellipse cx="252" cy="304" rx="28" ry="10" fill="none" stroke="#a6986a" stroke-width="0.5" opacity="0.55"/>
  <ellipse cx="252" cy="304" rx="14" ry="5" fill="none" stroke="#c9b97c" stroke-width="0.45" opacity="0.5"/>

  <!-- Long marble bar along the back-north edge (cols 2-6, row 0 zone) -->
  <g id="bar">
    <!-- Back wall bottle shelving -->
    <polygon points="272,60 488,168 488,196 272,88" fill="#2a1e14" stroke="#100805" stroke-width="0.55"/>
    <polygon points="276,66 484,170 484,190 276,86" fill="#120a06" stroke="#080403" stroke-width="0.4"/>
    <!-- Back-bar LED strip -->
    <polygon points="280,76 480,176 480,180 280,80" fill="url(#skyAmberGlow)" opacity="0.75"/>
    <!-- Shelves with bottle rows -->
    <line x1="280" y1="90" x2="480" y2="190" stroke="#2a1e14" stroke-width="0.6"/>
    <line x1="280" y1="104" x2="480" y2="204" stroke="#2a1e14" stroke-width="0.6"/>
    <line x1="280" y1="118" x2="480" y2="218" stroke="#2a1e14" stroke-width="0.6"/>
    <line x1="280" y1="132" x2="480" y2="232" stroke="#2a1e14" stroke-width="0.6"/>
    <!-- Rows of bottles (small verticals in varied ambers/emeralds) -->
    <g id="bottles-row1">
      <rect x="288" y="82" width="2.4" height="8" fill="#b8752a"/>
      <rect x="296" y="86" width="2.4" height="8" fill="#6a3222"/>
      <rect x="304" y="90" width="2.4" height="8" fill="#d89c5c"/>
      <rect x="312" y="94" width="2.4" height="8" fill="#3a5c3c"/>
      <rect x="320" y="98" width="2.4" height="8" fill="#b8752a"/>
      <rect x="328" y="102" width="2.4" height="8" fill="#8a5a2a"/>
      <rect x="336" y="106" width="2.4" height="8" fill="#c5d8ec"/>
      <rect x="344" y="110" width="2.4" height="8" fill="#6a3222"/>
      <rect x="352" y="114" width="2.4" height="8" fill="#d89c5c"/>
      <rect x="360" y="118" width="2.4" height="8" fill="#3a5c3c"/>
      <rect x="368" y="122" width="2.4" height="8" fill="#b8752a"/>
      <rect x="376" y="126" width="2.4" height="8" fill="#8a5a2a"/>
      <rect x="384" y="130" width="2.4" height="8" fill="#c5d8ec"/>
      <rect x="392" y="134" width="2.4" height="8" fill="#6a3222"/>
      <rect x="400" y="138" width="2.4" height="8" fill="#b8752a"/>
      <rect x="408" y="142" width="2.4" height="8" fill="#3a5c3c"/>
      <rect x="416" y="146" width="2.4" height="8" fill="#d89c5c"/>
      <rect x="424" y="150" width="2.4" height="8" fill="#6a3222"/>
      <rect x="432" y="154" width="2.4" height="8" fill="#b8752a"/>
      <rect x="440" y="158" width="2.4" height="8" fill="#8a5a2a"/>
      <rect x="448" y="162" width="2.4" height="8" fill="#d89c5c"/>
      <rect x="456" y="166" width="2.4" height="8" fill="#3a5c3c"/>
      <rect x="464" y="170" width="2.4" height="8" fill="#b8752a"/>
      <rect x="472" y="174" width="2.4" height="8" fill="#c5d8ec"/>
    </g>
    <g id="bottles-row2">
      <rect x="288" y="96" width="2.4" height="8" fill="#6a3222"/>
      <rect x="296" y="100" width="2.4" height="8" fill="#b8752a"/>
      <rect x="304" y="104" width="2.4" height="8" fill="#d89c5c"/>
      <rect x="312" y="108" width="2.4" height="8" fill="#c5d8ec"/>
      <rect x="320" y="112" width="2.4" height="8" fill="#8a5a2a"/>
      <rect x="328" y="116" width="2.4" height="8" fill="#3a5c3c"/>
      <rect x="336" y="120" width="2.4" height="8" fill="#b8752a"/>
      <rect x="344" y="124" width="2.4" height="8" fill="#6a3222"/>
      <rect x="352" y="128" width="2.4" height="8" fill="#d89c5c"/>
      <rect x="360" y="132" width="2.4" height="8" fill="#3a5c3c"/>
      <rect x="368" y="136" width="2.4" height="8" fill="#b8752a"/>
      <rect x="376" y="140" width="2.4" height="8" fill="#8a5a2a"/>
      <rect x="384" y="144" width="2.4" height="8" fill="#c5d8ec"/>
      <rect x="392" y="148" width="2.4" height="8" fill="#6a3222"/>
      <rect x="400" y="152" width="2.4" height="8" fill="#d89c5c"/>
      <rect x="408" y="156" width="2.4" height="8" fill="#b8752a"/>
      <rect x="416" y="160" width="2.4" height="8" fill="#3a5c3c"/>
      <rect x="424" y="164" width="2.4" height="8" fill="#8a5a2a"/>
      <rect x="432" y="168" width="2.4" height="8" fill="#b8752a"/>
      <rect x="440" y="172" width="2.4" height="8" fill="#c5d8ec"/>
      <rect x="448" y="176" width="2.4" height="8" fill="#d89c5c"/>
      <rect x="456" y="180" width="2.4" height="8" fill="#6a3222"/>
      <rect x="464" y="184" width="2.4" height="8" fill="#b8752a"/>
      <rect x="472" y="188" width="2.4" height="8" fill="#8a5a2a"/>
    </g>

    <!-- Bar counter top (marble slab) -->
    <polygon points="296,160 496,260 456,280 256,180"
      fill="url(#skyMarble)" stroke="#5a4d34" stroke-width="0.6"/>
    <!-- Bar counter front face -->
    <polygon points="256,180 456,280 456,306 256,206"
      fill="url(#skyBarFront)" stroke="#080403" stroke-width="0.5"/>
    <!-- East end face -->
    <polygon points="456,280 496,260 496,286 456,306"
      fill="#0b0503" stroke="#060302" stroke-width="0.4"/>
    <!-- Brass kick rail -->
    <polygon points="268,202 448,292 448,296 268,206" fill="#c9a354" opacity="0.85"/>
    <!-- Accessories on counter -->
    <ellipse cx="320" cy="200" rx="4" ry="1.6" fill="#c5d8ec" opacity="0.7"/>
    <ellipse cx="320" cy="199" rx="2.4" ry="0.9" fill="#b8752a"/>
    <ellipse cx="360" cy="220" rx="4" ry="1.6" fill="#c5d8ec" opacity="0.7"/>
    <ellipse cx="360" cy="219" rx="2.4" ry="0.9" fill="#b8752a"/>
    <ellipse cx="400" cy="240" rx="5" ry="2" fill="#c5d8ec" opacity="0.7" stroke="#4a5a6b" stroke-width="0.3"/>
    <ellipse cx="400" cy="238" rx="3" ry="1.2" fill="#b8752a" opacity="0.9"/>
    <!-- Small plated appetizer -->
    <ellipse cx="436" cy="260" rx="6" ry="2.4" fill="#ece3cc" stroke="#8a8170" stroke-width="0.3"/>
    <circle cx="436" cy="259" r="1.6" fill="#c56a4a"/>
  </g>

  <!-- Sculptural pendant (iso-anchored hanging fixture above bar) -->
  <g id="pendant">
    <line x1="380" y1="20" x2="380" y2="60" stroke="#1a1510" stroke-width="1.2"/>
    <ellipse cx="380" cy="64" rx="24" ry="8" fill="#3a2e1e" stroke="#1a1208" stroke-width="0.5"/>
    <ellipse cx="380" cy="64" rx="18" ry="6" fill="url(#skyAmberGlow)"/>
    <ellipse cx="380" cy="66" rx="12" ry="4" fill="#f4d080" opacity="0.75"/>
  </g>

  <!-- L-shaped velvet banquette (cols 0-2, rows 3-4 zone) -->
  <g id="banquette">
    <!-- West segment: long back along c-axis -->
    <polygon points="96,240 216,300 200,310 80,250"
      fill="url(#skyVelvet)" stroke="#0c0611" stroke-width="0.5"/>
    <polygon points="80,250 200,310 200,324 80,264"
      fill="#1e1225" stroke="#060308" stroke-width="0.4"/>
    <!-- West backrest -->
    <polygon points="96,216 216,276 216,300 96,240"
      fill="#4a3a58" stroke="#100812" stroke-width="0.5"/>
    <polygon points="98,220 214,276 214,296 98,238"
      fill="#5a4668" opacity="0.85"/>
    <!-- Tufting buttons on backrest -->
    <circle cx="118" cy="236" r="1" fill="#130810"/>
    <circle cx="144" cy="248" r="1" fill="#130810"/>
    <circle cx="170" cy="260" r="1" fill="#130810"/>
    <circle cx="196" cy="272" r="1" fill="#130810"/>
    <!-- South segment: perpendicular arm along r-axis (going south-west) -->
    <polygon points="80,252 120,272 64,308 24,288"
      fill="url(#skyVelvet)" stroke="#0c0611" stroke-width="0.5"/>
    <polygon points="24,288 64,308 64,322 24,302"
      fill="#1e1225" stroke="#060308" stroke-width="0.4"/>
    <!-- South backrest -->
    <polygon points="64,232 104,252 120,272 80,252"
      fill="#4a3a58" stroke="#100812" stroke-width="0.5"/>
    <polygon points="66,236 102,254 118,270 82,252"
      fill="#5a4668" opacity="0.85"/>
    <!-- Seat cushions (top highlights) -->
    <polygon points="116,256 140,268 140,274 116,262" fill="#6a5578" opacity="0.85"/>
    <polygon points="152,274 176,286 176,292 152,280" fill="#6a5578" opacity="0.85"/>
  </g>

  <!-- Chaise lounge to the east side (col 4-5, row 3 zone) -->
  <g id="chaise">
    <polygon points="316,280 412,328 384,342 288,294"
      fill="url(#skyVelvet)" stroke="#0c0611" stroke-width="0.5"/>
    <polygon points="288,294 384,342 384,352 288,304"
      fill="#1e1225" stroke="#060308" stroke-width="0.4"/>
    <!-- Upright headrest on the east end -->
    <polygon points="380,308 412,328 412,292 380,276"
      fill="#4a3a58" stroke="#100812" stroke-width="0.5"/>
    <polygon points="382,312 410,328 410,296 382,282"
      fill="#5a4668" opacity="0.85"/>
    <!-- Bolster pillow -->
    <polygon points="300,300 340,320 328,328 288,308" fill="#8a7d62" stroke="#3a3324" stroke-width="0.35"/>
  </g>

  <!-- Low smoked-glass cocktail table between banquette and chaise -->
  <g id="cocktail-table">
    <!-- Top -->
    <polygon points="248,272 312,304 280,320 216,288"
      fill="#1a1218" opacity="0.65" stroke="#090509" stroke-width="0.5"/>
    <polygon points="248,272 312,304 280,320 216,288"
      fill="url(#skyFloorSheen)" opacity="0.55"/>
    <!-- Frame rim -->
    <polyline points="248,272 312,304 280,320 216,288 248,272"
      fill="none" stroke="#c9a354" stroke-width="0.9"/>
    <!-- Decanter and glasses on top -->
    <polygon points="256,288 266,293 266,302 256,297" fill="#c5d8ec" opacity="0.6" stroke="#4a5a6b" stroke-width="0.35"/>
    <polygon points="258,290 264,293 264,298 258,295" fill="#b8752a" opacity="0.85"/>
    <polygon points="272,300 280,304 280,310 272,306" fill="#c5d8ec" opacity="0.55" stroke="#4a5a6b" stroke-width="0.3"/>
    <polygon points="286,308 294,312 294,318 286,314" fill="#c5d8ec" opacity="0.55" stroke="#4a5a6b" stroke-width="0.3"/>
    <!-- Thin brass legs -->
    <line x1="228" y1="288" x2="228" y2="308" stroke="#c9a354" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="300" y1="320" x2="300" y2="340" stroke="#c9a354" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="266" y1="320" x2="266" y2="340" stroke="#c9a354" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- North-east potted palm (c=6, r=0 zone) -->
  <g id="palm-ne">
    <polygon points="472,216 496,228 496,244 472,232"
      fill="#2b1e14" stroke="#12080a" stroke-width="0.5"/>
    <polygon points="496,228 520,216 520,232 496,244"
      fill="#1c120a" stroke="#0a0505" stroke-width="0.5"/>
    <polygon points="472,216 496,204 520,216 496,228"
      fill="#3a2414" stroke="#19100a" stroke-width="0.5"/>
    <line x1="496" y1="204" x2="496" y2="136" stroke="#5a3a22" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="496,140 516,130 526,114 502,128" fill="#3d6a3a" stroke="#1e3a1e" stroke-width="0.4"/>
    <polygon points="496,140 476,130 466,114 490,128" fill="#2f5a2f" stroke="#1a2e1a" stroke-width="0.4"/>
    <polygon points="496,136 510,116 504,108 488,122" fill="#4a7a42" stroke="#1e3a1e" stroke-width="0.4"/>
    <polygon points="496,136 482,116 488,108 504,122" fill="#3a6a36" stroke="#1a2e1a" stroke-width="0.4"/>
    <polygon points="496,136 516,138 532,132 498,132" fill="#2f5a2f" opacity="0.9"/>
    <polygon points="496,136 476,138 460,132 494,132" fill="#3a6a36" opacity="0.9"/>
  </g>

  <!-- South-west potted palm (c=0, r=4 zone) -->
  <g id="palm-sw">
    <polygon points="-16,232 8,244 8,260 -16,248"
      fill="#2b1e14" stroke="#12080a" stroke-width="0.5"/>
    <polygon points="8,244 32,232 32,248 8,260"
      fill="#1c120a" stroke="#0a0505" stroke-width="0.5"/>
    <polygon points="-16,232 8,220 32,232 8,244"
      fill="#3a2414" stroke="#19100a" stroke-width="0.5"/>
    <line x1="8" y1="220" x2="8" y2="152" stroke="#5a3a22" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="8,156 28,146 38,130 14,144" fill="#3d6a3a" stroke="#1e3a1e" stroke-width="0.4"/>
    <polygon points="8,156 -12,146 -22,130 2,144" fill="#2f5a2f" stroke="#1a2e1a" stroke-width="0.4"/>
    <polygon points="8,152 22,132 16,124 0,138" fill="#4a7a42" stroke="#1e3a1e" stroke-width="0.4"/>
    <polygon points="8,152 -6,132 0,124 16,138" fill="#3a6a36" stroke="#1a2e1a" stroke-width="0.4"/>
    <polygon points="8,152 28,154 44,148 10,148" fill="#2f5a2f" opacity="0.9"/>
    <polygon points="8,152 -12,154 -28,148 6,148" fill="#3a6a36" opacity="0.9"/>
  </g>

  <!-- Standing floor lamp (between banquette and chaise, near entry) -->
  <g id="floor-lamp">
    <polygon points="140,316 164,324 164,326 140,318" fill="#1a1510" stroke="#080503" stroke-width="0.3"/>
    <line x1="152" y1="320" x2="152" y2="256" stroke="#1a1510" stroke-width="1.4"/>
    <ellipse cx="152" cy="252" rx="14" ry="5" fill="#2a1f12" stroke="#100805" stroke-width="0.4"/>
    <ellipse cx="152" cy="252" rx="9" ry="3.2" fill="url(#skyAmberGlow)"/>
    <ellipse cx="152" cy="252" rx="5" ry="1.8" fill="#f4d080" opacity="0.9"/>
  </g>

  <!-- Abstract sculpture on counter (corner accent) -->
  <g id="sculpture">
    <polygon points="280,176 288,180 286,166 280,164" fill="#c9a354" stroke="#5a401c" stroke-width="0.4"/>
    <polygon points="288,180 296,176 296,162 288,166" fill="#a6823c" stroke="#3e2a14" stroke-width="0.35"/>
    <polygon points="280,164 288,160 296,162 288,166" fill="#d6b060" stroke="#5a401c" stroke-width="0.35"/>
  </g>
</svg>
