<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 360 290">
  <!-- Props-only scene layer: The Compliance Office, Skyscraper floor 7.
       Authored footprint: 2 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Narrow records office: a bank of steel filing cabinets along the back,
       a document-safe on the floor, a compact legal desk with reading lamp
       and stacks of folders, a guest chair, a tall legal bookshelf against
       the south-west wall, and an audit binder cart. No walls, floors, tile
       grids, room outlines, or structural elements. -->

  <defs>
    <linearGradient id="compSteelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a929c"/>
      <stop offset="1" stop-color="#535963"/>
    </linearGradient>
    <linearGradient id="compSteelFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555c66"/>
      <stop offset="1" stop-color="#2a2f36"/>
    </linearGradient>
    <radialGradient id="compLampGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#f4e3a0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8a6a24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bank of filing cabinets against the back-north wall (row 0, col 0-2) -->
  <g id="file-cabinets">
    <!-- Cabinet block top -->
    <polygon points="200,112 288,156 272,168 184,124"
      fill="url(#compSteelTop)" stroke="#262b32" stroke-width="0.5"/>
    <!-- Front face -->
    <polygon points="184,124 272,168 272,198 184,154"
      fill="url(#compSteelFront)" stroke="#0e1114" stroke-width="0.45"/>
    <!-- East end face -->
    <polygon points="272,168 288,156 288,188 272,198"
      fill="#1e232a" stroke="#0a0d11" stroke-width="0.4"/>
    <!-- Drawer dividers (three drawers stacked vertically, three across horizontally) -->
    <line x1="184" y1="134" x2="272" y2="178" stroke="#10141a" stroke-width="0.5"/>
    <line x1="184" y1="144" x2="272" y2="188" stroke="#10141a" stroke-width="0.5"/>
    <!-- Vertical drawer seams -->
    <line x1="212" y1="138" x2="212" y2="168" stroke="#10141a" stroke-width="0.35"/>
    <line x1="242" y1="153" x2="242" y2="183" stroke="#10141a" stroke-width="0.35"/>
    <!-- Drawer handles -->
    <rect x="196" y="132" width="6" height="1.6" fill="#c8ccd2"/>
    <rect x="222" y="148" width="6" height="1.6" fill="#c8ccd2"/>
    <rect x="248" y="164" width="6" height="1.6" fill="#c8ccd2"/>
    <rect x="196" y="146" width="6" height="1.6" fill="#c8ccd2"/>
    <rect x="222" y="162" width="6" height="1.6" fill="#c8ccd2"/>
    <rect x="248" y="178" width="6" height="1.6" fill="#c8ccd2"/>
    <rect x="196" y="160" width="6" height="1.6" fill="#c8ccd2"/>
    <rect x="222" y="176" width="6" height="1.6" fill="#c8ccd2"/>
    <rect x="248" y="192" width="6" height="1.6" fill="#c8ccd2"/>
    <!-- Label-tag strip on top row -->
    <rect x="190" y="128" width="9" height="3" fill="#e5d9b2"/>
    <rect x="216" y="144" width="9" height="3" fill="#e5d9b2"/>
    <rect x="242" y="160" width="9" height="3" fill="#e5d9b2"/>
  </g>

  <!-- Document safe on the floor (near back, west of cabinets) -->
  <g id="floor-safe">
    <polygon points="148,156 184,174 172,182 136,164"
      fill="#24282e" stroke="#0d0f13" stroke-width="0.45"/>
    <polygon points="136,164 172,182 172,202 136,184"
      fill="#161a1f" stroke="#080a0d" stroke-width="0.4"/>
    <polygon points="172,182 184,174 184,194 172,202"
      fill="#0c0e12" stroke="#050607" stroke-width="0.3"/>
    <!-- Dial -->
    <ellipse cx="152" cy="178" rx="3" ry="1.5" fill="#9ea4ad"/>
    <ellipse cx="152" cy="178" rx="1.6" ry="0.8" fill="#3c4149"/>
    <line x1="152" y1="178" x2="154" y2="179.2" stroke="#1a1d22" stroke-width="0.4"/>
    <!-- Handle -->
    <rect x="158" y="182" width="8" height="1.2" fill="#9ea4ad"/>
  </g>

  <!-- Legal desk in the middle of the room (row ~2 zone) -->
  <g id="desk">
    <!-- Top -->
    <polygon points="148,188 220,224 180,244 108,208"
      fill="#3a2414" stroke="#0d0604" stroke-width="0.5"/>
    <polygon points="152,192 216,224 180,240 116,208"
      fill="#4c2f1a" stroke="#1a0f07" stroke-width="0.4"/>
    <!-- Front face -->
    <polygon points="108,208 180,244 180,258 108,222"
      fill="#1e1009" stroke="#080403" stroke-width="0.4"/>
    <!-- East face -->
    <polygon points="220,224 180,244 180,258 220,238"
      fill="#100804" stroke="#060302" stroke-width="0.35"/>
    <!-- Folder stacks (manila) -->
    <polygon points="156,204 184,218 182,222 154,208" fill="#d5b972" stroke="#7d6838" stroke-width="0.3"/>
    <polygon points="156,200 184,214 184,218 156,204" fill="#e7cb86" stroke="#7d6838" stroke-width="0.3"/>
    <polygon points="158,198 184,211 184,214 158,201" fill="#e7cb86" stroke="#7d6838" stroke-width="0.3"/>
    <!-- Loose paper -->
    <polygon points="168,220 196,232 192,236 164,224" fill="#f7f1da" stroke="#8a8170" stroke-width="0.3"/>
    <!-- Reading lamp (task lamp) -->
    <line x1="124" y1="196" x2="124" y2="212" stroke="#1a1008" stroke-width="1.2"/>
    <line x1="124" y1="196" x2="134" y2="188" stroke="#1a1008" stroke-width="1.2"/>
    <polygon points="128,184 142,190 140,198 128,194" fill="#3a4048" stroke="#14171c" stroke-width="0.35"/>
    <ellipse cx="136" cy="196" rx="4" ry="1.8" fill="url(#compLampGlow)"/>
    <!-- Calculator or small device -->
    <polygon points="196,216 214,224 212,228 194,220" fill="#12161c" stroke="#05080c" stroke-width="0.3"/>
    <rect x="200" y="218" width="10" height="2.4" fill="#3c8a66" opacity="0.9"/>
  </g>

  <!-- Guest/inspector chair across from desk (row ~3 zone) -->
  <g id="guest-chair">
    <polygon points="100,224 132,240 124,246 92,230" fill="#2e1c10" stroke="#080504" stroke-width="0.35"/>
    <polygon points="92,230 124,246 124,256 92,240" fill="#1a1008" stroke="#070403" stroke-width="0.3"/>
    <polygon points="100,208 132,224 132,240 100,224" fill="#3a2618" stroke="#09050a" stroke-width="0.35"/>
    <polygon points="102,212 130,224 130,238 102,224" fill="#4a3122" opacity="0.85"/>
  </g>

  <!-- Legal bookshelf against the south-west wall (row 4 zone, col 0-1) -->
  <g id="legal-books">
    <polygon points="4,212 56,238 56,276 4,250"
      fill="#2a1a0e" stroke="#0d0604" stroke-width="0.5"/>
    <polygon points="8,216 52,238 52,272 8,248"
      fill="#1f130a" stroke="#0a0503" stroke-width="0.4"/>
    <!-- Shelves -->
    <line x1="8" y1="228" x2="52" y2="250" stroke="#0a0503" stroke-width="0.5"/>
    <line x1="8" y1="244" x2="52" y2="266" stroke="#0a0503" stroke-width="0.5"/>
    <line x1="8" y1="260" x2="52" y2="282" stroke="#0a0503" stroke-width="0.5"/>
    <!-- Matching legal volumes (uniform brown leather) -->
    <rect x="12" y="218" width="3" height="10" fill="#4a2a16"/>
    <rect x="17" y="220" width="3" height="10" fill="#4a2a16"/>
    <rect x="22" y="222" width="3" height="10" fill="#4a2a16"/>
    <rect x="27" y="224" width="3" height="10" fill="#4a2a16"/>
    <rect x="32" y="226" width="3" height="10" fill="#4a2a16"/>
    <rect x="37" y="228" width="3" height="10" fill="#4a2a16"/>
    <rect x="42" y="230" width="3" height="10" fill="#4a2a16"/>
    <rect x="47" y="232" width="3" height="10" fill="#4a2a16"/>
    <rect x="12" y="236" width="3" height="10" fill="#523018"/>
    <rect x="17" y="238" width="3" height="10" fill="#523018"/>
    <rect x="22" y="240" width="3" height="10" fill="#523018"/>
    <rect x="27" y="242" width="3" height="10" fill="#523018"/>
    <rect x="32" y="244" width="3" height="10" fill="#523018"/>
    <rect x="37" y="246" width="3" height="10" fill="#523018"/>
    <!-- Gold foil spines -->
    <line x1="12" y1="223" x2="50" y2="242" stroke="#b89644" stroke-width="0.35" opacity="0.8"/>
    <line x1="12" y1="241" x2="50" y2="260" stroke="#b89644" stroke-width="0.35" opacity="0.8"/>
  </g>

  <!-- Binder cart in the middle aisle -->
  <g id="binder-cart">
    <!-- Cart frame -->
    <polygon points="64,204 100,222 88,230 52,212" fill="#3a4048" stroke="#14171c" stroke-width="0.4"/>
    <polygon points="52,212 88,230 88,238 52,220" fill="#232830" stroke="#0c0f13" stroke-width="0.35"/>
    <!-- Binders on top -->
    <polygon points="66,198 80,205 80,212 66,205" fill="#5c2a2a"/>
    <polygon points="82,206 96,213 96,220 82,213" fill="#2a4a6b"/>
    <polygon points="64,210 78,217 78,222 64,215" fill="#6b5a2a"/>
    <!-- Wheels -->
    <ellipse cx="60" cy="230" rx="3" ry="1.4" fill="#1a1e23" stroke="#0b0d10" stroke-width="0.25"/>
    <ellipse cx="82" cy="240" rx="3" ry="1.4" fill="#1a1e23" stroke="#0b0d10" stroke-width="0.25"/>
  </g>

  <!-- Corner plant (south corner for slight warmth) -->
  <g id="plant">
    <polygon points="44,240 60,248 60,254 44,246" fill="#2d3239" stroke="#0f1317" stroke-width="0.35"/>
    <polygon points="60,248 76,240 76,246 60,254" fill="#1f2329" stroke="#0a0d10" stroke-width="0.3"/>
    <polygon points="44,240 60,232 76,240 60,248" fill="#3a4048" stroke="#13171c" stroke-width="0.35"/>
    <ellipse cx="60" cy="228" rx="8" ry="3" fill="#3a6a36" opacity="0.85"/>
    <ellipse cx="60" cy="225" rx="5" ry="2" fill="#4a7a42" opacity="0.9"/>
  </g>
</svg>
