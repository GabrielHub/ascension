<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 620 420">
  <!-- Props-only scene layer: The Lobby, Skyscraper ground-floor public entry.
       Authored footprint: 7 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Institutional midtown lobby: polished stone floor inlay, long reception
       counter across the back, two low guest couches around a glass coffee
       table, tall potted palms flanking the entry area, a back-wall gallery
       panel, a security podium, and a planter runner toward the elevators.
       No walls, floors, tile grids, room outlines, or structural elements.
       Every grounded rectangle follows the canonical 2:1 isometric axes;
       upright edges stay vertical; circular tops read as isometric ellipses. -->

  <defs>
    <linearGradient id="lobbyStoneTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3d7de"/>
      <stop offset="0.6" stop-color="#a9afb8"/>
      <stop offset="1" stop-color="#7a808a"/>
    </linearGradient>
    <linearGradient id="lobbyCounterFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e343d"/>
      <stop offset="1" stop-color="#1c2027"/>
    </linearGradient>
    <radialGradient id="lobbyRugSheen" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#9fa8b6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#9fa8b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Subtle polished-floor sheen as a centered iso ellipse (not a shadow pad) -->
  <polygon points="248,196 392,268 248,304 104,232"
    fill="url(#lobbyRugSheen)" opacity="0.9"/>

  <!-- Decorative dark-stone inlay band running along the canonical tile axes -->
  <polygon points="104,172 344,292 328,300 88,180"
    fill="#262a32" opacity="0.7"/>

  <!-- Reception counter: long slab across the back edge (cols 2–5, row 0-1 zone) -->
  <g id="reception-counter">
    <!-- Counter top (stone slab) -->
    <polygon points="296,148 488,244 456,260 264,164"
      fill="url(#lobbyStoneTop)" stroke="#4d525b" stroke-width="0.6"/>
    <!-- Front-facing panel (west face of counter) -->
    <polygon points="264,164 456,260 456,298 264,202"
      fill="url(#lobbyCounterFront)" stroke="#0f1217" stroke-width="0.6"/>
    <!-- End cap (east face) -->
    <polygon points="456,260 488,244 488,282 456,298"
      fill="#161a21" stroke="#0b0d12" stroke-width="0.55"/>
    <!-- Warm uplight stripe along the counter front -->
    <polygon points="268,196 452,288 452,294 268,202"
      fill="#d8a25a" opacity="0.55"/>
    <!-- Guilloché/logo medallion on the front -->
    <ellipse cx="360" cy="247" rx="10" ry="4" fill="#c6a55a" opacity="0.8"/>
    <ellipse cx="360" cy="247" rx="6" ry="2.4" fill="#f1d88a" opacity="0.9"/>
    <!-- Countertop desk accessories -->
    <rect x="300" y="175" width="18" height="6" fill="#141820" opacity="0.9"/>
    <polygon points="300,175 318,175 322,172 304,172" fill="#2b323c"/>
    <rect x="332" y="184" width="14" height="5" fill="#b9a36b" opacity="0.9"/>
    <circle cx="368" cy="196" r="4" fill="#2a4f3c"/>
    <circle cx="368" cy="195" r="2.4" fill="#6fbf8a"/>
    <polygon points="372,194 372,189 376,189 376,193" fill="#d7c28a" opacity="0.85"/>
  </g>

  <!-- Back-wall gallery panel (implied wall art, not wall itself) -->
  <g id="back-gallery">
    <polygon points="230,74 316,117 316,151 230,108"
      fill="#24282f" stroke="#12151a" stroke-width="0.6"/>
    <polygon points="234,80 312,119 312,138 234,99"
      fill="#394253" stroke="#1b2029" stroke-width="0.4"/>
    <polygon points="240,86 306,119 306,131 240,98"
      fill="#d89d54" opacity="0.55"/>
    <polygon points="244,100 300,128 300,134 244,106"
      fill="#a6bdd4" opacity="0.45"/>
  </g>

  <!-- North-east tall potted palm (cols ~5, row 0) -->
  <g id="palm-ne">
    <!-- Planter -->
    <polygon points="416,192 440,204 440,220 416,208"
      fill="#2b2d33" stroke="#15171b" stroke-width="0.5"/>
    <polygon points="440,204 464,192 464,208 440,220"
      fill="#1f2127" stroke="#0e1014" stroke-width="0.5"/>
    <polygon points="416,192 440,180 464,192 440,204"
      fill="#3a3d45" stroke="#181a1f" stroke-width="0.5"/>
    <!-- Trunk -->
    <line x1="440" y1="180" x2="440" y2="124" stroke="#5a3a22" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Palm fronds (broad fan leaves) -->
    <polygon points="440,128 460,118 470,102 446,116" fill="#3d6a3a" stroke="#1e3a1e" stroke-width="0.4"/>
    <polygon points="440,128 420,118 410,102 434,116" fill="#2f5a2f" stroke="#1a2e1a" stroke-width="0.4"/>
    <polygon points="440,124 454,104 448,96 432,110" fill="#4a7a42" stroke="#1e3a1e" stroke-width="0.4"/>
    <polygon points="440,124 426,104 432,96 448,110" fill="#3a6a36" stroke="#1a2e1a" stroke-width="0.4"/>
    <polygon points="440,124 460,126 476,120 442,120" fill="#2f5a2f" opacity="0.9"/>
    <polygon points="440,124 420,126 404,120 438,120" fill="#3a6a36" opacity="0.9"/>
  </g>

  <!-- South-west tall potted palm (cols ~1, row 3) -->
  <g id="palm-sw">
    <polygon points="36,196 60,208 60,224 36,212"
      fill="#2b2d33" stroke="#15171b" stroke-width="0.5"/>
    <polygon points="60,208 84,196 84,212 60,224"
      fill="#1f2127" stroke="#0e1014" stroke-width="0.5"/>
    <polygon points="36,196 60,184 84,196 60,208"
      fill="#3a3d45" stroke="#181a1f" stroke-width="0.5"/>
    <line x1="60" y1="184" x2="60" y2="128" stroke="#5a3a22" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="60,132 80,122 90,106 66,120" fill="#3d6a3a" stroke="#1e3a1e" stroke-width="0.4"/>
    <polygon points="60,132 40,122 30,106 54,120" fill="#2f5a2f" stroke="#1a2e1a" stroke-width="0.4"/>
    <polygon points="60,128 74,108 68,100 52,114" fill="#4a7a42" stroke="#1e3a1e" stroke-width="0.4"/>
    <polygon points="60,128 46,108 52,100 68,114" fill="#3a6a36" stroke="#1a2e1a" stroke-width="0.4"/>
    <polygon points="60,128 80,130 96,124 62,124" fill="#2f5a2f" opacity="0.9"/>
    <polygon points="60,128 40,130 24,124 58,124" fill="#3a6a36" opacity="0.9"/>
  </g>

  <!-- Guest seating: two low leather couches flanking a glass coffee table -->
  <g id="couch-north">
    <!-- Couch aligned along the NE-SW iso axis (back edge follows c-axis) -->
    <polygon points="152,224 248,272 228,282 132,234"
      fill="#453023" stroke="#241611" stroke-width="0.6"/>
    <polygon points="132,234 228,282 228,296 132,248"
      fill="#5a3f2e" stroke="#2c1b11" stroke-width="0.6"/>
    <polygon points="228,282 248,272 248,286 228,296"
      fill="#2e1e13" stroke="#1a100a" stroke-width="0.5"/>
    <!-- Backrest slab rising vertically -->
    <polygon points="152,200 248,248 248,272 152,224"
      fill="#6a4a36" stroke="#2c1b11" stroke-width="0.6"/>
    <polygon points="152,200 248,248 248,264 152,216"
      fill="#513624" opacity="0.85"/>
    <!-- Seat cushions (top faces) -->
    <polygon points="160,230 176,238 176,244 160,236" fill="#7c5c3f" stroke="#321f12" stroke-width="0.35"/>
    <polygon points="188,244 204,252 204,258 188,250" fill="#7c5c3f" stroke="#321f12" stroke-width="0.35"/>
    <polygon points="216,258 232,266 232,272 216,264" fill="#7c5c3f" stroke="#321f12" stroke-width="0.35"/>
  </g>

  <g id="couch-south">
    <!-- Opposite couch along SE-NW axis (back edge follows r-axis) -->
    <polygon points="264,256 176,300 196,310 284,266"
      fill="#453023" stroke="#241611" stroke-width="0.6"/>
    <polygon points="284,266 196,310 196,324 284,280"
      fill="#5a3f2e" stroke="#2c1b11" stroke-width="0.6"/>
    <polygon points="196,310 176,300 176,314 196,324"
      fill="#2e1e13" stroke="#1a100a" stroke-width="0.5"/>
    <!-- Backrest -->
    <polygon points="264,232 176,276 176,300 264,256"
      fill="#6a4a36" stroke="#2c1b11" stroke-width="0.6"/>
    <polygon points="264,232 176,276 176,292 264,248"
      fill="#513624" opacity="0.85"/>
    <!-- Seat cushions -->
    <polygon points="256,262 240,270 240,276 256,268" fill="#7c5c3f" stroke="#321f12" stroke-width="0.35"/>
    <polygon points="228,276 212,284 212,290 228,282" fill="#7c5c3f" stroke="#321f12" stroke-width="0.35"/>
    <polygon points="200,290 184,298 184,304 200,296" fill="#7c5c3f" stroke="#321f12" stroke-width="0.35"/>
  </g>

  <!-- Low glass coffee table between the couches -->
  <g id="coffee-table">
    <!-- Glass top as iso parallelogram with subtle sheen -->
    <polygon points="208,260 256,284 224,300 176,276"
      fill="#2a3138" opacity="0.55" stroke="#0f1215" stroke-width="0.5"/>
    <polygon points="208,260 256,284 224,300 176,276"
      fill="url(#lobbyRugSheen)" opacity="0.6"/>
    <!-- Frame rim -->
    <polyline points="208,260 256,284 224,300 176,276 208,260"
      fill="none" stroke="#8c97a5" stroke-width="0.8"/>
    <!-- Center accent book stack -->
    <polygon points="208,276 224,284 224,289 208,281" fill="#5a7086" stroke="#26303a" stroke-width="0.3"/>
    <polygon points="208,272 224,280 224,285 208,277" fill="#c9b67a" stroke="#5a4f2d" stroke-width="0.3"/>
    <!-- Thin square legs -->
    <line x1="188" y1="276" x2="188" y2="292" stroke="#2d3339" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="244" y1="292" x2="244" y2="308" stroke="#2d3339" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="216" y1="300" x2="216" y2="316" stroke="#2d3339" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Security podium (west-of-center, row 2-3) -->
  <g id="security-podium">
    <polygon points="100,232 124,244 124,268 100,256"
      fill="#2a2f37" stroke="#13161b" stroke-width="0.5"/>
    <polygon points="124,244 148,232 148,256 124,268"
      fill="#1d2128" stroke="#0b0d12" stroke-width="0.5"/>
    <polygon points="100,232 124,220 148,232 124,244"
      fill="#3a4050" stroke="#161a22" stroke-width="0.5"/>
    <!-- Top-mounted monitor -->
    <polygon points="116,216 132,224 132,232 116,224"
      fill="#0f141b" stroke="#060a10" stroke-width="0.35"/>
    <polygon points="118,218 130,224 130,230 118,224"
      fill="#1e3954" opacity="0.9"/>
    <polygon points="120,220 128,224 128,228 120,224"
      fill="#3a6b8e" opacity="0.9"/>
  </g>

  <!-- Wayfinding planter / low divider near the entry axis -->
  <g id="entry-planter">
    <polygon points="60,244 120,274 120,284 60,254"
      fill="#2a2d34" stroke="#13161b" stroke-width="0.5"/>
    <polygon points="120,274 180,244 180,254 120,284"
      fill="#1d2027" stroke="#0b0d12" stroke-width="0.5"/>
    <polygon points="60,244 120,214 180,244 120,274"
      fill="#363a43" stroke="#15181d" stroke-width="0.5"/>
    <!-- Low hedge plants -->
    <ellipse cx="90" cy="234" rx="9" ry="3.6" fill="#3a6a36" opacity="0.85"/>
    <ellipse cx="120" cy="228" rx="10" ry="4" fill="#4a7a42" opacity="0.9"/>
    <ellipse cx="150" cy="234" rx="9" ry="3.6" fill="#3a6a36" opacity="0.85"/>
    <ellipse cx="90" cy="232" rx="5" ry="2" fill="#5c9052" opacity="0.7"/>
    <ellipse cx="120" cy="226" rx="5" ry="2" fill="#68a05e" opacity="0.75"/>
    <ellipse cx="150" cy="232" rx="5" ry="2" fill="#5c9052" opacity="0.7"/>
  </g>

  <!-- Floor medallion: subtle company seal at the crossing of the two couches -->
  <ellipse cx="212" cy="286" rx="18" ry="6" fill="none" stroke="#5b6573" stroke-width="0.6" opacity="0.7"/>
  <ellipse cx="212" cy="286" rx="10" ry="3.4" fill="none" stroke="#8a94a2" stroke-width="0.5" opacity="0.55"/>
</svg>
