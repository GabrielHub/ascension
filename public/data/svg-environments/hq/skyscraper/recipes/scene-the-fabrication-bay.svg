<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 500 360">
  <!-- Props-only scene layer: The Fabrication Bay.
       Authored footprint: 5 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Skyscraper C-rank crafting floor: back-wall fabrication storage, a
       central steel workbench with tool layout, a CNC mill to the east, a
       welding stand with safety screen to the west, parts bins in the foreground,
       a drafting console to the south-east, and a pendant light cluster overhead.
       No walls, floors, tile grids, room outlines, or structural elements. -->

  <defs>
    <linearGradient id="fabSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9098"/>
      <stop offset="0.6" stop-color="#5f666d"/>
      <stop offset="1" stop-color="#3a4047"/>
    </linearGradient>
    <linearGradient id="fabSteelFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5057"/>
      <stop offset="1" stop-color="#252a30"/>
    </linearGradient>
    <radialGradient id="fabWeldArc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe8ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#6fa8e0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2a4466" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Back-wall parts rack (mounted fixture along c-axis of back edge) -->
  <g id="back-rack">
    <polygon points="236,82 376,152 376,176 236,106"
      fill="#3a3f46" stroke="#1a1d22" stroke-width="0.6"/>
    <polygon points="240,88 372,154 372,170 240,104"
      fill="#2a2e34" stroke="#14171b" stroke-width="0.4"/>
    <!-- Shelf lines -->
    <line x1="244" y1="102" x2="368" y2="164" stroke="#181b20" stroke-width="0.5"/>
    <line x1="244" y1="118" x2="368" y2="180" stroke="#181b20" stroke-width="0.5"/>
    <line x1="244" y1="134" x2="368" y2="196" stroke="#181b20" stroke-width="0.5"/>
    <!-- Parts / tools on rack -->
    <rect x="250" y="96" width="10" height="5" fill="#b48a3c"/>
    <rect x="272" y="106" width="10" height="5" fill="#8a6530"/>
    <rect x="296" y="118" width="10" height="5" fill="#c9a352"/>
    <rect x="322" y="130" width="10" height="5" fill="#8a6530"/>
    <rect x="348" y="142" width="10" height="5" fill="#b48a3c"/>
    <circle cx="258" cy="118" r="2.4" fill="#d8d2c0"/>
    <circle cx="282" cy="126" r="2.4" fill="#d8d2c0"/>
    <circle cx="306" cy="134" r="2.4" fill="#d8d2c0"/>
  </g>

  <!-- Central workbench (cols 1-3, row 1-3 zone) -->
  <g id="workbench">
    <!-- Bench top -->
    <polygon points="200,156 344,228 264,268 120,196"
      fill="url(#fabSteel)" stroke="#262b32" stroke-width="0.8"/>
    <!-- Bench front panel (west face, seen under the top) -->
    <polygon points="120,196 264,268 264,286 120,214"
      fill="url(#fabSteelFront)" stroke="#13171c" stroke-width="0.6"/>
    <!-- East end cap -->
    <polygon points="344,228 264,268 264,286 344,246"
      fill="#1d2228" stroke="#0e1115" stroke-width="0.5"/>
    <!-- Edge highlight -->
    <line x1="200" y1="156" x2="344" y2="228" stroke="#c2c8d0" stroke-width="0.6" opacity="0.8"/>
    <line x1="200" y1="156" x2="120" y2="196" stroke="#c2c8d0" stroke-width="0.6" opacity="0.6"/>
    <!-- Tool trays on bench top -->
    <polygon points="210,174 248,193 246,197 208,178" fill="#3a3f48" stroke="#181c21" stroke-width="0.35"/>
    <polygon points="256,198 296,218 294,222 254,202" fill="#3a3f48" stroke="#181c21" stroke-width="0.35"/>
    <!-- Wrench -->
    <line x1="214" y1="184" x2="240" y2="197" stroke="#b8c0cc" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="214" cy="184" r="1.6" fill="#8a93a0"/>
    <!-- Hammer -->
    <line x1="266" y1="208" x2="290" y2="220" stroke="#5a3b22" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="286" y="214" width="8" height="5" fill="#2d3238" stroke="#14171b" stroke-width="0.3"/>
    <!-- Clamp / vise on west end -->
    <polygon points="128,206 156,220 156,236 128,222" fill="#2d3239" stroke="#13171c" stroke-width="0.4"/>
    <polygon points="156,220 174,211 174,227 156,236" fill="#424852" stroke="#181c22" stroke-width="0.4"/>
    <polygon points="128,206 156,192 174,201 156,220" fill="#555d68" stroke="#1f242a" stroke-width="0.4"/>
  </g>

  <!-- CNC mill to the east (cols 3-4, row 0-1) -->
  <g id="cnc-mill">
    <!-- Base block -->
    <polygon points="320,144 388,178 388,222 320,188"
      fill="#3e444c" stroke="#181c21" stroke-width="0.6"/>
    <polygon points="388,178 412,166 412,210 388,222"
      fill="#2a2f36" stroke="#0f1217" stroke-width="0.55"/>
    <polygon points="320,144 388,110 412,122 388,178"
      fill="#565d66" stroke="#1b1f25" stroke-width="0.55"/>
    <!-- Machine gantry riser -->
    <polygon points="352,160 388,142 388,78 352,96"
      fill="#525862" stroke="#191d24" stroke-width="0.55"/>
    <polygon points="388,142 404,134 404,70 388,78"
      fill="#3a4048" stroke="#14171c" stroke-width="0.55"/>
    <!-- Cross-head with spindle -->
    <polygon points="352,104 404,78 404,90 352,116"
      fill="#2d3239" stroke="#11141a" stroke-width="0.45"/>
    <polygon points="372,108 380,104 380,128 372,132"
      fill="#1a1e24" stroke="#0a0c10" stroke-width="0.35"/>
    <line x1="376" y1="128" x2="376" y2="140" stroke="#d5d8de" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Control panel (small screen on side) -->
    <rect x="334" y="166" width="14" height="10" fill="#0f141b" stroke="#060a10" stroke-width="0.35"/>
    <rect x="336" y="168" width="10" height="6" fill="#285378" opacity="0.95"/>
    <rect x="336" y="169" width="6" height="2" fill="#6fbed2" opacity="0.9"/>
  </g>

  <!-- Welding stand with safety screen (west, col 0-1, row 1-2) -->
  <g id="weld-stand">
    <!-- Table -->
    <polygon points="80,180 136,208 96,228 40,200"
      fill="url(#fabSteel)" stroke="#262b32" stroke-width="0.6"/>
    <polygon points="40,200 96,228 96,242 40,214"
      fill="url(#fabSteelFront)" stroke="#13171c" stroke-width="0.5"/>
    <polygon points="96,228 136,208 136,222 96,242"
      fill="#1d2228" stroke="#0e1115" stroke-width="0.5"/>
    <!-- Welding workpiece (metal plate with arc glow) -->
    <polygon points="66,204 104,222 96,226 58,208" fill="#262a32"/>
    <circle cx="80" cy="212" r="13" fill="url(#fabWeldArc)"/>
    <circle cx="80" cy="212" r="2.4" fill="#ffffff"/>
    <!-- Safety screen (upright, yellow-orange tinted) -->
    <polygon points="36,180 88,208 88,156 36,128"
      fill="#c57b2e" opacity="0.7" stroke="#6d431a" stroke-width="0.5"/>
    <polygon points="36,180 88,208 88,156 36,128"
      fill="none" stroke="#8c5420" stroke-width="0.4" stroke-dasharray="3 2"/>
    <!-- Gas cylinder -->
    <polygon points="20,216 32,222 32,258 20,252"
      fill="#2e5142" stroke="#122018" stroke-width="0.5"/>
    <polygon points="32,222 44,216 44,252 32,258"
      fill="#204032" stroke="#0c1812" stroke-width="0.5"/>
    <polygon points="20,216 32,210 44,216 32,222"
      fill="#3a6a56" stroke="#13241b" stroke-width="0.45"/>
    <rect x="28" y="200" width="6" height="10" fill="#1f2a25" stroke="#0a1210" stroke-width="0.35"/>
  </g>

  <!-- Parts bins foreground (south zone cols 1-3, row 3-4) -->
  <g id="parts-bins">
    <!-- Bin 1 -->
    <polygon points="160,238 196,256 184,266 148,248"
      fill="#3f4a32" stroke="#171f0f" stroke-width="0.45"/>
    <polygon points="148,248 184,266 184,276 148,258"
      fill="#2a3322" stroke="#0f1509" stroke-width="0.45"/>
    <polygon points="196,256 184,266 184,276 196,266"
      fill="#1b2116" stroke="#0a0e07" stroke-width="0.4"/>
    <!-- Yellow pegs inside -->
    <rect x="158" y="250" width="6" height="4" fill="#d8a544" opacity="0.9"/>
    <rect x="170" y="256" width="6" height="4" fill="#b58834" opacity="0.9"/>
    <!-- Bin 2 -->
    <polygon points="220,256 256,274 244,284 208,266"
      fill="#433b2a" stroke="#1a1408" stroke-width="0.45"/>
    <polygon points="208,266 244,284 244,294 208,276"
      fill="#2e2918" stroke="#130e06" stroke-width="0.45"/>
    <polygon points="256,274 244,284 244,294 256,284"
      fill="#1e1a0f" stroke="#0b0905" stroke-width="0.4"/>
    <circle cx="220" cy="272" r="2.3" fill="#7a6a3a"/>
    <circle cx="232" cy="278" r="2.3" fill="#7a6a3a"/>
  </g>

  <!-- Drafting console to the south-east (col 3-4, row 3-4) -->
  <g id="drafting-console">
    <!-- Desk -->
    <polygon points="280,232 344,264 316,278 252,246"
      fill="#4d5260" stroke="#1c2028" stroke-width="0.5"/>
    <polygon points="252,246 316,278 316,292 252,260"
      fill="#34394a" stroke="#141825" stroke-width="0.5"/>
    <polygon points="344,264 316,278 316,292 344,278"
      fill="#242835" stroke="#0f1219" stroke-width="0.45"/>
    <!-- Drafting paper (canvas/blueprint) -->
    <polygon points="282,240 330,264 320,270 272,246"
      fill="#2a4566" stroke="#13223a" stroke-width="0.4"/>
    <!-- Blueprint line work -->
    <line x1="288" y1="246" x2="322" y2="264" stroke="#9fcfe8" stroke-width="0.5" opacity="0.85"/>
    <line x1="290" y1="252" x2="320" y2="266" stroke="#9fcfe8" stroke-width="0.4" opacity="0.65"/>
    <line x1="298" y1="256" x2="308" y2="262" stroke="#9fcfe8" stroke-width="0.4" opacity="0.7"/>
    <!-- Angle-poise desk lamp -->
    <line x1="262" y1="240" x2="260" y2="224" stroke="#2a2f37" stroke-width="1.4"/>
    <line x1="260" y1="224" x2="272" y2="216" stroke="#2a2f37" stroke-width="1.4"/>
    <polygon points="268,212 280,218 278,226 268,222" fill="#454d57" stroke="#1a1f26" stroke-width="0.35"/>
    <ellipse cx="278" cy="228" rx="3" ry="1.5" fill="#f0c880" opacity="0.85"/>
  </g>

  <!-- Overhead pendant cluster (high iso-anchored, NOT a drop shadow) -->
  <g id="pendants">
    <line x1="200" y1="40" x2="200" y2="70" stroke="#2a2f37" stroke-width="1.2"/>
    <ellipse cx="200" cy="74" rx="16" ry="5" fill="#3a4048" stroke="#181c22" stroke-width="0.45"/>
    <ellipse cx="200" cy="74" rx="10" ry="3" fill="#f4d48a" opacity="0.85"/>
    <line x1="236" y1="44" x2="236" y2="70" stroke="#2a2f37" stroke-width="1.1"/>
    <ellipse cx="236" cy="74" rx="10" ry="3.5" fill="#3a4048" stroke="#181c22" stroke-width="0.35"/>
    <ellipse cx="236" cy="74" rx="6" ry="2" fill="#f4d48a" opacity="0.85"/>
    <line x1="166" y1="44" x2="166" y2="68" stroke="#2a2f37" stroke-width="1.1"/>
    <ellipse cx="166" cy="72" rx="10" ry="3.5" fill="#3a4048" stroke="#181c22" stroke-width="0.35"/>
    <ellipse cx="166" cy="72" rx="6" ry="2" fill="#f4d48a" opacity="0.85"/>
  </g>
</svg>
