<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 480 340">
  <!-- Props-only scene layer: The Executive Office, Skyscraper floor 7.
       Authored footprint: 4 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).

       Corner office of the guild principal: heavy desk with green banker
       lamp and leather blotter, executive chair, two guest chairs in front,
       a tall bookshelf along the back wall, a drinks credenza with decanter
       and rocks glasses, a corner armchair with side table, and city-view
       curtain panels at the window implications. No walls, floors, tile
       grids, room outlines, or structural elements. -->

  <defs>
    <linearGradient id="execWalnutTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4428"/>
      <stop offset="0.55" stop-color="#4c2f1a"/>
      <stop offset="1" stop-color="#2c1b0e"/>
    </linearGradient>
    <linearGradient id="execWalnutFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2414"/>
      <stop offset="1" stop-color="#1a1009"/>
    </linearGradient>
    <linearGradient id="execLeather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2618"/>
      <stop offset="1" stop-color="#1e1309"/>
    </linearGradient>
    <radialGradient id="execLampGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#f4d480" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#b88632" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6a4818" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Persian rug under the desk area (iso parallelogram) -->
  <g id="rug">
    <polygon points="160,196 304,268 224,308 80,236"
      fill="#5a2a24" stroke="#28100d" stroke-width="0.6"/>
    <polygon points="168,204 296,268 224,304 96,240"
      fill="#7a3a30" opacity="0.75"/>
    <polygon points="180,216 280,266 224,294 124,244"
      fill="none" stroke="#caa068" stroke-width="0.45" opacity="0.55"/>
    <polygon points="200,228 264,260 224,280 160,248"
      fill="none" stroke="#caa068" stroke-width="0.35" opacity="0.45"/>
  </g>

  <!-- Executive desk along the back (row 1 zone, cols ~1-3) -->
  <g id="desk">
    <!-- Desk top (walnut) -->
    <polygon points="200,148 344,220 264,260 120,188"
      fill="url(#execWalnutTop)" stroke="#1a0f07" stroke-width="0.7"/>
    <!-- Front apron (visible front face) -->
    <polygon points="120,188 264,260 264,284 120,212"
      fill="url(#execWalnutFront)" stroke="#0d0804" stroke-width="0.5"/>
    <!-- End cap (east face) -->
    <polygon points="344,220 264,260 264,284 344,244"
      fill="#130a05" stroke="#080503" stroke-width="0.45"/>
    <!-- Edge highlight -->
    <line x1="200" y1="148" x2="344" y2="220" stroke="#8a5a36" stroke-width="0.6" opacity="0.85"/>
    <line x1="200" y1="148" x2="120" y2="188" stroke="#8a5a36" stroke-width="0.45" opacity="0.7"/>
    <!-- Leather blotter -->
    <polygon points="208,172 272,204 248,216 184,184"
      fill="url(#execLeather)" stroke="#0a0604" stroke-width="0.4"/>
    <polygon points="212,176 268,202 248,212 192,186"
      fill="#281710" stroke="#0c0503" stroke-width="0.3"/>
    <!-- Banker lamp (green glass shade + brass base) -->
    <g id="banker-lamp">
      <rect x="234" y="148" width="2.2" height="14" fill="#8a6628"/>
      <ellipse cx="235" cy="146" rx="1.8" ry="0.8" fill="#c8a352"/>
      <polygon points="220,148 250,148 248,158 222,158" fill="#1f3d2a" stroke="#0a1911" stroke-width="0.4"/>
      <polygon points="222,158 248,158 244,164 226,164" fill="#2d5a3d" stroke="#0b1c11" stroke-width="0.35"/>
      <polygon points="226,158 244,158 240,162 230,162" fill="url(#execLampGlow)"/>
      <ellipse cx="235" cy="192" rx="14" ry="5" fill="url(#execLampGlow)" opacity="0.65"/>
    </g>
    <!-- Fountain pen stand -->
    <polygon points="282,210 298,218 296,221 280,213" fill="#2c1a0e" stroke="#0d0604" stroke-width="0.3"/>
    <line x1="288" y1="210" x2="292" y2="196" stroke="#8a6628" stroke-width="0.7"/>
    <!-- Small document stack -->
    <polygon points="210,200 240,215 238,219 208,204" fill="#ece3cc" stroke="#8a8170" stroke-width="0.3"/>
    <polygon points="214,198 244,213 240,216 212,202" fill="#f7f1da" stroke="#8a8170" stroke-width="0.3"/>
    <!-- Telephone -->
    <polygon points="300,200 320,210 318,214 298,204" fill="#12161c" stroke="#05080c" stroke-width="0.3"/>
    <polygon points="302,198 320,207 320,210 302,201" fill="#1f262f" stroke="#070a0e" stroke-width="0.25"/>
    <line x1="304" y1="199" x2="314" y2="200" stroke="#2d3540" stroke-width="0.4"/>
  </g>

  <!-- Executive leather chair (behind desk, north side) -->
  <g id="exec-chair">
    <!-- Seat base -->
    <polygon points="220,116 268,140 256,148 208,124" fill="url(#execLeather)" stroke="#090604" stroke-width="0.4"/>
    <polygon points="208,124 256,148 256,158 208,134" fill="#1f130a" stroke="#080503" stroke-width="0.35"/>
    <!-- Backrest -->
    <polygon points="216,92 264,116 264,148 216,124" fill="#2e1c10" stroke="#09050a" stroke-width="0.4"/>
    <polygon points="218,96 260,118 260,140 218,118" fill="#3e2a1a" opacity="0.9"/>
    <!-- Button tufting -->
    <circle cx="226" cy="108" r="1" fill="#160c06"/>
    <circle cx="238" cy="114" r="1" fill="#160c06"/>
    <circle cx="250" cy="120" r="1" fill="#160c06"/>
    <circle cx="226" cy="120" r="1" fill="#160c06"/>
    <circle cx="238" cy="126" r="1" fill="#160c06"/>
    <circle cx="250" cy="132" r="1" fill="#160c06"/>
  </g>

  <!-- Two guest chairs in front of desk (south side) -->
  <g id="guest-chairs">
    <!-- Guest chair west -->
    <g>
      <polygon points="140,232 172,248 164,254 132,238" fill="url(#execLeather)" stroke="#090604" stroke-width="0.35"/>
      <polygon points="132,238 164,254 164,264 132,248" fill="#1a1008" stroke="#070403" stroke-width="0.3"/>
      <polygon points="140,216 172,232 172,248 140,232" fill="#2e1c10" stroke="#09050a" stroke-width="0.35"/>
      <polygon points="142,218 170,232 170,246 142,232" fill="#3e2a1a" opacity="0.85"/>
    </g>
    <!-- Guest chair east -->
    <g>
      <polygon points="180,252 212,268 204,274 172,258" fill="url(#execLeather)" stroke="#090604" stroke-width="0.35"/>
      <polygon points="172,258 204,274 204,284 172,268" fill="#1a1008" stroke="#070403" stroke-width="0.3"/>
      <polygon points="180,236 212,252 212,268 180,252" fill="#2e1c10" stroke="#09050a" stroke-width="0.35"/>
      <polygon points="182,238 210,252 210,266 182,252" fill="#3e2a1a" opacity="0.85"/>
    </g>
  </g>

  <!-- Tall bookshelf along the back wall (row 0 zone, col 0 side) -->
  <g id="bookshelf">
    <polygon points="100,102 156,130 156,196 100,168"
      fill="#2a1a0e" stroke="#0d0604" stroke-width="0.6"/>
    <polygon points="104,106 152,130 152,190 104,166"
      fill="#1f130a" stroke="#0a0503" stroke-width="0.4"/>
    <!-- Shelves -->
    <line x1="104" y1="124" x2="152" y2="148" stroke="#0a0503" stroke-width="0.5"/>
    <line x1="104" y1="142" x2="152" y2="166" stroke="#0a0503" stroke-width="0.5"/>
    <line x1="104" y1="160" x2="152" y2="184" stroke="#0a0503" stroke-width="0.5"/>
    <!-- Books -->
    <rect x="108" y="112" width="4" height="12" fill="#6b2a2a"/>
    <rect x="114" y="115" width="4" height="11" fill="#2a4a6b"/>
    <rect x="120" y="118" width="4" height="11" fill="#6b5a2a"/>
    <rect x="126" y="121" width="4" height="10" fill="#2a6b4a"/>
    <rect x="132" y="124" width="4" height="10" fill="#6b2a4a"/>
    <rect x="138" y="127" width="4" height="10" fill="#4a2a6b"/>
    <rect x="108" y="132" width="4" height="11" fill="#5a7a2a"/>
    <rect x="116" y="136" width="4" height="10" fill="#2a4a6b"/>
    <rect x="124" y="140" width="4" height="10" fill="#6b5a2a"/>
    <rect x="132" y="143" width="4" height="9" fill="#6b2a2a"/>
    <rect x="140" y="147" width="4" height="9" fill="#2a5a6b"/>
    <!-- Framed portrait / small bust on top -->
    <polygon points="118,102 140,112 138,118 116,108" fill="#c9a354" stroke="#5a401c" stroke-width="0.35"/>
    <polygon points="120,104 136,112 136,115 120,107" fill="#8a5a28"/>
  </g>

  <!-- Drinks credenza (east, along row ~1 col 3-4) -->
  <g id="credenza">
    <!-- Top -->
    <polygon points="312,168 372,198 336,216 276,186"
      fill="url(#execWalnutTop)" stroke="#1a0f07" stroke-width="0.6"/>
    <!-- Front face -->
    <polygon points="276,186 336,216 336,232 276,202"
      fill="url(#execWalnutFront)" stroke="#0b0503" stroke-width="0.5"/>
    <!-- East face -->
    <polygon points="336,216 372,198 372,214 336,232"
      fill="#0e0703" stroke="#060302" stroke-width="0.4"/>
    <!-- Decanter (crystal) -->
    <polygon points="322,174 336,181 334,193 322,187" fill="#c5d8ec" opacity="0.65" stroke="#4a5a6b" stroke-width="0.3"/>
    <polygon points="326,170 332,173 332,176 326,174" fill="#8a6628"/>
    <!-- Amber liquid -->
    <polygon points="324,182 334,187 333,192 324,188" fill="#b8752a" opacity="0.8"/>
    <!-- Rocks glasses -->
    <polygon points="344,186 352,190 352,196 344,192" fill="#c5d8ec" opacity="0.55" stroke="#4a5a6b" stroke-width="0.3"/>
    <polygon points="344,189 352,193 351,195 344,191" fill="#b8752a" opacity="0.7"/>
    <polygon points="354,194 362,198 362,204 354,200" fill="#c5d8ec" opacity="0.55" stroke="#4a5a6b" stroke-width="0.3"/>
    <!-- Small framed accolade on top -->
    <polygon points="294,184 308,191 308,196 294,189" fill="#c9a354" stroke="#5a401c" stroke-width="0.3"/>
    <polygon points="296,186 306,190 306,194 296,190" fill="#1e2a38"/>
  </g>

  <!-- Corner armchair + side table (south-west corner) -->
  <g id="corner-seat">
    <!-- Armchair -->
    <polygon points="36,244 76,264 60,274 20,254" fill="url(#execLeather)" stroke="#080504" stroke-width="0.4"/>
    <polygon points="20,254 60,274 60,286 20,266" fill="#1f130a" stroke="#080503" stroke-width="0.35"/>
    <polygon points="36,220 76,240 76,264 36,244" fill="#2e1c10" stroke="#09050a" stroke-width="0.4"/>
    <polygon points="38,224 74,242 74,262 38,244" fill="#3e2a1a" opacity="0.85"/>
    <!-- Armrest -->
    <polygon points="70,240 82,246 82,260 70,254" fill="#2a1a0e" stroke="#0a0503" stroke-width="0.35"/>
    <!-- Side table -->
    <polygon points="88,256 112,268 100,274 76,262" fill="url(#execWalnutTop)" stroke="#1a0f07" stroke-width="0.4"/>
    <polygon points="76,262 100,274 100,288 76,276" fill="url(#execWalnutFront)" stroke="#0b0503" stroke-width="0.35"/>
    <polygon points="100,274 112,268 112,282 100,288" fill="#0e0703" stroke="#060302" stroke-width="0.3"/>
    <!-- Scotch tumbler on table -->
    <polygon points="92,260 100,264 100,270 92,266" fill="#c5d8ec" opacity="0.55" stroke="#4a5a6b" stroke-width="0.3"/>
    <polygon points="92,263 100,267 100,269 92,266" fill="#b8752a" opacity="0.75"/>
  </g>

  <!-- Floor lamp (pole with shade, grounded at col 0 row 3ish) -->
  <g id="floor-lamp">
    <polygon points="-4,244 12,252 12,254 -4,246" fill="#1a1008" stroke="#050302" stroke-width="0.3"/>
    <line x1="4" y1="246" x2="4" y2="198" stroke="#2a1a0e" stroke-width="1.3"/>
    <polygon points="-4,196 12,196 14,186 -6,186" fill="#2a1a0e" stroke="#080504" stroke-width="0.4"/>
    <polygon points="-4,196 12,196 8,202 0,202" fill="url(#execLampGlow)"/>
  </g>

  <!-- Curtain panel cues (back wall window hints, not walls themselves) -->
  <g id="curtains">
    <!-- These stand just in front of the implied window; upright from top down to a vertical stop above the credenza zone. -->
    <polygon points="256,126 272,134 272,164 256,156" fill="#2a3340" stroke="#0e131b" stroke-width="0.4"/>
    <polygon points="258,128 270,134 270,158 258,152" fill="#384454" opacity="0.85"/>
    <polygon points="290,142 306,150 306,180 290,172" fill="#2a3340" stroke="#0e131b" stroke-width="0.4"/>
    <polygon points="292,144 304,150 304,174 292,168" fill="#384454" opacity="0.85"/>
  </g>
</svg>
