<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320">
  <!-- Ground-floor band backdrop: midtown plaza context seen at tower-base eye level. Reads as tower plaza, not sidewalk or waterfront: neighboring glass mid-rises, a distant slender high-rise, and cool atmospheric haze. No curb clutter, dock props, or harbor dressing. -->
  <defs>
    <linearGradient id="ground-plaza-haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3442" stop-opacity="0"/>
      <stop offset="1" stop-color="#38495c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ground-plaza-glass-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3c4c"/>
      <stop offset="1" stop-color="#243140"/>
    </linearGradient>
    <linearGradient id="ground-plaza-glass-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4b5d"/>
      <stop offset="1" stop-color="#2c3a4b"/>
    </linearGradient>
    <linearGradient id="ground-plaza-glass-lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e5f72"/>
      <stop offset="1" stop-color="#38495c"/>
    </linearGradient>
  </defs>

  <!-- Atmospheric haze wash over the whole strip, heavier at horizon -->
  <rect x="0" y="60" width="960" height="260" fill="url(#ground-plaza-haze)"/>

  <!-- Far tower silhouette: slender glass tower, furthest distance -->
  <polygon points="70,300 70,60 126,44 126,300" fill="#2a3544" opacity="0.62"/>
  <!-- Subtle window grid on far tower -->
  <g fill="#3a4a5c" opacity="0.4">
    <rect x="80" y="90" width="38" height="8"/>
    <rect x="80" y="118" width="38" height="8"/>
    <rect x="80" y="146" width="38" height="8"/>
    <rect x="80" y="174" width="38" height="8"/>
    <rect x="80" y="202" width="38" height="8"/>
    <rect x="80" y="230" width="38" height="8"/>
  </g>

  <!-- Neighbor tower mid-left: taller block form with stepped cap -->
  <polygon points="180,300 180,80 266,64 266,300" fill="url(#ground-plaza-glass-mid)" opacity="0.82"/>
  <polygon points="266,300 266,64 296,72 296,300" fill="url(#ground-plaza-glass-dark)" opacity="0.82"/>
  <!-- Stepped cap -->
  <rect x="208" y="68" width="58" height="14" fill="#4a5c70" opacity="0.7"/>
  <!-- Window grid -->
  <g fill="#556a80" opacity="0.55">
    <rect x="192" y="104" width="62" height="6"/>
    <rect x="192" y="122" width="62" height="6"/>
    <rect x="192" y="140" width="62" height="6"/>
    <rect x="192" y="158" width="62" height="6"/>
    <rect x="192" y="176" width="62" height="6"/>
    <rect x="192" y="194" width="62" height="6"/>
    <rect x="192" y="212" width="62" height="6"/>
    <rect x="192" y="230" width="62" height="6"/>
    <rect x="192" y="248" width="62" height="6"/>
    <rect x="192" y="266" width="62" height="6"/>
  </g>
  <!-- Scattered lit windows -->
  <g fill="#c8a862" opacity="0.75">
    <rect x="204" y="122" width="8" height="6"/>
    <rect x="228" y="140" width="8" height="6"/>
    <rect x="216" y="194" width="8" height="6"/>
    <rect x="240" y="230" width="8" height="6"/>
  </g>

  <!-- Mid-rise plaza block: low-rise retail/bank bordering the plaza, stepped roofline -->
  <polygon points="336,300 336,172 452,154 452,300" fill="url(#ground-plaza-glass-dark)" opacity="0.88"/>
  <polygon points="452,300 452,154 478,160 478,300" fill="#1c2632" opacity="0.88"/>
  <!-- Roof band -->
  <rect x="344" y="158" width="108" height="10" fill="#45556a" opacity="0.7"/>
  <!-- Lobby glow band -->
  <rect x="344" y="252" width="130" height="14" fill="#b88f4a" opacity="0.35"/>
  <g fill="#d1a35a" opacity="0.6">
    <rect x="354" y="254" width="14" height="10"/>
    <rect x="384" y="254" width="14" height="10"/>
    <rect x="414" y="254" width="14" height="10"/>
    <rect x="444" y="254" width="14" height="10"/>
  </g>
  <!-- Curtain wall window grid -->
  <g fill="#5e748a" opacity="0.55">
    <rect x="348" y="180" width="100" height="5"/>
    <rect x="348" y="196" width="100" height="5"/>
    <rect x="348" y="212" width="100" height="5"/>
    <rect x="348" y="228" width="100" height="5"/>
  </g>

  <!-- Distant slender high-rise behind right-flank -->
  <polygon points="530,300 530,24 576,12 576,300" fill="#222d3a" opacity="0.7"/>
  <polygon points="576,300 576,12 594,18 594,300" fill="#1a232f" opacity="0.7"/>
  <rect x="536" y="16" width="56" height="8" fill="#3c4a5a" opacity="0.65"/>
  <g fill="#3e4d60" opacity="0.45">
    <rect x="538" y="52" width="52" height="4"/>
    <rect x="538" y="68" width="52" height="4"/>
    <rect x="538" y="84" width="52" height="4"/>
    <rect x="538" y="100" width="52" height="4"/>
    <rect x="538" y="116" width="52" height="4"/>
    <rect x="538" y="132" width="52" height="4"/>
    <rect x="538" y="148" width="52" height="4"/>
    <rect x="538" y="164" width="52" height="4"/>
    <rect x="538" y="180" width="52" height="4"/>
    <rect x="538" y="196" width="52" height="4"/>
    <rect x="538" y="212" width="52" height="4"/>
    <rect x="538" y="228" width="52" height="4"/>
  </g>

  <!-- Neighbor tower right: block mass adjacent to tower footprint -->
  <polygon points="648,300 648,50 752,32 752,300" fill="url(#ground-plaza-glass-lit)" opacity="0.85"/>
  <polygon points="752,300 752,32 778,40 778,300" fill="url(#ground-plaza-glass-mid)" opacity="0.85"/>
  <!-- Stepped cap with small machinery -->
  <rect x="658" y="36" width="94" height="12" fill="#546778" opacity="0.75"/>
  <rect x="688" y="24" width="24" height="12" fill="#3e4d60" opacity="0.8"/>
  <!-- Window grid -->
  <g fill="#6c8298" opacity="0.55">
    <rect x="660" y="74" width="82" height="6"/>
    <rect x="660" y="96" width="82" height="6"/>
    <rect x="660" y="118" width="82" height="6"/>
    <rect x="660" y="140" width="82" height="6"/>
    <rect x="660" y="162" width="82" height="6"/>
    <rect x="660" y="184" width="82" height="6"/>
    <rect x="660" y="206" width="82" height="6"/>
    <rect x="660" y="228" width="82" height="6"/>
    <rect x="660" y="250" width="82" height="6"/>
  </g>
  <!-- Scattered lit windows -->
  <g fill="#d0a856" opacity="0.8">
    <rect x="672" y="96" width="10" height="6"/>
    <rect x="702" y="140" width="10" height="6"/>
    <rect x="686" y="184" width="10" height="6"/>
    <rect x="722" y="206" width="10" height="6"/>
    <rect x="672" y="250" width="10" height="6"/>
  </g>

  <!-- Far tower on the right horizon -->
  <polygon points="830,300 830,110 878,98 878,300" fill="#2a3443" opacity="0.6"/>
  <polygon points="878,300 878,98 896,104 896,300" fill="#1e2834" opacity="0.6"/>
  <g fill="#3e4e62" opacity="0.4">
    <rect x="838" y="132" width="42" height="5"/>
    <rect x="838" y="150" width="42" height="5"/>
    <rect x="838" y="168" width="42" height="5"/>
    <rect x="838" y="186" width="42" height="5"/>
    <rect x="838" y="204" width="42" height="5"/>
    <rect x="838" y="222" width="42" height="5"/>
    <rect x="838" y="240" width="42" height="5"/>
    <rect x="838" y="258" width="42" height="5"/>
  </g>

  <!-- Low atmospheric haze band across the plaza base -->
  <rect x="0" y="270" width="960" height="50" fill="#3a4a5e" opacity="0.28"/>
</svg>
