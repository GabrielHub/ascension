<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400">
  <!-- Mid-tower band backdrop: neighboring curtain-wall towers at eye-level altitude, wrapped in atmospheric haze. Tower tops fade into thickening haze; lit office windows scatter across the facades. No ground-plane dressing. -->
  <defs>
    <linearGradient id="mid-haze-upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e6077" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#3e5063" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2e3d4e" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="mid-haze-lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3c4c" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#485a6e" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="mid-tower-lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#506378"/>
      <stop offset="1" stop-color="#3a4a5d"/>
    </linearGradient>
    <linearGradient id="mid-tower-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38475a"/>
      <stop offset="1" stop-color="#24303f"/>
    </linearGradient>
    <linearGradient id="mid-tower-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3a4a"/>
      <stop offset="1" stop-color="#1e2735"/>
    </linearGradient>
  </defs>

  <!-- Upper haze bleed: hides the far tops so the eye reads altitude -->
  <rect x="0" y="0" width="960" height="220" fill="url(#mid-haze-upper)"/>

  <!-- Distant tower A: narrow slab, upper portion lost to haze -->
  <polygon points="60,400 60,60 134,48 134,400" fill="url(#mid-tower-far)" opacity="0.55"/>
  <polygon points="134,400 134,48 156,54 156,400" fill="#1a2330" opacity="0.55"/>
  <g fill="#3a4a5c" opacity="0.38">
    <rect x="70" y="100" width="58" height="5"/>
    <rect x="70" y="120" width="58" height="5"/>
    <rect x="70" y="140" width="58" height="5"/>
    <rect x="70" y="160" width="58" height="5"/>
    <rect x="70" y="180" width="58" height="5"/>
    <rect x="70" y="200" width="58" height="5"/>
    <rect x="70" y="220" width="58" height="5"/>
    <rect x="70" y="240" width="58" height="5"/>
    <rect x="70" y="260" width="58" height="5"/>
    <rect x="70" y="280" width="58" height="5"/>
    <rect x="70" y="300" width="58" height="5"/>
    <rect x="70" y="320" width="58" height="5"/>
    <rect x="70" y="340" width="58" height="5"/>
    <rect x="70" y="360" width="58" height="5"/>
  </g>

  <!-- Primary left-flank tower: large curtain-wall slab, iso-aligned -->
  <polygon points="204,400 204,30 314,16 314,400" fill="url(#mid-tower-shadow)" opacity="0.88"/>
  <polygon points="314,400 314,16 346,22 346,400" fill="#1e2834" opacity="0.92"/>
  <!-- Mechanical cap strip -->
  <rect x="212" y="20" width="102" height="12" fill="#3c4c5d" opacity="0.8"/>
  <!-- Curtain-wall horizontal reads -->
  <g fill="#4a5b6f" opacity="0.55">
    <rect x="214" y="60" width="96" height="5"/>
    <rect x="214" y="80" width="96" height="5"/>
    <rect x="214" y="100" width="96" height="5"/>
    <rect x="214" y="120" width="96" height="5"/>
    <rect x="214" y="140" width="96" height="5"/>
    <rect x="214" y="160" width="96" height="5"/>
    <rect x="214" y="180" width="96" height="5"/>
    <rect x="214" y="200" width="96" height="5"/>
    <rect x="214" y="220" width="96" height="5"/>
    <rect x="214" y="240" width="96" height="5"/>
    <rect x="214" y="260" width="96" height="5"/>
    <rect x="214" y="280" width="96" height="5"/>
    <rect x="214" y="300" width="96" height="5"/>
    <rect x="214" y="320" width="96" height="5"/>
    <rect x="214" y="340" width="96" height="5"/>
    <rect x="214" y="360" width="96" height="5"/>
    <rect x="214" y="380" width="96" height="5"/>
  </g>
  <!-- Mullion verticals -->
  <g stroke="#2a3542" stroke-width="1" opacity="0.7">
    <line x1="240" y1="32" x2="240" y2="400"/>
    <line x1="270" y1="28" x2="270" y2="400"/>
    <line x1="300" y1="22" x2="300" y2="400"/>
  </g>
  <!-- Scattered lit windows: office interiors through glass -->
  <g fill="#d1a962" opacity="0.8">
    <rect x="226" y="100" width="10" height="5"/>
    <rect x="252" y="140" width="10" height="5"/>
    <rect x="286" y="120" width="10" height="5"/>
    <rect x="220" y="180" width="10" height="5"/>
    <rect x="272" y="200" width="10" height="5"/>
    <rect x="300" y="240" width="10" height="5"/>
    <rect x="238" y="280" width="10" height="5"/>
    <rect x="280" y="320" width="10" height="5"/>
    <rect x="228" y="360" width="10" height="5"/>
  </g>

  <!-- Mid-distance tower between left and right flank: iso-aligned thin sliver -->
  <polygon points="400,400 400,180 436,172 436,400" fill="#2a3544" opacity="0.45"/>

  <!-- Rear central tower: distant, wrapped in upper haze -->
  <polygon points="468,400 468,100 522,90 522,400" fill="url(#mid-tower-far)" opacity="0.55"/>
  <polygon points="522,400 522,90 544,96 544,400" fill="#1a2331" opacity="0.55"/>
  <rect x="474" y="94" width="48" height="8" fill="#36455a" opacity="0.55"/>
  <g fill="#3e4e62" opacity="0.42">
    <rect x="476" y="130" width="44" height="5"/>
    <rect x="476" y="150" width="44" height="5"/>
    <rect x="476" y="170" width="44" height="5"/>
    <rect x="476" y="190" width="44" height="5"/>
    <rect x="476" y="210" width="44" height="5"/>
    <rect x="476" y="230" width="44" height="5"/>
    <rect x="476" y="250" width="44" height="5"/>
    <rect x="476" y="270" width="44" height="5"/>
    <rect x="476" y="290" width="44" height="5"/>
    <rect x="476" y="310" width="44" height="5"/>
    <rect x="476" y="330" width="44" height="5"/>
    <rect x="476" y="350" width="44" height="5"/>
    <rect x="476" y="370" width="44" height="5"/>
  </g>

  <!-- Right-flank tower: taller than the left-flank, iso-aligned slab -->
  <polygon points="594,400 594,10 722,-4 722,400" fill="url(#mid-tower-lit)" opacity="0.92"/>
  <polygon points="722,400 722,-4 758,4 758,400" fill="url(#mid-tower-shadow)" opacity="0.92"/>
  <!-- Mechanical cap -->
  <rect x="604" y="0" width="118" height="14" fill="#566a80" opacity="0.85"/>
  <rect x="654" y="-18" width="30" height="18" fill="#3e4d60" opacity="0.82"/>
  <!-- Curtain-wall horizontals -->
  <g fill="#6a8098" opacity="0.55">
    <rect x="606" y="42" width="114" height="5"/>
    <rect x="606" y="62" width="114" height="5"/>
    <rect x="606" y="82" width="114" height="5"/>
    <rect x="606" y="102" width="114" height="5"/>
    <rect x="606" y="122" width="114" height="5"/>
    <rect x="606" y="142" width="114" height="5"/>
    <rect x="606" y="162" width="114" height="5"/>
    <rect x="606" y="182" width="114" height="5"/>
    <rect x="606" y="202" width="114" height="5"/>
    <rect x="606" y="222" width="114" height="5"/>
    <rect x="606" y="242" width="114" height="5"/>
    <rect x="606" y="262" width="114" height="5"/>
    <rect x="606" y="282" width="114" height="5"/>
    <rect x="606" y="302" width="114" height="5"/>
    <rect x="606" y="322" width="114" height="5"/>
    <rect x="606" y="342" width="114" height="5"/>
    <rect x="606" y="362" width="114" height="5"/>
    <rect x="606" y="382" width="114" height="5"/>
  </g>
  <g stroke="#2a3542" stroke-width="1" opacity="0.7">
    <line x1="636" y1="-2" x2="636" y2="400"/>
    <line x1="672" y1="-4" x2="672" y2="400"/>
    <line x1="708" y1="-5" x2="708" y2="400"/>
  </g>
  <!-- Lit windows scattered more on the lit face -->
  <g fill="#d5ad66" opacity="0.85">
    <rect x="620" y="84" width="12" height="5"/>
    <rect x="654" y="124" width="12" height="5"/>
    <rect x="690" y="104" width="12" height="5"/>
    <rect x="612" y="162" width="12" height="5"/>
    <rect x="668" y="184" width="12" height="5"/>
    <rect x="702" y="222" width="12" height="5"/>
    <rect x="624" y="244" width="12" height="5"/>
    <rect x="680" y="284" width="12" height="5"/>
    <rect x="646" y="324" width="12" height="5"/>
    <rect x="702" y="344" width="12" height="5"/>
    <rect x="618" y="364" width="12" height="5"/>
  </g>

  <!-- Far tower on the right, almost lost in distant haze -->
  <polygon points="810,400 810,140 876,128 876,400" fill="#2a3442" opacity="0.48"/>
  <polygon points="876,400 876,128 900,134 900,400" fill="#1c2634" opacity="0.48"/>
  <g fill="#3a4a5c" opacity="0.38">
    <rect x="818" y="160" width="58" height="5"/>
    <rect x="818" y="180" width="58" height="5"/>
    <rect x="818" y="200" width="58" height="5"/>
    <rect x="818" y="220" width="58" height="5"/>
    <rect x="818" y="240" width="58" height="5"/>
    <rect x="818" y="260" width="58" height="5"/>
    <rect x="818" y="280" width="58" height="5"/>
    <rect x="818" y="300" width="58" height="5"/>
    <rect x="818" y="320" width="58" height="5"/>
    <rect x="818" y="340" width="58" height="5"/>
    <rect x="818" y="360" width="58" height="5"/>
  </g>

  <!-- Lower haze band: reinforces the mid-altitude float by hiding ground context -->
  <rect x="0" y="300" width="960" height="100" fill="url(#mid-haze-lower)"/>

  <!-- Thin low-opacity horizontal haze streaks — air-traffic altitude cue -->
  <g stroke="#6a7e94" stroke-width="1" opacity="0.18">
    <line x1="0" y1="88" x2="960" y2="92"/>
    <line x1="0" y1="152" x2="960" y2="158"/>
    <line x1="0" y1="214" x2="960" y2="220"/>
  </g>
</svg>
