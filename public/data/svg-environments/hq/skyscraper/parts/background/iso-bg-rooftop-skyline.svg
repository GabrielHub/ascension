<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400">
  <!-- Rooftop band backdrop: open-altitude sky with drifting clouds, distant tower tops below the horizon, an approaching aircraft beacon, and city glow rising from below. Reads as exposed altitude above the skyline, not plaza-level. -->
  <defs>
    <linearGradient id="rooftop-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a3e"/>
      <stop offset="0.55" stop-color="#2e3f56"/>
      <stop offset="1" stop-color="#3f5770"/>
    </linearGradient>
    <linearGradient id="rooftop-city-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5770" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#c68a3a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e0a248" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="rooftop-cloud" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#c9d4e2" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#94a4ba" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#94a4ba" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rooftop-beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b4a" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#d0432a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d0432a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky backdrop wash -->
  <rect x="0" y="0" width="960" height="400" fill="url(#rooftop-sky)"/>

  <!-- Scattered stars -->
  <g fill="#c8d6e6" opacity="0.7">
    <circle cx="80" cy="38" r="1.2"/>
    <circle cx="158" cy="72" r="0.9"/>
    <circle cx="222" cy="26" r="1.4"/>
    <circle cx="298" cy="60" r="1"/>
    <circle cx="362" cy="18" r="0.8"/>
    <circle cx="440" cy="48" r="1.1"/>
    <circle cx="528" cy="30" r="0.9"/>
    <circle cx="604" cy="66" r="1.3"/>
    <circle cx="676" cy="22" r="1"/>
    <circle cx="758" cy="54" r="0.9"/>
    <circle cx="832" cy="34" r="1.2"/>
    <circle cx="906" cy="68" r="0.9"/>
    <circle cx="114" cy="124" r="1"/>
    <circle cx="262" cy="150" r="0.9"/>
    <circle cx="496" cy="122" r="1.1"/>
    <circle cx="728" cy="140" r="0.9"/>
    <circle cx="874" cy="112" r="1.1"/>
  </g>

  <!-- Drifting clouds at altitude (soft radial washes, not literal puffs) -->
  <ellipse cx="180" cy="130" rx="140" ry="30" fill="url(#rooftop-cloud)"/>
  <ellipse cx="460" cy="90" rx="180" ry="28" fill="url(#rooftop-cloud)"/>
  <ellipse cx="740" cy="150" rx="160" ry="34" fill="url(#rooftop-cloud)"/>
  <ellipse cx="280" cy="200" rx="220" ry="32" fill="url(#rooftop-cloud)"/>
  <ellipse cx="680" cy="220" rx="200" ry="30" fill="url(#rooftop-cloud)"/>

  <!-- Approaching aircraft: far red beacon pulse plus a faint silhouette streak -->
  <circle cx="820" cy="104" r="18" fill="url(#rooftop-beacon)"/>
  <circle cx="820" cy="104" r="3" fill="#ff4a2e"/>
  <line x1="820" y1="104" x2="870" y2="106" stroke="#1e2a3e" stroke-width="1.2" opacity="0.55"/>
  <!-- Strobe wingtip hint -->
  <circle cx="872" cy="106" r="1.6" fill="#e8f4ff" opacity="0.9"/>

  <!-- Distant tower tops below the horizon line, receding into city glow -->
  <!-- Left cluster -->
  <polygon points="40,400 40,310 72,306 72,400" fill="#1c2838" opacity="0.8"/>
  <polygon points="72,400 72,306 94,308 94,400" fill="#131c28" opacity="0.8"/>
  <rect x="42" y="308" width="30" height="4" fill="#35465a" opacity="0.6"/>
  <line x1="58" y1="306" x2="58" y2="290" stroke="#131c28" stroke-width="1.4"/>
  <circle cx="58" cy="289" r="1.4" fill="#e04a3a"/>

  <polygon points="108,400 108,290 158,286 158,400" fill="#1e2a3c" opacity="0.85"/>
  <polygon points="158,400 158,286 186,290 186,400" fill="#141d2a" opacity="0.85"/>
  <rect x="114" y="288" width="44" height="5" fill="#3b4c62" opacity="0.7"/>
  <g fill="#4a5d74" opacity="0.5">
    <rect x="116" y="312" width="40" height="4"/>
    <rect x="116" y="328" width="40" height="4"/>
    <rect x="116" y="344" width="40" height="4"/>
    <rect x="116" y="360" width="40" height="4"/>
    <rect x="116" y="376" width="40" height="4"/>
  </g>
  <g fill="#d1a352" opacity="0.7">
    <rect x="124" y="328" width="6" height="4"/>
    <rect x="142" y="360" width="6" height="4"/>
  </g>

  <polygon points="210,400 210,326 238,322 238,400" fill="#1a2532" opacity="0.8"/>

  <!-- Central cluster: multiple overlapping tower tops -->
  <polygon points="284,400 284,304 326,298 326,400" fill="#1e2a3c" opacity="0.85"/>
  <polygon points="326,400 326,298 348,302 348,400" fill="#141e2b" opacity="0.85"/>
  <rect x="288" y="300" width="38" height="4" fill="#3c4d63" opacity="0.7"/>
  <line x1="306" y1="298" x2="306" y2="282" stroke="#131c28" stroke-width="1.4"/>
  <circle cx="306" cy="281" r="1.5" fill="#e04a3a"/>

  <polygon points="370,400 370,278 434,272 434,400" fill="url(#rooftop-sky)" opacity="0.7"/>
  <polygon points="370,400 370,278 434,272 434,400" fill="#243244" opacity="0.75"/>
  <polygon points="434,400 434,272 464,278 464,400" fill="#1a2432" opacity="0.85"/>
  <rect x="378" y="274" width="56" height="6" fill="#3e5067" opacity="0.78"/>
  <g fill="#556a82" opacity="0.55">
    <rect x="380" y="300" width="52" height="4"/>
    <rect x="380" y="316" width="52" height="4"/>
    <rect x="380" y="332" width="52" height="4"/>
    <rect x="380" y="348" width="52" height="4"/>
    <rect x="380" y="364" width="52" height="4"/>
    <rect x="380" y="380" width="52" height="4"/>
  </g>
  <g fill="#d8ac58" opacity="0.82">
    <rect x="388" y="300" width="6" height="4"/>
    <rect x="414" y="316" width="6" height="4"/>
    <rect x="396" y="348" width="6" height="4"/>
    <rect x="420" y="380" width="6" height="4"/>
  </g>

  <polygon points="488,400 488,316 528,312 528,400" fill="#1c2736" opacity="0.82"/>
  <polygon points="528,400 528,312 550,318 550,400" fill="#131c29" opacity="0.82"/>

  <!-- Right cluster -->
  <polygon points="588,400 588,286 640,280 640,400" fill="#1e2a3c" opacity="0.88"/>
  <polygon points="640,400 640,280 668,286 668,400" fill="#141e2b" opacity="0.88"/>
  <rect x="594" y="282" width="46" height="6" fill="#3c4d63" opacity="0.78"/>
  <rect x="610" y="266" width="18" height="16" fill="#2a3848" opacity="0.85"/>
  <g fill="#556a82" opacity="0.55">
    <rect x="596" y="310" width="42" height="4"/>
    <rect x="596" y="326" width="42" height="4"/>
    <rect x="596" y="342" width="42" height="4"/>
    <rect x="596" y="358" width="42" height="4"/>
    <rect x="596" y="374" width="42" height="4"/>
  </g>
  <g fill="#d5ab56" opacity="0.8">
    <rect x="608" y="310" width="6" height="4"/>
    <rect x="626" y="342" width="6" height="4"/>
    <rect x="612" y="374" width="6" height="4"/>
  </g>
  <line x1="619" y1="266" x2="619" y2="254" stroke="#131c28" stroke-width="1.4"/>
  <circle cx="619" cy="253" r="1.5" fill="#e04a3a"/>

  <polygon points="696,400 696,328 734,324 734,400" fill="#1a2432" opacity="0.78"/>

  <polygon points="770,400 770,296 824,290 824,400" fill="#1e2a3c" opacity="0.85"/>
  <polygon points="824,400 824,290 850,296 850,400" fill="#141e2b" opacity="0.85"/>
  <rect x="776" y="292" width="48" height="5" fill="#3c4d63" opacity="0.7"/>

  <polygon points="890,400 890,318 918,314 918,400" fill="#1a2532" opacity="0.78"/>

  <!-- City glow rising from below -->
  <rect x="0" y="260" width="960" height="140" fill="url(#rooftop-city-glow)"/>
</svg>
