<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960">
  <!-- Skyscraper core shell: nine-floor mirrored-glass midtown tower, isometric 2:1 cutaway. Left facade is the shadow side, right facade is the lit side. Floor dividers mark each level for the engine-rendered interiors beneath. -->
  <defs>
    <linearGradient id="skyscraper-shell-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3a48"/>
      <stop offset="1" stop-color="#23303e"/>
    </linearGradient>
    <linearGradient id="skyscraper-shell-lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52667a"/>
      <stop offset="1" stop-color="#3e5266"/>
    </linearGradient>
    <linearGradient id="skyscraper-shell-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7d90"/>
      <stop offset="1" stop-color="#4a5b6d"/>
    </linearGradient>
  </defs>

  <!-- Tower base iso plate (ground floor footprint visible from above/side) -->
  <polygon points="320,880 560,820 320,760 80,820" fill="#2a3038" stroke="#141a22" stroke-width="2"/>

  <!-- Left facade (shadow side): nine floors stacked, front-bottom to back-top -->
  <polygon points="320,880 320,160 80,100 80,820" fill="url(#skyscraper-shell-shadow)" stroke="#141a22" stroke-width="2"/>

  <!-- Right facade (lit side): nine floors stacked -->
  <polygon points="320,880 320,160 560,100 560,820" fill="url(#skyscraper-shell-lit)" stroke="#141a22" stroke-width="2"/>

  <!-- Floor divider lines: eight dividers between nine floors, along both facades. Line spacing 80px front-edge, matching the iso rise of 80 screen-px per floor. -->
  <g stroke="#8ba8c4" stroke-width="1.5" opacity="0.55">
    <line x1="320" y1="800" x2="80" y2="740"/>
    <line x1="320" y1="800" x2="560" y2="740"/>
    <line x1="320" y1="720" x2="80" y2="660"/>
    <line x1="320" y1="720" x2="560" y2="660"/>
    <line x1="320" y1="640" x2="80" y2="580"/>
    <line x1="320" y1="640" x2="560" y2="580"/>
    <line x1="320" y1="560" x2="80" y2="500"/>
    <line x1="320" y1="560" x2="560" y2="500"/>
    <line x1="320" y1="480" x2="80" y2="420"/>
    <line x1="320" y1="480" x2="560" y2="420"/>
    <line x1="320" y1="400" x2="80" y2="340"/>
    <line x1="320" y1="400" x2="560" y2="340"/>
    <line x1="320" y1="320" x2="80" y2="260"/>
    <line x1="320" y1="320" x2="560" y2="260"/>
    <line x1="320" y1="240" x2="80" y2="180"/>
    <line x1="320" y1="240" x2="560" y2="180"/>
  </g>

  <!-- Mullion verticals: cool-light catches that hint at a curtain-wall grid without competing with runtime room detail -->
  <g stroke="#95b2cd" stroke-width="1" opacity="0.35">
    <line x1="200" y1="835" x2="200" y2="130"/>
    <line x1="440" y1="835" x2="440" y2="130"/>
  </g>
  <g stroke="#5a7388" stroke-width="1" opacity="0.35">
    <line x1="160" y1="820" x2="160" y2="115"/>
    <line x1="480" y1="820" x2="480" y2="115"/>
  </g>

  <!-- Ground-floor entry band: subtle warmer reflection to read as the plaza lobby -->
  <polygon points="320,880 320,820 80,760 80,820" fill="#1e2530" opacity="0.85"/>
  <polygon points="320,880 320,820 560,760 560,820" fill="#1a2330" opacity="0.85"/>
  <line x1="320" y1="845" x2="80" y2="785" stroke="#c4a367" stroke-width="1.2" opacity="0.55"/>
  <line x1="320" y1="845" x2="560" y2="785" stroke="#c4a367" stroke-width="1.2" opacity="0.55"/>

  <!-- Roof cap iso plate -->
  <polygon points="320,160 560,100 320,40 80,100" fill="url(#skyscraper-shell-roof)" stroke="#141a22" stroke-width="2"/>

  <!-- Mechanical penthouse: smaller iso box on top of the cap -->
  <polygon points="320,40 320,-40 200,-68 200,12" fill="#3a4656" stroke="#141a22" stroke-width="2"/>
  <polygon points="320,40 320,-40 440,-68 440,12" fill="#4a5868" stroke="#141a22" stroke-width="2"/>
  <polygon points="320,-40 440,-68 320,-96 200,-68" fill="#5a6a7c" stroke="#141a22" stroke-width="2"/>

  <!-- Rooftop air-traffic beacon tower -->
  <line x1="320" y1="-96" x2="320" y2="-168" stroke="#151a22" stroke-width="2.5"/>
  <circle cx="320" cy="-170" r="4" fill="#e04a3a"/>
</svg>
