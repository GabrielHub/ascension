<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 360 290">
  <!-- REFERENCE FIXTURE: The Compliance Office, Skyscraper floor 7.
       Authored footprint: 2 cols x 5 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).
       Floor corners: N(0,0)=(200,100), E(2,0)=(296,148),
                      S(2,5)=(56,268), W(0,5)=(-40,220).
       Design reference only — runtime ships the props-only scene in
       recipes/scene-the-compliance-office.svg. -->

  <!-- Floor plane -->
  <polygon points="200,100 296,148 56,268 -40,220"
    fill="#2a2d35" stroke="#13161c" stroke-width="1.1"/>

  <!-- Grid overlay -->
  <g stroke="rgba(170,176,192,0.16)" stroke-width="0.5">
    <!-- c-axis (only 2 across) -->
    <line x1="152" y1="124" x2="-8" y2="204"/>
    <line x1="104" y1="148" x2="-56" y2="228"/>
    <line x1="56" y1="172" x2="-104" y2="252"/>
    <line x1="8" y1="196" x2="-152" y2="276"/>
    <!-- r-axis (5 deep) -->
    <line x1="248" y1="124" x2="8" y2="244"/>
    <line x1="200" y1="100" x2="-40" y2="220"/>
  </g>

  <!-- West wall (N to W corner). Wall height 84. -->
  <polygon points="200,16 -40,136 -40,220 200,100"
    fill="#353a46" stroke="#191d26" stroke-width="1"/>
  <!-- North wall (N to E corner). Wall height 84. -->
  <polygon points="200,16 296,64 296,148 200,100"
    fill="#2d323d" stroke="#161a21" stroke-width="1"/>

  <text x="128" y="288" font-family="monospace" font-size="11" fill="#a6b5c4" text-anchor="middle" opacity="0.9">THE COMPLIANCE OFFICE</text>
  <text x="128" y="10" font-family="monospace" font-size="7" fill="#8f8476" text-anchor="middle">Skyscraper reference fixture — not used in runtime</text>
</svg>
