<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 500 360">
  <!-- REFERENCE FIXTURE: The Supply Hall, Skyscraper floor 3.
       Authored footprint: 5 cols x 5 rows. Origin (200,100).
       Floor corners: N(0,0)=(200,100), E(5,0)=(440,220),
                      S(5,5)=(200,340), W(0,5)=(-40,220). -->

  <polygon points="200,100 440,220 200,340 -40,220"
    fill="#2a2d36" stroke="#14161c" stroke-width="1.1"/>

  <g stroke="rgba(170,170,190,0.16)" stroke-width="0.5">
    <line x1="152" y1="124" x2="392" y2="244"/>
    <line x1="104" y1="148" x2="344" y2="268"/>
    <line x1="56" y1="172" x2="296" y2="292"/>
    <line x1="8" y1="196" x2="248" y2="316"/>
    <line x1="248" y1="124" x2="8" y2="244"/>
    <line x1="296" y1="148" x2="56" y2="268"/>
    <line x1="344" y1="172" x2="104" y2="292"/>
    <line x1="392" y1="196" x2="152" y2="316"/>
  </g>

  <polygon points="200,16 -40,136 -40,220 200,100"
    fill="#353a46" stroke="#191d26" stroke-width="1"/>
  <polygon points="200,16 440,136 440,220 200,100"
    fill="#2d323d" stroke="#161a21" stroke-width="1"/>

  <text x="200" y="356" font-family="monospace" font-size="11" fill="#c9a34a" text-anchor="middle" opacity="0.9">THE SUPPLY HALL</text>
  <text x="200" y="10" font-family="monospace" font-size="7" fill="#8f8476" text-anchor="middle">Skyscraper reference fixture — not used in runtime</text>
</svg>
