<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">
  <!-- Three weathered wooden dock pilings rising from water.
       Isometric 2:1. Vertical cylinders with iso depth stagger. -->

  <!-- Back piling (upper, further from viewer) -->
  <g>
    <rect x="22" y="18" width="10" height="56" rx="1.5"
      fill="#3e3224" stroke="#2e2418" stroke-width="0.8"/>
    <g stroke="#2e2418" stroke-width="0.3" opacity="0.4">
      <line x1="24" y1="20" x2="24" y2="72"/>
      <line x1="29" y1="22" x2="29" y2="70"/>
    </g>
    <g stroke="#5a5040" stroke-width="1.5" fill="none" opacity="0.6">
      <line x1="21" y1="50" x2="33" y2="48"/>
      <line x1="21" y1="54" x2="33" y2="52"/>
      <line x1="21" y1="58" x2="33" y2="56"/>
    </g>
    <ellipse cx="27" cy="18" rx="6" ry="2.5" fill="#4a3e2e" stroke="#2e2418" stroke-width="0.5"/>
    <ellipse cx="26" cy="38" rx="3" ry="6" fill="#2a2018" opacity="0.2"/>
  </g>

  <!-- Middle piling (tallest) -->
  <g>
    <rect x="52" y="8" width="11" height="72" rx="1.5"
      fill="#4a3e2e" stroke="#2e2418" stroke-width="0.8"/>
    <g stroke="#2e2418" stroke-width="0.3" opacity="0.4">
      <line x1="55" y1="10" x2="55" y2="78"/>
      <line x1="60" y1="12" x2="60" y2="76"/>
    </g>
    <g stroke="#5a5040" stroke-width="1.8" fill="none" opacity="0.6">
      <line x1="51" y1="52" x2="64" y2="50"/>
      <line x1="51" y1="56" x2="64" y2="54"/>
      <line x1="51" y1="60" x2="64" y2="58"/>
      <line x1="51" y1="64" x2="64" y2="62"/>
    </g>
    <ellipse cx="57.5" cy="8" rx="7" ry="2.8" fill="#5a4e3a" stroke="#2e2418" stroke-width="0.5"/>
    <g fill="#3a3830" opacity="0.3">
      <circle cx="54" cy="70" r="1.5"/>
      <circle cx="61" cy="72" r="1"/>
      <circle cx="56" cy="74" r="1.2"/>
    </g>
  </g>

  <!-- Front piling (lower, closer to viewer) -->
  <g>
    <rect x="84" y="24" width="10" height="62" rx="1.5"
      fill="#3a3020" stroke="#2e2418" stroke-width="0.8"/>
    <g stroke="#2e2418" stroke-width="0.3" opacity="0.4">
      <line x1="87" y1="26" x2="87" y2="84"/>
      <line x1="91" y1="28" x2="91" y2="82"/>
    </g>
    <g stroke="#5a5040" stroke-width="1.5" fill="none" opacity="0.5">
      <line x1="83" y1="62" x2="95" y2="60"/>
      <line x1="83" y1="66" x2="95" y2="64"/>
    </g>
    <ellipse cx="89" cy="24" rx="6" ry="2.5" fill="#4a3e2e" stroke="#2e2418" stroke-width="0.5"/>
    <ellipse cx="90" cy="50" rx="2.5" ry="8" fill="#2a2018" opacity="0.15"/>
  </g>

  <!-- Dangling rope between middle and front -->
  <path d="M63,56 Q74,68 84,62" stroke="#5a5040" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
