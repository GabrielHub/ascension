<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 10 500 410">
  <!-- Low industrial warehouse building — Red Hook style.
       Brick with corrugated metal roof, loading dock, industrial character.
       Canonical 2:1 isometric. Facade slope +0.5, side slope -0.5.

       Tile-aligned footprint: facade 4 tiles (192px), side 5 tiles (240px).
       viewBox bottom-center sits on front corner base for placement anchor.

       Geometry:
         Front corner base: (240, 420)
         Front corner top:  (240, 240)
         FL base:           ( 48, 324)   FL top: ( 48, 144)
         BR base:           (480, 300)   BR top: (480, 120)
         BL top:            (288,  24)
         Wall height: 180
         Facade width: 192 (4 tiles × 48)
         Side depth:   240 (5 tiles × 48) -->

  <defs>
    <linearGradient id="wh-facade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#4a3028"/>
      <stop offset="100%" stop-color="#3a2418"/>
    </linearGradient>
    <linearGradient id="wh-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e1e16"/>
      <stop offset="100%" stop-color="#382818"/>
    </linearGradient>
  </defs>

  <!-- Side face (drawn first, behind facade) -->
  <polygon points="240,240 480,120 480,300 240,420"
    fill="url(#wh-side)" stroke="#2e1e16" stroke-width="1"/>

  <!-- Facade wall -->
  <polygon points="48,144 240,240 240,420 48,324"
    fill="url(#wh-facade)" stroke="#2e1e16" stroke-width="1.5"/>

  <!-- Roof -->
  <polygon points="48,144 240,240 480,120 288,24"
    fill="#2a2828" stroke="#222" stroke-width="1.5"/>

  <!-- Roof corrugation lines (parallel to side edges, slope -0.5) -->
  <g stroke="#1e1e1e" stroke-width="0.5" opacity="0.3">
    <line x1="96" y1="168" x2="336" y2="48"/>
    <line x1="144" y1="192" x2="384" y2="72"/>
    <line x1="192" y1="216" x2="432" y2="96"/>
  </g>

  <!-- Roof edge / gutter — facade -->
  <polygon points="48,144 240,240 240,246 48,150"
    fill="#3a3838" stroke="#2a2828" stroke-width="0.5" opacity="0.5"/>

  <!-- Roof edge — side -->
  <polygon points="240,240 480,120 480,126 240,246"
    fill="#2e2e2e" stroke="#2a2828" stroke-width="0.5" opacity="0.4"/>

  <!-- ═══ FACADE DETAILS — matrix(0.96, 0.48, 0, 1, 48, 144) ═══
       Local x: 0→200 (left to right along facade, scales to 192 world units)
       Local y: 0→180 (top to bottom, wall height) -->
  <g transform="matrix(0.96, 0.48, 0, 1, 48, 144)">
    <!-- Brick texture -->
    <g stroke="#3a2418" stroke-width="0.5" opacity="0.12">
      <line x1="5" y1="25" x2="195" y2="25"/>
      <line x1="5" y1="50" x2="195" y2="50"/>
      <line x1="5" y1="75" x2="195" y2="75"/>
      <line x1="5" y1="100" x2="195" y2="100"/>
      <line x1="5" y1="125" x2="195" y2="125"/>
      <line x1="5" y1="150" x2="195" y2="150"/>
    </g>

    <!-- Loading door (large, roll-up) -->
    <rect x="15" y="60" width="70" height="120" rx="2"
      fill="#161210" stroke="#3a2418" stroke-width="1"/>
    <!-- Door corrugation -->
    <g stroke="#1e1a14" stroke-width="0.5" opacity="0.4">
      <line x1="17" y1="70" x2="83" y2="70"/>
      <line x1="17" y1="80" x2="83" y2="80"/>
      <line x1="17" y1="90" x2="83" y2="90"/>
      <line x1="17" y1="100" x2="83" y2="100"/>
      <line x1="17" y1="110" x2="83" y2="110"/>
      <line x1="17" y1="120" x2="83" y2="120"/>
      <line x1="17" y1="130" x2="83" y2="130"/>
      <line x1="17" y1="140" x2="83" y2="140"/>
      <line x1="17" y1="150" x2="83" y2="150"/>
      <line x1="17" y1="160" x2="83" y2="160"/>
    </g>

    <!-- Small windows (high up) -->
    <g fill="#161210" stroke="#3a2418" stroke-width="0.5">
      <rect x="25" y="15" width="18" height="24" rx="1"/>
      <rect x="85" y="15" width="18" height="24" rx="1"/>
      <rect x="145" y="15" width="18" height="24" rx="1"/>
    </g>

    <!-- Dim window glow -->
    <g opacity="0.1">
      <rect x="27" y="17" width="14" height="20" rx="1" fill="#c8a84c"/>
      <rect x="147" y="17" width="14" height="20" rx="1" fill="#9a7a3c"/>
    </g>

    <!-- Personnel door -->
    <rect x="130" y="90" width="30" height="90" rx="1"
      fill="#1e1a14" stroke="#3a2418" stroke-width="0.8"/>
    <!-- Door handle -->
    <circle cx="155" cy="135" r="1.5" fill="#4a4848" opacity="0.4"/>
  </g>

  <!-- ═══ SIDE FACE DETAILS — matrix(0.9230769, -0.4615385, 0, 1, 240, 240) ═══
       Local x: 0→260 (front corner toward back, scales to 240 world units)
       Local y: 0→180 (top to bottom, wall height) -->
  <g transform="matrix(0.9230769, -0.4615385, 0, 1, 240, 240)">
    <!-- Brick texture -->
    <g stroke="#2a1e14" stroke-width="0.4" opacity="0.1">
      <line x1="5" y1="25" x2="255" y2="25"/>
      <line x1="5" y1="50" x2="255" y2="50"/>
      <line x1="5" y1="75" x2="255" y2="75"/>
      <line x1="5" y1="100" x2="255" y2="100"/>
      <line x1="5" y1="125" x2="255" y2="125"/>
      <line x1="5" y1="150" x2="255" y2="150"/>
    </g>

    <!-- Side windows -->
    <g fill="#161210" stroke="#3a2418" stroke-width="0.4" opacity="0.6">
      <rect x="30" y="15" width="16" height="22" rx="1"/>
      <rect x="90" y="15" width="16" height="22" rx="1"/>
      <rect x="150" y="15" width="16" height="22" rx="1"/>
      <rect x="210" y="15" width="16" height="22" rx="1"/>
    </g>

    <!-- Downspout -->
    <line x1="3" y1="5" x2="3" y2="175"
      stroke="#3a3838" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Water stain on facade -->
  <g transform="matrix(0.96, 0.48, 0, 1, 48, 144)">
    <line x1="110" y1="0" x2="112" y2="180"
      stroke="#30281e" stroke-width="3" opacity="0.08"/>
  </g>

  <!-- Graffiti hint (abstract shape) -->
  <g transform="matrix(0.96, 0.48, 0, 1, 48, 144)" opacity="0.06">
    <rect x="120" y="110" width="40" height="15" rx="2" fill="#5a8a5a"/>
  </g>
</svg>
