<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52">
  <!-- Cast-iron mooring bollard with cleated rope.
       Isometric 2:1. Mushroom-top bollard with proper iso box faces.
       Left face, right face, and top visible. -->

  <!-- Base plate — top face (iso diamond) -->
  <polygon points="22,39 32,44 22,49 12,44"
    fill="#2a2a2e" stroke="#1e1e22" stroke-width="0.6"/>
  <!-- Base plate — left face -->
  <polygon points="12,44 22,49 22,51 12,46"
    fill="#222226" stroke="#1a1a1e" stroke-width="0.5"/>
  <!-- Base plate — right face -->
  <polygon points="32,44 22,49 22,51 32,46"
    fill="#1e1e22" stroke="#1a1a1e" stroke-width="0.5"/>

  <!-- Body — left face (iso parallelogram) -->
  <polygon points="14,21 22,25 22,45 14,41"
    fill="#3a3838" stroke="#2a2a2e" stroke-width="0.5"/>
  <!-- Body — right face (iso parallelogram) -->
  <polygon points="30,21 22,25 22,45 30,41"
    fill="#2e2e30" stroke="#222228" stroke-width="0.5"/>

  <!-- Mushroom cap — left face -->
  <polygon points="12,10 22,15 22,19 12,14"
    fill="#4a4848" stroke="#2a2a2e" stroke-width="0.5"/>
  <!-- Mushroom cap — right face -->
  <polygon points="32,10 22,15 22,19 32,14"
    fill="#3a3a3e" stroke="#2a2a2e" stroke-width="0.5"/>
  <!-- Mushroom cap — top face (iso diamond) -->
  <polygon points="22,5 32,10 22,15 12,10"
    fill="#555558" stroke="#3a3a3e" stroke-width="0.5"/>

  <!-- Rust patches on left face -->
  <g opacity="0.15">
    <polygon points="16,28 19,30 19,35 16,33" fill="#5a3020"/>
    <polygon points="17,35 20,37 20,40 17,38" fill="#4a2818"/>
  </g>

  <!-- Cleated rope — wraps around body iso V-shape -->
  <g stroke="#5a5040" stroke-width="1.5" fill="none" opacity="0.6">
    <polyline points="14,28 22,32 30,28"/>
    <polyline points="14,32 22,36 30,32"/>
  </g>

  <!-- Rope trailing off right -->
  <path d="M30,30 Q35,34 36,40 Q37,44 35,48"
    stroke="#5a5040" stroke-width="1.2" fill="none" opacity="0.4"/>
</svg>
