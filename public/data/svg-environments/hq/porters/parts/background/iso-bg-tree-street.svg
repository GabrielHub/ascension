<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100">
  <!-- Isometric street tree. Looking down at ~30° angle.
       Trunk tapers into an isometric ground shadow below the canopy.
       Render at 110-150px wide for proper street scale. -->

  <!-- Ground shadow (isometric ellipse, cast slightly forward) -->
  <ellipse cx="30" cy="88" rx="24" ry="8" fill="rgba(0,0,0,0.18)"/>

  <!-- Trunk — extends from canopy down past the shadow line,
       giving correct top-down overlap perspective -->
  <line x1="30" y1="78" x2="30" y2="34" stroke="#3a2818" stroke-width="4"/>
  <line x1="30" y1="78" x2="30" y2="34" stroke="#4a3424" stroke-width="2.2"/>
  <!-- Trunk below shadow (visible overlap — we're looking DOWN at the tree) -->
  <line x1="30" y1="78" x2="30" y2="100" stroke="#2e1e12" stroke-width="3.5" opacity="0.55"/>
  <line x1="30" y1="78" x2="30" y2="96" stroke="#3a2818" stroke-width="1.8" opacity="0.35"/>

  <!-- Root flare (where trunk meets ground) -->
  <path d="M26,78 Q30,82 34,78" stroke="#3a2818" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Branches -->
  <line x1="30" y1="46" x2="15" y2="28" stroke="#3a2818" stroke-width="2"/>
  <line x1="30" y1="42" x2="45" y2="24" stroke="#3a2818" stroke-width="1.6"/>
  <line x1="30" y1="52" x2="19" y2="38" stroke="#3a2818" stroke-width="1.2"/>
  <line x1="30" y1="50" x2="40" y2="36" stroke="#3a2818" stroke-width="1"/>

  <!-- Foliage cluster (full canopy, viewed from above) -->
  <ellipse cx="30" cy="24" rx="27" ry="20" fill="#0e2818"/>
  <ellipse cx="20" cy="18" rx="16" ry="14" fill="#102a1c"/>
  <ellipse cx="40" cy="16" rx="14" ry="13" fill="#0c2616"/>
  <ellipse cx="30" cy="10" rx="18" ry="12" fill="#102a1c"/>
  <ellipse cx="10" cy="24" rx="12" ry="9" fill="#0e2818"/>
  <ellipse cx="50" cy="22" rx="10" ry="8" fill="#0c2616"/>

  <!-- Canopy top highlights (dappled light from above) -->
  <ellipse cx="22" cy="12" rx="7" ry="5" fill="#143020" opacity="0.5"/>
  <ellipse cx="38" cy="18" rx="5" ry="4" fill="#163222" opacity="0.4"/>
  <ellipse cx="14" cy="26" rx="4" ry="3" fill="#143020" opacity="0.3"/>
  <ellipse cx="34" cy="8" rx="5" ry="3" fill="#183824" opacity="0.3"/>
</svg>
