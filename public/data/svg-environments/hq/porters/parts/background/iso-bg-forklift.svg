<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 15 130 105">
  <!-- Industrial counterbalance forklift, weathered yellow.
       Iso 2:1, cell-shaded. No ground shadow.
       Vehicle long axis along facade direction (slope +0.5).
       Rear at upper-left, front (mast/forks) at lower-right.

       Iso transform — vehicle local (L,W,H) → screen:
         sx = 15 + L + W
         sy = 75 + L/2 - W/2 - H

       Body counterweight: L=60, W=28, H=16.
         FC_b (front-left base):  (75,105)
         FL_b (rear-left base):   (15, 75)
         BR_b (front-right base): (103,91)
         FC_t (front-left top):   (75, 89)
         FL_t (rear-left top):    (15, 59)
         BR_t (front-right top):  (103,75)
         BL_t (rear-right top):   (43, 45)

       Anchor: front-center-bottom around (89, 98). -->

  <!-- ═══ BODY COUNTERWEIGHT — three cell-shaded faces ═══ -->

  <!-- Front face (vehicle front, slope -0.5, darkest tone) -->
  <polygon points="75,89 103,75 103,91 75,105"
    fill="#9a7218" stroke="#1a1004" stroke-width="0.9"/>

  <!-- Left face / facade (vehicle left, slope +0.5, mid tone) -->
  <polygon points="15,59 75,89 75,105 15,75"
    fill="#c8a020" stroke="#1a1004" stroke-width="1"/>

  <!-- Top face (counterweight deck, lightest tone) -->
  <polygon points="15,59 43,45 103,75 75,89"
    fill="#e0b830" stroke="#1a1004" stroke-width="0.9"/>

  <!-- Cell-shading highlight: top-edge bright line where deck meets facade -->
  <line x1="15" y1="59" x2="75" y2="89" stroke="#f8d860" stroke-width="1.2" opacity="0.9"/>

  <!-- Cell-shading hard shadow stripe at base of facade -->
  <polygon points="15,71 75,101 75,105 15,75" fill="#3a2008" opacity="0.3"/>

  <!-- Counterweight vertical ribs (vertical world lines on facade) -->
  <g stroke="#3a2008" stroke-width="0.7" opacity="0.55">
    <line x1="25" y1="64" x2="25" y2="80"/>
    <line x1="35" y1="69" x2="35" y2="85"/>
    <line x1="45" y1="74" x2="45" y2="90"/>
    <line x1="55" y1="79" x2="55" y2="95"/>
    <line x1="65" y1="84" x2="65" y2="100"/>
  </g>

  <!-- ═══ FRONT FACE DETAILS — grille + headlight ═══ -->

  <!-- Grille slats (slope -0.5, parallel to side direction) -->
  <g stroke="#2a1808" stroke-width="0.6" opacity="0.6">
    <line x1="78" y1="99" x2="100" y2="88"/>
    <line x1="78" y1="96" x2="100" y2="85"/>
    <line x1="78" y1="93" x2="100" y2="82"/>
  </g>

  <!-- Headlight -->
  <ellipse cx="89" cy="86" rx="2" ry="1.4" fill="#f8d860"/>
  <ellipse cx="89" cy="86" rx="1.2" ry="0.8" fill="#fff5b0"/>

  <!-- ═══ OPERATOR SEAT + STEERING (on body top, inside cage area) ═══ -->

  <!-- Seat backrest (vertical parallelogram standing on body top) -->
  <polygon points="41,64 53,58 53,48 41,54"
    fill="#1a0c14" stroke="#0e0810" stroke-width="0.4"/>
  <line x1="41" y1="54" x2="53" y2="48" stroke="#3a2230" stroke-width="0.4" opacity="0.7"/>

  <!-- Seat cushion (small parallelogram on body top in front of backrest) -->
  <polygon points="41,64 53,70 65,64 53,58"
    fill="#22141a" stroke="#0e0810" stroke-width="0.4"/>
  <polygon points="41,62 53,68 65,62 53,56"
    fill="#3a2230" stroke="#0e0810" stroke-width="0.3" opacity="0.85"/>

  <!-- Steering column -->
  <line x1="64" y1="69" x2="64" y2="64" stroke="#22180a" stroke-width="1.4"/>
  <!-- Steering wheel -->
  <ellipse cx="64" cy="63" rx="3" ry="1.2" fill="#22141a" stroke="#0e0810" stroke-width="0.3"/>
  <ellipse cx="64" cy="63" rx="2" ry="0.7" fill="#3a2230" opacity="0.7"/>

  <!-- ═══ DRIVER CAGE / OVERHEAD GUARD ═══
       Cage covers facade pos 6→46, side pos 0→28, height 16→40 (24 tall above body).
         rear-left  base (21, 62)  top (21, 38)
         front-left base (61, 82)  top (61, 58)
         rear-right base (49, 48)  top (49, 24)
         front-right base(89, 68)  top (89, 44) -->

  <!-- Vertical posts -->
  <rect x="20" y="38" width="2" height="24" fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>
  <rect x="60" y="58" width="2" height="24" fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>
  <rect x="48" y="24" width="2" height="24" fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>
  <rect x="88" y="44" width="2" height="24" fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>

  <!-- Cage roof slab -->
  <polygon points="21,38 49,24 89,44 61,58"
    fill="#1a1004" stroke="#0a0602" stroke-width="0.6"/>
  <!-- Roof front-edge cell-shading highlight -->
  <line x1="21" y1="38" x2="61" y2="58" stroke="#3a2008" stroke-width="0.6" opacity="0.7"/>
  <!-- Roof slat cross-bracing -->
  <g stroke="#3a2008" stroke-width="0.4" opacity="0.55">
    <line x1="35" y1="31" x2="75" y2="51"/>
    <line x1="50" y1="38.5" x2="50" y2="38.5"/>
  </g>

  <!-- ═══ MAST — vertical lift assembly at front of body ═══
       Mast at facade pos 60 (front face of body), 60 tall world units.
       Back rail at side pos 4, front rail at side pos 24.
         back rail base (79,103) → top (79, 43)
         front rail base (99, 93) → top (99, 33) -->

  <!-- Mast back rail (vertical, slightly lighter — camera-near side) -->
  <rect x="78" y="43" width="2.5" height="60" fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>
  <line x1="78" y1="43" x2="78" y2="103" stroke="#3a2008" stroke-width="0.4" opacity="0.5"/>

  <!-- Mast front rail (vertical, darker — camera-far side) -->
  <rect x="98" y="33" width="2.5" height="60" fill="#0e0802" stroke="#050200" stroke-width="0.4"/>

  <!-- Mast cross brace TOP -->
  <polygon points="78,43 100.5,33 100.5,36 78,46"
    fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>

  <!-- Mast cross brace MID -->
  <polygon points="78,68 100.5,58 100.5,60 78,70"
    fill="#1a1004" stroke="#0a0602" stroke-width="0.4" opacity="0.85"/>

  <!-- Hydraulic lift cylinder behind mast (between rails) -->
  <rect x="89" y="40" width="1.6" height="55" fill="#5a5860" stroke="#2a282e" stroke-width="0.3"/>
  <line x1="89" y1="40" x2="89" y2="95" stroke="#9a9890" stroke-width="0.4" opacity="0.5"/>

  <!-- Fork carriage (mounting plate at base of mast) -->
  <polygon points="78,93 100.5,83 100.5,91 78,101"
    fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>
  <line x1="78" y1="93" x2="100.5" y2="83" stroke="#3a2008" stroke-width="0.4" opacity="0.6"/>

  <!-- ═══ FORKS extending forward from carriage ═══
       Forks at low height, facade pos 60→88, height 3→5.
         tine 1 (camera-near, side 8): top edge (83,96)→(111,110), bottom (83,98)→(111,112)
         tine 2 (camera-far,  side 20): top edge (95,90)→(123,104), bottom (95,92)→(123,106) -->

  <!-- Tine 1 -->
  <polygon points="83,96 111,110 111,112 83,98"
    fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>
  <line x1="83" y1="96" x2="111" y2="110" stroke="#3a2008" stroke-width="0.4" opacity="0.6"/>
  <!-- Tine 1 tip cap -->
  <polygon points="111,110 113,111 113,113 111,112"
    fill="#0e0802" stroke="#050200" stroke-width="0.3"/>

  <!-- Tine 2 -->
  <polygon points="95,90 123,104 123,106 95,92"
    fill="#1a1004" stroke="#0a0602" stroke-width="0.4"/>
  <line x1="95" y1="90" x2="123" y2="104" stroke="#3a2008" stroke-width="0.4" opacity="0.6"/>
  <!-- Tine 2 tip cap -->
  <polygon points="123,104 125,105 125,107 123,106"
    fill="#0e0802" stroke="#050200" stroke-width="0.3"/>

  <!-- ═══ WHEELS — iso-tilted discs ═══
       Wheel axis along W direction; disc lies in L-H plane.
       Projected ellipse: rx≈1.28R, ry≈0.78R, rotated ~52° CW.
       Front (drive, R=4): world (46,-2,4) → screen (59, 95)
       Rear (steerable, R=3): world (14,-2,3) → screen (27, 80) -->

  <!-- Front wheel -->
  <g transform="rotate(52 59 95)">
    <ellipse cx="59" cy="95" rx="5.1" ry="3.1"
      fill="#12121a" stroke="#050508" stroke-width="0.7"/>
    <!-- Tire sidewall cell-shade highlight (upper-left arc tone) -->
    <ellipse cx="59" cy="95" rx="5.1" ry="3.1"
      fill="none" stroke="#2a2a34" stroke-width="0.6"
      stroke-dasharray="4 12" opacity="0.8"/>
    <!-- Rim disc -->
    <ellipse cx="59" cy="95" rx="3.0" ry="1.85"
      fill="#26262e" stroke="#0a0a0e" stroke-width="0.4"/>
    <!-- Hub plate -->
    <ellipse cx="59" cy="95" rx="1.5" ry="0.9"
      fill="#3c3c46" stroke="#16161c" stroke-width="0.3"/>
    <!-- Lug nut -->
    <circle cx="59" cy="95" r="0.55" fill="#6e6e78"/>
  </g>

  <!-- Rear wheel -->
  <g transform="rotate(52 27 80)">
    <ellipse cx="27" cy="80" rx="3.85" ry="2.35"
      fill="#12121a" stroke="#050508" stroke-width="0.6"/>
    <ellipse cx="27" cy="80" rx="3.85" ry="2.35"
      fill="none" stroke="#2a2a34" stroke-width="0.5"
      stroke-dasharray="3 9" opacity="0.8"/>
    <ellipse cx="27" cy="80" rx="2.2" ry="1.35"
      fill="#26262e" stroke="#0a0a0e" stroke-width="0.3"/>
    <ellipse cx="27" cy="80" rx="1.05" ry="0.65"
      fill="#3c3c46" stroke="#16161c" stroke-width="0.25"/>
    <circle cx="27" cy="80" r="0.45" fill="#6e6e78"/>
  </g>

  <!-- ═══ WEATHERING ═══ -->

  <!-- Rust streaks on facade -->
  <g opacity="0.22">
    <polygon points="29,68 31,82 27,82 25,68" fill="#5a2818"/>
    <polygon points="49,77 51,93 47,93 45,77" fill="#4a2010"/>
    <polygon points="63,84 65,98 61,98 59,84" fill="#3a1808"/>
  </g>

  <!-- Scuff marks on top deck -->
  <g opacity="0.18">
    <ellipse cx="35" cy="55" rx="6" ry="1.5" fill="#5a3008" transform="rotate(15 35 55)"/>
    <ellipse cx="65" cy="73" rx="5" ry="1.2" fill="#4a2008" transform="rotate(20 65 73)"/>
  </g>

</svg>
