<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 90">
  <!-- Wooden post with a perched seagull.
       Dock piling with a single gull sitting on top. -->

  <!-- Ground shadow -->
  <ellipse cx="17" cy="86" rx="12" ry="3" fill="#060608" opacity="0.2"/>

  <!-- Post -->
  <rect x="12" y="28" width="8" height="58" rx="1"
    fill="#3e3224" stroke="#2e2418" stroke-width="0.7"/>

  <!-- Wood grain -->
  <g stroke="#2e2418" stroke-width="0.3" opacity="0.3">
    <line x1="14" y1="30" x2="14" y2="84"/>
    <line x1="18" y1="32" x2="18" y2="82"/>
  </g>

  <!-- Post cap -->
  <ellipse cx="16" cy="28" rx="5" ry="2" fill="#4a3e2e" stroke="#2e2418" stroke-width="0.4"/>

  <!-- Rope wrap at base -->
  <g stroke="#5a5040" stroke-width="1.2" fill="none" opacity="0.4">
    <line x1="11" y1="72" x2="21" y2="71"/>
    <line x1="11" y1="75" x2="21" y2="74"/>
  </g>

  <!-- Seagull body -->
  <g>
    <!-- Body (plump oval) -->
    <ellipse cx="17" cy="22" rx="8" ry="5"
      fill="#c8c4b8" stroke="#a8a498" stroke-width="0.4"/>
    <!-- Head -->
    <circle cx="10" cy="17" r="4"
      fill="#d0ccc0" stroke="#a8a498" stroke-width="0.3"/>
    <!-- Beak -->
    <polygon points="6,17 3,16 6,15.5"
      fill="#c89030" stroke="#a87020" stroke-width="0.3"/>
    <!-- Eye -->
    <circle cx="9" cy="16" r="0.8" fill="#1a1a1a"/>
    <!-- Wing fold line -->
    <path d="M12,19 Q18,18 24,21"
      stroke="#a8a498" stroke-width="0.5" fill="none" opacity="0.5"/>
    <!-- Wing tip -->
    <polygon points="24,21 28,19 26,23"
      fill="#8a8880" stroke="#7a7870" stroke-width="0.3"/>
    <!-- Tail -->
    <polygon points="24,22 28,24 24,25"
      fill="#9a9890" stroke="#8a8880" stroke-width="0.3"/>
    <!-- Legs -->
    <g stroke="#c87030" stroke-width="0.6">
      <line x1="14" y1="26" x2="14" y2="28"/>
      <line x1="19" y1="26" x2="19" y2="28"/>
    </g>
    <!-- Feet -->
    <g stroke="#c87030" stroke-width="0.4">
      <line x1="12" y1="28" x2="16" y2="28"/>
      <line x1="17" y1="28" x2="21" y2="28"/>
    </g>
  </g>

  <!-- Guano streak on post -->
  <path d="M16,28 L15,38 Q16,40 17,38 L16,28"
    fill="#d8d8d0" opacity="0.15"/>
</svg>