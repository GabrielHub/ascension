<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 36">
  <!-- Coiled dock rope lying on pier surface.
       Isometric ground-plane coil — ellipses match iso projection. -->

  <!-- Ground shadow -->
  <ellipse cx="26" cy="28" rx="20" ry="5" fill="#060608" opacity="0.12"/>

  <!-- Rope height (small stack visible from the side) -->
  <polygon points="8,20 44,20 44,24 8,24"
    fill="#4a4030" stroke="#3a3020" stroke-width="0.4"/>

  <!-- Outer coil — iso ground ellipse (top of rope pile) -->
  <ellipse cx="26" cy="20" rx="18" ry="9"
    fill="none" stroke="#5a5040" stroke-width="2.5"/>

  <!-- Middle coil -->
  <ellipse cx="26" cy="19" rx="13" ry="6.5"
    fill="none" stroke="#6a6050" stroke-width="2.2"/>

  <!-- Inner coil -->
  <ellipse cx="26" cy="18" rx="8" ry="4"
    fill="none" stroke="#5a5040" stroke-width="2"/>

  <!-- Center pile (filled mass) -->
  <ellipse cx="26" cy="17.5" rx="4" ry="2"
    fill="#4a4030" stroke="#3a3020" stroke-width="0.5"/>

  <!-- Loose end trailing out (on ground plane) -->
  <path d="M44,20 Q48,22 46,26 Q44,30 40,28"
    stroke="#5a5040" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Rope texture marks -->
  <g stroke="#3a3020" stroke-width="0.4" opacity="0.25">
    <line x1="14" y1="17" x2="16" y2="19"/>
    <line x1="36" y1="16" x2="38" y2="18"/>
  </g>
</svg>