<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Dock.
       Waterfront staging and departure surface for Porter's.
       Built in the approved bodega room-scene language: dense hand-placed
       isometric props, readable work surfaces, practical clutter, no walls,
       no floors, no tile grid, no labels, and no broad detached shadows. -->

