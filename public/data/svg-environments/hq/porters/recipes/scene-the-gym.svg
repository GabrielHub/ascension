  </g>

  <!-- Weight bench: pad runs on the c-axis; barbell runs on the perpendicular r-axis. -->
  <g transform="translate(30 6)">
    <g stroke="#2a221a" stroke-linecap="round">
      <line x1="172" y1="136" x2="172" y2="188" stroke-width="2.6"/>
      <line x1="144" y1="150" x2="144" y2="202" stroke-width="2.6"/>
    </g>

    <polygon points="164,171 224,201 210,208 150,178"
      fill="#3c2a18" stroke="#1c1208" stroke-width="0.65"/>
    <polygon points="150,178 210,208 210,214 150,184"
      fill="#261a0e" stroke="#120a04" stroke-width="0.4"/>
    <polygon points="224,201 210,208 210,214 224,207"
