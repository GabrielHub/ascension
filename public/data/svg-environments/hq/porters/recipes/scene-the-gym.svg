<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Gym (Porter's tier 1)
       First real training room. Scrappy Red Hook conditioning space:
       heavy bag, corrected weight bench, dumbbell tree, canvas mat,
       and kettlebells.
       Grid 4x3. Origin (200,100). iso(c,r,z) = (200+(c-r)*48, 100+(c+r)*24 - z).
       No walls, floors, tile grid, or labels. -->

  <!-- Canvas mat, front-left. Floor-plane edges use the canonical 2:1 axes. -->
  <polygon points="116,144 174,173 126,197 68,168"
    fill="#8a7a54" stroke="#3e3320" stroke-width="0.8"/>
  <polygon points="116,144 174,173 166,177 108,148" fill="rgba(255,240,190,0.12)"/>
  <polygon points="68,168 126,197 126,202 68,173" fill="#5f5135" stroke="#312615" stroke-width="0.45"/>
  <polygon points="126,197 174,173 174,178 126,202" fill="#716139" stroke="#312615" stroke-width="0.45"/>
  <line x1="94" y1="157" x2="152" y2="186" stroke="#3e3320" stroke-width="0.45" opacity="0.65" stroke-dasharray="3 2"/>
  <line x1="150" y1="157" x2="92" y2="186" stroke="#3e3320" stroke-width="0.45" opacity="0.65" stroke-dasharray="3 2"/>

  <!-- Kettlebells as compact faceted floor-plane props, not front-facing icons. -->
  <g transform="translate(143 170)">
    <polygon points="-8,7 1,11 10,6 1,2" fill="rgba(0,0,0,0.24)"/>
    <polygon points="-7,-2 1,-6 9,-2 9,5 1,9 -7,5"
