  <ellipse cx="288" cy="95" rx="15" ry="6" fill="#5a2018" stroke="#2c0e08" stroke-width="0.55"/>
  <path d="M 276,153 C 280,160 296,160 300,153" fill="none" stroke="#2a0e08" stroke-width="1.35"/>
  <path d="M 280,156 C 284,158 292,158 296,156" fill="none" stroke="rgba(20,8,4,0.35)" stroke-width="0.8"/>
  <ellipse cx="288" cy="111" rx="14" ry="5.4" fill="none" stroke="rgba(232,218,175,0.78)" stroke-width="3"/>
  <ellipse cx="288" cy="118" rx="14" ry="5.4" fill="none" stroke="rgba(202,186,144,0.7)" stroke-width="2.2"/>
  <line x1="288" y1="100" x2="288" y2="153" stroke="#4c1a12" stroke-width="0.45" opacity="0.75"/>
  <polygon points="279,128 286,132 282,136 278,134" fill="rgba(20,8,4,0.45)"/>
  <polygon points="292,139 300,143 298,147 291,145" fill="rgba(20,8,4,0.40)"/>

  <!-- Plate tree, right side. Plates sit directly on the angled rack arms. -->
  <polygon points="336,181 351,188.5 336,196 321,188.5"
