    <rect x="-4" y="-6.8" width="8" height="13.6" fill="#202027" stroke="#0e0e13" stroke-width="0.3"/>
    <circle cx="4" cy="0" r="6.8" fill="#1c1c22" stroke="#0e0e13" stroke-width="0.4"/>
    <path d="M 0,-5 C 1.8,-2.5 1.8,2.5 0,5" fill="none" stroke="#2d2d36" stroke-width="0.5"/>
