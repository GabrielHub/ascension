    <polygon points="-7,-2 1,2 1,9 -7,5" fill="#1b1b22"/>
    <polygon points="1,2 9,-2 9,5 1,9" fill="#15151b"/>
    <polygon points="-3,-7 2,-9 7,-7 7,-4 2,-2 -3,-4"
      fill="#2b2b34" stroke="#0d0d12" stroke-width="0.45"/>
    <polygon points="-1,-6 2,-7.5 5,-6 2,-4.5" fill="#3a3a44"/>
  </g>
  <g transform="translate(103 173)">
    <polygon points="-6,6 1,9 8,5 1,2" fill="rgba(0,0,0,0.22)"/>
    <polygon points="-5,-1 1,-4 7,-1 7,5 1,8 -5,5"
      fill="#25252c" stroke="#0d0d12" stroke-width="0.5"/>
    <polygon points="-5,-1 1,-4 7,-1 1,2" fill="#31313a"/>
    <polygon points="-5,-1 1,2 1,8 -5,5" fill="#1d1d24"/>
