      <polygon points="0,-29 18,-38 18,-35 0,-26" fill="#211208" stroke="#140a06" stroke-width="0.3"/>
      <polygon points="-18,-38 0,-29 18,-38 0,-47" fill="#4a2f18" stroke="#231408" stroke-width="0.5"/>
