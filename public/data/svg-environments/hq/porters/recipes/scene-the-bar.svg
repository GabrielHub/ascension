<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Bar (Porter's tier 1)
       Grid: 4 cols x 3 rows. Origin (200,100). iso(c,r,z) = (200+(c-r)*48, 100+(c+r)*24-z).
       Composition goals:
         - One continuous bar run that spans the room without module seams.
         - A readable bartender lane between the back bar and the counter.
         - Fewer overlapping props and a calmer pendant rhythm.
         - Front seating arranged as distinct table groups with chairs attached to table edges. -->

