<svg xmlns="http://www.w3.org/2000/svg" viewBox="-330 0 1060 640">
  <!-- Props-only scene layer: The Floor, Porter's ground-floor public dining room.
       Authored footprint: 10 cols x 10 rows. Origin (200,100).
       iso(c,r) = (200+(c-r)*48, 100+(c+r)*24).
       This scene intentionally fills the full restaurant slot: booth runs along
       the back edge, two staggered dining lanes fill the room, and service/host
       fixtures hold the public restaurant read without adding walls or floors. -->

  <defs>
    <g id="chair-w">
      <line x1="-10" y1="3" x2="-10" y2="18" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="0" y2="24" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="10" y1="3" x2="10" y2="18" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <polygon points="-13,0 0,7 13,0 0,-7" fill="#7c5434" stroke="#3c2616" stroke-width="0.55"/>
      <polygon points="-13,0 0,7 0,11 -13,4" fill="#4c2f1b" stroke="#2d1a0e" stroke-width="0.35"/>
      <polygon points="0,7 13,0 13,4 0,11" fill="#362012" stroke="#2d1a0e" stroke-width="0.35"/>
      <polygon points="0,-7 -13,0 -13,-21 0,-28" fill="#5c3922" stroke="#3c2616" stroke-width="0.55"/>
      <polygon points="-2,-8 -11,-3 -11,-18 -2,-23" fill="#9a6b42" opacity="0.7"/>
    </g>

    <g id="chair-e">
      <line x1="-10" y1="3" x2="-10" y2="18" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="0" y2="24" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="10" y1="3" x2="10" y2="18" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <polygon points="-13,0 0,7 13,0 0,-7" fill="#7c5434" stroke="#3c2616" stroke-width="0.55"/>
      <polygon points="-13,0 0,7 0,11 -13,4" fill="#4c2f1b" stroke="#2d1a0e" stroke-width="0.35"/>
      <polygon points="0,7 13,0 13,4 0,11" fill="#362012" stroke="#2d1a0e" stroke-width="0.35"/>
      <polygon points="0,7 13,0 13,-21 0,-14" fill="#5c3922" stroke="#3c2616" stroke-width="0.55"/>
      <polygon points="2,6 11,1 11,-16 2,-11" fill="#9a6b42" opacity="0.7"/>
    </g>

    <g id="chair-n">
      <line x1="-10" y1="3" x2="-10" y2="18" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="0" y2="24" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="10" y1="3" x2="10" y2="18" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <polygon points="-13,0 0,7 13,0 0,-7" fill="#7c5434" stroke="#3c2616" stroke-width="0.55"/>
      <polygon points="-13,0 0,7 0,11 -13,4" fill="#4c2f1b" stroke="#2d1a0e" stroke-width="0.35"/>
      <polygon points="0,7 13,0 13,4 0,11" fill="#362012" stroke="#2d1a0e" stroke-width="0.35"/>
      <polygon points="0,-7 13,0 13,-21 0,-28" fill="#5c3922" stroke="#3c2616" stroke-width="0.55"/>
      <polygon points="2,-8 11,-3 11,-18 2,-23" fill="#9a6b42" opacity="0.7"/>
    </g>

    <g id="chair-s">
      <line x1="-10" y1="3" x2="-10" y2="18" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="0" y2="24" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="10" y1="3" x2="10" y2="18" stroke="#26180f" stroke-width="1.7" stroke-linecap="round"/>
      <polygon points="-13,0 0,7 13,0 0,-7" fill="#7c5434" stroke="#3c2616" stroke-width="0.55"/>
      <polygon points="-13,0 0,7 0,11 -13,4" fill="#4c2f1b" stroke="#2d1a0e" stroke-width="0.35"/>
      <polygon points="0,7 13,0 13,4 0,11" fill="#362012" stroke="#2d1a0e" stroke-width="0.35"/>
      <polygon points="0,7 -13,0 -13,-21 0,-14" fill="#5c3922" stroke="#3c2616" stroke-width="0.55"/>
      <polygon points="-2,6 -11,1 -11,-16 -2,-11" fill="#9a6b42" opacity="0.7"/>
    </g>

    <g id="table-2top">
      <line x1="0" y1="-20" x2="0" y2="8" stroke="#24170f" stroke-width="2"/>
      <polygon points="-40,0 0,20 0,25 -40,5" fill="#352416" stroke="#24170f" stroke-width="0.45"/>
      <polygon points="40,0 0,20 0,25 40,5" fill="#2b1d12" stroke="#24170f" stroke-width="0.45"/>
      <polygon points="0,-20 40,0 0,20 -40,0" fill="#5a3c24" stroke="#332116" stroke-width="0.75"/>
      <line x1="-24" y1="-10" x2="22" y2="13" stroke="#2c1b10" stroke-width="0.35" opacity="0.35"/>
      <line x1="-30" y1="6" x2="22" y2="-20" stroke="rgba(255,238,190,0.09)" stroke-width="0.55"/>
      <line x1="-40" y1="5" x2="-38" y2="30" stroke="#24170f" stroke-width="2"/>
      <line x1="40" y1="5" x2="38" y2="30" stroke="#24170f" stroke-width="2"/>
      <line x1="0" y1="25" x2="0" y2="50" stroke="#24170f" stroke-width="2"/>
    </g>

    <g id="table-4top">
      <line x1="-10" y1="-28" x2="-10" y2="0" stroke="#24170f" stroke-width="2"/>
      <polygon points="-58,-6 10,28 10,34 -58,0" fill="#352416" stroke="#24170f" stroke-width="0.45"/>
      <polygon points="58,6 10,28 10,34 58,12" fill="#2b1d12" stroke="#24170f" stroke-width="0.45"/>
      <polygon points="-10,-28 58,6 10,28 -58,-6" fill="#5a3c24" stroke="#332116" stroke-width="0.75"/>
      <line x1="-42" y1="-16" x2="38" y2="24" stroke="#2c1b10" stroke-width="0.35" opacity="0.35"/>
      <line x1="-48" y1="8" x2="44" y2="-38" stroke="rgba(255,238,190,0.08)" stroke-width="0.55"/>
      <line x1="-58" y1="0" x2="-56" y2="27" stroke="#24170f" stroke-width="2"/>
      <line x1="58" y1="12" x2="56" y2="39" stroke="#24170f" stroke-width="2"/>
      <line x1="10" y1="34" x2="10" y2="61" stroke="#24170f" stroke-width="2"/>
    </g>

    <g id="booth">
      <polygon points="-74,3 0,40 74,3 0,-34" fill="#49301d" stroke="#2c1b10" stroke-width="0.65"/>
      <polygon points="-74,3 0,40 0,50 -74,13" fill="#2e1d12" stroke="#1f1209" stroke-width="0.45"/>
      <polygon points="0,40 74,3 74,13 0,50" fill="#25170e" stroke="#1f1209" stroke-width="0.45"/>
      <polygon points="-86,-7 -74,-1 0,-38 0,-64 -86,-21" fill="#6f1f25" stroke="#3c1215" stroke-width="0.65"/>
      <polygon points="0,-38 74,-1 86,-7 0,-50" fill="#922b30" stroke="#3c1215" stroke-width="0.55"/>
      <line x1="-66" y1="-13" x2="-6" y2="-43" stroke="rgba(255,190,155,0.18)" stroke-width="1"/>
      <line x1="10" y1="-41" x2="64" y2="-14" stroke="rgba(255,190,155,0.14)" stroke-width="1"/>
      <use href="#setting" x="-22" y="2"/>
      <use href="#setting" x="24" y="3"/>
    </g>

    <g id="setting">
      <ellipse cx="0" cy="0" rx="8" ry="3.2" fill="#ebe2d0" stroke="#a89a83" stroke-width="0.5"/>
      <ellipse cx="0" cy="0" rx="4.8" ry="1.8" fill="#d8ccb8" opacity="0.8"/>
      <ellipse cx="11" cy="-2" rx="2.4" ry="1" fill="rgba(200,220,235,0.38)" stroke="rgba(150,185,200,0.55)" stroke-width="0.35"/>
      <line x1="-11" y1="-3" x2="-17" y2="-6" stroke="#c8b898" stroke-width="0.7"/>
      <line x1="-11" y1="1" x2="-18" y2="-2" stroke="#c8b898" stroke-width="0.7"/>
    </g>

    <g id="votive">
      <polygon points="-3,-2 3,-2 3,4 -3,4" fill="#c58b45" stroke="#3a2110" stroke-width="0.35"/>
      <ellipse cx="0" cy="-2" rx="3" ry="1.1" fill="#503018" stroke="#3a2110" stroke-width="0.35"/>
      <ellipse cx="0" cy="-4" rx="0.9" ry="2" fill="#ffd66a"/>
    </g>

    <g id="potted-plant">
      <polygon points="-12,4 0,11 12,4 0,-3" fill="#9a4e26" stroke="#4e230e" stroke-width="0.55"/>
      <polygon points="-12,4 0,11 0,24 -12,17" fill="#5c2a14" stroke="#3e1d0e" stroke-width="0.45"/>
      <polygon points="0,11 12,4 12,17 0,24" fill="#7c3a1c" stroke="#3e1d0e" stroke-width="0.45"/>
      <ellipse cx="0" cy="-2" rx="9" ry="3.5" fill="#21140a"/>
      <path d="M0,-4 C-15,-24 -30,-18 -21,-1 C-10,-9 -5,-9 0,-4" fill="#4f8747" stroke="#244c24" stroke-width="0.55"/>
      <path d="M0,-4 C15,-24 30,-18 21,-1 C10,-9 5,-9 0,-4" fill="#5d9a52" stroke="#244c24" stroke-width="0.55"/>
      <path d="M0,-6 C-5,-32 7,-34 8,-13 C5,-10 2,-8 0,-6" fill="#6aaa5e" stroke="#2a5228" stroke-width="0.45"/>
    </g>

    <g id="server-station">
      <polygon points="-42,-8 0,13 42,-8 0,-29" fill="#5a3820" stroke="#2a170c" stroke-width="0.65"/>
      <polygon points="-42,-8 0,13 0,70 -42,49" fill="#3a2314" stroke="#221309" stroke-width="0.55"/>
      <polygon points="0,13 42,-8 42,49 0,70" fill="#2a190f" stroke="#221309" stroke-width="0.55"/>
      <polygon points="-30,8 -8,19 -8,38 -30,27" fill="#1f1209" opacity="0.55"/>
      <polygon points="10,18 30,8 30,28 10,38" fill="#1f1209" opacity="0.55"/>
      <ellipse cx="-12" cy="-8" rx="8" ry="3" fill="#d8d0c0" stroke="#9c8e78" stroke-width="0.4"/>
      <rect x="4" y="-17" width="13" height="18" rx="1.5" fill="#70451e" stroke="#2a170c" stroke-width="0.45"/>
      <ellipse cx="10.5" cy="-17" rx="6.5" ry="2.2" fill="#a56a2e" stroke="#2a170c" stroke-width="0.35"/>
    </g>

    <g id="host-stand">
      <polygon points="-34,-5 0,12 34,-5 0,-22" fill="#5b3c24" stroke="#2c1b10" stroke-width="0.65"/>
      <polygon points="-34,-5 0,12 0,62 -34,45" fill="#3c2617" stroke="#211208" stroke-width="0.55"/>
      <polygon points="0,12 34,-5 34,45 0,62" fill="#2b1b10" stroke="#211208" stroke-width="0.55"/>
      <polygon points="-12,-15 20,1 22,-3 -10,-19" fill="#e1d2b4" stroke="#8a7658" stroke-width="0.45"/>
      <line x1="-4" y1="-11" x2="12" y2="-3" stroke="#8a7658" stroke-width="0.5" opacity="0.5"/>
      <line x1="-8" y1="-6" x2="8" y2="2" stroke="#8a7658" stroke-width="0.5" opacity="0.5"/>
    </g>

    <g id="pendant">
      <line x1="0" y1="-52" x2="0" y2="-12" stroke="#2f2117" stroke-width="1.3"/>
      <ellipse cx="0" cy="-5" rx="10" ry="5.4" fill="#f4ead0" stroke="#b89a5a" stroke-width="0.55"/>
      <ellipse cx="0" cy="-6" rx="7" ry="3" fill="#ffdfa0" opacity="0.65"/>
      <ellipse cx="-3" cy="-7" rx="2.4" ry="1.1" fill="rgba(255,255,255,0.5)"/>
    </g>

    <g id="table-two-cluster">
      <use href="#chair-w" x="-33" y="-2"/>
      <use href="#table-2top"/>
      <use href="#setting" x="-14" y="-2"/>
      <use href="#setting" x="16" y="4"/>
      <use href="#votive" x="0" y="0"/>
      <use href="#chair-e" x="33" y="28"/>
    </g>

    <g id="table-four-cluster">
      <use href="#chair-w" x="-54" y="-15"/>
      <use href="#chair-n" x="22" y="-29"/>
      <use href="#table-4top"/>
      <use href="#setting" x="-28" y="-4"/>
      <use href="#setting" x="22" y="5"/>
      <use href="#setting" x="-2" y="-18"/>
      <use href="#setting" x="0" y="18"/>
      <use href="#votive" x="0" y="0"/>
      <use href="#chair-s" x="-22" y="35"/>
      <use href="#chair-e" x="54" y="27"/>
    </g>
  </defs>

  <!-- Back booth row, snapped to the same c-axis run as the room grid. -->
  <use href="#booth" x="104" y="156"/>
  <use href="#booth" x="392" y="300"/>
  <use href="#potted-plant" x="536" y="372"/>

  <!-- Dining lane A: row-axis spacing follows the bodega dining run pattern. -->
  <use href="#table-two-cluster" x="-28" y="246"/>
  <use href="#pendant" x="-28" y="196"/>
  <use href="#table-four-cluster" x="116" y="318"/>
  <use href="#pendant" x="116" y="268"/>
  <use href="#table-two-cluster" x="260" y="390"/>
  <use href="#pendant" x="260" y="340"/>

  <!-- Dining lane B: parallel lane offset by +col, leaving a central path. -->
  <use href="#table-four-cluster" x="236" y="222"/>
  <use href="#pendant" x="236" y="172"/>
  <use href="#table-two-cluster" x="380" y="294"/>
  <use href="#pendant" x="380" y="244"/>
  <use href="#server-station" x="360" y="400"/>

  <!-- Entry/service edge. -->
  <use href="#host-stand" x="-184" y="330"/>
  <use href="#table-two-cluster" x="-76" y="360"/>
  <use href="#pendant" x="-76" y="310"/>
  <use href="#table-four-cluster" x="68" y="432"/>
  <use href="#pendant" x="68" y="382"/>
  <use href="#potted-plant" x="240" y="536"/>
</svg>
