<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- Props-only scene layer: The Infirmary (Porter's).
       First dedicated recovery room: one clear treatment bed with minimal
       wall-mounted medical context. No walls, floors, tile grid, room
       outlines, labels, or loose floor clutter.

       Origin (200,100). iso(c,r,z) = (200+(c-r)*48, 100+(c+r)*24-z).
       Z-order: wall-adjacent fixture, treatment bed. -->

  <!-- Wall-mounted medication lockbox, kept small so the bed owns the room read. -->
  <g id="wall-med-lockbox">
    <polygon points="312,68 350,87 350,118 312,99"
      fill="#e8e2d4" stroke="#6a6258" stroke-width="0.55"/>
    <polygon points="316,73 346,88 346,113 316,98"
      fill="#f3efe4" stroke="#9a9184" stroke-width="0.35"/>
    <polygon points="323,82 339,90 339,104 323,96"
      fill="#c9d6dc" stroke="#6b7b86" stroke-width="0.28" opacity="0.72"/>
    <line x1="331" y1="86" x2="331" y2="100" stroke="#b23535" stroke-width="1.2"/>
    <line x1="326" y1="91" x2="336" y2="96" stroke="#b23535" stroke-width="1.2"/>
    <rect x="341" y="101" width="2.4" height="4.8" rx="0.4" fill="#7a7168"/>
  </g>

  <!-- Main treatment bed, aligned to the canonical isometric tile axes. -->
  <g id="medical-bed">
    <!-- Rear legs and casters. -->
    <line x1="157" y1="173" x2="157" y2="196" stroke="#555862" stroke-width="1.7"/>
    <line x1="280" y1="234" x2="280" y2="257" stroke="#454a54" stroke-width="1.7"/>
    <circle cx="157" cy="197" r="2.2" fill="#313741"/>
    <circle cx="280" cy="258" r="2.2" fill="#2a3038"/>

    <!-- Steel bed frame. -->
    <polygon points="166,151 298,217 246,243 114,177"
      fill="#4f535c" stroke="#292d34" stroke-width="0.75"/>
    <polygon points="114,177 246,243 246,253 114,187"
      fill="#343941" stroke="#242830" stroke-width="0.55"/>
    <polygon points="298,217 246,243 246,253 298,227"
      fill="#3d424b" stroke="#242830" stroke-width="0.55"/>

    <!-- Mattress and blanket planes. -->
    <polygon points="174,133 306,199 254,225 122,159"
      fill="#ded9cc" stroke="#b7afa0" stroke-width="0.65"/>
    <polygon points="122,159 254,225 254,234 122,168"
      fill="#c4bdb0" stroke="#a79f92" stroke-width="0.45"/>
    <polygon points="306,199 254,225 254,234 306,208"
      fill="#d0c8bc" stroke="#a79f92" stroke-width="0.45"/>
    <polygon points="133,163 207,200 195,206 121,169"
      fill="#8196a6" opacity="0.38"/>
    <line x1="160" y1="144" x2="254" y2="191" stroke="#c1baad" stroke-width="0.55" opacity="0.72"/>
    <line x1="254" y1="191" x2="300" y2="168" stroke="#c1baad" stroke-width="0.45" opacity="0.42"/>

    <!-- Pillow at the head end. -->
    <polygon points="259,165 292,181 280,187 247,171"
      fill="#f1ecdf" stroke="#c8c1b5" stroke-width="0.45"/>
    <polygon points="280,187 292,181 292,185 280,191"
      fill="#d9d2c6" stroke="#c8c1b5" stroke-width="0.28"/>
    <line x1="253" y1="169" x2="283" y2="184" stroke="#d0c7b8" stroke-width="0.25" opacity="0.6"/>

    <!-- Side rails and head rail. -->
    <line x1="145" y1="154" x2="145" y2="179" stroke="#60656e" stroke-width="1.6"/>
    <line x1="174" y1="168" x2="174" y2="193" stroke="#535862" stroke-width="1.6"/>
    <line x1="145" y1="154" x2="174" y2="168" stroke="#727780" stroke-width="1.0"/>
    <line x1="145" y1="166" x2="174" y2="180" stroke="#5e636c" stroke-width="0.9"/>
    <line x1="252" y1="132" x2="252" y2="155" stroke="#60656e" stroke-width="1.5"/>
    <line x1="284" y1="148" x2="284" y2="171" stroke="#535862" stroke-width="1.5"/>
    <line x1="252" y1="132" x2="284" y2="148" stroke="#727780" stroke-width="1.0"/>
    <line x1="252" y1="144" x2="284" y2="160" stroke="#5e636c" stroke-width="0.85"/>

    <!-- Front legs and caster contact points. -->
    <line x1="116" y1="187" x2="116" y2="207" stroke="#5a5f68" stroke-width="1.8"/>
    <line x1="246" y1="253" x2="246" y2="273" stroke="#4a505a" stroke-width="1.8"/>
    <line x1="298" y1="227" x2="298" y2="247" stroke="#444a52" stroke-width="1.8"/>
    <circle cx="116" cy="208" r="2.2" fill="#303741"/>
    <circle cx="246" cy="274" r="2.3" fill="#2b323b"/>
    <circle cx="298" cy="248" r="2.2" fill="#282e36"/>

    <!-- Small red tape marker for a medical read without extra loose props. -->
    <polygon points="214,226 223,222 223,225 214,229"
      fill="#c95546" opacity="0.78"/>
    <polygon points="218,221 222,219 222,231 218,233"
      fill="#c95546" opacity="0.78"/>
  </g>
</svg>
