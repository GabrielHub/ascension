      <path d="M -22 -8 L -6 -16 L 10 -8 L -6 0 Z" fill="none" stroke="#e59d69" stroke-width="2" stroke-linejoin="round"/>
      <path d="M -2 -2 L 10 -8" stroke="#e59d69" stroke-width="2" stroke-linecap="round"/>
