<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 420 310">
  <!-- REFERENCE FIXTURE: The Infirmary — first dedicated recovery room.
       4 cols x 3 rows. Origin (200,100). Canonical Porter's room-scene frame.
       Design reference only: runtime uses recipes/scene-the-infirmary.svg as
       the props-only scene over engine-rendered structure. -->

  <!-- Right wall: converted upstairs Porter's room, warm worn plaster. -->
  <polygon points="200,16 392,112 392,196 200,100"
    fill="#3b2b1f" stroke="#2a1e15" stroke-width="1"/>
  <line x1="200" y1="42" x2="392" y2="138" stroke="rgba(255,238,210,0.06)" stroke-width="0.5"/>
  <line x1="200" y1="70" x2="392" y2="166" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>

  <!-- Left wall: door/opening remains structural and engine-rendered in game. -->
  <polygon points="152,40 56,88 56,172 152,124"
    fill="#34251c" stroke="#251a13" stroke-width="1"/>
  <line x1="200" y1="16" x2="200" y2="100" stroke="#4b3a2b" stroke-width="1.6"/>
  <line x1="152" y1="40" x2="152" y2="124" stroke="#4b3a2b" stroke-width="1.6"/>
  <line x1="200" y1="26" x2="152" y2="50" stroke="#4b3a2b" stroke-width="1.15"/>

  <!-- Floor: reference-only, the live room floor is engine-rendered. -->
  <polygon points="200,100 392,196 248,268 56,172"
    fill="#3a2a1d" stroke="#2b1d12" stroke-width="1.1"/>
  <line x1="248" y1="124" x2="104" y2="196" stroke="rgba(0,0,0,0.18)" stroke-width="0.5"/>
  <line x1="296" y1="148" x2="152" y2="220" stroke="rgba(0,0,0,0.18)" stroke-width="0.5"/>
  <line x1="344" y1="172" x2="200" y2="244" stroke="rgba(0,0,0,0.18)" stroke-width="0.5"/>
  <line x1="152" y1="124" x2="344" y2="220" stroke="rgba(255,238,210,0.04)" stroke-width="0.45"/>
  <line x1="104" y1="148" x2="296" y2="244" stroke="rgba(255,238,210,0.04)" stroke-width="0.45"/>

  <!-- Pull the production props-only layer into the preview so reference
       and live review modes stay synchronized. -->
  <image href="../recipes/scene-the-infirmary.svg" x="20" y="0" width="420" height="310" preserveAspectRatio="none"/>

  <text x="220" y="296" font-family="monospace" font-size="11" fill="#c8a84c" text-anchor="middle" opacity="0.82">THE INFIRMARY</text>
  <text x="220" y="14" font-family="monospace" font-size="7" fill="#8f8476" text-anchor="middle">Porter's reference fixture — not used in runtime</text>
</svg>
