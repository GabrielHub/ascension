<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Fold Walkers — two overlapping offset rectangles suggesting spatial fold, blue-teal -->
  <rect x="3" y="3" width="6" height="8" rx="0.5" fill="rgba(72,152,192,0.12)" stroke="rgba(72,152,192,0.3)" stroke-width="0.6" transform="rotate(-4,6,7)"/>
  <rect x="7" y="5" width="6" height="8" rx="0.5" fill="rgba(72,152,192,0.12)" stroke="rgba(72,152,192,0.3)" stroke-width="0.6" transform="rotate(4,10,9)"/>
  <line x1="8.5" y1="4" x2="8.5" y2="12" stroke="rgba(72,152,192,0.2)" stroke-width="0.4" stroke-dasharray="1 1.5"/>
</svg>
