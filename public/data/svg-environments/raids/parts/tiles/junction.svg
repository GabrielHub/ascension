<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="jnc-floor" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#171b2a"/>
      <stop offset="100%" stop-color="#121624"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" fill="url(#jnc-floor)"/>
  <!-- Small corner walls for crossroad feel -->
  <rect x="0" y="0" width="4" height="4" fill="#1e2540" opacity="0.5"/>
  <rect x="28" y="0" width="4" height="4" fill="#1e2540" opacity="0.5"/>
  <rect x="0" y="28" width="4" height="4" fill="#1e2540" opacity="0.5"/>
  <rect x="28" y="28" width="4" height="4" fill="#1e2540" opacity="0.5"/>
  <!-- Center cross guide -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="rgba(200,168,76,0.025)" stroke-width="0.5"/>
  <line x1="4" y1="16" x2="28" y2="16" stroke="rgba(200,168,76,0.025)" stroke-width="0.5"/>
  <circle cx="16" cy="16" r="1" fill="rgba(200,168,76,0.04)"/>
</svg>
