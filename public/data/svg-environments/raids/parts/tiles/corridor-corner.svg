<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cc-floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161a28"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#cc-floor)"/>
  <!-- L-shaped wall: top edge and right edge -->
  <rect x="0" y="0" width="32" height="2" fill="#1e2540" opacity="0.6"/>
  <rect x="30" y="0" width="2" height="32" fill="#1e2540" opacity="0.6"/>
  <!-- Inner corner accent -->
  <path d="M2,2 L2,30 L30,30" fill="none" stroke="rgba(200,168,76,0.04)" stroke-width="0.5"/>
  <!-- Scuff marks -->
  <circle cx="8" cy="24" r="0.6" fill="#1a1e30" opacity="0.35"/>
  <circle cx="16" cy="16" r="0.5" fill="#1a1e30" opacity="0.3"/>
</svg>
