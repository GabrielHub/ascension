<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="boss-floor" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1c1428"/>
      <stop offset="60%" stop-color="#161024"/>
      <stop offset="100%" stop-color="#100c1e"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" fill="url(#boss-floor)"/>
  <!-- Heavy walls -->
  <rect x="0" y="0" width="96" height="3" fill="#2a2040" opacity="0.7"/>
  <rect x="0" y="93" width="96" height="3" fill="#2a2040" opacity="0.7"/>
  <rect x="0" y="0" width="3" height="96" fill="#2a2040" opacity="0.7"/>
  <rect x="93" y="0" width="3" height="96" fill="#2a2040" opacity="0.7"/>
  <!-- Ominous center marking -->
  <circle cx="48" cy="48" r="18" fill="none" stroke="rgba(212,84,30,0.06)" stroke-width="1"/>
  <circle cx="48" cy="48" r="8" fill="none" stroke="rgba(212,84,30,0.08)" stroke-width="0.5"/>
  <circle cx="48" cy="48" r="2" fill="rgba(212,84,30,0.1)"/>
  <!-- Corner rune-like marks -->
  <line x1="8" y1="8" x2="16" y2="8" stroke="rgba(212,84,30,0.05)" stroke-width="0.5"/>
  <line x1="8" y1="8" x2="8" y2="16" stroke="rgba(212,84,30,0.05)" stroke-width="0.5"/>
  <line x1="80" y1="88" x2="88" y2="88" stroke="rgba(212,84,30,0.05)" stroke-width="0.5"/>
  <line x1="88" y1="80" x2="88" y2="88" stroke="rgba(212,84,30,0.05)" stroke-width="0.5"/>
  <line x1="80" y1="8" x2="88" y2="8" stroke="rgba(212,84,30,0.05)" stroke-width="0.5"/>
  <line x1="88" y1="8" x2="88" y2="16" stroke="rgba(212,84,30,0.05)" stroke-width="0.5"/>
  <line x1="8" y1="80" x2="8" y2="88" stroke="rgba(212,84,30,0.05)" stroke-width="0.5"/>
  <line x1="8" y1="88" x2="16" y2="88" stroke="rgba(212,84,30,0.05)" stroke-width="0.5"/>
  <!-- Entry at bottom -->
  <rect x="42" y="93" width="12" height="3" fill="#161024"/>
