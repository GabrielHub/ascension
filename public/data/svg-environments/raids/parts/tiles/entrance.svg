<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="ent-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1e30"/>
      <stop offset="100%" stop-color="#141828"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#ent-floor)"/>
  <!-- Walls with gate opening at bottom -->
  <rect x="0" y="0" width="48" height="2" fill="#1e2540" opacity="0.6"/>
  <rect x="0" y="0" width="2" height="48" fill="#1e2540" opacity="0.6"/>
  <rect x="46" y="0" width="2" height="48" fill="#1e2540" opacity="0.6"/>
  <!-- Gate pillars -->
  <rect x="16" y="44" width="3" height="4" fill="#252a42" opacity="0.7"/>
  <rect x="29" y="44" width="3" height="4" fill="#252a42" opacity="0.7"/>
  <!-- Gate threshold glow -->
  <line x1="19" y1="46" x2="29" y2="46" stroke="rgba(200,168,76,0.12)" stroke-width="1"/>
  <!-- Arrow indicating entry -->
  <path d="M24,38 L24,28 M21,31 L24,28 L27,31" fill="none" stroke="rgba(200,168,76,0.08)" stroke-width="1" stroke-linecap="round"/>
</svg>
