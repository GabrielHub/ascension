<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <radialGradient id="in-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(100,160,220,0.1)"/>
      <stop offset="100%" stop-color="rgba(100,160,220,0)"/>
