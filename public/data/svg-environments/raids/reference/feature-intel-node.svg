  <!-- Scan lines -->
  <line x1="5" y1="8" x2="3" y2="8" stroke="rgba(100,160,220,0.08)" stroke-width="0.4"/>
  <line x1="11" y1="8" x2="13" y2="8" stroke="rgba(100,160,220,0.08)" stroke-width="0.4"/>
</svg>
