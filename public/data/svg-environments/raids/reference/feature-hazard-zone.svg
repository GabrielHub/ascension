<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <radialGradient id="hz-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(212,84,30,0.12)"/>
      <stop offset="100%" stop-color="rgba(212,84,30,0)"/>
    </radialGradient>
  </defs>
  <!-- Hazard zone — danger area overlay -->
  <circle cx="8" cy="8" r="7" fill="url(#hz-glow)"/>
  <!-- Warning triangle outline -->
  <polygon points="8,3 13,12 3,12" fill="none" stroke="rgba(212,84,30,0.2)" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Center dot -->
  <circle cx="8" cy="9" r="1" fill="rgba(212,84,30,0.15)"/>
</svg>
