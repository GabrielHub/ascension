<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="junc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(200,168,76,0.03)"/>
      <stop offset="100%" stop-color="rgba(200,168,76,0)"/>
    </radialGradient>
  </defs>
  <!-- Floor -->
  <rect width="32" height="32" fill="#161a28"/>
  <rect width="32" height="32" fill="url(#junc-glow)"/>
  <!-- Crosshair guides suggesting multiple paths -->
  <line x1="16" y1="0" x2="16" y2="32" stroke="rgba(42,53,85,0.12)" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="0" y1="16" x2="32" y2="16" stroke="rgba(42,53,85,0.12)" stroke-width="0.5" stroke-dasharray="3,3"/>
  <!-- Center decision point -->
  <circle cx="16" cy="16" r="2" fill="none" stroke="rgba(200,168,76,0.06)" stroke-width="0.6"/>
</svg>
