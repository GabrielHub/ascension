      <stop offset="0%" stop-color="rgba(212,84,30,0.2)"/>
      <stop offset="100%" stop-color="rgba(212,84,30,0)"/>
    </radialGradient>
  </defs>
  <!-- Ambient threat glow -->
  <circle cx="10" cy="10" r="9" fill="url(#eg-glow)"/>
