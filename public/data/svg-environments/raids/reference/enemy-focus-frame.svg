<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="ef-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="rgba(212,84,30,0.08)"/>
      <stop offset="100%" stop-color="rgba(212,84,30,0)"/>
    </radialGradient>
    <linearGradient id="ef-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(212,84,30,0.5)"/>
      <stop offset="50%" stop-color="rgba(212,84,30,0.2)"/>
      <stop offset="100%" stop-color="rgba(212,84,30,0.5)"/>
    </linearGradient>
  </defs>
  <!-- Focus-mode enemy portrait frame -->
  <rect width="120" height="120" fill="rgba(6,6,8,0.9)" rx="4"/>
  <rect width="120" height="120" fill="url(#ef-glow)" rx="4"/>
  <!-- Frame border -->
  <rect x="2" y="2" width="116" height="116" fill="none" stroke="url(#ef-border)" stroke-width="1.5" rx="3"/>
  <!-- Corner threat marks -->
  <path d="M8,16 L8,8 L16,8" fill="none" stroke="rgba(212,84,30,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M104,8 L112,8 L112,16" fill="none" stroke="rgba(212,84,30,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M112,104 L112,112 L104,112" fill="none" stroke="rgba(212,84,30,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16,112 L8,112 L8,104" fill="none" stroke="rgba(212,84,30,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Threat level bar slot -->
  <rect x="12" y="104" width="96" height="4" fill="rgba(212,84,30,0.08)" rx="2"/>
  <!-- Placeholder for actual enemy portrait content area -->
  <rect x="20" y="16" width="80" height="80" fill="rgba(212,84,30,0.03)" rx="2" stroke="rgba(212,84,30,0.06)" stroke-width="0.5" stroke-dasharray="4,3"/>
</svg>
