<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <radialGradient id="eb-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="rgba(212,84,30,0.3)"/>
      <stop offset="60%" stop-color="rgba(212,84,30,0.1)"/>
      <stop offset="100%" stop-color="rgba(212,84,30,0)"/>
    </radialGradient>
  </defs>
  <!-- Boss marker — largest enemy, imposing presence -->
  <circle cx="14" cy="14" r="13" fill="url(#eb-glow)"/>
