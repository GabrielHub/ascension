<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="fog-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono" result="dim">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="dim" mode="screen"/>
    </filter>
  </defs>
  <!-- Dense fog for fully unexplored cells -->
  <rect width="32" height="32" fill="rgba(6,6,8,0.92)" filter="url(#fog-noise)"/>
</svg>
