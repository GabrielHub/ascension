<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="pj-aura" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e8a038" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#2a1608" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pj-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a87028"/>
      <stop offset="50%" stop-color="#8a5818"/>
      <stop offset="100%" stop-color="#4a2a08"/>
    </linearGradient>
    <linearGradient id="pj-reel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a2e18"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="pj-usher" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6a1818"/>
      <stop offset="50%" stop-color="#4a0808"/>
      <stop offset="100%" stop-color="#2a0404"/>
    </linearGradient>
    <linearGradient id="pj-film" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2816"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="pj-bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f4b848" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6a3808" stop-opacity="0"/>
    </radialGradient>
    <filter id="pj-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pj-flicker">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <ellipse cx="100" cy="140" rx="94" ry="132" fill="url(#pj-aura)"/>

  <!-- Dust motes caught in the projector beam -->
  <circle cx="60" cy="94" r="0.9" fill="#e8b060" opacity="0.55" filter="url(#pj-flicker)"/>
  <circle cx="78" cy="80" r="0.7" fill="#e8b060" opacity="0.45" filter="url(#pj-flicker)"/>
  <circle cx="50" cy="118" r="1" fill="#e8b060" opacity="0.5" filter="url(#pj-flicker)"/>
  <circle cx="38" cy="146" r="0.8" fill="#e8b060" opacity="0.4" filter="url(#pj-flicker)"/>
  <circle cx="28" cy="172" r="0.9" fill="#e8b060" opacity="0.35" filter="url(#pj-flicker)"/>
  <circle cx="122" cy="80" r="0.8" fill="#e8b060" opacity="0.45" filter="url(#pj-flicker)"/>
  <circle cx="140" cy="120" r="0.9" fill="#e8b060" opacity="0.4" filter="url(#pj-flicker)"/>
  <circle cx="156" cy="148" r="0.7" fill="#e8b060" opacity="0.35" filter="url(#pj-flicker)"/>
  <circle cx="170" cy="178" r="0.8" fill="#e8b060" opacity="0.3" filter="url(#pj-flicker)"/>

  <!-- Projector beam — narrow bright cone projecting forward -->
  <path d="M 100 82 L 30 170 L 22 190 L 18 210 L 100 110 Z" fill="#ffe0a0" opacity="0.09"/>
  <path d="M 100 82 L 40 180 L 36 200 L 100 120 Z" fill="#ffc860" opacity="0.10"/>
  <path d="M 100 82 L 50 190 L 100 130 Z" fill="#ffb848" opacity="0.08"/>
  <!-- Mirrored beam on the other side -->
  <path d="M 100 82 L 170 170 L 178 190 L 182 210 L 100 110 Z" fill="#ffe0a0" opacity="0.09"/>
  <path d="M 100 82 L 160 180 L 164 200 L 100 120 Z" fill="#ffc860" opacity="0.10"/>

  <!-- Usher uniform lower body — theater red pants and vest legs -->
  <rect x="78" y="200" width="14" height="62" rx="1" fill="url(#pj-usher)" stroke="#1a0404" stroke-width="0.6"/>
  <rect x="108" y="200" width="14" height="62" rx="1" fill="url(#pj-usher)" stroke="#1a0404" stroke-width="0.6"/>
  <!-- Gold trim stripes on the pants -->
  <line x1="80" y1="210" x2="80" y2="258" stroke="#d4a830" stroke-width="0.8" opacity="0.75"/>
  <line x1="120" y1="210" x2="120" y2="258" stroke="#d4a830" stroke-width="0.8" opacity="0.75"/>
  <!-- Polished black shoes -->
  <ellipse cx="85" cy="266" rx="9" ry="3" fill="#0a0402" stroke="#1a0a04" stroke-width="0.5"/>
  <ellipse cx="115" cy="266" rx="9" ry="3" fill="#0a0402" stroke="#1a0a04" stroke-width="0.5"/>

  <!-- Torso — old projection booth rectangular frame -->
  <rect x="60" y="100" width="80" height="110" rx="3" fill="#2a1e10" stroke="#0a0402" stroke-width="1"/>
  <rect x="62" y="102" width="76" height="106" rx="2" fill="none" stroke="url(#pj-brass)" stroke-width="1"/>

  <!-- Film gate window on the chest — a bright bulb visible through it -->
  <rect x="82" y="130" width="36" height="48" rx="2" fill="#0a0402" stroke="url(#pj-brass)" stroke-width="1.5"/>
  <rect x="84" y="132" width="32" height="44" rx="1" fill="#1a0e04" stroke="#4a2a08" stroke-width="0.4"/>
  <!-- Bulb glow -->
  <circle cx="100" cy="154" r="16" fill="url(#pj-bulb)" filter="url(#pj-glow)"/>
  <circle cx="100" cy="154" r="8" fill="#fff0b8" opacity="0.85" filter="url(#pj-glow)"/>
  <circle cx="100" cy="154" r="3.5" fill="#ffffff" opacity="0.95"/>
  <!-- Film advancing through the gate — sprockets visible -->
  <rect x="84" y="136" width="32" height="3" fill="url(#pj-film)"/>
  <rect x="84" y="170" width="32" height="3" fill="url(#pj-film)"/>
  <!-- Sprocket holes -->
  <rect x="88" y="137" width="1.5" height="1" fill="#0a0402"/>
  <rect x="94" y="137" width="1.5" height="1" fill="#0a0402"/>
  <rect x="100" y="137" width="1.5" height="1" fill="#0a0402"/>
  <rect x="106" y="137" width="1.5" height="1" fill="#0a0402"/>
  <rect x="112" y="137" width="1.5" height="1" fill="#0a0402"/>
  <rect x="88" y="171" width="1.5" height="1" fill="#0a0402"/>
  <rect x="94" y="171" width="1.5" height="1" fill="#0a0402"/>
  <rect x="100" y="171" width="1.5" height="1" fill="#0a0402"/>
  <rect x="106" y="171" width="1.5" height="1" fill="#0a0402"/>
  <rect x="112" y="171" width="1.5" height="1" fill="#0a0402"/>
  <!-- Film frame lines -->
  <line x1="84" y1="145" x2="116" y2="145" stroke="#4a2a08" stroke-width="0.3" opacity="0.7"/>
  <line x1="84" y1="165" x2="116" y2="165" stroke="#4a2a08" stroke-width="0.3" opacity="0.7"/>

  <!-- Booth control dials and switches on the torso above and below the gate -->
  <circle cx="72" cy="116" r="4" fill="#1a0e04" stroke="url(#pj-brass)" stroke-width="0.6"/>
  <circle cx="72" cy="116" r="2.5" fill="#4a2a08" stroke="#6a4a18" stroke-width="0.3"/>
  <line x1="72" y1="113" x2="73" y2="116" stroke="#d4a830" stroke-width="0.5"/>
  <circle cx="128" cy="116" r="4" fill="#1a0e04" stroke="url(#pj-brass)" stroke-width="0.6"/>
  <circle cx="128" cy="116" r="2.5" fill="#4a2a08" stroke="#6a4a18" stroke-width="0.3"/>
  <line x1="128" y1="113" x2="129" y2="117" stroke="#d4a830" stroke-width="0.5"/>
  <!-- Toggle switches -->
  <rect x="66" y="184" width="4" height="6" rx="0.5" fill="#6a4a18" stroke="#1a0e04" stroke-width="0.3"/>
  <rect x="67" y="182" width="2" height="3" fill="#d4a830"/>
  <rect x="74" y="184" width="4" height="6" rx="0.5" fill="#6a4a18" stroke="#1a0e04" stroke-width="0.3"/>
  <rect x="75" y="187" width="2" height="3" fill="#d4a830"/>
  <rect x="122" y="184" width="4" height="6" rx="0.5" fill="#6a4a18" stroke="#1a0e04" stroke-width="0.3"/>
  <rect x="123" y="182" width="2" height="3" fill="#d4a830"/>
  <rect x="130" y="184" width="4" height="6" rx="0.5" fill="#6a4a18" stroke="#1a0e04" stroke-width="0.3"/>
  <rect x="131" y="187" width="2" height="3" fill="#d4a830"/>
  <!-- "REEL 13" label plate -->
  <rect x="72" y="196" width="56" height="8" rx="0.5" fill="#1a0e04" stroke="url(#pj-brass)" stroke-width="0.5"/>
  <text x="100" y="202" text-anchor="middle" fill="#d4a830" font-size="5" font-family="serif" font-weight="bold">REEL 13</text>

  <!-- Left reel arm — a massive film reel mounted as a shoulder -->
  <circle cx="36" cy="118" r="22" fill="url(#pj-reel)" stroke="url(#pj-brass)" stroke-width="1.5"/>
  <circle cx="36" cy="118" r="18" fill="none" stroke="#6a4a18" stroke-width="0.6"/>
  <!-- Reel spokes -->
  <line x1="36" y1="100" x2="36" y2="136" stroke="#6a4a18" stroke-width="1.2"/>
  <line x1="18" y1="118" x2="54" y2="118" stroke="#6a4a18" stroke-width="1.2"/>
  <line x1="23" y1="105" x2="49" y2="131" stroke="#6a4a18" stroke-width="1"/>
  <line x1="23" y1="131" x2="49" y2="105" stroke="#6a4a18" stroke-width="1"/>
  <!-- Center hub -->
  <circle cx="36" cy="118" r="4" fill="url(#pj-brass)" stroke="#1a0e04" stroke-width="0.5"/>
  <circle cx="36" cy="118" r="1.5" fill="#1a0e04"/>
  <!-- Film wound on the reel -->
  <circle cx="36" cy="118" r="14" fill="none" stroke="#3a2816" stroke-width="1.5" opacity="0.8"/>
  <circle cx="36" cy="118" r="10" fill="none" stroke="#3a2816" stroke-width="1.2" opacity="0.7"/>
  <circle cx="36" cy="118" r="7" fill="none" stroke="#3a2816" stroke-width="0.8" opacity="0.6"/>
  <!-- Reel mount to body -->
  <rect x="52" y="114" width="10" height="8" fill="url(#pj-brass)" stroke="#1a0e04" stroke-width="0.5"/>

  <!-- Film strip unspooling from left reel, cascading down -->
  <path d="M 30 140 Q 20 160 16 180 Q 14 200 18 220 L 22 230" fill="none" stroke="url(#pj-film)" stroke-width="6"/>
  <!-- Sprockets on left unspool -->
  <circle cx="28" cy="144" r="0.6" fill="#0a0402"/>
  <circle cx="24" cy="152" r="0.6" fill="#0a0402"/>
  <circle cx="22" cy="162" r="0.6" fill="#0a0402"/>
  <circle cx="18" cy="174" r="0.6" fill="#0a0402"/>
  <circle cx="16" cy="186" r="0.6" fill="#0a0402"/>
  <circle cx="16" cy="200" r="0.6" fill="#0a0402"/>
  <circle cx="17" cy="214" r="0.6" fill="#0a0402"/>
  <circle cx="20" cy="226" r="0.6" fill="#0a0402"/>
  <!-- Left film frame dividers -->
  <line x1="26" y1="148" x2="32" y2="150" stroke="#4a2a08" stroke-width="0.3"/>
  <line x1="22" y1="160" x2="28" y2="162" stroke="#4a2a08" stroke-width="0.3"/>
  <line x1="18" y1="176" x2="24" y2="178" stroke="#4a2a08" stroke-width="0.3"/>
  <line x1="16" y1="194" x2="22" y2="196" stroke="#4a2a08" stroke-width="0.3"/>
  <line x1="16" y1="210" x2="22" y2="212" stroke="#4a2a08" stroke-width="0.3"/>
  <!-- Film tail curling -->
  <path d="M 22 230 Q 14 238 20 244 L 26 240" fill="none" stroke="url(#pj-film)" stroke-width="4"/>

  <!-- Right reel arm — identical but mirrored -->
  <circle cx="164" cy="118" r="22" fill="url(#pj-reel)" stroke="url(#pj-brass)" stroke-width="1.5"/>
  <circle cx="164" cy="118" r="18" fill="none" stroke="#6a4a18" stroke-width="0.6"/>
  <line x1="164" y1="100" x2="164" y2="136" stroke="#6a4a18" stroke-width="1.2"/>
  <line x1="146" y1="118" x2="182" y2="118" stroke="#6a4a18" stroke-width="1.2"/>
  <line x1="151" y1="105" x2="177" y2="131" stroke="#6a4a18" stroke-width="1"/>
  <line x1="151" y1="131" x2="177" y2="105" stroke="#6a4a18" stroke-width="1"/>
  <circle cx="164" cy="118" r="4" fill="url(#pj-brass)" stroke="#1a0e04" stroke-width="0.5"/>
  <circle cx="164" cy="118" r="1.5" fill="#1a0e04"/>
  <circle cx="164" cy="118" r="14" fill="none" stroke="#3a2816" stroke-width="1.5" opacity="0.8"/>
  <circle cx="164" cy="118" r="10" fill="none" stroke="#3a2816" stroke-width="1.2" opacity="0.7"/>
  <circle cx="164" cy="118" r="7" fill="none" stroke="#3a2816" stroke-width="0.8" opacity="0.6"/>
  <rect x="138" y="114" width="10" height="8" fill="url(#pj-brass)" stroke="#1a0e04" stroke-width="0.5"/>

  <!-- Right film strip unspooling, tangled, burning -->
  <path d="M 170 140 Q 180 160 184 180 Q 186 198 182 216" fill="none" stroke="url(#pj-film)" stroke-width="6"/>
  <circle cx="172" cy="144" r="0.6" fill="#0a0402"/>
  <circle cx="176" cy="152" r="0.6" fill="#0a0402"/>
  <circle cx="178" cy="162" r="0.6" fill="#0a0402"/>
  <circle cx="182" cy="174" r="0.6" fill="#0a0402"/>
  <circle cx="184" cy="186" r="0.6" fill="#0a0402"/>
  <circle cx="184" cy="200" r="0.6" fill="#0a0402"/>
  <circle cx="183" cy="214" r="0.6" fill="#0a0402"/>
  <!-- Right strip is BURNING — orange flame at end -->
  <path d="M 182 216 Q 188 222 186 230 Q 192 224 194 232 Q 198 226 196 236 L 192 242" fill="#e86018" opacity="0.65" filter="url(#pj-glow)"/>
  <path d="M 184 220 Q 190 226 188 234" fill="#ffb848" opacity="0.7" filter="url(#pj-glow)"/>
  <path d="M 186 224 L 189 228 L 186 232" fill="#fff0a0" opacity="0.8"/>
  <!-- Embers from the burning strip -->
  <circle cx="186" cy="242" r="0.8" fill="#e86018" opacity="0.85" filter="url(#pj-glow)"/>
  <circle cx="180" cy="250" r="0.7" fill="#f4a048" opacity="0.8" filter="url(#pj-glow)"/>
  <circle cx="192" cy="248" r="0.7" fill="#f4a048" opacity="0.75" filter="url(#pj-glow)"/>
  <circle cx="188" cy="258" r="0.6" fill="#e86018" opacity="0.7" filter="url(#pj-glow)"/>

  <!-- The HEAD — a massive 35mm projector housing as a skull -->
  <!-- Projector body box -->
  <rect x="74" y="36" width="52" height="50" rx="3" fill="#2a1e10" stroke="#0a0402" stroke-width="1"/>
  <rect x="76" y="38" width="48" height="46" rx="2" fill="none" stroke="url(#pj-brass)" stroke-width="0.8"/>
  <!-- Top housing with reel holder -->
  <path d="M 78 36 L 78 28 L 122 28 L 122 36" fill="none" stroke="url(#pj-brass)" stroke-width="1.2"/>
  <circle cx="88" cy="26" r="6" fill="url(#pj-reel)" stroke="url(#pj-brass)" stroke-width="0.6"/>
  <circle cx="88" cy="26" r="4" fill="none" stroke="#6a4a18" stroke-width="0.3"/>
  <circle cx="88" cy="26" r="1.2" fill="url(#pj-brass)"/>
  <circle cx="112" cy="26" r="6" fill="url(#pj-reel)" stroke="url(#pj-brass)" stroke-width="0.6"/>
  <circle cx="112" cy="26" r="4" fill="none" stroke="#6a4a18" stroke-width="0.3"/>
  <circle cx="112" cy="26" r="1.2" fill="url(#pj-brass)"/>

  <!-- Projector lens — the main single "eye" of the head -->
  <!-- Outer lens rim -->
  <circle cx="100" cy="62" r="18" fill="#0a0402" stroke="url(#pj-brass)" stroke-width="2"/>
  <!-- Secondary rim -->
  <circle cx="100" cy="62" r="14" fill="#1a0e04" stroke="#6a4a18" stroke-width="0.8"/>
  <!-- Inner lens — multi-element glass -->
  <circle cx="100" cy="62" r="11" fill="#2a1e10" stroke="#4a2a08" stroke-width="0.5"/>
  <circle cx="100" cy="62" r="9" fill="#1a0e04" stroke="#3a2008" stroke-width="0.3"/>
  <!-- Lens light — bright projector bulb at the center -->
  <circle cx="100" cy="62" r="7" fill="#ffe0a0" opacity="0.9" filter="url(#pj-glow)"/>
  <circle cx="100" cy="62" r="4" fill="#ffffff" opacity="0.95"/>
  <circle cx="100" cy="62" r="1.5" fill="#ffffff"/>
  <!-- Lens reflection ring -->
  <circle cx="100" cy="62" r="9" fill="none" stroke="#f4a848" stroke-width="0.3" opacity="0.6"/>
  <!-- Lens element marker lines -->
  <line x1="88" y1="62" x2="86" y2="62" stroke="#d4a830" stroke-width="0.4"/>
  <line x1="112" y1="62" x2="114" y2="62" stroke="#d4a830" stroke-width="0.4"/>
  <line x1="100" y1="50" x2="100" y2="48" stroke="#d4a830" stroke-width="0.4"/>
  <line x1="100" y1="74" x2="100" y2="76" stroke="#d4a830" stroke-width="0.4"/>
  <!-- Focus adjustment ring bumps -->
  <circle cx="82" cy="62" r="0.8" fill="url(#pj-brass)"/>
  <circle cx="118" cy="62" r="0.8" fill="url(#pj-brass)"/>
  <circle cx="100" cy="44" r="0.8" fill="url(#pj-brass)"/>
  <circle cx="100" cy="80" r="0.8" fill="url(#pj-brass)"/>

  <!-- Cooling vents at the sides of the projector head -->
  <line x1="78" y1="50" x2="74" y2="50" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="78" y1="54" x2="72" y2="54" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="78" y1="58" x2="72" y2="58" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="78" y1="66" x2="72" y2="66" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="78" y1="70" x2="72" y2="70" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="78" y1="74" x2="74" y2="74" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="122" y1="50" x2="126" y2="50" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="122" y1="54" x2="128" y2="54" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="122" y1="58" x2="128" y2="58" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="122" y1="66" x2="128" y2="66" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="122" y1="70" x2="128" y2="70" stroke="#6a4a18" stroke-width="0.8"/>
  <line x1="122" y1="74" x2="126" y2="74" stroke="#6a4a18" stroke-width="0.8"/>

  <!-- Projector mounting neck — brass support pedestal -->
  <rect x="94" y="84" width="12" height="16" fill="url(#pj-brass)" stroke="#1a0e04" stroke-width="0.6"/>
  <rect x="92" y="96" width="16" height="4" fill="url(#pj-brass)" stroke="#1a0e04" stroke-width="0.4"/>
  <circle cx="94" cy="90" r="0.6" fill="#1a0e04"/>
  <circle cx="106" cy="90" r="0.6" fill="#1a0e04"/>

  <!-- Heat haze waves rising from projector head -->
  <path d="M 84 34 Q 82 30 84 26" fill="none" stroke="#e8a038" stroke-width="0.5" opacity="0.35" filter="url(#pj-flicker)"/>
  <path d="M 100 24 Q 98 20 100 16" fill="none" stroke="#e8a038" stroke-width="0.5" opacity="0.35" filter="url(#pj-flicker)"/>
  <path d="M 116 34 Q 118 30 116 26" fill="none" stroke="#e8a038" stroke-width="0.5" opacity="0.35" filter="url(#pj-flicker)"/>

  <!-- Gold usher epaulettes on shoulders — loops of gold braid -->
  <path d="M 60 100 Q 56 96 52 100" fill="none" stroke="#d4a830" stroke-width="1"/>
  <path d="M 140 100 Q 144 96 148 100" fill="none" stroke="#d4a830" stroke-width="1"/>
  <circle cx="56" cy="98" r="0.8" fill="#d4a830"/>
  <circle cx="144" cy="98" r="0.8" fill="#d4a830"/>

  <!-- Film strips scattered around the feet — spooled on the floor -->
  <ellipse cx="60" cy="262" rx="16" ry="2.5" fill="url(#pj-film)" opacity="0.75"/>
  <path d="M 48 264 Q 58 259 72 264" fill="none" stroke="url(#pj-film)" stroke-width="2"/>
  <path d="M 50 266 Q 60 263 70 266" fill="none" stroke="url(#pj-film)" stroke-width="1.5"/>
  <circle cx="54" cy="264" r="0.5" fill="#0a0402"/>
  <circle cx="62" cy="264" r="0.5" fill="#0a0402"/>
  <circle cx="68" cy="264" r="0.5" fill="#0a0402"/>
  <ellipse cx="140" cy="262" rx="16" ry="2.5" fill="url(#pj-film)" opacity="0.75"/>
  <path d="M 128 264 Q 138 259 152 264" fill="none" stroke="url(#pj-film)" stroke-width="2"/>
  <path d="M 130 266 Q 140 263 150 266" fill="none" stroke="url(#pj-film)" stroke-width="1.5"/>
  <circle cx="134" cy="264" r="0.5" fill="#0a0402"/>
  <circle cx="142" cy="264" r="0.5" fill="#0a0402"/>
  <circle cx="148" cy="264" r="0.5" fill="#0a0402"/>
</svg>
