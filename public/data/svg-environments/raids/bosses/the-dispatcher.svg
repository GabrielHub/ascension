<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="d-aura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d4541e" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0d1225" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="50%" stop-color="#131a2d"/>
      <stop offset="100%" stop-color="#0d1225"/>
    </linearGradient>
    <linearGradient id="d-signal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4541e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4541e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d4541e" stop-opacity="0"/>
    </linearGradient>
    <filter id="d-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="d-ember">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aura backdrop -->
  <ellipse cx="100" cy="130" rx="95" ry="130" fill="url(#d-aura)"/>

  <!-- Signal wave arcs emanating from head -->
  <path d="M 55 75 Q 40 60 55 45" fill="none" stroke="#d4541e" stroke-width="0.8" opacity="0.15"/>
  <path d="M 45 80 Q 25 60 45 35" fill="none" stroke="#d4541e" stroke-width="0.6" opacity="0.1"/>
  <path d="M 145 75 Q 160 60 145 45" fill="none" stroke="#d4541e" stroke-width="0.8" opacity="0.15"/>
  <path d="M 155 80 Q 175 60 155 35" fill="none" stroke="#d4541e" stroke-width="0.6" opacity="0.1"/>

  <!-- Body silhouette — massive, angular, transit-controller -->
  <path d="
    M 100 30
    L 120 40 L 135 55 L 140 75 L 145 95
    L 150 120 L 148 150 L 145 180
    L 140 210 L 135 235 L 130 260
    L 120 270 L 100 275 L 80 270
    L 70 260 L 65 235 L 60 210
    L 55 180 L 52 150 L 50 120
    L 55 95 L 60 75 L 65 55
    L 80 40 Z
  " fill="url(#d-body)" stroke="rgba(26,36,64,0.6)" stroke-width="1"/>

  <!-- Shoulder armor plates -->
  <path d="M 60 75 L 40 85 L 38 95 L 42 100 L 60 95 Z" fill="#1a2440" stroke="#2a3555" stroke-width="0.5"/>
  <path d="M 140 75 L 160 85 L 162 95 L 158 100 L 140 95 Z" fill="#1a2440" stroke="#2a3555" stroke-width="0.5"/>

  <!-- Transit routing lines on torso -->
  <line x1="80" y1="110" x2="80" y2="180" stroke="#2a3555" stroke-width="0.6" opacity="0.5"/>
  <line x1="100" y1="100" x2="100" y2="190" stroke="#2a3555" stroke-width="0.8" opacity="0.4"/>
  <line x1="120" y1="110" x2="120" y2="180" stroke="#2a3555" stroke-width="0.6" opacity="0.5"/>
  <!-- Cross routes -->
  <line x1="70" y1="130" x2="130" y2="130" stroke="#2a3555" stroke-width="0.5" opacity="0.3"/>
  <line x1="72" y1="155" x2="128" y2="155" stroke="#2a3555" stroke-width="0.5" opacity="0.3"/>
  <!-- Junction nodes -->
  <circle cx="80" cy="130" r="2" fill="#d4541e" opacity="0.3"/>
  <circle cx="120" cy="130" r="2" fill="#d4541e" opacity="0.3"/>
  <circle cx="100" cy="155" r="2.5" fill="#d4541e" opacity="0.4"/>

  <!-- Head — angular helmet with radio headset -->
  <path d="
    M 100 25
    L 118 32 L 124 48 L 122 62 L 115 70
    L 100 74 L 85 70 L 78 62
    L 76 48 L 82 32 Z
  " fill="#131a2d" stroke="#2a3555" stroke-width="0.8"/>

  <!-- Headset ear pieces -->
  <ellipse cx="73" cy="52" rx="6" ry="10" fill="#1a2440" stroke="#2a3555" stroke-width="0.6"/>
  <ellipse cx="127" cy="52" rx="6" ry="10" fill="#1a2440" stroke="#2a3555" stroke-width="0.6"/>
  <!-- Headset bridge -->
  <path d="M 78 38 Q 100 24 122 38" fill="none" stroke="#2a3555" stroke-width="1.5"/>

  <!-- Microphone boom -->
  <path d="M 73 58 L 60 68 L 58 72" fill="none" stroke="#2a3555" stroke-width="1"/>
  <circle cx="57" cy="73" r="2.5" fill="#1a2440" stroke="#d4541e" stroke-width="0.5" opacity="0.6"/>

  <!-- Eyes — glowing ember -->
  <ellipse cx="90" cy="52" rx="5" ry="3" fill="#d4541e" opacity="0.7" filter="url(#d-ember)"/>
  <ellipse cx="110" cy="52" rx="5" ry="3" fill="#d4541e" opacity="0.7" filter="url(#d-ember)"/>
  <!-- Eye cores -->
  <ellipse cx="90" cy="52" rx="2.5" ry="1.5" fill="#ff7b3a" opacity="0.9"/>
  <ellipse cx="110" cy="52" rx="2.5" ry="1.5" fill="#ff7b3a" opacity="0.9"/>

  <!-- Visor slit -->
  <line x1="84" y1="52" x2="116" y2="52" stroke="#d4541e" stroke-width="0.3" opacity="0.3"/>

  <!-- Chest panel — routing display -->
  <rect x="82" y="95" width="36" height="25" rx="3" fill="#0d1225" stroke="#2a3555" stroke-width="0.6"/>
  <!-- Panel signal lines -->
  <line x1="86" y1="102" x2="114" y2="102" stroke="#d4541e" stroke-width="0.4" opacity="0.3"/>
  <line x1="86" y1="107" x2="108" y2="107" stroke="#d4541e" stroke-width="0.4" opacity="0.2"/>
  <line x1="86" y1="112" x2="112" y2="112" stroke="#d4541e" stroke-width="0.4" opacity="0.25"/>
  <!-- Panel indicator dot -->
  <circle cx="112" cy="100" r="1.5" fill="#d4541e" opacity="0.6"/>

  <!-- Arms — heavy, angular -->
  <path d="M 55 95 L 42 130 L 38 160 L 40 170 L 48 165 L 52 140 L 60 110 Z" fill="#131a2d" stroke="#2a3555" stroke-width="0.5"/>
  <path d="M 145 95 L 158 130 L 162 160 L 160 170 L 152 165 L 148 140 L 140 110 Z" fill="#131a2d" stroke="#2a3555" stroke-width="0.5"/>

  <!-- Hands holding dispatch equipment -->
  <rect x="32" y="162" width="14" height="20" rx="2" fill="#1a2440" stroke="#2a3555" stroke-width="0.5"/>
  <!-- Handheld radio -->
  <rect x="34" y="164" width="10" height="12" rx="1" fill="#0d1225" stroke="#d4541e" stroke-width="0.3" opacity="0.4"/>
  <line x1="39" y1="160" x2="39" y2="152" stroke="#2a3555" stroke-width="0.8"/>
  <circle cx="39" cy="151" r="1" fill="#d4541e" opacity="0.4"/>

  <!-- Threat sigil on belt -->
  <circle cx="100" cy="195" r="8" fill="none" stroke="#d4541e" stroke-width="0.6" opacity="0.2"/>
  <circle cx="100" cy="195" r="4" fill="none" stroke="#d4541e" stroke-width="0.4" opacity="0.3"/>
  <circle cx="100" cy="195" r="1.5" fill="#d4541e" opacity="0.25"/>
</svg>
