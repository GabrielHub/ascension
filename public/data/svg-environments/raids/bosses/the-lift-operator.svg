<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="lo-aura" cx="50%" cy="45%" r="56%">
      <stop offset="0%" stop-color="#d4a020" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#1a1818" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#060606" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lo-cage" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a3640"/>
      <stop offset="50%" stop-color="#2a2830"/>
      <stop offset="100%" stop-color="#1a1820"/>
    </linearGradient>
    <linearGradient id="lo-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a030"/>
      <stop offset="50%" stop-color="#8a6818"/>
      <stop offset="100%" stop-color="#4a3408"/>
    </linearGradient>
    <linearGradient id="lo-iron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4650"/>
      <stop offset="100%" stop-color="#2a2630"/>
    </linearGradient>
    <linearGradient id="lo-chain" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5a5660"/>
      <stop offset="50%" stop-color="#3a3640"/>
      <stop offset="100%" stop-color="#2a2630"/>
    </linearGradient>
    <linearGradient id="lo-dial" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8dcb0"/>
      <stop offset="100%" stop-color="#b0a070"/>
    </linearGradient>
    <filter id="lo-glow">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lo-amber">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <ellipse cx="100" cy="142" rx="95" ry="130" fill="url(#lo-aura)"/>

  <!-- Cable tension lines running vertically behind the cage -->
  <line x1="72" y1="0" x2="72" y2="280" stroke="#3a3640" stroke-width="1.2" opacity="0.2"/>
  <line x1="128" y1="0" x2="128" y2="280" stroke="#3a3640" stroke-width="1.2" opacity="0.2"/>
  <line x1="72" y1="0" x2="72" y2="280" stroke="#d4a020" stroke-width="0.4" opacity="0.08"/>
  <line x1="128" y1="0" x2="128" y2="280" stroke="#d4a020" stroke-width="0.4" opacity="0.08"/>

  <!-- Shadow beneath -->
  <ellipse cx="100" cy="268" rx="65" ry="5" fill="#1a1820" opacity="0.5"/>

  <!-- Body — vertical elevator cage structure -->
  <path d="
    M 58 72
    L 58 252 L 142 252 L 142 72 Z
  " fill="url(#lo-cage)" stroke="#1a1820" stroke-width="1"/>

  <!-- Vertical cage bars -->
  <line x1="66" y1="72" x2="66" y2="252" stroke="#4a4650" stroke-width="1.4" opacity="0.8"/>
  <line x1="76" y1="72" x2="76" y2="252" stroke="#4a4650" stroke-width="1.4" opacity="0.8"/>
  <line x1="86" y1="72" x2="86" y2="252" stroke="#4a4650" stroke-width="1.4" opacity="0.8"/>
  <line x1="100" y1="72" x2="100" y2="252" stroke="#4a4650" stroke-width="1.4" opacity="0.8"/>
  <line x1="114" y1="72" x2="114" y2="252" stroke="#4a4650" stroke-width="1.4" opacity="0.8"/>
  <line x1="124" y1="72" x2="124" y2="252" stroke="#4a4650" stroke-width="1.4" opacity="0.8"/>
  <line x1="134" y1="72" x2="134" y2="252" stroke="#4a4650" stroke-width="1.4" opacity="0.8"/>

  <!-- Horizontal cage crossbars -->
  <rect x="58" y="72" width="84" height="5" fill="url(#lo-iron)" stroke="#0a0a0e" stroke-width="0.6"/>
  <rect x="58" y="120" width="84" height="4" fill="url(#lo-iron)" stroke="#0a0a0e" stroke-width="0.5"/>
  <rect x="58" y="168" width="84" height="4" fill="url(#lo-iron)" stroke="#0a0a0e" stroke-width="0.5"/>
  <rect x="58" y="216" width="84" height="4" fill="url(#lo-iron)" stroke="#0a0a0e" stroke-width="0.5"/>
  <rect x="58" y="248" width="84" height="5" fill="url(#lo-iron)" stroke="#0a0a0e" stroke-width="0.6"/>

  <!-- Cage bar crosshatch pattern (diamond lattice) -->
  <line x1="58" y1="77" x2="100" y2="120" stroke="#3a3640" stroke-width="0.5" opacity="0.35"/>
  <line x1="100" y1="77" x2="142" y2="120" stroke="#3a3640" stroke-width="0.5" opacity="0.35"/>
  <line x1="142" y1="77" x2="100" y2="120" stroke="#3a3640" stroke-width="0.5" opacity="0.35"/>
  <line x1="100" y1="77" x2="58" y2="120" stroke="#3a3640" stroke-width="0.5" opacity="0.35"/>
  <line x1="58" y1="124" x2="100" y2="168" stroke="#3a3640" stroke-width="0.5" opacity="0.3"/>
  <line x1="142" y1="124" x2="100" y2="168" stroke="#3a3640" stroke-width="0.5" opacity="0.3"/>
  <line x1="58" y1="172" x2="100" y2="216" stroke="#3a3640" stroke-width="0.5" opacity="0.25"/>
  <line x1="142" y1="172" x2="100" y2="216" stroke="#3a3640" stroke-width="0.5" opacity="0.25"/>

  <!-- Amber indicator lights along cage frame -->
  <circle cx="62" cy="90" r="2" fill="#d4a020" opacity="0.85" filter="url(#lo-amber)"/>
  <circle cx="62" cy="140" r="2" fill="#d4a020" opacity="0.7" filter="url(#lo-amber)"/>
  <circle cx="62" cy="190" r="2" fill="#d4a020" opacity="0.6" filter="url(#lo-amber)"/>
  <circle cx="62" cy="236" r="2" fill="#d4a020" opacity="0.5" filter="url(#lo-amber)"/>
  <circle cx="138" cy="90" r="2" fill="#d4a020" opacity="0.85" filter="url(#lo-amber)"/>
  <circle cx="138" cy="140" r="2" fill="#d4a020" opacity="0.7" filter="url(#lo-amber)"/>
  <circle cx="138" cy="190" r="2" fill="#d4a020" opacity="0.6" filter="url(#lo-amber)"/>
  <circle cx="138" cy="236" r="2" fill="#d4a020" opacity="0.5" filter="url(#lo-amber)"/>

  <!-- Chain mechanisms on shoulders -->
  <path d="M 56 72 Q 48 60 42 50 Q 36 42 30 38" fill="none" stroke="url(#lo-chain)" stroke-width="2.4" opacity="0.7"/>
  <path d="M 144 72 Q 152 60 158 50 Q 164 42 170 38" fill="none" stroke="url(#lo-chain)" stroke-width="2.4" opacity="0.7"/>
  <!-- Chain links detail -->
  <ellipse cx="44" cy="52" rx="2" ry="3" fill="none" stroke="#5a5660" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="48" cy="58" rx="2" ry="3" fill="none" stroke="#5a5660" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="52" cy="64" rx="2" ry="3" fill="none" stroke="#5a5660" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="156" cy="52" rx="2" ry="3" fill="none" stroke="#5a5660" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="152" cy="58" rx="2" ry="3" fill="none" stroke="#5a5660" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="148" cy="64" rx="2" ry="3" fill="none" stroke="#5a5660" stroke-width="0.8" opacity="0.6"/>
  <!-- Chain pulleys at top -->
  <circle cx="30" cy="36" r="5" fill="#2a2630" stroke="#4a4650" stroke-width="0.8"/>
  <circle cx="30" cy="36" r="2" fill="#4a4650"/>
  <circle cx="170" cy="36" r="5" fill="#2a2630" stroke="#4a4650" stroke-width="0.8"/>
  <circle cx="170" cy="36" r="2" fill="#4a4650"/>

  <!-- Head — floor indicator dial (semicircle) -->
  <path d="M 70 50 A 30 30 0 0 1 130 50" fill="url(#lo-dial)" stroke="#4a3408" stroke-width="1"/>
  <rect x="70" y="48" width="60" height="4" fill="#4a3408" stroke="#2a1808" stroke-width="0.5"/>
  <!-- Floor number markings on dial -->
  <text x="78" y="46" fill="#2a2018" font-size="4" font-family="sans-serif">B</text>
  <text x="86" y="38" fill="#2a2018" font-size="4" font-family="sans-serif">1</text>
  <text x="96" y="34" fill="#2a2018" font-size="4" font-family="sans-serif">13</text>
  <text x="108" y="38" fill="#2a2018" font-size="4" font-family="sans-serif">?</text>
  <text x="118" y="46" fill="#2a2018" font-size="4" font-family="sans-serif">&#x221E;</text>
  <!-- Tick marks on dial -->
  <line x1="78" y1="48" x2="80" y2="44" stroke="#2a2018" stroke-width="0.4"/>
  <line x1="88" y1="48" x2="89" y2="37" stroke="#2a2018" stroke-width="0.4"/>
  <line x1="100" y1="48" x2="100" y2="32" stroke="#2a2018" stroke-width="0.4"/>
  <line x1="112" y1="48" x2="111" y2="37" stroke="#2a2018" stroke-width="0.4"/>
  <line x1="122" y1="48" x2="120" y2="44" stroke="#2a2018" stroke-width="0.4"/>
  <!-- Needle pointing to impossible floor (13/?) -->
  <line x1="100" y1="50" x2="104" y2="36" stroke="#8a1818" stroke-width="1" filter="url(#lo-glow)"/>
  <circle cx="100" cy="50" r="2" fill="#4a3408" stroke="#2a1808" stroke-width="0.5"/>
  <!-- Dial glow -->
  <circle cx="104" cy="36" r="1.5" fill="#d4a020" opacity="0.8" filter="url(#lo-glow)"/>

  <!-- Left arm — extends through cage gap, holds brass lever -->
  <path d="M 58 130 Q 42 140 30 158 Q 22 176 18 194 L 24 198 L 30 186 Q 36 168 44 150 Z" fill="url(#lo-iron)" stroke="#0a0a0e" stroke-width="0.7"/>
  <!-- Elbow joint -->
  <circle cx="34" cy="158" r="3" fill="#2a2630" stroke="#4a4650" stroke-width="0.5"/>
  <circle cx="34" cy="158" r="1.2" fill="#4a4650"/>
  <!-- Brass lever -->
  <rect x="12" y="192" width="5" height="28" rx="1" fill="url(#lo-brass)" stroke="#2a1808" stroke-width="0.6"/>
  <circle cx="14" cy="192" r="3" fill="url(#lo-brass)" stroke="#2a1808" stroke-width="0.5"/>
  <!-- Hand gripping lever -->
  <path d="M 10 196 Q 8 200 10 204 L 18 204 L 20 200 L 18 196 Z" fill="#3a3640" stroke="#0a0a0e" stroke-width="0.4"/>

  <!-- Right arm — extends through cage gap, holds punch card -->
  <path d="M 142 130 Q 158 140 170 158 Q 178 176 182 194 L 176 198 L 170 186 Q 164 168 156 150 Z" fill="url(#lo-iron)" stroke="#0a0a0e" stroke-width="0.7"/>
  <circle cx="166" cy="158" r="3" fill="#2a2630" stroke="#4a4650" stroke-width="0.5"/>
  <circle cx="166" cy="158" r="1.2" fill="#4a4650"/>
  <!-- Punch card -->
  <rect x="172" y="190" width="18" height="28" rx="0.5" fill="#e8dcb0" stroke="#8a7850" stroke-width="0.5"/>
  <!-- Punch holes -->
  <circle cx="176" cy="196" r="0.8" fill="#2a2018"/>
  <circle cx="180" cy="196" r="0.8" fill="#2a2018"/>
  <circle cx="184" cy="196" r="0.8" fill="#2a2018"/>
  <circle cx="178" cy="200" r="0.8" fill="#2a2018"/>
  <circle cx="182" cy="200" r="0.8" fill="#2a2018"/>
  <circle cx="186" cy="200" r="0.8" fill="#2a2018"/>
  <circle cx="176" cy="204" r="0.8" fill="#2a2018"/>
  <circle cx="184" cy="204" r="0.8" fill="#2a2018"/>
  <circle cx="178" cy="208" r="0.8" fill="#2a2018"/>
  <circle cx="180" cy="212" r="0.8" fill="#2a2018"/>
  <circle cx="186" cy="208" r="0.8" fill="#2a2018"/>
  <!-- Hand holding card -->
  <path d="M 170 194 Q 168 198 170 202 L 174 202 L 174 194 Z" fill="#3a3640" stroke="#0a0a0e" stroke-width="0.4"/>

  <!-- Cage door gate overlay — accordion diamond pattern at center -->
  <path d="M 82 100 L 90 110 L 82 120" fill="none" stroke="#5a5660" stroke-width="0.6" opacity="0.4"/>
  <path d="M 90 100 L 98 110 L 90 120" fill="none" stroke="#5a5660" stroke-width="0.6" opacity="0.4"/>
  <path d="M 98 100 L 106 110 L 98 120" fill="none" stroke="#5a5660" stroke-width="0.6" opacity="0.4"/>
  <path d="M 106 100 L 114 110 L 106 120" fill="none" stroke="#5a5660" stroke-width="0.6" opacity="0.4"/>
  <path d="M 114 100 L 122 110 L 114 120" fill="none" stroke="#5a5660" stroke-width="0.6" opacity="0.4"/>

  <!-- Counterweight mechanism at bottom -->
  <rect x="88" y="254" width="24" height="12" fill="#2a2630" stroke="#4a4650" stroke-width="0.6"/>
  <line x1="92" y1="256" x2="92" y2="264" stroke="#4a4650" stroke-width="0.4"/>
  <line x1="96" y1="256" x2="96" y2="264" stroke="#4a4650" stroke-width="0.4"/>
  <line x1="100" y1="256" x2="100" y2="264" stroke="#4a4650" stroke-width="0.4"/>
  <line x1="104" y1="256" x2="104" y2="264" stroke="#4a4650" stroke-width="0.4"/>
  <line x1="108" y1="256" x2="108" y2="264" stroke="#4a4650" stroke-width="0.4"/>
</svg>
