<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="cp-aura" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#b8986a" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#1a1410" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cp-coat" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="50%" stop-color="#1e1408"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <linearGradient id="cp-brass" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f4d088"/>
      <stop offset="50%" stop-color="#c88838"/>
      <stop offset="100%" stop-color="#6a4418"/>
    </linearGradient>
    <linearGradient id="cp-velvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a0c14"/>
      <stop offset="100%" stop-color="#2a0408"/>
    </linearGradient>
    <filter id="cp-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <ellipse cx="100" cy="140" rx="94" ry="132" fill="url(#cp-aura)"/>

  <!-- Hallway carpet runner -->
  <path d="M 60 262 L 140 262 L 150 276 L 50 276 Z" fill="url(#cp-velvet)" stroke="#1a0408" stroke-width="0.5"/>
  <!-- Brass carpet-rod markers -->
  <circle cx="70" cy="270" r="0.8" fill="url(#cp-brass)"/>
  <circle cx="100" cy="270" r="0.8" fill="url(#cp-brass)"/>
  <circle cx="130" cy="270" r="0.8" fill="url(#cp-brass)"/>

  <!-- Apartment-door pattern echoing behind him (recursive hint) -->
  <rect x="16" y="80" width="14" height="40" rx="1" fill="none" stroke="#3a2a18" stroke-width="0.4" opacity="0.55"/>
  <rect x="32" y="86" width="12" height="34" rx="1" fill="none" stroke="#3a2a18" stroke-width="0.3" opacity="0.4"/>
  <rect x="170" y="80" width="14" height="40" rx="1" fill="none" stroke="#3a2a18" stroke-width="0.4" opacity="0.55"/>
  <rect x="156" y="86" width="12" height="34" rx="1" fill="none" stroke="#3a2a18" stroke-width="0.3" opacity="0.4"/>

  <!-- Shoes — patent black, polished -->
  <path d="M 66 250 L 62 262 L 90 262 L 88 250 Z" fill="#0a0608" stroke="#030202" stroke-width="0.4"/>
  <path d="M 110 250 L 112 262 L 138 262 L 134 250 Z" fill="#0a0608" stroke="#030202" stroke-width="0.4"/>

  <!-- Legs — pressed trousers -->
  <rect x="70" y="198" width="22" height="54" rx="1" fill="url(#cp-coat)" stroke="#0a0604" stroke-width="0.6"/>
  <rect x="108" y="198" width="22" height="54" rx="1" fill="url(#cp-coat)" stroke="#0a0604" stroke-width="0.6"/>

  <!-- Trouser side-stripe — brass piping -->
  <line x1="92" y1="200" x2="92" y2="248" stroke="url(#cp-brass)" stroke-width="0.5" opacity="0.75"/>
  <line x1="108" y1="200" x2="108" y2="248" stroke="url(#cp-brass)" stroke-width="0.5" opacity="0.75"/>

  <!-- Main body — long bellhop/concierge tailcoat -->
  <path d="M 56 102 L 64 90 L 80 84 L 100 82 L 120 84 L 136 90 L 144 102 L 150 140 L 154 180 L 148 220 L 52 220 L 46 180 L 50 140 Z"
        fill="url(#cp-coat)" stroke="#050404" stroke-width="1.0"/>

  <!-- Coat tails trailing -->
  <path d="M 52 220 L 40 250 L 56 250 Z" fill="url(#cp-coat)" stroke="#0a0604" stroke-width="0.5"/>
  <path d="M 148 220 L 160 250 L 144 250 Z" fill="url(#cp-coat)" stroke="#0a0604" stroke-width="0.5"/>

  <!-- Coat front — double row of brass buttons -->
  <line x1="100" y1="90" x2="100" y2="220" stroke="#0a0604" stroke-width="0.4"/>
  <circle cx="92" cy="108" r="1.4" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <circle cx="108" cy="108" r="1.4" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <circle cx="92" cy="128" r="1.4" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <circle cx="108" cy="128" r="1.4" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <circle cx="92" cy="148" r="1.4" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <circle cx="108" cy="148" r="1.4" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <circle cx="92" cy="168" r="1.4" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <circle cx="108" cy="168" r="1.4" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>

  <!-- Shoulder boards — gilded epaulets -->
  <rect x="58" y="94" width="18" height="6" rx="1" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.4"/>
  <rect x="124" y="94" width="18" height="6" rx="1" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.4"/>
  <!-- Epaulet tassels -->
  <line x1="60" y1="100" x2="60" y2="106" stroke="url(#cp-brass)" stroke-width="0.4"/>
  <line x1="64" y1="100" x2="64" y2="106" stroke="url(#cp-brass)" stroke-width="0.4"/>
  <line x1="68" y1="100" x2="68" y2="106" stroke="url(#cp-brass)" stroke-width="0.4"/>
  <line x1="132" y1="100" x2="132" y2="106" stroke="url(#cp-brass)" stroke-width="0.4"/>
  <line x1="136" y1="100" x2="136" y2="106" stroke="url(#cp-brass)" stroke-width="0.4"/>
  <line x1="140" y1="100" x2="140" y2="106" stroke="url(#cp-brass)" stroke-width="0.4"/>

  <!-- High collar with velvet trim -->
  <path d="M 78 82 L 76 96 L 100 98 L 124 96 L 122 82 Z" fill="url(#cp-velvet)" stroke="#1a0408" stroke-width="0.5"/>

  <!-- Left arm — holding out a silver tray with a single brass bell -->
  <path d="M 46 106 L 34 120 L 22 152 L 12 186 L 18 190 L 30 164 L 42 138 L 52 122 Z" fill="url(#cp-coat)" stroke="#050404" stroke-width="0.6"/>
  <!-- White-gloved hand -->
  <ellipse cx="16" cy="192" rx="6" ry="4.5" fill="#f4ecd4" stroke="#8a6a42" stroke-width="0.4"/>
  <!-- Glove cuff button -->
  <circle cx="16" cy="196" r="0.7" fill="#c88838"/>
  <!-- Silver service tray -->
  <ellipse cx="24" cy="210" rx="18" ry="3" fill="#d8d4c8" stroke="#6a6858" stroke-width="0.5"/>
  <!-- Brass bell on the tray -->
  <path d="M 20 198 L 28 198 L 30 208 L 18 208 Z" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.4"/>
  <rect x="23" y="196" width="2" height="3" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <circle cx="24" cy="196" r="1" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <!-- Ring halo around the bell -->
  <circle cx="24" cy="202" r="9" fill="none" stroke="#f4d088" stroke-width="0.3" opacity="0.55" filter="url(#cp-glow)"/>

  <!-- Right arm — held at his side, key-ring dangling from gloved hand -->
  <path d="M 154 106 L 166 122 L 178 150 L 184 182 L 178 186 L 168 162 L 158 138 L 148 120 Z" fill="url(#cp-coat)" stroke="#050404" stroke-width="0.6"/>
  <!-- White glove -->
  <ellipse cx="180" cy="188" rx="6" ry="4.5" fill="#f4ecd4" stroke="#8a6a42" stroke-width="0.4"/>
  <!-- Key ring -->
  <circle cx="184" cy="210" r="6" fill="none" stroke="url(#cp-brass)" stroke-width="0.8"/>
  <!-- Three brass keys hanging -->
  <path d="M 178 212 L 176 226 L 178 228 L 180 226 L 178 216 Z" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <path d="M 184 214 L 184 230 L 182 230 L 184 220 L 186 230" fill="none" stroke="url(#cp-brass)" stroke-width="0.8"/>
  <path d="M 190 212 L 192 228 L 190 228 L 190 220 L 188 218" fill="none" stroke="url(#cp-brass)" stroke-width="0.8"/>
  <!-- Chain connecting key ring to belt -->
  <path d="M 150 196 Q 170 200 184 206" fill="none" stroke="url(#cp-brass)" stroke-width="0.5" opacity="0.9"/>

  <!-- Head — composed, ageless -->
  <ellipse cx="100" cy="62" rx="15" ry="17" fill="#d8b898" stroke="#6a4a30" stroke-width="0.5"/>
  <!-- Bellhop pillbox hat -->
  <rect x="82" y="32" width="36" height="14" rx="1" fill="url(#cp-velvet)" stroke="#1a0408" stroke-width="0.5"/>
  <rect x="82" y="44" width="36" height="2" fill="url(#cp-brass)" stroke="#3a1c08" stroke-width="0.3"/>
  <!-- Chin strap -->
  <path d="M 86 56 Q 100 72 114 56" fill="none" stroke="#3a1c08" stroke-width="0.4"/>

  <!-- Eyes — amber, polite predator -->
  <ellipse cx="93" cy="62" rx="2.6" ry="1.8" fill="#f4ecd0" stroke="#2a1810" stroke-width="0.3"/>
  <circle cx="93" cy="62" r="1.1" fill="#c88838" filter="url(#cp-glow)"/>
  <ellipse cx="107" cy="62" rx="2.6" ry="1.8" fill="#f4ecd0" stroke="#2a1810" stroke-width="0.3"/>
  <circle cx="107" cy="62" r="1.1" fill="#c88838" filter="url(#cp-glow)"/>

  <!-- Pencil moustache -->
  <path d="M 92 76 Q 100 77 108 76" fill="none" stroke="#1a0e08" stroke-width="0.7"/>

  <!-- Thin polite smile -->
  <path d="M 94 80 Q 100 82 106 80" fill="none" stroke="#3a1810" stroke-width="0.6"/>

  <!-- Brow -->
  <path d="M 88 57 Q 93 55 98 57" fill="none" stroke="#1a0e08" stroke-width="0.55"/>
  <path d="M 102 57 Q 107 55 112 57" fill="none" stroke="#1a0e08" stroke-width="0.55"/>

  <!-- Sharp nose -->
  <path d="M 100 64 L 98 72 L 100 74 L 102 72 Z" fill="#c08868" stroke="#6a4a30" stroke-width="0.3"/>
</svg>
