<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="ap-aura" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#d4a830" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#1a1608" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#060604" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ap-case" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d4d4dc" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#8a9098" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4a4e58" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="ap-frame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#b08838"/>
      <stop offset="50%" stop-color="#8a6820"/>
      <stop offset="100%" stop-color="#4a3812"/>
    </linearGradient>
    <linearGradient id="ap-suit" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a2a18"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="ap-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d860"/>
      <stop offset="50%" stop-color="#d4a830"/>
      <stop offset="100%" stop-color="#8a6820"/>
    </linearGradient>
    <filter id="ap-glow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ap-shimmer">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <ellipse cx="100" cy="138" rx="94" ry="132" fill="url(#ap-aura)"/>

  <!-- Fluorescent shop-light buzz streaks from overhead -->
  <rect x="18" y="8" width="56" height="3" rx="0.5" fill="#e8dc88" opacity="0.28" filter="url(#ap-glow)"/>
  <rect x="126" y="8" width="56" height="3" rx="0.5" fill="#e8dc88" opacity="0.28" filter="url(#ap-glow)"/>

  <!-- Legs — dark pinstriped pants -->
  <rect x="80" y="214" width="14" height="48" rx="1" fill="url(#ap-suit)" stroke="#0a0604" stroke-width="0.6"/>
  <rect x="106" y="214" width="14" height="48" rx="1" fill="url(#ap-suit)" stroke="#0a0604" stroke-width="0.6"/>
  <!-- Pinstripes -->
  <line x1="84" y1="218" x2="84" y2="258" stroke="#6a5a38" stroke-width="0.3" opacity="0.5"/>
  <line x1="90" y1="218" x2="90" y2="258" stroke="#6a5a38" stroke-width="0.3" opacity="0.5"/>
  <line x1="110" y1="218" x2="110" y2="258" stroke="#6a5a38" stroke-width="0.3" opacity="0.5"/>
  <line x1="116" y1="218" x2="116" y2="258" stroke="#6a5a38" stroke-width="0.3" opacity="0.5"/>
  <!-- Polished shoes -->
  <ellipse cx="87" cy="264" rx="9" ry="3.5" fill="#0a0604" stroke="#2a1e10" stroke-width="0.5"/>
  <ellipse cx="113" cy="264" rx="9" ry="3.5" fill="#0a0604" stroke="#2a1e10" stroke-width="0.5"/>
  <ellipse cx="85" cy="262" rx="3" ry="0.8" fill="#4a3e28" opacity="0.7"/>
  <ellipse cx="111" cy="262" rx="3" ry="0.8" fill="#4a3e28" opacity="0.7"/>

  <!-- Torso — an enormous glass display case replacing the chest -->
  <!-- Case back panel (velvet lining) -->
  <rect x="52" y="96" width="96" height="130" rx="3" fill="#4a1818" stroke="#2a0808" stroke-width="1"/>
  <!-- Velvet weave texture -->
  <line x1="54" y1="110" x2="146" y2="110" stroke="#2a0808" stroke-width="0.3" opacity="0.5"/>
  <line x1="54" y1="140" x2="146" y2="140" stroke="#2a0808" stroke-width="0.3" opacity="0.5"/>
  <line x1="54" y1="170" x2="146" y2="170" stroke="#2a0808" stroke-width="0.3" opacity="0.5"/>
  <line x1="54" y1="200" x2="146" y2="200" stroke="#2a0808" stroke-width="0.3" opacity="0.5"/>
  <line x1="72" y1="98" x2="72" y2="224" stroke="#2a0808" stroke-width="0.3" opacity="0.5"/>
  <line x1="100" y1="98" x2="100" y2="224" stroke="#2a0808" stroke-width="0.3" opacity="0.5"/>
  <line x1="128" y1="98" x2="128" y2="224" stroke="#2a0808" stroke-width="0.3" opacity="0.5"/>

  <!-- Brass frame around the case -->
  <rect x="50" y="94" width="100" height="134" rx="4" fill="none" stroke="url(#ap-frame)" stroke-width="3"/>
  <!-- Brass corner brackets -->
  <path d="M 50 102 L 50 94 L 58 94" fill="none" stroke="#f4d860" stroke-width="1.2"/>
  <path d="M 142 94 L 150 94 L 150 102" fill="none" stroke="#f4d860" stroke-width="1.2"/>
  <path d="M 50 220 L 50 228 L 58 228" fill="none" stroke="#f4d860" stroke-width="1.2"/>
  <path d="M 142 228 L 150 228 L 150 220" fill="none" stroke="#f4d860" stroke-width="1.2"/>
  <!-- Brass rivets -->
  <circle cx="53" cy="97" r="1.2" fill="#f4d860"/>
  <circle cx="147" cy="97" r="1.2" fill="#f4d860"/>
  <circle cx="53" cy="225" r="1.2" fill="#f4d860"/>
  <circle cx="147" cy="225" r="1.2" fill="#f4d860"/>

  <!-- Dividers — glass case has three horizontal shelves -->
  <line x1="52" y1="128" x2="148" y2="128" stroke="url(#ap-frame)" stroke-width="1.5"/>
  <line x1="52" y1="164" x2="148" y2="164" stroke="url(#ap-frame)" stroke-width="1.5"/>
  <line x1="52" y1="196" x2="148" y2="196" stroke="url(#ap-frame)" stroke-width="1.5"/>

  <!-- ITEMS inside display case — each section holds pawned goods -->
  <!-- Top shelf: wristwatches -->
  <g>
    <circle cx="72" cy="114" r="6" fill="#1a1608" stroke="#d4a830" stroke-width="0.8"/>
    <circle cx="72" cy="114" r="4.5" fill="#e8e0c4" stroke="#6a5a38" stroke-width="0.3"/>
    <line x1="72" y1="111" x2="72" y2="114" stroke="#1a1208" stroke-width="0.5"/>
    <line x1="72" y1="114" x2="75" y2="114" stroke="#1a1208" stroke-width="0.5"/>
    <rect x="68" y="108" width="8" height="2" rx="0.3" fill="#6a4a18"/>
    <rect x="68" y="118" width="8" height="2" rx="0.3" fill="#6a4a18"/>
  </g>
  <g>
    <circle cx="100" cy="114" r="7" fill="#1a1208" stroke="#f4d860" stroke-width="0.8"/>
    <circle cx="100" cy="114" r="5" fill="#f4e0a4" stroke="#6a5a38" stroke-width="0.3"/>
    <!-- Watch hands pointing at impossible time -->
    <line x1="100" y1="110" x2="103" y2="117" stroke="#1a1208" stroke-width="0.6"/>
    <line x1="100" y1="114" x2="96" y2="110" stroke="#1a1208" stroke-width="0.6"/>
    <!-- Numbers shown as dots -->
    <circle cx="100" cy="111" r="0.3" fill="#1a1208"/>
    <circle cx="103" cy="114" r="0.3" fill="#1a1208"/>
    <circle cx="100" cy="117" r="0.3" fill="#1a1208"/>
    <circle cx="97" cy="114" r="0.3" fill="#1a1208"/>
    <rect x="96" y="108" width="8" height="2" rx="0.3" fill="#6a4a18"/>
    <rect x="96" y="118" width="8" height="2" rx="0.3" fill="#6a4a18"/>
  </g>
  <g>
    <circle cx="128" cy="114" r="5.5" fill="#1a1608" stroke="#d4a830" stroke-width="0.7"/>
    <circle cx="128" cy="114" r="4" fill="#c8b888" stroke="#6a5a38" stroke-width="0.3"/>
    <line x1="128" y1="111" x2="131" y2="114" stroke="#1a1208" stroke-width="0.5"/>
    <line x1="128" y1="114" x2="128" y2="117" stroke="#1a1208" stroke-width="0.5"/>
  </g>

  <!-- Second shelf: gold rings and chains -->
  <circle cx="66" cy="146" r="4" fill="none" stroke="url(#ap-gold)" stroke-width="1.5"/>
  <circle cx="66" cy="146" r="4" fill="none" stroke="#f4d860" stroke-width="0.3"/>
  <circle cx="66" cy="144" r="1.2" fill="#b8d8e0" stroke="#6a6a78" stroke-width="0.3"/>
  <circle cx="78" cy="148" r="3" fill="none" stroke="url(#ap-gold)" stroke-width="1.2"/>
  <circle cx="78" cy="148" r="1" fill="#f4dc88" opacity="0.8"/>
  <!-- Gold chain draped -->
  <path d="M 90 140 Q 100 148 110 140 Q 120 146 130 144" fill="none" stroke="url(#ap-gold)" stroke-width="1.2"/>
  <circle cx="94" cy="144" r="0.8" fill="#f4d860"/>
  <circle cx="100" cy="148" r="0.8" fill="#f4d860"/>
  <circle cx="106" cy="144" r="0.8" fill="#f4d860"/>
  <circle cx="112" cy="142" r="0.8" fill="#f4d860"/>
  <circle cx="120" cy="145" r="0.8" fill="#f4d860"/>
  <!-- Ring with large gem -->
  <circle cx="134" cy="152" r="3" fill="none" stroke="url(#ap-gold)" stroke-width="1.2"/>
  <path d="M 133 149 L 135 149 L 136 151 L 134 153 L 132 151 Z" fill="#8a1838" stroke="#4a0818" stroke-width="0.3"/>
  <!-- Another watch on its side -->
  <ellipse cx="66" cy="156" rx="4" ry="2.5" fill="#1a1608" stroke="#d4a830" stroke-width="0.5"/>

  <!-- Third shelf: pocket watches, knife, gun outline (pawned items) -->
  <circle cx="68" cy="180" r="7" fill="#1a1208" stroke="url(#ap-gold)" stroke-width="1"/>
  <circle cx="68" cy="180" r="5.5" fill="#e8dc88" stroke="#6a5a38" stroke-width="0.4"/>
  <line x1="68" y1="175" x2="68" y2="180" stroke="#1a1208" stroke-width="0.5"/>
  <line x1="68" y1="180" x2="72" y2="183" stroke="#1a1208" stroke-width="0.5"/>
  <!-- Chain -->
  <path d="M 68 187 Q 66 192 64 194" fill="none" stroke="#d4a830" stroke-width="0.6"/>
  <!-- Knife -->
  <path d="M 88 184 L 106 178 L 108 180 L 90 186 Z" fill="#c0c4cc" stroke="#4a5058" stroke-width="0.4"/>
  <rect x="86" y="184" width="4" height="3" rx="0.3" fill="#6a4a18"/>
  <!-- Small camera -->
  <rect x="116" y="178" width="14" height="10" rx="1" fill="#2a1e10" stroke="#4a3218" stroke-width="0.5"/>
  <circle cx="123" cy="183" r="2.5" fill="#0a0604" stroke="#8a6820" stroke-width="0.4"/>
  <circle cx="123" cy="183" r="1" fill="#3a2e18"/>
  <!-- Handgun silhouette -->
  <path d="M 132 184 L 142 184 L 144 182 L 144 186 L 140 188 L 136 188 L 132 186 Z" fill="#2a1e10" stroke="#4a3218" stroke-width="0.4"/>

  <!-- Fourth shelf: cash stack, lighter, vintage coin -->
  <rect x="60" y="206" width="20" height="12" rx="0.5" fill="#3a5a38" stroke="#1a2a18" stroke-width="0.4"/>
  <line x1="62" y1="210" x2="78" y2="210" stroke="#1a2a18" stroke-width="0.3"/>
  <line x1="62" y1="214" x2="78" y2="214" stroke="#1a2a18" stroke-width="0.3"/>
  <circle cx="70" cy="212" r="2" fill="none" stroke="#6a8a68" stroke-width="0.4"/>
  <text x="70" y="213.5" text-anchor="middle" fill="#6a8a68" font-size="3" font-family="serif">$</text>
  <!-- Lighter -->
  <rect x="90" y="208" width="6" height="10" rx="0.5" fill="#c0c4cc" stroke="#4a5058" stroke-width="0.4"/>
  <rect x="91" y="206" width="4" height="2" rx="0.2" fill="#6a4a18"/>
  <!-- Coin -->
  <circle cx="110" cy="212" r="4" fill="url(#ap-gold)" stroke="#6a5020" stroke-width="0.5"/>
  <text x="110" y="214" text-anchor="middle" fill="#4a3812" font-size="3.5" font-family="serif" font-weight="bold">5</text>
  <!-- Dollar bill roll -->
  <circle cx="128" cy="212" r="5" fill="#4a5a38" stroke="#1a2a18" stroke-width="0.4"/>
  <circle cx="128" cy="212" r="3" fill="#2a3a28" stroke="#1a2a18" stroke-width="0.3"/>
  <circle cx="128" cy="212" r="1" fill="#8a9a68"/>

  <!-- Glass pane over the case — reflective highlights -->
  <rect x="52" y="96" width="96" height="130" rx="2" fill="url(#ap-case)" opacity="0.6"/>
  <!-- Glass reflection streaks -->
  <path d="M 58 100 L 66 100 L 60 224 L 52 224 Z" fill="#f4f4fc" opacity="0.10"/>
  <path d="M 130 104 L 136 104 L 134 222 L 128 222 Z" fill="#f4f4fc" opacity="0.06"/>

  <!-- Price tags attached to the frame -->
  <g opacity="0.9">
    <path d="M 44 118 L 40 126 L 32 124 L 34 114 Z" fill="#e8dcb0" stroke="#6a5a38" stroke-width="0.4"/>
    <circle cx="38" cy="118" r="0.7" fill="#6a5a38"/>
    <text x="38" y="123" text-anchor="middle" fill="#3a2e18" font-size="3.5" font-family="serif">$$$</text>
  </g>
  <g opacity="0.9">
    <path d="M 156 162 L 160 170 L 168 168 L 166 158 Z" fill="#e8dcb0" stroke="#6a5a38" stroke-width="0.4"/>
    <circle cx="162" cy="162" r="0.7" fill="#6a5a38"/>
    <text x="162" y="167" text-anchor="middle" fill="#3a2e18" font-size="3.5" font-family="serif">SOLD</text>
  </g>

  <!-- Arms — emerging from behind the case (suit jacket sleeves) -->
  <!-- Left arm (holding a magnifier loupe) -->
  <path d="M 50 104 L 38 130 L 30 158 L 26 180 Q 26 188 32 188 L 38 182 L 44 160 L 52 134 Z" fill="url(#ap-suit)" stroke="#0a0604" stroke-width="0.6"/>
  <!-- Shirt cuff -->
  <rect x="28" y="182" width="12" height="4" rx="0.5" fill="#e8dcb0" stroke="#6a5a38" stroke-width="0.3"/>
  <!-- Hand -->
  <ellipse cx="34" cy="192" rx="6" ry="4" fill="#d4a880" stroke="#5a3820" stroke-width="0.5"/>
  <!-- Fingers gripping the loupe handle -->
  <line x1="30" y1="194" x2="28" y2="198" stroke="#5a3820" stroke-width="0.5"/>
  <line x1="34" y1="195" x2="34" y2="200" stroke="#5a3820" stroke-width="0.5"/>
  <line x1="38" y1="194" x2="40" y2="198" stroke="#5a3820" stroke-width="0.5"/>
  <!-- Loupe — a jeweler's magnifying glass -->
  <line x1="34" y1="196" x2="20" y2="218" stroke="url(#ap-frame)" stroke-width="1.5"/>
  <circle cx="16" cy="226" r="11" fill="none" stroke="url(#ap-frame)" stroke-width="2"/>
  <circle cx="16" cy="226" r="9" fill="#d4d8e0" stroke="#6a5a38" stroke-width="0.4" opacity="0.55"/>
  <!-- Loupe glass highlights -->
  <path d="M 10 218 Q 14 220 16 226" fill="none" stroke="#f4f4fc" stroke-width="0.6" opacity="0.6"/>
  <circle cx="16" cy="226" r="3" fill="none" stroke="#8a6820" stroke-width="0.4" opacity="0.5"/>
  <!-- Something visible through the glass — a small watching eye -->
  <circle cx="16" cy="226" r="1.5" fill="#1a1208"/>
  <circle cx="16" cy="226" r="0.8" fill="#f4d860" opacity="0.8" filter="url(#ap-glow)"/>

  <!-- Right arm — pointing authoritatively -->
  <path d="M 150 104 L 162 130 L 170 158 L 174 180 Q 174 188 168 188 L 162 182 L 156 160 L 148 134 Z" fill="url(#ap-suit)" stroke="#0a0604" stroke-width="0.6"/>
  <rect x="160" y="182" width="12" height="4" rx="0.5" fill="#e8dcb0" stroke="#6a5a38" stroke-width="0.3"/>
  <!-- Hand index pointing -->
  <path d="M 166 188 L 172 196 L 176 204 L 178 208 L 182 206 L 180 198 L 174 190 Z" fill="#d4a880" stroke="#5a3820" stroke-width="0.5"/>
  <!-- Ring on the pointing finger — gold with ruby -->
  <circle cx="174" cy="194" r="1.6" fill="#f4d860" stroke="#8a6820" stroke-width="0.4"/>
  <circle cx="174" cy="194" r="0.7" fill="#8a1838"/>

  <!-- Head — a polished bald head with jeweler's loupe eye -->
  <!-- Neck -->
  <rect x="92" y="82" width="16" height="14" fill="#d4a880" stroke="#5a3820" stroke-width="0.5"/>
  <!-- Head -->
  <ellipse cx="100" cy="58" rx="22" ry="26" fill="#d4a880" stroke="#5a3820" stroke-width="0.8"/>
  <!-- Bald scalp highlight -->
  <path d="M 86 40 Q 100 28 114 40" fill="none" stroke="#f4d4a8" stroke-width="1" opacity="0.55"/>
  <!-- Hair on the sides — thin wisps -->
  <path d="M 78 60 Q 76 64 78 68 L 82 70" fill="none" stroke="#2a1608" stroke-width="1" opacity="0.8"/>
  <path d="M 122 60 Q 124 64 122 68 L 118 70" fill="none" stroke="#2a1608" stroke-width="1" opacity="0.8"/>
  <!-- Eyebrows -->
  <path d="M 84 50 Q 88 48 94 50" fill="none" stroke="#3a1e08" stroke-width="0.8"/>
  <path d="M 106 50 Q 112 48 116 50" fill="none" stroke="#3a1e08" stroke-width="0.8"/>

  <!-- Left eye — a jeweler's loupe fused into the eye socket -->
  <circle cx="88" cy="58" r="6" fill="#1a1208" stroke="url(#ap-frame)" stroke-width="1.2"/>
  <circle cx="88" cy="58" r="4.5" fill="#4a5058" stroke="#6a5a38" stroke-width="0.4"/>
  <circle cx="88" cy="58" r="3" fill="#1a1208"/>
  <circle cx="88" cy="58" r="1.5" fill="#f4d860" filter="url(#ap-glow)"/>
  <circle cx="88" cy="58" r="0.6" fill="#f4f4fc"/>
  <!-- Loupe rim with magnification marks -->
  <line x1="84" y1="54" x2="85" y2="55" stroke="#f4d860" stroke-width="0.3"/>
  <line x1="92" y1="54" x2="91" y2="55" stroke="#f4d860" stroke-width="0.3"/>
  <line x1="84" y1="62" x2="85" y2="61" stroke="#f4d860" stroke-width="0.3"/>
  <line x1="92" y1="62" x2="91" y2="61" stroke="#f4d860" stroke-width="0.3"/>

  <!-- Right eye — a regular but greedy eye -->
  <ellipse cx="110" cy="58" rx="4" ry="3" fill="#f4e8d4" stroke="#5a3820" stroke-width="0.4"/>
  <circle cx="111" cy="58" r="1.8" fill="#4a3218"/>
  <circle cx="111" cy="58" r="0.9" fill="#1a1208"/>
  <circle cx="111.5" cy="57.5" r="0.4" fill="#f4f4fc"/>

  <!-- Nose -->
  <path d="M 100 56 L 98 68 L 100 72 L 102 68 Z" fill="#b88868" stroke="#5a3820" stroke-width="0.3"/>

  <!-- Mouth — wide smile with gold tooth -->
  <path d="M 90 76 Q 100 82 110 76" fill="none" stroke="#4a1808" stroke-width="0.8"/>
  <path d="M 92 76 Q 100 80 108 76 L 108 78 L 92 78 Z" fill="#2a0808" stroke="#4a1808" stroke-width="0.3"/>
  <!-- Teeth -->
  <rect x="94" y="76" width="2" height="2" fill="#f4e8d4" opacity="0.9"/>
  <rect x="97" y="76" width="2" height="2.2" fill="url(#ap-gold)" stroke="#8a6820" stroke-width="0.2"/>
  <rect x="100" y="76" width="2" height="2.2" fill="url(#ap-gold)" stroke="#8a6820" stroke-width="0.2"/>
  <rect x="103" y="76" width="2" height="2" fill="#f4e8d4" opacity="0.9"/>

  <!-- Pocket watch necklace — long chain of watches around the neck -->
  <path d="M 86 86 Q 80 96 76 104 Q 74 110 78 112 L 82 108 Q 86 98 94 90" fill="none" stroke="url(#ap-gold)" stroke-width="0.8"/>
  <path d="M 114 86 Q 120 96 124 104 Q 126 110 122 112 L 118 108 Q 114 98 106 90" fill="none" stroke="url(#ap-gold)" stroke-width="0.8"/>
  <circle cx="78" cy="106" r="2.5" fill="#1a1208" stroke="url(#ap-gold)" stroke-width="0.5"/>
  <circle cx="122" cy="106" r="2.5" fill="#1a1208" stroke="url(#ap-gold)" stroke-width="0.5"/>

  <!-- Suit lapels -->
  <path d="M 92 96 L 86 110 L 92 128" fill="none" stroke="#0a0604" stroke-width="1"/>
  <path d="M 108 96 L 114 110 L 108 128" fill="none" stroke="#0a0604" stroke-width="1"/>
  <!-- Bow tie -->
  <path d="M 95 92 L 92 90 L 92 98 L 95 96 Z" fill="#4a0818" stroke="#2a0408" stroke-width="0.4"/>
  <path d="M 105 92 L 108 90 L 108 98 L 105 96 Z" fill="#4a0818" stroke="#2a0408" stroke-width="0.4"/>
  <circle cx="100" cy="93" r="1" fill="#4a0818" stroke="#2a0408" stroke-width="0.3"/>

  <!-- Tiny sparkles around the head suggesting "valuation" -->
  <path d="M 64 44 L 62 42 L 64 40 L 66 42 Z" fill="#f4d860" opacity="0.75" filter="url(#ap-shimmer)"/>
  <path d="M 138 36 L 136 34 L 138 32 L 140 34 Z" fill="#f4d860" opacity="0.7" filter="url(#ap-shimmer)"/>
  <path d="M 54 76 L 53 75 L 54 74 L 55 75 Z" fill="#f4d860" opacity="0.6" filter="url(#ap-shimmer)"/>
  <path d="M 146 80 L 145 79 L 146 78 L 147 79 Z" fill="#f4d860" opacity="0.6" filter="url(#ap-shimmer)"/>
  <path d="M 72 26 L 71 25 L 72 24 L 73 25 Z" fill="#f4d860" opacity="0.55" filter="url(#ap-shimmer)"/>
  <path d="M 128 22 L 127 21 L 128 20 L 129 21 Z" fill="#f4d860" opacity="0.55" filter="url(#ap-shimmer)"/>
</svg>
