<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="at-aura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5a8aaa" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#1a2030" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#060808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="at-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a3c40"/>
      <stop offset="40%" stop-color="#2e3034"/>
      <stop offset="100%" stop-color="#1c1e22"/>
    </linearGradient>
    <linearGradient id="at-drum" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#44484e"/>
      <stop offset="50%" stop-color="#38393e"/>
      <stop offset="100%" stop-color="#2a2c30"/>
    </linearGradient>
    <linearGradient id="at-steam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#7aaaca" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7aaaca" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="at-drum-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a9aba" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#3a6a8a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#1a2030" stop-opacity="0"/>
    </radialGradient>
    <filter id="at-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="at-steam-blur">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <ellipse cx="100" cy="140" rx="90" ry="130" fill="url(#at-aura)"/>

  <!-- Floor puddle — water pooling beneath -->
  <ellipse cx="100" cy="262" rx="55" ry="8" fill="#3a6a8a" opacity="0.06"/>
  <ellipse cx="95" cy="265" rx="35" ry="5" fill="#5a9aba" opacity="0.04"/>

  <!-- Drip lines from body to floor -->
  <path d="M 80 245 Q 78 255 80 268" fill="none" stroke="#5a9aba" stroke-width="0.4" opacity="0.12"/>
  <path d="M 120 248 Q 122 258 120 270" fill="none" stroke="#5a9aba" stroke-width="0.35" opacity="0.10"/>
  <path d="M 100 252 L 100 272" fill="none" stroke="#5a9aba" stroke-width="0.3" opacity="0.08"/>

  <!-- Main body — boxy industrial washing machine torso -->
  <path d="
    M 68 60
    L 132 60 L 138 68 L 140 90
    L 142 130 L 142 180
    L 140 220 L 138 240 L 132 250
    L 68 250 L 62 240 L 60 220
    L 58 180 L 58 130 L 60 90
    L 62 68 Z
  " fill="url(#at-body)" stroke="rgba(90,100,110,0.35)" stroke-width="0.8"/>

  <!-- Panel lines — industrial seams -->
  <line x1="68" y1="85" x2="132" y2="85" stroke="#4a4c50" stroke-width="0.6" opacity="0.4"/>
  <line x1="68" y1="200" x2="132" y2="200" stroke="#4a4c50" stroke-width="0.6" opacity="0.4"/>
  <line x1="100" y1="200" x2="100" y2="250" stroke="#4a4c50" stroke-width="0.5" opacity="0.3"/>

  <!-- Drum window — the central glass porthole -->
  <circle cx="100" cy="142" r="38" fill="#1a1c20" stroke="#5a5e64" stroke-width="1.5"/>
  <circle cx="100" cy="142" r="35" fill="url(#at-drum-glow)" stroke="#4a4e54" stroke-width="0.6"/>
  <!-- Drum rim bolts -->
  <circle cx="100" cy="104" r="2" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.5"/>
  <circle cx="100" cy="180" r="2" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.5"/>
  <circle cx="62" cy="142" r="2" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.5"/>
  <circle cx="138" cy="142" r="2" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.5"/>
  <circle cx="73" cy="113" r="1.8" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.4"/>
  <circle cx="127" cy="113" r="1.8" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.4"/>
  <circle cx="73" cy="171" r="1.8" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.4"/>
  <circle cx="127" cy="171" r="1.8" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.4"/>

  <!-- Inner drum rotation vanes — visible through glass -->
  <line x1="100" y1="112" x2="100" y2="172" stroke="#5a9aba" stroke-width="0.5" opacity="0.12"/>
  <line x1="72" y1="130" x2="128" y2="154" stroke="#5a9aba" stroke-width="0.5" opacity="0.10"/>
  <line x1="72" y1="154" x2="128" y2="130" stroke="#5a9aba" stroke-width="0.5" opacity="0.10"/>

  <!-- Churning water inside drum — wavy refraction -->
  <path d="M 68 148 Q 78 142 88 148 Q 98 154 108 148 Q 118 142 128 148" fill="none" stroke="#5a9aba" stroke-width="0.8" opacity="0.15" filter="url(#at-glow)"/>
  <path d="M 70 155 Q 80 149 90 155 Q 100 161 110 155 Q 120 149 130 155" fill="none" stroke="#5a9aba" stroke-width="0.6" opacity="0.10"/>
  <path d="M 72 162 Q 82 157 92 162 Q 100 166 112 160 Q 122 156 130 162" fill="none" stroke="#4a7a9a" stroke-width="0.5" opacity="0.08"/>

  <!-- Control panel — top section -->
  <rect x="72" y="65" width="56" height="16" rx="2" fill="#1e2024" stroke="#4a4c50" stroke-width="0.5"/>
  <!-- Dials -->
  <circle cx="82" cy="73" r="4" fill="#1a1c20" stroke="#5a5e64" stroke-width="0.6"/>
  <line x1="82" y1="70" x2="82" y2="73" stroke="#d4541e" stroke-width="0.6" opacity="0.7"/>
  <circle cx="96" cy="73" r="4" fill="#1a1c20" stroke="#5a5e64" stroke-width="0.6"/>
  <line x1="96" y1="73" x2="98" y2="71" stroke="#d4541e" stroke-width="0.6" opacity="0.5"/>
  <!-- Status LEDs -->
  <circle cx="110" cy="71" r="1.5" fill="#d4541e" opacity="0.6" filter="url(#at-glow)"/>
  <circle cx="116" cy="71" r="1.5" fill="#5a9aba" opacity="0.5" filter="url(#at-glow)"/>
  <circle cx="122" cy="71" r="1.5" fill="#d4541e" opacity="0.35"/>
  <!-- Temperature display -->
  <rect x="108" y="74" width="16" height="5" rx="0.5" fill="#0a0c10"/>
  <text x="116" y="78" text-anchor="middle" fill="#d4541e" font-size="3.5" font-family="monospace" opacity="0.6">ERR</text>

  <!-- Head — industrial monitor/sensor cluster on top -->
  <path d="
    M 82 60 L 82 38 L 86 30 L 100 26 L 114 30 L 118 38 L 118 60
  " fill="#2a2c30" stroke="#3a3c40" stroke-width="0.7"/>
  <!-- Visor — slit sensor array -->
  <rect x="86" y="38" width="28" height="10" rx="1.5" fill="#141618" stroke="#4a4c50" stroke-width="0.5"/>
  <!-- Sensor glow — menacing slit eyes -->
  <rect x="88" y="41" width="10" height="4" rx="0.8" fill="#5a9aba" opacity="0.25" filter="url(#at-glow)"/>
  <rect x="102" y="41" width="10" height="4" rx="0.8" fill="#5a9aba" opacity="0.25" filter="url(#at-glow)"/>
  <!-- Antenna / steam vent on head -->
  <line x1="100" y1="26" x2="100" y2="16" stroke="#4a4c50" stroke-width="1"/>
  <circle cx="100" cy="14" r="2" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.5"/>
  <!-- Side vents on head -->
  <line x1="82" y1="42" x2="78" y2="40" stroke="#3a3c40" stroke-width="1.5"/>
  <line x1="82" y1="46" x2="78" y2="48" stroke="#3a3c40" stroke-width="1.5"/>
  <line x1="118" y1="42" x2="122" y2="40" stroke="#3a3c40" stroke-width="1.5"/>
  <line x1="118" y1="46" x2="122" y2="48" stroke="#3a3c40" stroke-width="1.5"/>

  <!-- Steam plumes from head vents -->
  <path d="M 78 40 Q 68 35 62 25 Q 58 18 60 10" fill="none" stroke="#7aaaca" stroke-width="1.5" opacity="0.08" filter="url(#at-steam-blur)"/>
  <path d="M 78 38 Q 70 30 66 20" fill="none" stroke="#7aaaca" stroke-width="1" opacity="0.06" filter="url(#at-steam-blur)"/>
  <path d="M 122 40 Q 132 35 138 25 Q 142 18 140 10" fill="none" stroke="#7aaaca" stroke-width="1.5" opacity="0.08" filter="url(#at-steam-blur)"/>

  <!-- Left arm — segmented hose/pipe with nozzle -->
  <path d="M 58 100 L 42 115 Q 30 130 22 150 Q 18 165 24 172" fill="none" stroke="url(#at-drum)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 58 100 L 42 115 Q 30 130 22 150 Q 18 165 24 172" fill="none" stroke="#4a4c50" stroke-width="1" opacity="0.5"/>
  <!-- Hose ribbing -->
  <path d="M 48 110 L 44 114" stroke="#5a5e64" stroke-width="0.5" opacity="0.3"/>
  <path d="M 38 122 L 34 126" stroke="#5a5e64" stroke-width="0.5" opacity="0.3"/>
  <path d="M 28 138 L 24 142" stroke="#5a5e64" stroke-width="0.5" opacity="0.3"/>
  <path d="M 22 152 L 18 156" stroke="#5a5e64" stroke-width="0.5" opacity="0.3"/>
  <!-- Nozzle — sprayer head -->
  <path d="M 24 172 L 18 185 L 14 188 L 20 192 L 28 188 L 24 185 Z" fill="#3a3c40" stroke="#5a5e64" stroke-width="0.5"/>
  <!-- Drip from nozzle -->
  <path d="M 19 192 Q 18 198 20 205" fill="none" stroke="#5a9aba" stroke-width="0.6" opacity="0.15" filter="url(#at-glow)"/>
  <circle cx="20" cy="208" r="1.5" fill="#5a9aba" opacity="0.10"/>

  <!-- Right arm — heavier pipe with valve attachment -->
  <path d="M 142 100 L 158 115 Q 170 130 178 150 Q 182 165 176 172" fill="none" stroke="url(#at-drum)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 142 100 L 158 115 Q 170 130 178 150 Q 182 165 176 172" fill="none" stroke="#4a4c50" stroke-width="1" opacity="0.5"/>
  <!-- Hose ribbing -->
  <path d="M 152 110 L 156 114" stroke="#5a5e64" stroke-width="0.5" opacity="0.3"/>
  <path d="M 162 122 L 166 126" stroke="#5a5e64" stroke-width="0.5" opacity="0.3"/>
  <path d="M 172 138 L 176 142" stroke="#5a5e64" stroke-width="0.5" opacity="0.3"/>
  <!-- Valve wheel on right arm -->
  <circle cx="170" cy="145" r="6" fill="none" stroke="#8a7a50" stroke-width="1" opacity="0.4"/>
  <circle cx="170" cy="145" r="3.5" fill="none" stroke="#8a7a50" stroke-width="0.5" opacity="0.3"/>
  <line x1="170" y1="139" x2="170" y2="151" stroke="#8a7a50" stroke-width="0.4" opacity="0.3"/>
  <line x1="164" y1="145" x2="176" y2="145" stroke="#8a7a50" stroke-width="0.4" opacity="0.3"/>
  <!-- Fist — heavy pipe cap -->
  <path d="M 176 172 L 182 180 Q 186 188 182 194 L 176 196 Q 170 194 168 188 L 170 180 Z" fill="#2a2c30" stroke="#4a4c50" stroke-width="0.6"/>

  <!-- Chemical staining — detergent residue -->
  <ellipse cx="78" cy="220" rx="10" ry="8" fill="#7aaaca" opacity="0.05"/>
  <ellipse cx="125" cy="110" rx="8" ry="6" fill="#7aaaca" opacity="0.04"/>
  <ellipse cx="115" cy="225" rx="12" ry="6" fill="#9abaca" opacity="0.04"/>

  <!-- Corrosion and rust patches -->
  <ellipse cx="72" cy="170" rx="5" ry="8" fill="#8b5833" opacity="0.08"/>
  <ellipse cx="130" cy="190" rx="6" ry="5" fill="#8b5833" opacity="0.07"/>
  <ellipse cx="85" cy="235" rx="7" ry="4" fill="#6a5030" opacity="0.06"/>

  <!-- Foam/suds leaking from seams -->
  <circle cx="60" cy="140" r="2.5" fill="#8aaaba" opacity="0.06"/>
  <circle cx="58" cy="145" r="1.8" fill="#8aaaba" opacity="0.05"/>
  <circle cx="140" cy="135" r="2" fill="#8aaaba" opacity="0.05"/>
  <circle cx="143" cy="142" r="2.5" fill="#8aaaba" opacity="0.06"/>
  <circle cx="62" cy="148" r="1.5" fill="#9abaca" opacity="0.04"/>

  <!-- Bottom — stumpy legs / base supports -->
  <rect x="72" y="248" width="16" height="14" rx="2" fill="#2a2c30" stroke="#3a3c40" stroke-width="0.5"/>
  <rect x="112" y="248" width="16" height="14" rx="2" fill="#2a2c30" stroke="#3a3c40" stroke-width="0.5"/>
  <!-- Rubber feet -->
  <rect x="74" y="260" width="12" height="3" rx="1" fill="#1e1e1c"/>
  <rect x="114" y="260" width="12" height="3" rx="1" fill="#1e1e1c"/>

  <!-- Subtle energy in drum — rift glow -->
  <circle cx="100" cy="142" r="15" fill="none" stroke="#5a9aba" stroke-width="0.4" opacity="0.12" filter="url(#at-glow)"/>
  <circle cx="100" cy="142" r="8" fill="#5a9aba" opacity="0.04" filter="url(#at-glow)"/>

  <!-- Water damage streaks on body -->
  <path d="M 132 90 L 134 120 L 132 145" fill="none" stroke="#5a8aaa" stroke-width="0.4" opacity="0.10"/>
  <path d="M 68 95 L 66 125 L 68 150" fill="none" stroke="#5a8aaa" stroke-width="0.4" opacity="0.10"/>
</svg>
