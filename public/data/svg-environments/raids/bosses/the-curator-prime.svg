<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="cup-aura" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#9c78d0" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#181028" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup-robe" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a2c48"/>
      <stop offset="55%" stop-color="#1a1228"/>
      <stop offset="100%" stop-color="#080410"/>
    </linearGradient>
    <linearGradient id="cup-gold" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f4d488"/>
      <stop offset="55%" stop-color="#c89438"/>
      <stop offset="100%" stop-color="#6a4418"/>
    </linearGradient>
    <filter id="cup-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <ellipse cx="100" cy="140" rx="94" ry="132" fill="url(#cup-aura)"/>

  <!-- Gallery parquet floor -->
  <polygon points="0,260 200,260 196,276 4,276" fill="#1a1008" stroke="#0a0604" stroke-width="0.3"/>
  <line x1="20" y1="260" x2="22" y2="276" stroke="#4a3418" stroke-width="0.3"/>
  <line x1="60" y1="260" x2="62" y2="276" stroke="#4a3418" stroke-width="0.3"/>
  <line x1="100" y1="260" x2="100" y2="276" stroke="#4a3418" stroke-width="0.3"/>
  <line x1="140" y1="260" x2="138" y2="276" stroke="#4a3418" stroke-width="0.3"/>
  <line x1="180" y1="260" x2="178" y2="276" stroke="#4a3418" stroke-width="0.3"/>

  <!-- Folded exhibit frames behind (two partial walls at wrong angles) -->
  <rect x="4" y="40" width="38" height="140" fill="none" stroke="url(#cup-gold)" stroke-width="0.8" opacity="0.7"/>
  <rect x="158" y="40" width="38" height="140" fill="none" stroke="url(#cup-gold)" stroke-width="0.8" opacity="0.7"/>
  <!-- Inner ghost paintings -->
  <rect x="10" y="56" width="26" height="38" fill="#2a1c1c" stroke="#5a3a30" stroke-width="0.3" opacity="0.6"/>
  <rect x="10" y="104" width="26" height="38" fill="#2a1c1c" stroke="#5a3a30" stroke-width="0.3" opacity="0.6"/>
  <rect x="164" y="56" width="26" height="38" fill="#2a1c1c" stroke="#5a3a30" stroke-width="0.3" opacity="0.6"/>
  <rect x="164" y="104" width="26" height="38" fill="#2a1c1c" stroke="#5a3a30" stroke-width="0.3" opacity="0.6"/>
  <!-- Tiny placards under each painting -->
  <rect x="12" y="96" width="22" height="4" fill="#e8d098" stroke="#5a3018" stroke-width="0.2" opacity="0.6"/>
  <rect x="12" y="144" width="22" height="4" fill="#e8d098" stroke="#5a3018" stroke-width="0.2" opacity="0.6"/>
  <rect x="166" y="96" width="22" height="4" fill="#e8d098" stroke="#5a3018" stroke-width="0.2" opacity="0.6"/>
  <rect x="166" y="144" width="22" height="4" fill="#e8d098" stroke="#5a3018" stroke-width="0.2" opacity="0.6"/>

  <!-- Shoes — low-heeled, institutional -->
  <path d="M 68 252 L 64 262 L 90 262 L 88 252 Z" fill="#0a0604" stroke="#050404" stroke-width="0.4"/>
  <path d="M 110 252 L 112 262 L 138 262 L 134 252 Z" fill="#0a0604" stroke="#050404" stroke-width="0.4"/>

  <!-- Long skirt of the archival robe -->
  <path d="M 58 188 L 52 260 L 148 260 L 142 188 Z" fill="url(#cup-robe)" stroke="#050408" stroke-width="0.7"/>
  <!-- Skirt folds -->
  <line x1="76" y1="196" x2="70" y2="260" stroke="#1a1228" stroke-width="0.4"/>
  <line x1="100" y1="196" x2="100" y2="260" stroke="#1a1228" stroke-width="0.4"/>
  <line x1="124" y1="196" x2="130" y2="260" stroke="#1a1228" stroke-width="0.4"/>

  <!-- Gold hem -->
  <path d="M 52 260 L 148 260" stroke="url(#cup-gold)" stroke-width="1.2" opacity="0.8"/>
  <path d="M 52 258 L 148 258" stroke="url(#cup-gold)" stroke-width="0.4" opacity="0.6"/>

  <!-- Torso — high-collared smock -->
  <path d="M 58 102 L 66 90 L 80 84 L 100 82 L 120 84 L 134 90 L 142 102 L 146 132 L 146 170 L 144 190 L 56 190 L 54 170 L 54 132 Z"
        fill="url(#cup-robe)" stroke="#050408" stroke-width="1.0"/>
  <!-- Contrasting stole — deep burgundy -->
  <path d="M 84 86 L 82 190 L 90 190 L 92 86 Z" fill="#4a0a18" stroke="#1a0408" stroke-width="0.4"/>
  <path d="M 116 86 L 118 190 L 110 190 L 108 86 Z" fill="#4a0a18" stroke="#1a0408" stroke-width="0.4"/>
  <!-- Gold trim on stole -->
  <line x1="86" y1="90" x2="86" y2="188" stroke="url(#cup-gold)" stroke-width="0.5" opacity="0.85"/>
  <line x1="114" y1="90" x2="114" y2="188" stroke="url(#cup-gold)" stroke-width="0.5" opacity="0.85"/>

  <!-- Gold brooch over heart -->
  <circle cx="100" cy="124" r="3.5" fill="url(#cup-gold)" stroke="#3a1c08" stroke-width="0.4"/>
  <circle cx="100" cy="124" r="1.5" fill="#5a1818" stroke="#3a1c08" stroke-width="0.3"/>

  <!-- Left arm — holding up a small oil lamp (gallery lighting) -->
  <path d="M 48 108 L 36 122 L 26 152 L 16 178 L 22 184 L 32 168 L 44 142 L 54 122 Z" fill="url(#cup-robe)" stroke="#050408" stroke-width="0.6"/>
  <!-- Hand -->
  <ellipse cx="20" cy="188" rx="5.5" ry="4" fill="#dcc0a0" stroke="#5a3a20" stroke-width="0.4"/>
  <!-- Oil lamp body -->
  <path d="M 12 174 L 28 174 L 30 186 L 10 186 Z" fill="url(#cup-gold)" stroke="#3a1c08" stroke-width="0.4"/>
  <rect x="18" y="170" width="4" height="4" fill="url(#cup-gold)" stroke="#3a1c08" stroke-width="0.3"/>
  <!-- Flame — wrong color (violet) -->
  <ellipse cx="20" cy="166" rx="3" ry="6" fill="#9c78d0" filter="url(#cup-glow)"/>
  <ellipse cx="20" cy="164" rx="1.5" ry="3" fill="#f4ecf8"/>
  <!-- Lamp light cone -->
  <path d="M 20 186 L 6 230 L 34 230 Z" fill="#9c78d0" opacity="0.08"/>

  <!-- Right arm — folded, holding a red leather-bound catalogue -->
  <path d="M 152 108 L 162 120 L 170 142 L 174 172 L 168 178 L 160 160 L 152 138 L 146 120 Z" fill="url(#cup-robe)" stroke="#050408" stroke-width="0.6"/>
  <!-- Hand -->
  <ellipse cx="170" cy="182" rx="5.5" ry="4" fill="#dcc0a0" stroke="#5a3a20" stroke-width="0.4"/>
  <!-- Catalogue -->
  <rect x="156" y="172" width="22" height="24" rx="1" fill="#4a0a18" stroke="#1a0408" stroke-width="0.5"/>
  <rect x="156" y="172" width="22" height="3" fill="url(#cup-gold)" stroke="#3a1c08" stroke-width="0.3"/>
  <line x1="167" y1="175" x2="167" y2="196" stroke="#1a0408" stroke-width="0.4"/>
  <text x="159" y="186" font-family="serif" font-size="4" fill="#f4d488" opacity="0.9">§</text>
  <text x="169" y="186" font-family="serif" font-size="4" fill="#f4d488" opacity="0.9">§</text>

  <!-- Head — stern, ageless -->
  <ellipse cx="100" cy="62" rx="14" ry="17" fill="#e8ccac" stroke="#6a4828" stroke-width="0.5"/>
  <!-- Hair — neat gray bun tied up -->
  <path d="M 82 52 Q 100 38 118 52 L 120 56 L 80 56 Z" fill="#6a6064" stroke="#3a2e30" stroke-width="0.4"/>
  <circle cx="100" cy="36" r="6" fill="#6a6064" stroke="#3a2e30" stroke-width="0.4"/>
  <!-- Bun detailing -->
  <path d="M 95 36 Q 100 32 105 36" fill="none" stroke="#3a2e30" stroke-width="0.3"/>
  <path d="M 94 40 Q 100 37 106 40" fill="none" stroke="#3a2e30" stroke-width="0.3"/>

  <!-- Pince-nez glasses -->
  <circle cx="93" cy="62" r="3" fill="none" stroke="url(#cup-gold)" stroke-width="0.5"/>
  <circle cx="107" cy="62" r="3" fill="none" stroke="url(#cup-gold)" stroke-width="0.5"/>
  <line x1="96" y1="62" x2="104" y2="62" stroke="url(#cup-gold)" stroke-width="0.4"/>
  <!-- Pince-nez chain -->
  <path d="M 90 62 Q 80 68 82 90" fill="none" stroke="url(#cup-gold)" stroke-width="0.3" opacity="0.8"/>

  <!-- Eyes through the lenses — violet -->
  <circle cx="93" cy="62" r="1.0" fill="#9c78d0" filter="url(#cup-glow)"/>
  <circle cx="107" cy="62" r="1.0" fill="#9c78d0" filter="url(#cup-glow)"/>

  <!-- Brow -->
  <path d="M 88 57 Q 93 55 98 58" fill="none" stroke="#3a2e30" stroke-width="0.55"/>
  <path d="M 102 58 Q 107 55 112 57" fill="none" stroke="#3a2e30" stroke-width="0.55"/>

  <!-- Thin nose -->
  <path d="M 100 64 L 98 72 L 100 74 L 102 72 Z" fill="#c8a888" stroke="#6a4828" stroke-width="0.3"/>

  <!-- Pressed-line mouth — disapproval -->
  <path d="M 94 78 L 106 78" stroke="#3a1818" stroke-width="0.6"/>

  <!-- Docent placard clipped to her lapel -->
  <rect x="72" y="106" width="18" height="10" rx="0.5" fill="#e8d098" stroke="#5a3018" stroke-width="0.4"/>
  <text x="74" y="113" font-family="serif" font-size="3.2" fill="#3a1808">Head Curator</text>

  <!-- Floating exhibit labels around her (folded labels from other rooms) -->
  <rect x="38" y="86" width="18" height="7" rx="0.3" fill="#e8d098" stroke="#5a3018" stroke-width="0.3" opacity="0.9" transform="rotate(-8 47 89)"/>
  <text x="40" y="91" font-family="serif" font-size="2.4" fill="#3a1808" transform="rotate(-8 47 89)">Rm IV</text>
  <rect x="146" y="106" width="18" height="7" rx="0.3" fill="#e8d098" stroke="#5a3018" stroke-width="0.3" opacity="0.9" transform="rotate(7 155 109)"/>
  <text x="148" y="111" font-family="serif" font-size="2.4" fill="#3a1808" transform="rotate(7 155 109)">Rm II</text>
</svg>
