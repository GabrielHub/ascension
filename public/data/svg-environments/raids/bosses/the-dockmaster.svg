<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="dm-aura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d47a1e" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#0d1820" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dm-body" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2838"/>
      <stop offset="50%" stop-color="#12202e"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </linearGradient>
    <linearGradient id="dm-crane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4858"/>
      <stop offset="100%" stop-color="#1a2838"/>
    </linearGradient>
    <linearGradient id="dm-warn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d47a1e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d47a1e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d47a1e" stop-opacity="0"/>
    </linearGradient>
    <filter id="dm-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dm-ember">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aura backdrop -->
  <ellipse cx="100" cy="130" rx="95" ry="130" fill="url(#dm-aura)"/>

  <!-- Gravity distortion — faint rings beneath floating lower body -->
  <ellipse cx="100" cy="262" rx="50" ry="5" fill="none" stroke="#d47a1e" stroke-width="0.5" opacity="0.12"/>
  <ellipse cx="100" cy="266" rx="38" ry="3.5" fill="none" stroke="#d47a1e" stroke-width="0.4" opacity="0.08"/>
  <ellipse cx="100" cy="270" rx="26" ry="2.5" fill="none" stroke="#d47a1e" stroke-width="0.3" opacity="0.06"/>

  <!-- Body silhouette — massive dock authority, lower body detached/floating -->
  <path d="
    M 100 38
    L 125 48 L 142 62 L 148 85 L 150 110
    L 152 140 L 150 170 L 146 195
    L 140 215 L 132 235
    L 120 252 L 100 256 L 80 252
    L 68 235 L 60 215 L 54 195
    L 50 170 L 48 140 L 50 110
    L 52 85 L 58 62 L 75 48 Z
  " fill="url(#dm-body)" stroke="rgba(26,40,56,0.6)" stroke-width="1"/>

  <!-- Warning stripes — diagonal hazard lines across torso -->
  <line x1="70" y1="110" x2="82" y2="135" stroke="#d47a1e" stroke-width="1.2" opacity="0.18"/>
  <line x1="78" y1="108" x2="90" y2="133" stroke="#d47a1e" stroke-width="1.2" opacity="0.18"/>
  <line x1="110" y1="108" x2="122" y2="133" stroke="#d47a1e" stroke-width="1.2" opacity="0.18"/>
  <line x1="118" y1="110" x2="130" y2="135" stroke="#d47a1e" stroke-width="1.2" opacity="0.18"/>

  <!-- Crane arm structures fused with shoulders -->
  <path d="M 58 68 L 30 50 L 22 42 L 18 36 L 22 34 L 28 40 L 36 48 L 58 62" fill="none" stroke="#3a4858" stroke-width="2" opacity="0.7"/>
  <path d="M 142 68 L 170 50 L 178 42 L 182 36 L 178 34 L 172 40 L 164 48 L 142 62" fill="none" stroke="#3a4858" stroke-width="2" opacity="0.7"/>
  <!-- Crane lattice cross-braces -->
  <line x1="34" y1="44" x2="42" y2="56" stroke="#2a3848" stroke-width="0.6" opacity="0.5"/>
  <line x1="42" y1="48" x2="34" y2="58" stroke="#2a3848" stroke-width="0.6" opacity="0.5"/>
  <line x1="158" y1="48" x2="166" y2="56" stroke="#2a3848" stroke-width="0.6" opacity="0.5"/>
  <line x1="166" y1="48" x2="158" y2="58" stroke="#2a3848" stroke-width="0.6" opacity="0.5"/>

  <!-- Crane hooks hanging from shoulder tips -->
  <line x1="18" y1="36" x2="18" y2="56" stroke="#4a5868" stroke-width="1"/>
  <path d="M 18 56 Q 14 64 18 70 Q 22 66 20 62" fill="none" stroke="#6a7888" stroke-width="1.5"/>
  <line x1="182" y1="36" x2="182" y2="56" stroke="#4a5868" stroke-width="1"/>
  <path d="M 182 56 Q 178 64 182 70 Q 186 66 184 62" fill="none" stroke="#6a7888" stroke-width="1.5"/>

  <!-- Shoulder armor plates — heavy industrial -->
  <path d="M 58 72 L 38 80 L 36 92 L 40 96 L 58 90 Z" fill="#1a2838" stroke="#2a3848" stroke-width="0.6"/>
  <path d="M 142 72 L 162 80 L 164 92 L 160 96 L 142 90 Z" fill="#1a2838" stroke="#2a3848" stroke-width="0.6"/>
  <!-- Rivets on shoulders -->
  <circle cx="44" cy="86" r="1.2" fill="#3a4858" stroke="#1a2838" stroke-width="0.3"/>
  <circle cx="50" cy="82" r="1.2" fill="#3a4858" stroke="#1a2838" stroke-width="0.3"/>
  <circle cx="156" cy="86" r="1.2" fill="#3a4858" stroke="#1a2838" stroke-width="0.3"/>
  <circle cx="150" cy="82" r="1.2" fill="#3a4858" stroke="#1a2838" stroke-width="0.3"/>

  <!-- Head — angular hard hat with authority badge -->
  <path d="
    M 100 28
    L 120 34 L 126 48 L 124 62 L 118 70
    L 100 74 L 82 70 L 76 62
    L 74 48 L 80 34 Z
  " fill="#12202e" stroke="#2a3848" stroke-width="0.8"/>

  <!-- Hard hat brim and dome -->
  <path d="M 70 42 Q 100 38 130 42 L 128 46 Q 100 42 72 46 Z" fill="#d47a1e" opacity="0.35"/>
  <path d="M 76 42 Q 100 28 124 42" fill="none" stroke="#d47a1e" stroke-width="0.8" opacity="0.25"/>

  <!-- Eyes — glowing orange behind visor shadow -->
  <ellipse cx="90" cy="54" rx="5" ry="3" fill="#d47a1e" opacity="0.7" filter="url(#dm-ember)"/>
  <ellipse cx="110" cy="54" rx="5" ry="3" fill="#d47a1e" opacity="0.7" filter="url(#dm-ember)"/>
  <!-- Eye cores -->
  <ellipse cx="90" cy="54" rx="2.5" ry="1.5" fill="#ff9b3a" opacity="0.9"/>
  <ellipse cx="110" cy="54" rx="2.5" ry="1.5" fill="#ff9b3a" opacity="0.9"/>
  <!-- Visor shadow line -->
  <line x1="78" y1="48" x2="122" y2="48" stroke="#0a1620" stroke-width="1.5" opacity="0.4"/>

  <!-- Jaw — heavy, squared -->
  <path d="M 86 66 Q 100 72 114 66" fill="none" stroke="#2a3848" stroke-width="0.6" opacity="0.5"/>

  <!-- Clipboard chest panel -->
  <rect x="80" y="95" width="40" height="32" rx="2" fill="#0a1620" stroke="#2a3848" stroke-width="0.6"/>
  <!-- Clipboard clip top -->
  <rect x="92" y="92" width="16" height="5" rx="1" fill="#3a4858" stroke="#2a3848" stroke-width="0.4"/>
  <!-- Manifest lines on chest -->
  <line x1="84" y1="102" x2="116" y2="102" stroke="#d47a1e" stroke-width="0.4" opacity="0.2"/>
  <line x1="84" y1="107" x2="112" y2="107" stroke="#d47a1e" stroke-width="0.4" opacity="0.18"/>
  <line x1="84" y1="112" x2="114" y2="112" stroke="#d47a1e" stroke-width="0.4" opacity="0.15"/>
  <line x1="84" y1="117" x2="110" y2="117" stroke="#d47a1e" stroke-width="0.4" opacity="0.12"/>
  <!-- Status indicator -->
  <circle cx="114" cy="98" r="1.5" fill="#d47a1e" opacity="0.5"/>

  <!-- Arms — thick industrial -->
  <path d="M 52 90 L 38 125 L 34 155 L 36 168 L 44 164 L 46 138 L 55 108 Z" fill="#12202e" stroke="#2a3848" stroke-width="0.5"/>
  <path d="M 148 90 L 162 125 L 166 155 L 164 168 L 156 164 L 154 138 L 145 108 Z" fill="#12202e" stroke="#2a3848" stroke-width="0.5"/>

  <!-- Left hand — heavy glove holding chain -->
  <path d="M 30 164 L 26 174 L 28 182 L 36 180 L 40 170 Z" fill="#2a3848" stroke="#1a2838" stroke-width="0.5"/>
  <!-- Chain links -->
  <ellipse cx="28" cy="186" rx="3" ry="4" fill="none" stroke="#4a5868" stroke-width="1"/>
  <ellipse cx="28" cy="194" rx="3" ry="4" fill="none" stroke="#4a5868" stroke-width="1"/>
  <ellipse cx="28" cy="202" rx="3" ry="4" fill="none" stroke="#4a5868" stroke-width="1"/>

  <!-- Right hand — gauntlet gripping loading manifest -->
  <path d="M 160 164 L 164 174 L 162 182 L 154 180 L 150 170 Z" fill="#2a3848" stroke="#1a2838" stroke-width="0.5"/>
  <rect x="156" y="176" width="14" height="22" rx="1" fill="#1a2838" stroke="#2a3848" stroke-width="0.4"/>
  <line x1="158" y1="182" x2="168" y2="182" stroke="#d47a1e" stroke-width="0.3" opacity="0.25"/>
  <line x1="158" y1="186" x2="166" y2="186" stroke="#d47a1e" stroke-width="0.3" opacity="0.2"/>
  <line x1="158" y1="190" x2="168" y2="190" stroke="#d47a1e" stroke-width="0.3" opacity="0.2"/>

  <!-- Gravity break — gap between upper and lower body -->
  <line x1="62" y1="225" x2="138" y2="225" stroke="#d47a1e" stroke-width="0.3" opacity="0.15"/>
  <!-- Floating debris particles around the gap -->
  <rect x="72" y="222" width="2" height="2" fill="#2a3848" opacity="0.3" transform="rotate(15,73,223)"/>
  <rect x="118" y="220" width="1.5" height="1.5" fill="#2a3848" opacity="0.25" transform="rotate(30,119,221)"/>
  <rect x="96" y="218" width="1.8" height="1.8" fill="#2a3848" opacity="0.2" transform="rotate(45,97,219)"/>

  <!-- Belt — industrial utility with warning tape -->
  <rect x="58" y="190" width="84" height="6" rx="1" fill="#1a2838" stroke="#2a3848" stroke-width="0.5"/>
  <line x1="62" y1="192" x2="68" y2="195" stroke="#d47a1e" stroke-width="0.8" opacity="0.3"/>
  <line x1="72" y1="192" x2="78" y2="195" stroke="#d47a1e" stroke-width="0.8" opacity="0.3"/>
  <line x1="82" y1="192" x2="88" y2="195" stroke="#d47a1e" stroke-width="0.8" opacity="0.3"/>
  <line x1="112" y1="192" x2="118" y2="195" stroke="#d47a1e" stroke-width="0.8" opacity="0.3"/>
  <line x1="122" y1="192" x2="128" y2="195" stroke="#d47a1e" stroke-width="0.8" opacity="0.3"/>

  <!-- Authority sigil at belt center -->
  <circle cx="100" cy="193" r="5" fill="none" stroke="#d47a1e" stroke-width="0.5" opacity="0.25"/>
  <circle cx="100" cy="193" r="2" fill="#d47a1e" opacity="0.2"/>
</svg>