<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" fill="none">
  <!-- Vicente Ortega — Quartermaster chibi token.
       Lean teen build, cropped lime jacket over white tee + relaxed cream trousers, tousled dark hair, wired earbud. -->

  <!-- Ground shadow (lean footprint) -->
  <ellipse cx="16" cy="37" rx="6.5" ry="2" fill="#000" opacity="0.18"/>

  <!-- Body: white tee (lean) -->
  <path d="M11 22 Q11 20 12 19 L20 19 Q21 20 21 22 L21 34 Q21 36 20 36 L12 36 Q11 36 11 34 Z"
        fill="#f0eae0" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Cropped bright-lime jacket over upper body only -->
  <path d="M11 22 Q11 20 12 19 L20 19 Q21 20 21 22 L21 27 Q21 27.5 20 27.5 L12 27.5 Q11 27.5 11 27 Z"
        fill="#a8d040" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Jacket center opening (white tee strip showing) -->
  <rect x="15.5" y="19.2" width="1" height="8" fill="#f0eae0"/>

  <!-- Cream relaxed trousers (lower portion) -->
  <path d="M11 30 L21 30 L21 34 Q21 36 20 36 L12 36 Q11 36 11 34 Z"
        fill="#d8c8a8" stroke="#0a0a0c" stroke-width="0.4"/>

  <!-- Wired earbud cable trailing down -->
  <path d="M22.5 12.5 Q23 14.5 22.5 17 Q22 19 22 21" stroke="#f0eae0" stroke-width="0.5" fill="none"/>

  <!-- Neck (warm medium-brown) -->
  <rect x="14" y="16" width="4" height="4" rx="1.2" fill="#c4a08a"/>

  <!-- Head circle (lean r=7) -->
  <circle cx="16" cy="12" r="7" fill="#c4a08a" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Face shadow -->
  <path d="M10.5 14 Q16 17 21.5 14 Q20 9 16 7.5 Q12 9 10.5 14" fill="#000" opacity="0.08"/>

  <!-- Hair: tousled dark, messy fronds -->
  <path d="M9.5 10 Q9 3.5 16 2.6 Q23 3.5 22.5 10 Q21 6 16 5.6 Q11 6 9.5 10"
        fill="#1a1410" stroke="#0a0a0c" stroke-width="0.6"/>

  <!-- Tousled spikes pushing up through the hair line -->
  <path d="M11 4 L11.5 6 M14 3 L14.5 5 M17.5 3 L18 5 M20 4 L19.5 6 M22 5 L21.5 7"
        stroke="#0a0608" stroke-width="0.55" fill="none"/>

  <!-- Earbud (small white dot near ear) -->
  <circle cx="22.5" cy="12.5" r="0.7" fill="#f0eae0" stroke="#0a0a0c" stroke-width="0.25"/>

  <!-- Brows (focused-teen energy) -->
  <path d="M11.5 10.7 L13.5 10.5" stroke="#0a0a0c" stroke-width="0.5"/>
  <path d="M18.5 10.5 L20.5 10.7" stroke="#0a0a0c" stroke-width="0.5"/>

  <!-- Eyes -->
  <circle cx="13" cy="12.5" r="1.0" fill="#0a0a0c"/>
  <circle cx="19" cy="12.5" r="1.0" fill="#0a0a0c"/>
  <circle cx="13.4" cy="12.2" r="0.3" fill="#fff" opacity="0.8"/>
  <circle cx="19.4" cy="12.2" r="0.3" fill="#fff" opacity="0.8"/>
</svg>
