<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" fill="none">
  <!-- Laura Bennett — Compliance Officer chibi token.
       Lean executive build, oxblood pencil-skirt suit + sheer blazer + brushed-gold blouse, smooth ash-brown hair side-parted. -->

  <!-- Ground shadow (lean footprint) -->
  <ellipse cx="16" cy="37" rx="6.5" ry="2" fill="#000" opacity="0.2"/>

  <!-- Body: oxblood pencil-skirt suit (lean silhouette) -->
  <path d="M11 22 Q11 20 12 19 L20 19 Q21 20 21 22 L21 34 Q21 36 20 36 L12 36 Q11 36 11 34 Z"
        fill="#5a1820" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Brushed-gold wrap blouse v-collar -->
  <path d="M14 19 L16 22.4 L18 19 Z" fill="#a8814a" stroke="#0a0a0c" stroke-width="0.4"/>

  <!-- Sheer structured blazer (lighter overlay on the side panels) -->
  <path d="M11 22 Q11 20 12 19 L13.5 19 L13.5 32 L11 32 Z" fill="#7a2830" stroke="#0a0a0c" stroke-width="0.3" opacity="0.6"/>
  <path d="M21 22 Q21 20 20 19 L18.5 19 L18.5 32 L21 32 Z" fill="#7a2830" stroke="#0a0a0c" stroke-width="0.3" opacity="0.6"/>

  <!-- Pencil skirt waist seam -->
  <line x1="11" y1="29" x2="21" y2="29" stroke="#3a0810" stroke-width="0.35"/>

  <!-- Compliance badge clip on lapel -->
  <rect x="13.5" y="22.6" width="1.3" height="0.9" fill="#c8a850"/>

  <!-- Neck (light-cool) -->
  <rect x="14" y="16" width="4" height="4" rx="1.2" fill="#e8d0c0"/>

  <!-- Head circle (lean r=7) -->
  <circle cx="16" cy="12" r="7" fill="#e8d0c0" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Face shadow -->
  <path d="M10.5 14 Q16 17 21.5 14 Q20 9 16 7.5 Q12 9 10.5 14" fill="#000" opacity="0.06"/>

  <!-- Hair: smooth shoulder-length ash-brown with side part -->
  <path d="M9.5 10 Q9 3.8 16 2.8 Q23 3.8 22.5 10 Q21 6.5 16 6 Q11 6.5 9.5 10"
        fill="#5a4838" stroke="#0a0a0c" stroke-width="0.5"/>

  <!-- Asymmetric side part -->
  <path d="M14 4.2 Q14.5 7 14 10" stroke="#3a2818" stroke-width="0.4" fill="none"/>

  <!-- Shoulder-length hair fall on both sides -->
  <path d="M9 10 Q8.4 14 9 18 L10.5 18 Q10.5 14 10.5 10 Z" fill="#5a4838" stroke="#0a0a0c" stroke-width="0.4"/>
  <path d="M22.5 10 Q23.6 14 23 18 L21.5 18 Q21.5 14 21.5 10 Z" fill="#5a4838" stroke="#0a0a0c" stroke-width="0.4"/>

  <!-- Brows (controlled, slight arch) -->
  <path d="M11.5 10.8 Q13 10.4 14 10.8" stroke="#0a0a0c" stroke-width="0.5" fill="none"/>
  <path d="M18 10.8 Q19 10.4 20.5 10.8" stroke="#0a0a0c" stroke-width="0.5" fill="none"/>

  <!-- Eyes (cool, faintly narrowed) -->
  <circle cx="13" cy="12.5" r="1.0" fill="#0a0a0c"/>
  <circle cx="19" cy="12.5" r="1.0" fill="#0a0a0c"/>
  <circle cx="13.4" cy="12.2" r="0.3" fill="#fff" opacity="0.8"/>
  <circle cx="19.4" cy="12.2" r="0.3" fill="#fff" opacity="0.8"/>
</svg>
