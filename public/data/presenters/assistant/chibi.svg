<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" fill="none">
  <!-- Mara Cordero — Guild Assistant chibi token.
       Medium build, charcoal blouse + structured vest, voluminous dark curls, notebook tucked at chest. -->

  <!-- Ground shadow -->
  <ellipse cx="16" cy="37" rx="7.5" ry="2.2" fill="#000" opacity="0.2"/>

  <!-- Body: charcoal blouse (medium silhouette) -->
  <path d="M9.5 22 Q9.5 20 11 19 L21 19 Q22.5 20 22.5 22 L22.5 34 Q22.5 36 21 36 L11 36 Q9.5 36 9.5 34 Z"
        fill="#2c2c30" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Structured vest layers (open at center, blouse shows through) -->
  <path d="M9.5 22 Q9.5 20 11 19 L13.5 19 L13.5 36 L11 36 Q9.5 36 9.5 34 Z"
        fill="#15151a" stroke="#0a0a0c" stroke-width="0.4"/>
  <path d="M22.5 22 Q22.5 20 21 19 L18.5 19 L18.5 36 L21 36 Q22.5 36 22.5 34 Z"
        fill="#15151a" stroke="#0a0a0c" stroke-width="0.4"/>

  <!-- Blouse v-collar (warm brown skin showing) -->
  <path d="M14.5 19 L16 21.4 L17.5 19 Z" fill="#8a6048"/>

  <!-- Badge clip on lapel -->
  <rect x="13.5" y="22" width="1.2" height="1.4" fill="#c8a84c" opacity="0.85"/>

  <!-- Notebook tucked at chest -->
  <rect x="13.5" y="26" width="5" height="6" rx="0.4" fill="#0a0a0c" stroke="#000" stroke-width="0.3"/>
  <line x1="13.5" y1="28" x2="18.5" y2="28" stroke="#3a3a40" stroke-width="0.3"/>
  <line x1="13.5" y1="30" x2="18.5" y2="30" stroke="#3a3a40" stroke-width="0.3"/>

  <!-- Neck (warm brown skin) -->
  <rect x="14" y="16" width="4" height="4" rx="1.2" fill="#8a6048"/>

  <!-- Head circle (medium r=7.5) -->
  <circle cx="16" cy="12" r="7.5" fill="#8a6048" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Face shadow -->
  <path d="M10.5 14 Q16 17.5 21.5 14 Q20 9 16 7 Q12 9 10.5 14" fill="#000" opacity="0.1"/>

  <!-- Hair: voluminous dark curls, pinned with volume on top -->
  <path d="M8 10 Q6.5 2.5 16 1.5 Q25.5 2.5 24 10 Q22 6.5 16 6 Q10 6.5 8 10"
        fill="#1a1410" stroke="#0a0a0c" stroke-width="0.6"/>

  <!-- Curl texture across the dome (soft swirls) -->
  <path d="M9 5.5 Q10.5 3.5 12 5.5 M13 4 Q14.5 2.5 16 4 M16 4 Q17.5 2.5 19 4 M20 5.5 Q21.5 3.5 23 5.5"
        stroke="#0a0a0c" stroke-width="0.45" opacity="0.55" fill="none"/>

  <!-- Escaped strands at the temples -->
  <path d="M9.2 9 L8.8 12 M22.8 9 L23.2 12" stroke="#0f0a08" stroke-width="0.45"/>

  <!-- Brows -->
  <path d="M11.7 10.9 L13.7 10.7" stroke="#0a0a0c" stroke-width="0.5"/>
  <path d="M18.3 10.7 L20.3 10.9" stroke="#0a0a0c" stroke-width="0.5"/>

  <!-- Eyes -->
  <circle cx="13" cy="12.6" r="1.05" fill="#0a0a0c"/>
  <circle cx="19" cy="12.6" r="1.05" fill="#0a0a0c"/>
  <circle cx="13.4" cy="12.3" r="0.32" fill="#fff" opacity="0.8"/>
  <circle cx="19.4" cy="12.3" r="0.32" fill="#fff" opacity="0.8"/>

  <!-- Tired under-eye hint -->
  <path d="M11.7 13.7 Q13 14.3 14.3 13.7" stroke="#000" stroke-width="0.3" opacity="0.3" fill="none"/>
  <path d="M17.7 13.7 Q19 14.3 20.3 13.7" stroke="#000" stroke-width="0.3" opacity="0.3" fill="none"/>
</svg>
