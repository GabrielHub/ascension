<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" fill="none">
  <!-- Sloane Becker — Front of House chibi token.
       Lean build, dark sleeveless top + dark upscale jeans, ash-blonde hair with pale mint accent. -->

  <!-- Ground shadow (lean footprint) -->
  <ellipse cx="16" cy="37" rx="6.5" ry="2" fill="#000" opacity="0.18"/>

  <!-- Body: dark sleeveless top (lean) -->
  <path d="M11 22 Q11 20 12 19 L20 19 Q21 20 21 22 L21 34 Q21 36 20 36 L12 36 Q11 36 11 34 Z"
        fill="#181420" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Tank top neckline (skin showing) -->
  <path d="M13.5 19 L13.5 22 L18.5 22 L18.5 19 Z" fill="#e8d0c0"/>
  <!-- Tank top straps -->
  <rect x="13" y="19" width="0.7" height="3" fill="#181420"/>
  <rect x="18.3" y="19" width="0.7" height="3" fill="#181420"/>

  <!-- Dark upscale jean waistband -->
  <rect x="11" y="31.5" width="10" height="1.4" fill="#0c0e1a" stroke="#000" stroke-width="0.2"/>

  <!-- Neck (cool fair) -->
  <rect x="14" y="16" width="4" height="4" rx="1.2" fill="#e8d0c0"/>

  <!-- Head circle (lean r=7) -->
  <circle cx="16" cy="12" r="7" fill="#e8d0c0" stroke="#0a0a0c" stroke-width="0.8"/>

  <!-- Face shadow -->
  <path d="M10.5 14 Q16 17 21.5 14 Q20 9 16 7.5 Q12 9 10.5 14" fill="#000" opacity="0.06"/>

  <!-- Hair: ash blonde, swept with side fall -->
  <path d="M9.5 10.5 Q9 4 16 3 Q23 4 22.5 10.5 Q21 6.5 16 6 Q11 6.5 9.5 10.5"
        fill="#c8beae" stroke="#0a0a0c" stroke-width="0.5"/>

  <!-- Side hair fall (long, past the shoulder) -->
  <path d="M9 10.5 Q8.4 14 9 18 L10.5 18 Q10.5 14 10.5 10.5 Z" fill="#c8beae" stroke="#0a0a0c" stroke-width="0.4"/>

  <!-- Pale mint accent strand -->
  <path d="M11 5.5 L10.5 11 L11.5 11 L12 5.5 Z" fill="#a8d8c4" opacity="0.78"/>

  <!-- Brows (cool, level) -->
  <path d="M11.8 10.8 L13.8 10.6" stroke="#7a6850" stroke-width="0.5"/>
  <path d="M18.2 10.6 L20.2 10.8" stroke="#7a6850" stroke-width="0.5"/>

  <!-- Eyes (cool, narrow) -->
  <circle cx="13" cy="12.5" r="1.0" fill="#0a0a0c"/>
  <circle cx="19" cy="12.5" r="1.0" fill="#0a0a0c"/>
  <circle cx="13.4" cy="12.2" r="0.3" fill="#fff" opacity="0.8"/>
  <circle cx="19.4" cy="12.2" r="0.3" fill="#fff" opacity="0.8"/>
</svg>
